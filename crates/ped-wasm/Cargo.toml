[package]
name = "ped-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true

# Internal crates — mode-aware wrappers
ped-core   = { path = "../ped-core" }
ped-resus  = { path = "../ped-resus" }
ped-airway = { path = "../ped-airway" }
ped-sepsis = { path = "../ped-sepsis" }
ped-neonatal = { path = "../ped-neonatal" }
ped-cardiac  = { path = "../ped-cardiac" }
ped-trauma   = { path = "../ped-trauma" }

# Direct access to rust-sci-core for any calculations not yet
# wrapped by ped-* crates
sci-clinical.workspace = true
sci-units.workspace = true
sci-growth.workspace = true
sci-stats.workspace = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
