# Medical-Software Compliance Example Workflow
#
# Drop this file into any clinical repo at `.github/workflows/medical-compliance.yml`.
# It wires up PHI scanning, SBOM generation, and audit logging for the full
# HIPAA / FDA CSA / 21 CFR Part 11 baseline.
#
# Copy this into repos like:
#   - timothyhartzog/Peds
#   - timothyhartzog/PedNeoSim.jl (or Patient-simulation-julia)
#   - timothyhartzog/BioStatistics.jl
#   - timothyhartzog/rust-sci-core

name: Medical-Software Compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 9 * * 1"   # Mon 9:00 UTC — weekly full-history scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Fast gate on every PR: PHI scan on diff ─────────────────────────────────
  phi-scan-pr:
    if: github.event_name == 'pull_request'
    uses: timothyhartzog/.github/.github/workflows/reusable-phi-scan.yml@main
    with:
      scan-mode: diff
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  # ── Weekly deep scan: full history ──────────────────────────────────────────
  phi-scan-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: timothyhartzog/.github/.github/workflows/reusable-phi-scan.yml@main
    with:
      scan-mode: full-history
      fail-on-findings: true
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  # ── SBOM on release + weekly refresh ────────────────────────────────────────
  sbom:
    if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'push'
    uses: timothyhartzog/.github/.github/workflows/reusable-sbom.yml@main
    with:
      sbom-format: both
      commit-sbom: true
      attach-to-release: true
      fail-on-license-deny: true
    permissions:
      contents: write

  # ── Audit ledger on every build ────────────────────────────────────────────
  audit:
    if: always()
    needs: [phi-scan-pr, sbom]
    uses: timothyhartzog/.github/.github/workflows/audit-log.yml@main
    with:
      include-deps: true
      retention-entries: 500
    permissions:
      contents: write
