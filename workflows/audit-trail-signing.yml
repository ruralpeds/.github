name: Security - Daily Audit Trail Signing

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      days-back:
        description: 'Number of days back to sign (for backfill)'
        required: false
        default: '1'

permissions:
  contents: read
  id-token: write  # For OIDC to AWS

env:
  AUDIT_LOG_DIR: audit-log

jobs:
  sign-audit-trail:
    name: Sign and Verify Audit Trail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Retrieve signing key from Secrets Manager
        id: signing-key
        run: |
          KEY=$(aws secretsmanager get-secret-value \
            --secret-id audit-signing-key \
            --query SecretString \
            --output text)
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Create unsigned audit trail
        run: |
          mkdir -p ${{ env.AUDIT_LOG_DIR }}/signed
          DATE=$(date -u +"%Y-%m-%d")

          # Find unsigned entries from last run
          # In production, would pull from events.jsonl and filter unsigned entries
          cat > "${{ env.AUDIT_LOG_DIR }}/unsigned-${DATE}.jsonl" <<'EOF'
          {"sequence": 1, "timestamp": "2026-05-04T02:00:00Z", "event_type": "audit_trail_signing_started", "data": {"version": "6B"}}
          EOF

      - name: Sign audit entries
        env:
          AUDIT_SIGNING_KEY: ${{ steps.signing-key.outputs.key }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          INPUT_FILE="${{ env.AUDIT_LOG_DIR }}/unsigned-${DATE}.jsonl"
          OUTPUT_FILE="${{ env.AUDIT_LOG_DIR }}/signed/audit-trail-${DATE}.jsonl"

          python3 scripts/audit-log-signer.py \
            --input "$INPUT_FILE" \
            --output "$OUTPUT_FILE"

      - name: Verify audit trail integrity
        env:
          AUDIT_SIGNING_KEY: ${{ steps.signing-key.outputs.key }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          SIGNED_FILE="${{ env.AUDIT_LOG_DIR }}/signed/audit-trail-${DATE}.jsonl"
          REPORT_FILE="${{ env.AUDIT_LOG_DIR }}/verification-${DATE}.json"

          python3 scripts/audit-log-verifier.py \
            --input "$SIGNED_FILE" \
            --output "$REPORT_FILE"

      - name: Check verification results
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          REPORT_FILE="${{ env.AUDIT_LOG_DIR }}/verification-${DATE}.json"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "❌ Verification report not found"
            exit 1
          fi

          VALID=$(jq -r '.valid' "$REPORT_FILE")
          ENTRIES=$(jq -r '.entries_checked' "$REPORT_FILE")

          if [ "$VALID" != "true" ]; then
            echo "❌ Audit trail integrity check FAILED"
            jq '.' "$REPORT_FILE"
            exit 1
          fi

          echo "✅ Audit trail verified: $ENTRIES entries, integrity valid"

      - name: Archive signed audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-audit-trail
          path: |
            ${{ env.AUDIT_LOG_DIR }}/signed/audit-trail-*.jsonl
            ${{ env.AUDIT_LOG_DIR }}/verification-*.json
          retention-days: 365

  create-alert-if-failed:
    name: Create Alert on Verification Failure
    needs: sign-audit-trail
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Create issue for audit trail failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🔴 CRITICAL: Audit trail signing/verification failed" \
            --label "security" \
            --label "critical" \
            --body "Audit trail signing or verification failed at $(date -u). This requires immediate investigation.

See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

**Action Required:**
1. Review signing key configuration
2. Check audit log files for corruption
3. Verify AWS Secrets Manager connectivity
4. Run verification manually to diagnose
"

  notify-completion:
    name: Notify Signing Completion
    needs: sign-audit-trail
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Report signing status
        run: |
          echo "✅ Audit trail signing completed successfully"
          echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
