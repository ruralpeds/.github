# Synthea Configuration for Medical Device Platform
# Generates synthetic patient data for FDA compliance testing
# Version: 1.0 (April 25, 2026)

# ============================================================================
# POPULATION GENERATION
# ============================================================================

# Number of patients to generate (for load testing: 1000-5000)
population = 500

# Random seed for reproducibility (same seed = same patients)
seed = 12345

# Minimum age for patient generation
min_age = 18

# Maximum age for patient generation
max_age = 90

# ============================================================================
# CLINICAL DISEASE PREVALENCE (realistic distributions)
# ============================================================================

# Chronic conditions (ICD-10 prevalence rates from CDC)
condition.diabetes = 0.108          # 10.8% of US population
condition.hypertension = 0.298      # 29.8% of US population
condition.chronic_kidney_disease = 0.071  # 7.1%
condition.asthma = 0.065            # 6.5%
condition.copd = 0.034              # 3.4%
condition.heart_failure = 0.020     # 2.0%
condition.atrial_fibrillation = 0.025  # 2.5%

# Medications (common for chronic disease patients)
medication.metformin = 0.052        # Diabetes (50% of diabetics)
medication.lisinopril = 0.089       # Hypertension ACE inhibitor
medication.atorvastatin = 0.073     # Cholesterol (statin)
medication.metoprolol = 0.045       # Hypertension/heart disease
medication.warfarin = 0.010         # Atrial fibrillation anticoagulant

# ============================================================================
# ADVERSE EVENT SCENARIOS (controlled for testing)
# ============================================================================

# Percentage of patients with baseline abnormal vitals
adverse_event_rate = 0.15           # 15% have adverse event during observation

# Severe hypoglycemia (diabetes complication)
severe_hypoglycemia_rate = 0.02     # 2% of diabetics
severe_hypoglycemia_glucose = 40    # mg/dL

# Sepsis (serious adverse event)
sepsis_rate = 0.005                 # 0.5% of patients
sepsis_trigger_wbc = 15.0           # WBC threshold (K/uL)

# Hyperglycemic crisis (diabetes)
hyperglycemia_rate = 0.01           # 1% of patients
hyperglycemia_glucose = 350         # mg/dL

# ============================================================================
# VITAL SIGNS RANGES (normal + abnormal)
# ============================================================================

# Normal vital ranges (for validation)
vital.heart_rate_min_normal = 60     # bpm
vital.heart_rate_max_normal = 100    # bpm

vital.systolic_min_normal = 90       # mmHg
vital.systolic_max_normal = 120      # mmHg

vital.diastolic_min_normal = 60      # mmHg
vital.diastolic_max_normal = 80      # mmHg

vital.respiratory_rate_min_normal = 12  # breaths/min
vital.respiratory_rate_max_normal = 20  # breaths/min

vital.temperature_min_normal = 36.5  # Celsius
vital.temperature_max_normal = 37.5  # Celsius

vital.oxygen_saturation_min_normal = 95  # %
vital.oxygen_saturation_max_normal = 100 # %

vital.glucose_min_normal = 70        # mg/dL (fasting)
vital.glucose_max_normal = 100       # mg/dL (fasting)

# ============================================================================
# OBSERVATION FREQUENCY (for continuous monitoring)
# ============================================================================

# Vital signs recorded every X minutes (during simulated hospital stay)
vital_observation_interval_minutes = 15

# Lab results (every 24 hours)
lab_observation_interval_hours = 24

# Observation period for each patient (days)
observation_period_days = 7

# ============================================================================
# OUTPUT FORMAT
# ============================================================================

# Export format: FHIR_STU3, FHIR_R4, CSV, JSON
export_format = FHIR_R4

# Include complete patient history
include_full_history = true

# Include synthetic provider/organization data
include_providers = true

# ============================================================================
# DISEASE PROGRESSIONS
# ============================================================================

# Allow chronic diseases to progress during observation period
allow_disease_progression = true

# Diabetes progression: normal → pre-diabetes → diabetes
diabetes_progression_enabled = true

# Hypertension control: uncontrolled → controlled (with medication)
hypertension_control_enabled = true

# ============================================================================
# DATA VALIDATION
# ============================================================================

# Validate all generated vital signs against normal ranges
validate_vitals = true

# Flag impossible vital sign combinations (e.g., RR=2 bpm)
flag_impossible_vitals = true

# Report patients with >3 abnormal vitals simultaneously
report_critical_patients = true
