// ════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════
const EDU = {
  aap2018: {
    title: "AAP 2018 Maintenance IVF Guideline", cat: "Guideline", icon: "📋",
    sections: [
      {h:"What Changed?",t:"For 60 years (1957–2018), pediatric IVF was based on Holliday-Segar which produced D5 0.2% NaCl — a fluid that is 78% electrolyte-free water. The AAP 2018 guideline ended this practice after evidence of preventable hyponatremic deaths."},
      {h:"The Evidence",t:"17 RCTs (2,455 patients) showed isotonic fluids significantly reduced hospital-acquired hyponatremia. NNT = 7.5 to prevent one case."},
      {h:"Key Action Statement",t:"Children 28 days–18 years requiring maintenance IVF should receive ISOTONIC solutions with appropriate KCl and dextrose. Grade B (Strong). Acceptable: D5NS, D5LR, or D5 Plasma-Lyte."},
      {h:"Why Hypotonic Fluids Were Dangerous",t:"Hospitalized children have non-osmotic ADH stimulation from pain, nausea, surgery, fever. ~30% meet SIADH criteria. Elevated ADH impairs free-water excretion → dilutional hyponatremia. Children at higher risk due to larger brain-to-skull ratio."},
      {h:"Exceptions",t:"Excludes: neonates <28 days, cardiac disease, hepatic disease, renal disease, neurosurgical patients, DKA, and burns."},
      {h:"Clinical Pearl",t:"Even with isotonic fluids, hyponatremia still occurred in 0–23%. Serial sodium monitoring (start at 6–12h) remains essential."},
    ],
    refs: ["Feld LG et al. Pediatrics 2018;142(6):e20183083. PMID: 30478247","Moritz ML, Ayus JC. Pediatrics 2003;111(2):227-230. PMID: 12563043"]
  },
  hollidaySegar: {
    title: "Holliday-Segar Formula (4-2-1 Rule)", cat: "Calculation", icon: "🧮",
    sections: [
      {h:"Origin",t:"Published 1957. Water needs calculated from caloric expenditure: 1 mL/kcal. Key insight: metabolic rate correlates with BSA, not weight — but weight-based approximation created for clinical use."},
      {h:"The 4-2-1 Rule (Hourly)",t:"• First 10 kg: 4 mL/kg/hr\n• Next 10 kg: 2 mL/kg/hr\n• >20 kg: 1 mL/kg/hr\nExample: 25 kg = 40+20+5 = 65 mL/hr"},
      {h:"Daily Calculation",t:"• First 10 kg: 100 mL/kg/day\n• Next 10 kg: 50 mL/kg/day\n• >20 kg: 20 mL/kg/day\nExample: 25 kg = 1000+500+100 = 1600 mL/day"},
      {h:"When to Modify",t:"INCREASE (+12%/°C >37°C): fever, burns\nDECREASE to 2/3: SIADH, post-op, increased ICP, heart failure\nDECREASE to 1/2: severe SIADH, anuria"},
      {h:"Obesity",t:"Use IDEAL body weight. Max ~2,400 mL/day for large adolescents."},
      {h:"Key Limitation",t:"The formula estimates WATER needs only. Use for RATE, but choose ISOTONIC fluid per AAP 2018."},
    ],
    refs: ["Holliday MA, Segar WE. Pediatrics 1957;19(5):823-832. PMID: 13431307"]
  },
  resuscitation: {
    title: "Fluid Resuscitation & Septic Shock", cat: "Emergency", icon: "🚨",
    sections: [
      {h:"Surviving Sepsis 2020 (Pediatric)",t:"Resource-rich settings with ICU: 10–20 mL/kg isotonic crystalloid over 5–20 min. Reassess after each bolus. Up to 40–60 mL/kg in first hour. If fluid-refractory → vasopressors."},
      {h:"The FEAST Trial (2011)",t:"3,141 children in East Africa. Mortality HIGHER with bolus: 10.5% vs 7.3%. Context: 57% malaria, no ICU. Applies to resource-LIMITED settings — not resource-rich. SSC 2020 differentiates by setting."},
      {h:"Balanced Crystalloids vs NS",t:"SMART trial (2018): balanced crystalloids reduced composite death/RRT/renal dysfunction: 14.3% vs 15.4%. NS causes hyperchloremic acidosis from high chloride load (154 mEq/L)."},
      {h:"Cold vs Warm Shock",t:"COLD SHOCK (~60–80%): Low CO, high SVR. Cool extremities, weak pulses. → Epinephrine.\nWARM SHOCK (~20%): High CO, low SVR. Warm/flushed, bounding pulses. → Norepinephrine."},
      {h:"When to Stop Bolusing",t:"Signs of overload: hepatomegaly, new rales, periorbital edema, weight gain >10%, worsening oxygenation, lung B-lines on POCUS."},
    ],
    refs: ["Weiss SL et al. Pediatr Crit Care Med 2020;21(2):e52. PMID: 32032273","Maitland K et al. NEJM 2011;364(26):2483. PMID: 21615299","Semler MW et al. NEJM 2018;378(9):829. PMID: 29485925"]
  },
  dehydration: {
    title: "Pediatric Dehydration Assessment & Correction", cat: "Assessment", icon: "💧",
    sections: [
      {h:"Severity Classification",t:"Mild (3–5%): slightly dry mouth, mild thirst\nModerate (6–9%): dry MM, tachycardia, decreased turgor, sunken eyes, cap refill 2–3s\nSevere (≥10%): very dry, marked tachycardia, mottled, absent tears, cap refill >3s, lethargy, hypotension (LATE)"},
      {h:"Best Clinical Signs (Steiner 2004)",t:"Prolonged cap refill: LR+ 4.1\nAbnormal skin turgor: LR+ 2.5\nGorelick 4-item scale: ≥2 of (dry MM, no tears, ill appearance, cap refill >2s) = ≥5% dehydrated"},
      {h:"ORT First Line",t:"ORT successful >90% of mild-moderate cases. WHO ORS (245 mOsm/L): Na 75, K 20, glucose 75 mmol/L.\nDose: 50 mL/kg (mild) to 75–100 mL/kg (moderate) over 4h.\nOndansetron 0.15 mg/kg reduces IV need from 31% to 14%."},
      {h:"IV Deficit Formula",t:"Deficit (mL) = % × weight (kg) × 10\nPhase 2: 50% deficit over first 8h + 1/3 maint\nPhase 3: 50% deficit over next 16h + 2/3 maint"},
      {h:"Na Correction Rates — CRITICAL",t:"HYPERNATREMIC: ≤0.5 mEq/L/hr (≤10–12/24h). D5 0.45NS. 48–72h total. Risk: cerebral edema.\nHYPONATREMIC: ≤8–10 mEq/L/24h. Risk: osmotic demyelination (ODS)."},
    ],

  dka: {
    title: "DKA Fluid Management", cat: "Endocrine", icon: "🩸",
    sections: [
      {h:"DKA Classification",t:"Mild: pH 7.2–7.3, bicarb 10–15\nModerate: pH 7.1–7.2, bicarb 5–10\nSevere: pH <7.1, bicarb <5"},
      {h:"Initial Fluid (ISPAD 2022)",t:"NS 10–20 mL/kg over 20–30 min ONLY if hemodynamically compromised. Avoid aggressive bolusing >40 mL/kg. After stabilization: 1–1.5× maintenance."},
      {h:"Two-Bag System",t:"Bag 1: NS + KCl (no dextrose)\nBag 2: D10 + NS + KCl\nTitrate ratio to maintain BG 150–250 while continuing insulin. Response time: ~1 min vs ~42 min for traditional bag changes."},
      {h:"PECARN FLUID Trial (2018)",t:"1,255 children randomized 2×2: rapid vs slow × 0.9% vs 0.45% NaCl. NO difference in GCS decline or brain injury with any approach. PMID: 29897851"},
      {h:"Cerebral Edema",t:"Muir Criteria (92% sens, 96% spec):\nDiagnostic: abnormal motor/verbal, decorticate/decerebrate, CN palsy, abnormal breathing\nTreatment: Mannitol 0.5–1 g/kg IV OR 3% NaCl 2.5–5 mL/kg over 10–15 min. Elevate HOB 30°."},
    ],
    refs: ["Kuppermann N et al. NEJM 2018;378(24):2275. PMID: 29897851","Wolfsdorf JI et al. ISPAD 2022. PMID: 36537527"]
  },
  siadhCsw: {
    title: "SIADH vs Cerebral Salt Wasting", cat: "Neurosurgical", icon: "🧠",
    sections: [
      {h:"Why This Matters — Opposite Treatments",t:"Both: hyponatremia, elevated urine Na >40, low serum osm.\nSIADH → RESTRICT fluids (50–67% maint)\nCSW → EXPAND volume with NS (1.5–2× maint)\nTreating CSW with restriction → worsens hypovolemia → threatens cerebral perfusion."},
      {h:"SIADH Criteria",t:"Serum osm <280, urine osm >100, urine Na >40, EUVOLEMIC, normal thyroid/adrenal/renal"},
      {h:"CSW Criteria",t:"Same labs as SIADH but HYPOVOLEMIC: dry MM, tachycardia, orthostatic hypotension, weight loss, polyuria, negative fluid balance, elevated BUN."},
      {h:"FEurate Test",t:"SIADH: FEurate normalizes (4–11%) after Na correction.\nCSW: FEurate remains >11% after Na correction.\nMost reliable discriminator."},
      {h:"3% NaCl for Emergencies",t:"3–5 mL/kg over 10–20 min for hyponatremic seizures. Raises Na ~4–6 mEq/L. Total correction ≤8–10 mEq/L/24h."},
    ],
    refs: ["Bardanzellu F et al. Pediatr Nephrol 2022;37(7):1469. PMID: 34468821"]
  },
  burns: {
    title: "Burns Fluid Resuscitation in Children", cat: "Trauma", icon: "🔥",
    sections: [
      {h:"Parkland Formula",t:"4 mL × weight (kg) × %TBSA = total 24h LR.\nFirst half in first 8h FROM TIME OF BURN, second half over next 16h."},
      {h:"Pediatric Modification",t:"<20 kg: ADD maintenance D5LR alongside Parkland.\nTotal = Parkland + Maintenance"},
      {h:"TBSA Estimation — Lund-Browder",t:"NEVER use Rule of Nines in children <14 yr.\nInfant head: 19% (vs 7% adult). Infant legs: 14% (vs 18% adult). Palm ≈ 1%."},
      {h:"UOP Targets",t:"Goal: 1–2 mL/kg/hr (higher than adults at 0.5–1 mL/kg/hr). PRIMARY titration endpoint."},
    ],
    refs: ["Romanowski KS, Palmieri TL. Burns Trauma 2017;5:26. PMID: 28795058"]
  },
  naCorrection: {
    title: "Sodium Correction Safety Limits", cat: "Safety", icon: "⚠️",
    sections: [
      {h:"Hypernatremia (Na >150)",t:"Rate: ≤0.5 mEq/L per HOUR (≤10–12/24h). 48–72h total. D5 0.45NS or D5 0.2NS. Check q4–6h.\nRisk: CEREBRAL EDEMA. Idiogenic osmoles take up to 36 days to dissipate."},
      {h:"Hyponatremia (Na <130)",t:"Rate: ≤8–10 mEq/L in first 24h. For seizures: 3% NaCl 3–5 mL/kg. Check q2–4h.\nRisk: OSMOTIC DEMYELINATION (ODS). Presents 2–6 days after over-correction: dysarthria, quadriplegia, locked-in syndrome."},
      {h:"Free Water Deficit",t:"FWD (L) = 0.6 × Wt (kg) × [(Na/140) − 1]. Replace over 48–72h."},
      {h:"Sodium Deficit",t:"Na deficit (mEq) = 0.6 × Wt × (Desired Na − Current Na). Use NS or 3% NaCl."},
      {h:"Speed of Onset Rules",t:"ACUTE (<48h): can correct faster (up to 1–2 mEq/L/hr initially).\nCHRONIC (>48h or unknown): MUST correct slowly.\nWhen in doubt → assume CHRONIC."},
    ],
    refs: ["Lee JH et al. NEJM 1994;331:439. PMID: 8035845"]

function calcMaint(wt) {
  if (wt <= 0) return { hr: 0, day: 0 };
  let d = wt <= 10 ? wt*100 : wt <= 20 ? 1000+(wt-10)*50 : 1500+(wt-20)*20;
  return { hr: Math.round((d/24)*10)/10, day: Math.round(d) };
}

function PedIVFEducational() {
  const [weight, setWeight] = useState(15);
  const [activeTopic, setActiveTopic] = useState(null);
  const [view, setView] = useState("tree");
  const maint = useMemo(() => calcMaint(weight), [weight]);
  const openEdu = useCallback((id) => setActiveTopic(id), []);
  const closeEdu = useCallback(() => setActiveTopic(null), []);
  const topic = activeTopic ? EDU[activeTopic] : null;

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(155deg, #0b1121 0%, #0f172a 50%, #080c16 100%)", color:"#d4dce8", fontFamily:"'IBM Plex Sans', system-ui, sans-serif", padding:16, position:"relative" }}>

      {/* Modal */}
      {topic && (
        <div onClick={closeEdu} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", backdropFilter:"blur(4px)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"#0f1629", border:"1px solid #1e2d4a", borderRadius:14, maxWidth:640, width:"100%", maxHeight:"85vh", overflow:"hidden", display:"flex", flexDirection:"column", boxShadow:"0 24px 80px rgba(0,0,0,0.6)" }}>
            <div style={{ padding:"16px 20px", borderBottom:"1px solid #1e293b", display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexShrink:0 }}>
              <div>
                <span style={{ fontSize:20, marginRight:8 }}>{topic.icon}</span>
                <span style={{ fontSize:9, fontWeight:700, color:"#60a5fa", background:"rgba(59,130,246,0.15)", padding:"2px 8px", borderRadius:4, textTransform:"uppercase", letterSpacing:"0.08em" }}>{topic.cat}</span>
                <h2 style={{ fontSize:17, fontWeight:700, color:"#e8edf5", margin:"6px 0 0", lineHeight:1.3 }}>{topic.title}</h2>
              </div>
              <button onClick={closeEdu} style={{ background:"rgba(255,255,255,0.05)", border:"1px solid #1e293b", borderRadius:6, color:"#5a6b82", fontSize:16, width:32, height:32, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
            </div>
            <div style={{ padding:"16px 20px", overflowY:"auto", flex:1 }}>
              <div style={{ background:"rgba(16,185,129,0.08)", border:"1px solid rgba(16,185,129,0.2)", borderRadius:8, padding:"8px 12px", marginBottom:14, display:"flex", gap:12, flexWrap:"wrap", fontSize:10, color:"#34d399" }}>
                <span><strong>Patient:</strong> {weight} kg</span>
                <span><strong>Maint:</strong> {maint.hr} mL/hr ({maint.day} mL/day)</span>
                <span><strong>Bolus 20:</strong> {Math.round(weight*20)} mL</span>
                <span><strong>2/3 Maint:</strong> {Math.round(maint.day*2/3)} mL/day</span>
              </div>
              {topic.sections.map((s,i) => (
                <div key={i} style={{ marginBottom:16 }}>
                  <h4 style={{ fontSize:13, fontWeight:700, color:"#e8edf5", margin:"0 0 5px", display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ width:20, height:20, borderRadius:5, background:"rgba(59,130,246,0.15)", color:"#60a5fa", display:"inline-flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:700, flexShrink:0 }}>{i+1}</span>
                    {s.h}
                  </h4>
                  <div style={{ fontSize:12, color:"#8892a8", lineHeight:1.7, whiteSpace:"pre-line", paddingLeft:26 }}>{s.t}</div>
                </div>
              ))}
              {topic.refs && (
                <div style={{ marginTop:16, paddingTop:12, borderTop:"1px solid #1e293b" }}>
                  <div style={{ fontSize:9, fontWeight:700, color:"#5a6b82", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:6 }}>Key References</div>
                  {topic.refs.map((r,i) => (
                    <div key={i} style={{ fontSize:10, color:"#4b5a70", lineHeight:1.5, marginBottom:3 }}>
                      <span style={{ color:"#60a5fa" }}>[{i+1}]</span> {r}
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={{ padding:"10px 20px", borderTop:"1px solid #1e293b", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
              <span style={{ fontSize:9, color:"#3b4a63" }}>For educational and clinical reference — not a substitute for clinical judgment</span>
              <button onClick={closeEdu} style={{ padding:"5px 14px", borderRadius:6, border:"1px solid #3b82f6", background:"rgba(59,130,246,0.15)", color:"#60a5fa", fontSize:11, fontWeight:600, cursor:"pointer" }}>Close</button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div style={{ textAlign:"center", marginBottom:14 }}>
        <h1 style={{ fontSize:19, fontWeight:700, color:"#e8edf5", margin:0 }}>Pediatric IVF Clinical Decision Support</h1>
        <p style={{ fontSize:10, color:"#4b5a70", margin:"3px 0 0" }}>AAP 2018 · SSC 2020 · ISPAD 2022 — Tap any <span style={{ color:"#60a5fa" }}>Learn</span> button for educational content</p>
      </div>

      {/* Weight + View Toggle */}
      <div style={{ display:"flex", gap:10, marginBottom:14, alignItems:"flex-end", flexWrap:"wrap" }}>
        <div style={{ flex:"0 0 140px" }}>
          <label style={{ fontSize:9, color:"#5a6b82", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em", display:"block", marginBottom:3 }}>Patient Weight (kg)</label>
          <input type="number" value={weight} min={2} max={120} step={0.5} onChange={e=>setWeight(Number(e.target.value))} style={{ width:"100%", padding:"7px 10px", borderRadius:6, border:"1px solid #1e293b", background:"#0a0f1e", color:"#e8edf5", fontSize:14, fontWeight:600, boxSizing:"border-box" }} />
        </div>
        <div style={{ display:"flex", gap:4 }}>
          {["tree","topics","calc"].map(v => (
            <button key={v} onClick={()=>setView(v)} style={{ padding:"7px 14px", borderRadius:6, border:`1px solid ${view===v?"#3b82f6":"#1e293b"}`, background:view===v?"rgba(59,130,246,0.12)":"rgba(10,15,30,0.6)", color:view===v?"#60a5fa":"#5a6b82", fontSize:10, fontWeight:600, cursor:"pointer", textTransform:"capitalize" }}>
              {v === "tree" ? "Decision Tree" : v === "topics" ? "Topic Library" : "Quick Calc"}
            </button>
          ))}
        </div>
        <div style={{ display:"flex", gap:6, marginLeft:"auto" }}>
          <Pill c="#10b981">{maint.hr} mL/hr</Pill>
          <Pill c="#3b82f6">{maint.day} mL/day</Pill>
        </div>
      </div>

      {/* Decision Tree View */}
      {view === "tree" && (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          <TreeNode c="#3b82f6" tag="ASSESS" title="Child Requires IV Fluids (1mo–18yr)" sub="Evaluate: hemodynamics, hydration, NPO status, serum Na/K/Glc/Cr, UOP" edu="aap2018" onLearn={openEdu} />
          <TreeNode c="#ef4444" tag="DECISION" title="Hemodynamically Unstable?" sub="Shock, severe dehydration, or hemodynamic compromise" edu="resuscitation" onLearn={openEdu} />
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <TreeNode c="#ef4444" tag="YES → BOLUS" title={`NS/LR 20 mL/kg = ${Math.round(weight*20)} mL`} sub={`Over 5–20 min. Repeat ×3. Max ${Math.round(weight*60)} mL before pressors.`} edu="resuscitation" onLearn={openEdu} small />
              <TreeNode c="#f59e0b" tag="REASSESS" title="Fluid-Responsive?" sub="If no: epinephrine (cold) or norepinephrine (warm shock)" edu="resuscitation" onLearn={openEdu} small />
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <TreeNode c="#10b981" tag="NO → STABLE" title="Standard Maintenance" sub={`D5NS + KCl 20 mEq/L at ${maint.hr} mL/hr (${maint.day} mL/day)`} edu="aap2018" onLearn={openEdu} small />
              <TreeNode c="#8b5cf6" tag="SPECIAL?" title="Check for Special Populations" sub="DKA · Neuro · Cardiac · Burns · Renal" edu="hollidaySegar" onLearn={openEdu} small />
            </div>
          </div>
          <div style={{ fontSize:11, fontWeight:600, color:"#5a6b82", textAlign:"center", margin:"4px 0" }}>▼ Special Population Pathways ▼</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))", gap:8 }}>
            <TreeNode c="#8b5cf6" tag="DKA" title="1–1.5× Maintenance" sub={`${Math.round(maint.day)}–${Math.round(maint.day*1.5)} mL/day. 2-bag system.`} edu="dka" onLearn={openEdu} small />
            <TreeNode c="#3b82f6" tag="NEURO" title="SIADH vs CSW" sub={`SIADH: restrict to ${Math.round(maint.day*0.5)}–${Math.round(maint.day*0.67)} mL/day. CSW: EXPAND with NS.`} edu="siadhCsw" onLearn={openEdu} small />
            <TreeNode c="#f97316" tag="BURNS" title="Parkland: 4×kg×%TBSA" sub="Half in first 8h from burn time. Add maint if <20kg." edu="burns" onLearn={openEdu} small />
          </div>
          <TreeNode c="#f59e0b" tag="DEHYDRATION" title="Dehydration Correction" sub={`Mild ORT: ${Math.round(weight*50)} mL/4h | Moderate deficit: ${Math.round(5*weight*10)} mL | Severe: 20 mL/kg bolus`} edu="dehydration" onLearn={openEdu} />
          <TreeNode c="#ef4444" tag="SAFETY" title="Na Correction Rate Limits" sub="Hypernatremic: ≤0.5 mEq/L/hr. Hyponatremic: ≤8–10 mEq/L/24h. Seizures: 3% NaCl 3–5 mL/kg." edu="naCorrection" onLearn={openEdu} />
          <TreeNode c="#10b981" tag="MONITOR" title="Ongoing Assessment" sub="BMP q12–24h. Strict I&O. Daily weights. UOP 1–2 mL/kg/hr. Transition to PO when able." edu="hollidaySegar" onLearn={openEdu} />
        </div>
      )}

      {/* Topic Library */}
      {view === "topics" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(280px, 1fr))", gap:10 }}>
          {Object.entries(EDU).map(([id,t]) => (
            <button key={id} onClick={()=>openEdu(id)} style={{ background:"rgba(12,18,32,0.8)", border:"1px solid #1e293b", borderRadius:10, padding:14, cursor:"pointer", textAlign:"left" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
                <span style={{ fontSize:22 }}>{t.icon}</span>
                <span style={{ fontSize:9, fontWeight:700, color:"#60a5fa", background:"rgba(59,130,246,0.12)", padding:"2px 7px", borderRadius:3, textTransform:"uppercase" }}>{t.cat}</span>
              </div>
              <div style={{ fontSize:13, fontWeight:600, color:"#e8edf5", marginBottom:4 }}>{t.title}</div>
              <div style={{ fontSize:10, color:"#5a6b82" }}>{t.sections.length} sections · {t.refs?.length||0} references</div>
            </button>
          ))}
        </div>
      )}

      {/* Quick Calc */}
      {view === "calc" && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))", gap:10 }}>
          <QCalc title="Maintenance (4-2-1)" rows={[
            ["Full maintenance",`${maint.hr} mL/hr (${maint.day} mL/day)`,"#10b981"],
            ["2/3 maintenance",`${(maint.hr*2/3).toFixed(1)} mL/hr (${Math.round(maint.day*2/3)} mL/day)`,"#f59e0b"],
            ["1/2 maintenance",`${(maint.hr/2).toFixed(1)} mL/hr (${Math.round(maint.day/2)} mL/day)`,"#f59e0b"],
            ["1.5× maintenance",`${(maint.hr*1.5).toFixed(1)} mL/hr (${Math.round(maint.day*1.5)} mL/day)`,"#3b82f6"],
          ]} eduId="hollidaySegar" onLearn={openEdu} />
          <QCalc title="Bolus Volumes" rows={[
            ["10 mL/kg",`${Math.round(weight*10)} mL`,"#f59e0b"],
            ["20 mL/kg",`${Math.round(weight*20)} mL`,"#ef4444"],
            ["Max (60 mL/kg)",`${Math.round(weight*60)} mL`,"#ef4444"],
          ]} eduId="resuscitation" onLearn={openEdu} />
          <QCalc title="Dehydration Deficits" rows={[
            ["3% (mild)",`${Math.round(3*weight*10)} mL`,"#10b981"],
            ["5% (mild-mod)",`${Math.round(5*weight*10)} mL`,"#10b981"],
            ["7% (moderate)",`${Math.round(7*weight*10)} mL`,"#f59e0b"],
            ["10% (severe)",`${Math.round(10*weight*10)} mL`,"#ef4444"],
          ]} eduId="dehydration" onLearn={openEdu} />
          <QCalc title="3% NaCl" rows={[
            ["Seizure dose (3 mL/kg)",`${Math.round(weight*3)} mL`,"#ef4444"],
            ["Max dose (5 mL/kg)",`${Math.round(weight*5)} mL`,"#ef4444"],
          ]} eduId="naCorrection" onLearn={openEdu} />
        </div>
      )}

      <div style={{ textAlign:"center", marginTop:20, fontSize:9, color:"#1e2d3e" }}>
        Pediatric IVF CDS with Integrated Education — AAP 2018 / SSC 2020 / ISPAD 2022 — For educational and clinical reference
      </div>
    </div>
  );
}

// Components
function Pill({children,c}) { return <span style={{ padding:"3px 9px", borderRadius:5, border:`1px solid ${c}30`, background:`${c}10`, color:c, fontSize:10, fontWeight:600 }}>{children}</span>; }
function TreeNode({c,tag,title,sub,edu,onLearn,small}) {
  return (
    <div style={{ background:`${c}06`, border:`1px solid ${c}18`, borderRadius:small?8:10, padding:small?"8px 10px":"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
      <div style={{ flex:1 }}>
        <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:3, flexWrap:"wrap" }}>
          <span style={{ fontSize:8, fontWeight:700, color:c, background:`${c}15`, padding:"1px 6px", borderRadius:3, textTransform:"uppercase", letterSpacing:"0.06em" }}>{tag}</span>
          <span style={{ fontSize:small?11:12, fontWeight:600, color:"#e8edf5" }}>{title}</span>
        </div>
        <div style={{ fontSize:small?9:10, color:"#6b7a94", lineHeight:1.4 }}>{sub}</div>
      </div>
      {edu && (
        <button onClick={()=>onLearn(edu)} style={{ padding:"4px 10px", borderRadius:5, border:"1px solid #3b82f640", background:"rgba(59,130,246,0.1)", color:"#60a5fa", fontSize:9, fontWeight:700, cursor:"pointer", flexShrink:0, whiteSpace:"nowrap" }}>
          Learn ›
        </button>
      )}
    </div>
  );
}
function QCalc({title,rows,eduId,onLearn}) {
  return (
    <div style={{ background:"rgba(12,18,32,0.8)", border:"1px solid #1e293b", borderRadius:10, padding:12 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
        <h4 style={{ fontSize:12, fontWeight:600, color:"#e8edf5", margin:0 }}>{title}</h4>
        {eduId && <button onClick={()=>onLearn(eduId)} style={{ padding:"2px 8px", borderRadius:4, border:"1px solid #3b82f640", background:"rgba(59,130,246,0.08)", color:"#60a5fa", fontSize:8, fontWeight:700, cursor:"pointer" }}>Learn ›</button>}
      </div>
      {rows.map(([label,val,color],i) => (
        <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"3px 0", borderBottom:i<rows.length-1?"1px solid #111827":"none" }}>
          <span style={{ fontSize:10, color:"#6b7a94" }}>{label}</span>
          <span style={{ fontSize:11, fontWeight:700, color }}>{val}</span>
        </div>
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PedIVFEducational />);
</script>
<script src="/theme-bridge.js"></script>
</body>
</html>
