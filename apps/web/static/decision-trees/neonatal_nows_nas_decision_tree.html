<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOWS / NAS Decision Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg-primary: var(--bg, #0b1121);
    --bg-secondary: var(--bg2, #0f172a);
    --bg-card: var(--surface, #1e293b);
    --text-primary: var(--text, #e8edf5);
    --text-secondary: var(--text2, #8892a8);
    --text-muted: var(--text3, #5a6478);
    --accent-blue: var(--accent, #3b82f6);
    --accent-cyan: var(--accent2, #06b6d4);
    --accent-emerald: var(--green, #10b981);
    --accent-amber: var(--yellow, #f59e0b);
    --accent-rose: var(--red, #f43f5e);
    --accent-violet: var(--purple, #8b5cf6);
    --accent-orange: var(--orange, #f97316);
    --border: var(--border, #1e293b);
    --node-assess: var(--bbg, #1e3a5f);
    --node-treat: var(--gbg, #0d3320);
    --node-decide: var(--ybg, #3a2d0a);
    --node-wean: var(--gbg, #0d2f2f);
    --node-stop: var(--pbg, #2a2a2a);
    --node-escalate: var(--rbg, #3a0d0d);
    --node-adjunct: var(--bbg, #1a1a3a);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg-primary) 0%, rgba(10,14,26,0.95) 70%, rgba(10,14,26,0) 100%);
    padding: 16px 24px 32px;
    pointer-events: none;
  }

  #header > * { pointer-events: auto; }

  #header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  #header p {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .legend {
    display: flex;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-secondary);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }

  #tree-container {
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }

  #tree-container:active { cursor: grabbing; }

  .node-group { cursor: pointer; }

  .node-rect {
    rx: 6;
    ry: 6;
    stroke-width: 1.5;
    transition: filter 0.2s;
  }

  .node-group:hover .node-rect {
    filter: brightness(1.3) drop-shadow(0 0 8px rgba(59,130,246,0.3));
  }

  .node-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    fill: var(--text-primary);
    pointer-events: none;
  }

  .node-sublabel {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px;
    font-weight: 400;
    fill: var(--text-secondary);
    pointer-events: none;
  }

  .node-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    fill: var(--text-primary);
    pointer-events: none;
  }

  .link-path {
    fill: none;
    stroke-width: 1.5;
    opacity: 0.5;
  }

  .link-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px;
    font-weight: 500;
    pointer-events: none;
  }

  .expand-icon {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    fill: var(--text-secondary);
    pointer-events: none;
  }

  /* Detail panel */
  #detail-panel {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 360px;
    max-height: 50vh;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    z-index: 200;
    overflow-y: auto;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  #detail-panel.visible { display: block; }

  #detail-panel h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text-primary);
  }

  #detail-panel .detail-type {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    padding: 2px 8px;
    border-radius: 3px;
    display: inline-block;
  }

  #detail-panel .detail-body {
    font-size: 12px;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  #detail-panel .detail-body strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  #detail-panel .close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  #detail-panel .close-btn:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text-primary);
  }

  #controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    display: flex;
    gap: 6px;
    z-index: 200;
  }

  .ctrl-btn {
    width: 36px;
    height: 36px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
  }

  .ctrl-btn:hover {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }

  /* Scrollbar */
  #detail-panel::-webkit-scrollbar { width: 4px; }
  #detail-panel::-webkit-scrollbar-track { background: transparent; }
  #detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="header">
  <h1>NOWS Pharmacotherapy Decision Tree</h1>
  <p>Level II+ Nursery &mdash; Neonatal Opioid Withdrawal Syndrome &mdash; Click nodes to expand / view details</p>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Assessment</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Decision</div>
    <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>Treatment</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Escalation</div>
    <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>Weaning</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f43f5e"></div>Stop / Discharge</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Adjunct</div>
  </div>
</div>

<div id="tree-container">
  <svg id="tree-svg"></svg>
</div>

<div id="detail-panel">
  <button class="close-btn" onclick="closeDetail()">&times;</button>
  <div class="detail-type" id="detail-type-badge"></div>
  <h3 id="detail-title"></h3>
  <div class="detail-body" id="detail-body"></div>
</div>

<div id="controls">
  <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">+</button>
  <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">&minus;</button>
  <button class="ctrl-btn" onclick="resetView()" title="Reset View">⟳</button>
  <button class="ctrl-btn" onclick="expandAll()" title="Expand All">⊞</button>
  <button class="ctrl-btn" onclick="collapseAll()" title="Collapse All">⊟</button>
</div>

            {
              name: "Score ≥8 × 3 or ≥12 × 2?",
              type: "decide",
              sub: "Pharmacotherapy threshold reached",
              detail: "<strong>If threshold met:</strong> Follow same pharmacotherapy selection tree as ESC pathway (Morphine / Methadone / Buprenorphine).<br><br><strong>Wean triggers (Finnegan):</strong><br>• Scores consistently <8 for 24–48h → begin wean<br>• Wean by reducing dose 10–20% of max stabilizing dose q24–48h<br>• Discontinue when dose at minimum therapeutic level with scores <8 × 48h<br>• Observe 24–48h post-discontinuation<br><br><strong>All other decision nodes (escalation, adjunctive therapy, discharge) follow identical logic as ESC pathway.</strong>"
            }
          ]
        },
        {
          name: "Polysubstance? Atypical Presentation?",
          type: "decide",
          sub: "Consider co-exposures if atypical symptoms",
          detail: "<strong>Red flags for polysubstance exposure:</strong><br><br><strong>Opioid + Benzodiazepine:</strong> Biphasic withdrawal — initial opioid (24–72h) then delayed benzo (days–weeks). Add phenobarbital.<br><br><strong>Opioid + Gabapentin:</strong> Tongue thrusting, nystagmus, opisthotonos, rolling eyes. Does NOT respond to opioid treatment. Consider gabapentin 5 mg/kg q12h (Loudin 2017).<br><br><strong>Opioid + SSRI:</strong> Jitteriness, increased tone, tachypnea. Earlier onset, self-limited 48h. Supportive care usually sufficient.<br><br><strong>Opioid + Methamphetamine:</strong> May initially mask opioid withdrawal. Monitor for delayed presentation after stimulant effects wane.<br><br><strong>Iatrogenic (NICU):</strong> After >5 days continuous opioid/benzo infusion. Use WAT-1 score. Protocolized 10–20% daily wean.",
          children: [
            {
              name: "Gabapentin Exposure",
              type: "adjunct",
              sub: "Gabapentin 5 mg/kg PO q12h",
              detail: "<strong>Gabapentin for atypical gabapentin co-exposure withdrawal:</strong><br><br><strong>Dose:</strong> 5 mg/kg PO q12h<br>• 79% of gabapentin+opioid co-exposed infants show atypical phenotype<br>• Symptoms do NOT respond to standard opioid treatment<br>• Gabapentin administration resolves atypical symptoms<br>• Continue until symptoms resolve, then wean over 5–7 days<br><br><strong>Also treat concurrent opioid withdrawal with standard opioid protocol.</strong>"
            },
            {
              name: "Benzodiazepine Co-Exposure",
              type: "adjunct",
              sub: "Phenobarbital: Load 20 mg/kg → 5 mg/kg/day",
              detail: "<strong>Benzodiazepine co-exposure management:</strong><br><br>• 51% increased odds of pharmacotherapy (Sanlorenzo 2019)<br>• May cause delayed/biphasic withdrawal (benzo withdrawal peaks 7–14 days)<br>• <strong>Add phenobarbital</strong> as primary agent for benzo component<br>• Loading: 20 mg/kg IV/PO<br>• Maintenance: 5 mg/kg/day, target level 20–30 mcg/mL<br>• Monitor sedation closely — combined with opioid treatment<br>• Outpatient phenobarbital wean: 20% every 3–5 days<br>• Extend observation period to ≥7 days before discharge"
            }
          ]
        }
      ]
    }
  ]
};

// ===== COLOR & STYLE MAPS =====
const typeColors = {
  assess: { fill: '#1e3a5f', stroke: '#3b82f6', badge: '#3b82f6', label: 'Assessment' },
  decide: { fill: '#3b1f5e', stroke: '#8b5cf6', badge: '#8b5cf6', label: 'Decision' },
  treat: { fill: '#1a3d2e', stroke: '#10b981', badge: '#10b981', label: 'Treatment' },
  escalate: { fill: '#3d2e1a', stroke: '#f59e0b', badge: '#f59e0b', label: 'Escalation' },
  wean: { fill: '#1a3d3d', stroke: '#06b6d4', badge: '#06b6d4', label: 'Weaning' },
  stop: { fill: '#1a2d1a', stroke: '#22c55e', badge: '#22c55e', label: 'Discharge' },
  adjunct: { fill: '#2e1a3d', stroke: '#f97316', badge: '#f97316', label: 'Adjunctive' },
};

// ===== D3 TREE SETUP =====
const width = window.innerWidth;
const height = window.innerHeight;
const nodeW = 210, nodeH = 52;

const svg = d3.select('#tree-svg')
  .attr('width', width)
  .attr('height', height);

const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.15, 2.5])
  .on('zoom', (e) => g.attr('transform', e.transform));

svg.call(zoom);

const treemap = d3.tree().nodeSize([nodeW + 30, nodeH + 90]);

let root = d3.hierarchy(treeData, d => d.children);
root.x0 = 0;
root.y0 = 0;

// Start with depth 2 collapsed
root.descendants().forEach((d) => {
  if (d.depth > 2 && d.children) {
    d._children = d.children;
    d.children = null;
  }
});

const linkGroup = g.append('g').attr('class', 'links');
const nodeGroup = g.append('g').attr('class', 'nodes');

function update(source) {
  const treeLayout = treemap(root);
  const nodes = treeLayout.descendants();
  const links = treeLayout.links();

  // Swap x/y for horizontal layout
  nodes.forEach(d => {
    const tmp = d.x;
    d.x = d.y * 1.4;
    d.y = tmp;
  });

  // ===== LINKS =====
  const link = linkGroup.selectAll('.link-group')
    .data(links, d => d.target.data.name);

  const linkEnter = link.enter().append('g').attr('class', 'link-group');

  linkEnter.append('path')
    .attr('class', 'link-path')
    .attr('d', () => {
      const o = { x: source.x0 || 0, y: source.y0 || 0 };
      return diagonal(o, o);
    })
    .attr('stroke', d => typeColors[d.target.data.type]?.stroke || '#3b82f6');

  const linkUpdate = linkEnter.merge(link);

  linkUpdate.select('.link-path')
    .transition().duration(500)
    .attr('d', d => diagonal(d.source, d.target))
    .attr('stroke', d => typeColors[d.target.data.type]?.stroke || '#3b82f6');

  link.exit().select('.link-path')
    .transition().duration(300)
    .attr('d', () => {
      const o = { x: source.x, y: source.y };
      return diagonal(o, o);
    })
    .remove();

  link.exit().transition().duration(300).remove();

  // ===== NODES =====
  const node = nodeGroup.selectAll('.node-group')
    .data(nodes, d => d.data.name);

  const nodeEnter = node.enter().append('g')
    .attr('class', 'node-group')
    .attr('transform', `translate(${source.x0 || 0},${source.y0 || 0})`)
    .on('click', (e, d) => {
      e.stopPropagation();
      if (e.shiftKey || e.metaKey) {
        showDetail(d.data);
        return;
      }
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      showDetail(d.data);
      update(d);
    });

  // Node rectangle
  nodeEnter.append('rect')
    .attr('class', 'node-rect')
    .attr('x', -nodeW / 2)
    .attr('y', -nodeH / 2)
    .attr('width', nodeW)
    .attr('height', nodeH)
    .attr('fill', d => typeColors[d.data.type]?.fill || '#1a2035')
    .attr('stroke', d => typeColors[d.data.type]?.stroke || '#3b82f6');

  // Type badge
  nodeEnter.append('rect')
    .attr('x', -nodeW / 2 + 6)
    .attr('y', -nodeH / 2 + 5)
    .attr('width', 50)
    .attr('height', 12)
    .attr('rx', 2)
    .attr('fill', d => typeColors[d.data.type]?.badge || '#3b82f6')
    .attr('opacity', 0.2);

  nodeEnter.append('text')
    .attr('class', 'node-badge')
    .attr('x', -nodeW / 2 + 8)
    .attr('y', -nodeH / 2 + 14)
    .text(d => typeColors[d.data.type]?.label?.toUpperCase() || '');

  // Name label
  nodeEnter.append('text')
    .attr('class', 'node-label')
    .attr('x', -nodeW / 2 + 8)
    .attr('y', 2)
    .text(d => truncate(d.data.name, 28));

  // Sublabel
  nodeEnter.append('text')
    .attr('class', 'node-sublabel')
    .attr('x', -nodeW / 2 + 8)
    .attr('y', 16)
    .text(d => truncate(d.data.sub || '', 34));

  // Expand/collapse indicator
  nodeEnter.append('text')
    .attr('class', 'expand-icon')
    .attr('x', nodeW / 2 - 14)
    .attr('y', 4)
    .text(d => (d.children || d._children) ? (d.children ? '−' : '+') : '');

  // UPDATE
  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(500)
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodeUpdate.select('.expand-icon')
    .text(d => (d.children || d._children) ? (d.children ? '−' : '+') : '');

  // EXIT
  node.exit().transition().duration(300)
    .attr('transform', `translate(${source.x},${source.y})`)
    .style('opacity', 0)
    .remove();

  // Store positions
  nodes.forEach(d => {
    d.x0 = d.x;
    d.y0 = d.y;
  });
}

function diagonal(s, d) {
  const mx = (s.x + d.x) / 2;
  return `M ${s.x},${s.y} C ${mx},${s.y} ${mx},${d.y} ${d.x},${d.y}`;
}

function truncate(str, n) {
  return str.length > n ? str.substr(0, n - 1) + '…' : str;
}

// ===== DETAIL PANEL =====
function showDetail(data) {
  const panel = document.getElementById('detail-panel');
  const colors = typeColors[data.type] || typeColors.assess;
  document.getElementById('detail-type-badge').textContent = colors.label;
  document.getElementById('detail-type-badge').style.background = colors.badge + '22';
  document.getElementById('detail-type-badge').style.color = colors.badge;
  document.getElementById('detail-title').textContent = data.name;
  document.getElementById('detail-body').innerHTML = data.detail || 'No additional details.';
  panel.classList.add('visible');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
}

// ===== CONTROLS =====
function zoomIn() {
  svg.transition().duration(300).call(zoom.scaleBy, 1.3);
}

function zoomOut() {
  svg.transition().duration(300).call(zoom.scaleBy, 0.7);
}

function resetView() {
  svg.transition().duration(500).call(
    zoom.transform,
    d3.zoomIdentity.translate(180, height / 2).scale(0.65)
  );
}

function expandAll() {
  root.descendants().forEach(d => {
    if (d._children) {
      d.children = d._children;
      d._children = null;
    }
  });
  update(root);
}

function collapseAll() {
  root.descendants().forEach(d => {
    if (d.depth > 1 && d.children) {
      d._children = d.children;
      d.children = null;
    }
  });
  update(root);
}

// ===== INIT =====
update(root);
resetView();

// Close detail on background click
svg.on('click', () => closeDetail());

// Resize handler
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
});
</script>
<script src="../theme-bridge.js"></script>
</body>
</html>
