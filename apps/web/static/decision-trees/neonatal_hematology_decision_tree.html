<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1121;--bg2:#0f172a;--surface:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--accent:#38bdf8;
--red:#f87171;--rbg:#2a1215;--orange:#fb923c;--obg:#2a1a0a;--yellow:#fbbf24;--ybg:#2a2006;
--green:#4ade80;--gbg:#0a2a1a;--blue:#60a5fa;--bbg:#0f1d3a;--purple:#c084fc;--pbg:#1a0f2e;--cyan:#22d3ee;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw;}
/* Header */
#hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(180deg,var(--bg) 65%,transparent);padding:14px 24px 30px;display:flex;align-items:center;gap:16px;}
#hdr h1{font-family:'DM Serif Display',serif;font-size:24px;color:var(--accent);letter-spacing:.3px;}
#hdr .sub{font-size:12px;color:var(--text2);font-weight:300;margin-top:2px;}
.ctrls{margin-left:auto;display:flex;gap:8px;}
.ctrls button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;}
.ctrls button:hover{background:var(--border);border-color:var(--accent);color:var(--accent);}
/* Tree SVG */
#tc{width:100vw;height:100vh;cursor:grab;}#tc:active{cursor:grabbing;}
.ng{cursor:pointer;}.nr{rx:10;ry:10;stroke-width:1.8;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));transition:all .25s;}
.ng:hover .nr{filter:brightness(1.25) drop-shadow(0 0 12px rgba(56,189,248,.25));}
.nl{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:11px;fill:var(--text);text-anchor:middle;pointer-events:none;}
.ns{font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:8.5px;fill:var(--text2);text-anchor:middle;pointer-events:none;}
.ni{font-size:15px;text-anchor:middle;pointer-events:none;}
.lk{fill:none;stroke:var(--border);stroke-width:1.6;stroke-opacity:.5;}
.ll{font-family:'IBM Plex Mono',monospace;font-size:8.5px;fill:var(--yellow);font-weight:500;}
.ib{cursor:pointer;transition:all .2s;}.ib:hover{transform:scale(1.15);}

/* ═══ POPUP ═══ */
#po{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;justify-content:center;align-items:center;}
#po.active{display:flex;}
#pp{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:680px;width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:popIn .28s cubic-bezier(.16,1,.3,1);}
#pp::-webkit-scrollbar{width:5px;}#pp::-webkit-scrollbar-track{background:transparent;}#pp::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@keyframes popIn{from{transform:scale(.9) translateY(24px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
#ph{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;position:sticky;top:0;background:var(--bg2);z-index:1;border-radius:16px 16px 0 0;}
#picon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
#ptitle{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);line-height:1.2;}
#ptype{font-size:11px;font-weight:600;padding:3px 10px;border-radius:5px;display:inline-block;margin-top:5px;letter-spacing:.5px;}
#pclose{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:18px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
#pclose:hover{color:var(--text);border-color:var(--accent);}
#pbody{padding:16px 24px 32px;}
/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tabs::-webkit-scrollbar{height:0;}
.tb{background:none;border:none;color:var(--text2);font-size:11px;font-weight:600;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;}
.tb.active{color:var(--accent);border-bottom-color:var(--accent);}
.tb:hover:not(.active){color:var(--text);}
.tc{display:none;}.tc.active{display:block;}
/* Content typography */
.tc p,.tc li{font-size:13px;line-height:1.7;color:var(--text2);margin-bottom:8px;}
.tc ul{list-style:none;padding-left:0;margin-bottom:10px;}
.tc li{padding:3px 0 3px 18px;position:relative;}
.tc li::before{content:'›';position:absolute;left:2px;color:var(--accent);font-weight:700;font-size:14px;}
.tc strong{color:var(--text);}
/* Tables */
.rt{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12px;}
.rt th{text-align:left;font-size:9.5px;font-weight:700;color:var(--accent);padding:8px 10px;border-bottom:1.5px solid var(--border);text-transform:uppercase;letter-spacing:.6px;background:rgba(56,189,248,.04);}
.rt td{padding:7px 10px;border-bottom:1px solid rgba(51,65,85,.3);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.rt td:first-child{font-family:'IBM Plex Sans',sans-serif;font-weight:500;color:var(--text2);}
.rt tr:hover td{background:rgba(56,189,248,.025);}
.dt{width:100%;border-collapse:collapse;margin:6px 0 10px;}
.dt th{text-align:left;font-size:9px;font-weight:700;color:var(--text2);padding:6px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px;}
.dt td{font-size:11px;padding:6px 8px;border-bottom:1px solid rgba(51,65,85,.2);color:var(--text);vertical-align:top;line-height:1.5;}
/* Alert boxes */
.bx{border-radius:10px;padding:12px 16px;font-size:12px;line-height:1.6;margin:10px 0;}
.bx strong{color:inherit;}
.br{background:var(--rbg);border:1px solid rgba(248,113,113,.25);color:var(--red);}
.bg{background:var(--gbg);border:1px solid rgba(74,222,128,.25);color:var(--green);}
.bb{background:var(--bbg);border:1px solid rgba(96,165,250,.25);color:var(--blue);}
.bo{background:var(--obg);border:1px solid rgba(251,146,60,.25);color:var(--orange);}
.bp{background:var(--pbg);border:1px solid rgba(192,132,252,.25);color:var(--purple);}
/* Step lists */
.sl{counter-reset:stp;list-style:none!important;padding:0;margin:8px 0;}
.sl li{counter-increment:stp;padding:5px 0 5px 32px!important;position:relative;font-size:12px;color:var(--text2);line-height:1.55;}
.sl li::before{content:counter(stp)!important;position:absolute;left:0;top:4px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border);text-align:center;line-height:22px;font-size:10px;font-weight:700;color:var(--accent);}
/* Legend */
#lg{position:fixed;bottom:14px;left:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:11px;z-index:50;display:flex;gap:14px;flex-wrap:wrap;}
.li{display:flex;align-items:center;gap:6px;}.ld{width:10px;height:10px;border-radius:3px;}
#bc{position:fixed;bottom:14px;right:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:11px;color:var(--text2);z-index:50;}
</style>

const T={
name:"Newborn CBC\nEvaluation",icon:"🩸",type:"assessment",sub:"Initial hematologic assessment",edge:"",
info:{tabs:["Overview","Reference Values","Interpretation","Workup"],
t0:`<p>The complete blood count (CBC) is the foundational hematologic test in neonatal care. It includes hemoglobin (Hb), hematocrit (Hct), red blood cell indices (MCV, MCH, MCHC, RDW), white blood cell count with automated and manual differential, platelet count, and reticulocyte count.</p>
<p><strong>When to obtain a neonatal CBC:</strong></p>
<ul><li>Risk factors for sepsis (maternal fever, PROM >18h, GBS positive/unknown)</li>
<li>Clinical signs: pallor, plethora, jaundice, petechiae, bleeding</li>
<li>Maternal history: diabetes, preeclampsia, TORCH, alloimmunization</li>
<li>Abnormal prenatal findings (hydrops, IUGR, TTTS)</li>
<li>Traumatic delivery (vacuum, forceps) — evaluate for hemorrhage</li>
<li>Temperature instability, poor feeding, lethargy, respiratory distress</li></ul>`,
t1:`<table class="rt"><thead><tr><th>Parameter</th><th>Term (37–42 wk)</th><th>Preterm (28–36 wk)</th><th>Notes</th></tr></thead><tbody>
<tr><td>Hemoglobin</td><td>14–20 g/dL</td><td>12–18 g/dL</td><td>Cord Hb; peaks at 6–12h</td></tr>
<tr><td>Hematocrit</td><td>42–65%</td><td>36–60%</td><td>Venous required; cap overestimates 5–15%</td></tr>
<tr><td>MCV</td><td>100–110 fL</td><td>105–125 fL</td><td>Macrocytic is NORMAL in neonates</td></tr>
<tr><td>Reticulocyte count</td><td>3–7%</td><td>6–10%</td><td>Higher in preterm; active erythropoiesis</td></tr>
<tr><td>WBC</td><td>9,000–30,000/µL</td><td>5,000–21,000/µL</td><td>Peaks at 12–24h then declines</td></tr>
<tr><td>ANC</td><td>6,000–26,000/µL</td><td>1,000–12,000/µL</td><td>Use Schmutz/Manroe charts by GA</td></tr>
<tr><td>Platelets</td><td>150,000–400,000/µL</td><td>150,000–400,000/µL</td><td>Same regardless of GA</td></tr>
<tr><td>HbF</td><td>60–80%</td><td>80–95%</td><td>Higher O₂ affinity; declines over months</td></tr>
<tr><td>PT</td><td>12–18 sec</td><td>14–22 sec</td><td>Physiologically prolonged (low Vit K factors)</td></tr>
<tr><td>aPTT</td><td>25–70 sec</td><td>25–100 sec</td><td>Wide range; highly variable in preterm</td></tr>
<tr><td>Fibrinogen</td><td>150–400 mg/dL</td><td>120–300 mg/dL</td><td>Slightly lower in preterm</td></tr>
</tbody></table>`,
t2:`<p><strong>Five-Step CBC Interpretation Framework:</strong></p>
<ol class="sl">
<li><strong>Hb/Hct normal for GA and postnatal age?</strong> Low → anemia pathway. High → polycythemia. Always use age-appropriate references.</li>
<li><strong>Reticulocyte count?</strong> High retic (>6–8%) = hemorrhage or hemolysis (marrow responding). Low retic (&lt;2%) = hypoproliferative (marrow failing).</li>
<li><strong>Direct Coombs (DAT) positive?</strong> Positive = immune hemolysis (Rh, ABO, minor antigens). Negative = non-immune or hemorrhage.</li>
<li><strong>Platelet count?</strong> Low = thrombocytopenia pathway. Timing matters: early (&lt;72h) vs late (>72h) determines differential.</li>
<li><strong>Coagulopathy?</strong> Prolonged PT/aPTT = assess for DIC, VKDB, liver disease, or inherited factor deficiency.</li>
</ol>
<div class="bx bo">⚠️ <strong>Critical Pitfall:</strong> Capillary (heel-stick) Hct overestimates venous Hct by 5–15%. ALWAYS confirm with a venous sample before making treatment decisions.</div>`,
t3:`<p><strong>Systematic Workup by Finding:</strong></p>
<table class="dt"><thead><tr><th>Finding</th><th>Immediate Workup</th><th>Second-Line</th></tr></thead><tbody>
<tr><td>Low Hb/Hct</td><td>Retic, DAT, smear, T&S, total/direct bili</td><td>KB test (maternal blood), Hb electrophoresis, G6PD screen</td></tr>
<tr><td>High Hb/Hct</td><td>Confirm VENOUS Hct, glucose, calcium, bili</td><td>Blood gas, renal function, cranial US if symptomatic</td></tr>
<tr><td>Low platelets</td><td>Smear, maternal plt count, TORCH, blood cx</td><td>HPA typing (NAIT), cranial US, DIC panel</td></tr>
<tr><td>Prolonged PT/aPTT</td><td>Fibrinogen, D-dimer, plt count, smear</td><td>Factor levels (VIII, IX), mixing studies, LFTs</td></tr>
<tr><td>Abnormal WBC</td><td>Blood cx, CRP/procalcitonin, I:T ratio</td><td>CSF if sepsis suspected, serial CBC q12–24h</td></tr>
</tbody></table>`
},
children:[
// ═══════════════════════════ BRANCH 1: ANEMIA ═══════════════════════════
{name:"ANEMIA",icon:"🔻",type:"decision",sub:"Hb below GA/age norms",edge:"Low Hb/Hct",
info:{tabs:["Classification","Differential","Workup Steps","2024 Transfusion CPG"],
t0:`<p>Neonatal anemia = Hb below normal for gestational and postnatal age. Term at birth: Hb &lt; 14 g/dL. The reticulocyte count classifies the mechanism.</p>
<table class="rt"><thead><tr><th>GA / Age</th><th>Anemia Threshold</th><th>Notes</th></tr></thead><tbody>
<tr><td>Term at birth</td><td>&lt; 14 g/dL</td><td>Venous sample</td></tr>
<tr><td>Preterm 28–32 wk</td><td>&lt; 13 g/dL</td><td>Lower normal</td></tr>
<tr><td>Preterm &lt; 28 wk</td><td>&lt; 12 g/dL</td><td>Wide variability</td></tr>
<tr><td>Term physiologic nadir</td><td>9–11 g/dL at 6–12 wk</td><td>Normal; no treatment</td></tr>
<tr><td>Preterm nadir</td><td>7–9 g/dL at 4–8 wk</td><td>Anemia of prematurity</td></tr>
</tbody></table>`,
t1:`<table class="dt"><thead><tr><th>Mechanism</th><th>Retic</th><th>DAT</th><th>Bili</th><th>Common Causes</th><th>Key Clues</th></tr></thead><tbody>
<tr><td><strong>Hemorrhage</strong></td><td>↑</td><td>−</td><td>Normal</td><td>FMH, TTTS, abruption, subgaleal, IVH, hepatic</td><td>Pallor ± shock; normal smear morphology; KB test</td></tr>
<tr><td><strong>Hemolysis (immune)</strong></td><td>↑</td><td><strong>+</strong></td><td>↑ indirect</td><td>Rh, ABO, anti-Kell, anti-c, anti-E</td><td>Jaundice; spherocytes; TSB rise >0.5/hr</td></tr>
<tr><td><strong>Hemolysis (non-immune)</strong></td><td>↑</td><td>−</td><td>↑ indirect</td><td>G6PD, hereditary spherocytosis, PK def, α-thal</td><td>Bite cells (G6PD), spherocytes+↑MCHC (HS)</td></tr>
<tr><td><strong>Hypoproliferative</strong></td><td>↓/normal</td><td>−</td><td>Normal</td><td>Anemia of prematurity, DBA, Fanconi, parvovirus</td><td>Low retic; anomalies (DBA/Fanconi); blasts (TAM)</td></tr>
</tbody></table>`,
t2:`<ol class="sl">
<li><strong>CBC with reticulocyte count and peripheral smear</strong> — severity and morphology</li>
<li><strong>Direct Coombs test (DAT)</strong> — positive = immune hemolysis</li>
<li><strong>Blood type and Rh</strong> — maternal AND infant</li>
<li><strong>Total and direct bilirubin</strong> — indirect ↑ supports hemolysis</li>
<li><strong>Kleihauer-Betke on MATERNAL blood</strong> — if hemorrhage suspected</li>
<li><strong>Based on DAT result:</strong><br>
DAT+ → antibody ID panel<br>
DAT− + high retic → G6PD screen, EMA test, Hb electrophoresis<br>
DAT− + low retic → parvovirus B19 PCR, bone marrow if persistent</li>
</ol>
<div class="bx bo">⚠️ <strong>Anti-Kell pitfall:</strong> Suppresses erythropoiesis AND causes hemolysis. Retic may be LOW despite immune hemolysis. Don't be reassured by low bilirubin in anti-Kell disease — anemia can be severe.</div>`,
t3:`<p><strong>2024 Neonatal Transfusion Network CPG</strong> (Deschmann et al., JAMA Network Open 2024). Based on ETTNO + TOP trials — NO benefit of liberal thresholds.</p>
<table class="rt"><thead><tr><th>Postnatal Week</th><th>On Resp Support</th><th>No/Minimal Support</th></tr></thead><tbody>
<tr><td>Week 1</td><td>Hb &lt; 11 g/dL</td><td>Hb &lt; 10 g/dL</td></tr>
<tr><td>Week 2</td><td>Hb &lt; 10 g/dL</td><td>Hb &lt; 8.5 g/dL</td></tr>
<tr><td>Week 3+</td><td>Hb &lt; 9 g/dL</td><td>Hb &lt; 7 g/dL</td></tr>
</tbody></table>
<p><strong>Protocol:</strong> 10–20 mL/kg pRBC (Hct ~60%) over 2–4 hr. Irradiated, leukoreduced, CMV-safe, O Rh-compatible. Assigned-unit system to limit donor exposures.</p>
<p><strong>Prevention:</strong></p>
<ul><li>DCC 30–60 sec → 27% fewer transfusions (Cochrane 2019)</li>
<li>Minimize phlebotomy — micro-sampling, POC testing</li>
<li>Iron 2–4 mg/kg/day starting 2–4 weeks in preterm</li>
<li>EPO: modest benefit, no NDI benefit (PENUT, NEJM 2020); NOT recommended routinely</li></ul>
<div class="bx bg">✓ <strong>Continue enteral feeds during RBC transfusion.</strong> Transfusion-associated NEC not consistently demonstrated (TOP subanalysis 2022).</div>`
},children:[
// ── Hemorrhagic ──
{name:"Hemorrhagic\nAnemia",icon:"💧",type:"emergency",sub:"Blood loss · Retic ↑ · DAT −",edge:"Retic ↑\nDAT −",
info:{tabs:["Definition","Causes","Emergency Protocol","Subgaleal Hemorrhage"],
t0:`<p>Hemorrhagic anemia = blood loss, acute or chronic. DAT negative, normal smear morphology, initially normal bilirubin (acute). Reticulocyte count elevated.</p>
<ul><li><strong>Acute:</strong> pallor, tachycardia, hypotension, poor perfusion, normal bili</li>
<li><strong>Chronic:</strong> compensated, hepatosplenomegaly (extramedullary hematopoiesis), elevated retics</li>
<li>Bilirubin initially NORMAL (no RBC destruction releasing bilirubin)</li>
<li>MCV may be elevated from reticulocytosis (reticulocytes are large cells)</li></ul>`,
t1:`<table class="dt"><thead><tr><th>Cause</th><th>Incidence</th><th>Presentation</th><th>Diagnosis</th><th>Urgency</th></tr></thead><tbody>
<tr><td><strong>FMH</strong></td><td>Large: 1/1,000–5,000</td><td>Acute: pallor+shock. Chronic: compensated</td><td>KB test on MATERNAL blood</td><td>🔴</td></tr>
<tr><td><strong>TTTS</strong></td><td>10% MC twins</td><td>Donor: anemic. Recipient: polycythemic</td><td>Hb difference >5 g/dL between twins</td><td>🟠</td></tr>
<tr><td><strong>Subgaleal hemorrhage</strong></td><td>1/160 vacuum</td><td>Boggy swelling crossing sutures, ↑ HC</td><td>Clinical; HC q30min</td><td>🔴🔴</td></tr>
<tr><td><strong>Placental abruption</strong></td><td>1% pregnancies</td><td>Acute hemorrhage at delivery</td><td>Clinical + placental exam</td><td>🔴</td></tr>
<tr><td><strong>IVH</strong></td><td>25–30% &lt;1500g</td><td>Apnea, bulging fontanelle, seizures</td><td>Cranial US (all &lt;32 wk at 7–14 d)</td><td>🟡</td></tr>
<tr><td><strong>Hepatic rupture</strong></td><td>Rare</td><td>Distension, falling Hb, shock</td><td>Abdominal US</td><td>🔴</td></tr>
<tr><td><strong>Adrenal hemorrhage</strong></td><td>Uncommon</td><td>Flank mass, adrenal insufficiency</td><td>US; may calcify</td><td>🟠</td></tr>
<tr><td><strong>Cephalhematoma</strong></td><td>1–2%</td><td>Firm, limited to ONE bone</td><td>Does NOT cross sutures</td><td>🟢</td></tr>
</tbody></table>`,
t2:`<ol class="sl">
<li><strong>ABCs:</strong> Airway/breathing secured. IV access ×2.</li>
<li><strong>Volume:</strong> NS 10–20 mL/kg bolus. Repeat for HR >180, CRT >3s, hypotension.</li>
<li><strong>Emergency blood:</strong> Uncrossmatched O-neg pRBCs 10–15 mL/kg.</li>
<li><strong>Crossmatched pRBC:</strong> 10–20 mL/kg over 2–4 hr (faster if shock).</li>
<li><strong>Coagulopathy:</strong> Vitamin K 1 mg IV. FFP 10–15 mL/kg. Cryo 5–10 mL/kg if fib &lt;100.</li>
<li><strong>Identify source:</strong> KB test, cranial US, abdominal US, serial HC.</li>
<li><strong>Monitor:</strong> Serial Hb q4–6h. HC q30min if subgaleal. Strict I&O.</li>
<li><strong>Transfer Level III/IV</strong> if ongoing hemorrhage or hemodynamic instability.</li>
</ol>`,
t3:`<div class="bx br">🚨 <strong>Subgaleal hemorrhage is LIFE-THREATENING.</strong> The space can hold the entire blood volume (~80 mL/kg = 240–320 mL in a term neonate).</div>
<p><strong>Subgaleal Hemorrhage Protocol:</strong></p>
<ol class="sl">
<li><strong>Recognize:</strong> Boggy, fluctuant swelling that CROSSES suture lines. Often shifts with gravity.</li>
<li><strong>Measure HC immediately and every 30 minutes.</strong> Increase >1 cm = concerning.</li>
<li><strong>Establish IV ×2.</strong> STAT CBC, T&S, PT/aPTT/fibrinogen.</li>
<li><strong>Volume resuscitation:</strong> NS 10–20 mL/kg. Repeat PRN.</li>
<li><strong>pRBC 10–15 mL/kg.</strong> Use O-neg uncrossmatched if emergent.</li>
<li><strong>Correct coagulopathy:</strong> Vit K 1 mg IV. FFP 10–15 mL/kg. Cryo if fib &lt;100.</li>
<li><strong>Pressure wrap</strong> (ACE around head) — may slow hemorrhage.</li>
<li><strong>Transfer Level III/IV NICU</strong> immediately.</li>
</ol>
<p><strong>IVH Papile Classification:</strong></p>
<table class="rt"><thead><tr><th>Grade</th><th>Description</th><th>Prognosis</th></tr></thead><tbody>
<tr><td>I</td><td>Germinal matrix hemorrhage only</td><td>Excellent; resolves</td></tr>
<tr><td>II</td><td>IVH without dilation (&lt;50%)</td><td>Generally favorable</td></tr>
<tr><td>III</td><td>IVH WITH dilation (>50%)</td><td>Risk hydrocephalus/NDI</td></tr>
<tr><td>IV*</td><td>PVHI (periventricular hemorrhagic infarction)</td><td>High risk CP/NDI</td></tr>
</tbody></table>
<p><em>*Grade IV now termed PVHI — venous infarction, not IVH extension.</em></p>`
},children:[
{name:"FMH / TTTS",icon:"🔬",type:"diagnosis",sub:"Kleihauer-Betke on maternal blood",edge:"Maternal\nblood test",
info:{tabs:["FMH","TTTS/TAPS","KB Test Details"],
t0:`<p><strong>Fetomaternal Hemorrhage (FMH):</strong> Fetal blood crosses placenta into maternal circulation. Small FMH (&lt;1 mL) in 50–75% of pregnancies (insignificant). Large FMH (>30 mL) = severe neonatal anemia or hydrops.</p>
<ul><li>Acute: pallor, shock, normal bilirubin</li>
<li>Chronic: compensated anemia, high retics, hepatosplenomegaly, possible hydrops</li>
<li>RhoGAM dose adjustment needed for Rh-neg mothers if large FMH (>30 mL = additional vials)</li></ul>`,
t1:`<p><strong>TTTS:</strong> Unbalanced flow through vascular anastomoses in monochorionic placentas.</p>
<ul><li>Donor twin: anemic (Hb often &lt;8), growth-restricted</li>
<li>Recipient twin: polycythemic (Hct often >65%), may develop hydrops from volume overload</li></ul>
<p><strong>TAPS (Twin Anemia-Polycythemia Sequence):</strong> Chronic slow TTTS causing large inter-twin Hb difference (>8 g/dL) WITHOUT amniotic fluid discordance.</p>`,
t2:`<p><strong>Kleihauer-Betke Test:</strong></p>
<ul><li>Performed on <strong>MATERNAL blood</strong> (not infant)</li>
<li>Acid elution: adult Hb eluted by acid; HbF resists → fetal cells visible as dark "ghost cells"</li>
<li>% fetal cells × maternal blood volume (~5,000 mL) = FMH volume</li>
<li>Detects FMH >5 mL; may miss smaller hemorrhages</li>
<li><strong>False positives:</strong> maternal sickle trait, hereditary persistence of fetal Hb</li>
<li>Flow cytometry: more accurate alternative using anti-HbF antibodies</li></ul>
<div class="bx bo">⚠️ <strong>When to send KB test:</strong> Any unexplained neonatal anemia with elevated retics, normal bilirubin, and negative DAT. Order on the MOTHER, not the infant.</div>`
}},
{name:"Internal\nHemorrhage",icon:"🧠",type:"emergency",sub:"IVH, subgaleal, hepatic, adrenal",edge:"Imaging\nrequired",
info:{tabs:["Types","Screening","Prevention"],
t0:`<table class="dt"><thead><tr><th>Site</th><th>Risk Factors</th><th>Presentation</th><th>Diagnosis</th></tr></thead><tbody>
<tr><td><strong>Subgaleal</strong></td><td>Vacuum (#1)</td><td>Boggy crossing sutures, ↑HC, shock</td><td>Clinical; serial HC q30min</td></tr>
<tr><td><strong>IVH</strong></td><td>&lt;32 wk, &lt;1500g</td><td>Apnea, bradycardia, bulging fontanelle</td><td>Cranial US at 7–14 days</td></tr>
<tr><td><strong>Hepatic</strong></td><td>LGA, breech, difficult delivery</td><td>Distension, falling Hb, shock</td><td>Abdominal US</td></tr>
<tr><td><strong>Adrenal</strong></td><td>LGA, traumatic, asphyxia</td><td>Flank mass, adrenal insufficiency</td><td>US; calcification later</td></tr>
<tr><td><strong>Cephalhematoma</strong></td><td>Instrumented delivery</td><td>Firm, limited to one bone, NOT crossing sutures</td><td>Clinical; benign</td></tr>
</tbody></table>`,
t1:`<p><strong>IVH Screening Protocol:</strong></p>
<ul><li>Cranial US for ALL infants &lt;32 weeks at 7–14 days of life</li>
<li>Repeat at 36–40 weeks PMA (evaluate for PVL)</li>
<li>Earlier US if acute neurologic deterioration</li></ul>`,
t2:`<p><strong>IVH Prevention Strategies:</strong></p>
<ul><li>Antenatal steroids (most effective single intervention)</li>
<li>Delayed cord clamping 30–60 sec</li>
<li>Gentle handling in first 72 hours</li>
<li>Head midline positioning</li>
<li>Avoid wide blood pressure swings</li>
<li>Correct coagulopathy promptly</li>
<li>Avoid rapid volume expansion</li></ul>`
}}
]},
// ── Hemolytic ──
{name:"Hemolytic\nAnemia",icon:"💥",type:"urgent",sub:"RBC destruction · Retic ↑ · Jaundice",edge:"Retic ↑\nIndirect bili ↑",
info:{tabs:["Definition","Immune vs Non-Immune","DAT+ Workup","DAT− Workup"],
t0:`<p>Hemolytic anemia = premature RBC destruction. Hallmarks: anemia with elevated retic, indirect hyperbilirubinemia, elevated LDH, low haptoglobin (unreliable in neonates).</p>
<p>The <strong>DAT (Coombs test)</strong> is the critical branch point: positive = immune; negative = non-immune.</p>`,
t1:`<table class="dt"><thead><tr><th>Feature</th><th>Immune (DAT+)</th><th>Non-Immune (DAT−)</th></tr></thead><tbody>
<tr><td>Mechanism</td><td>Maternal IgG crosses placenta, destroys fetal RBCs</td><td>Intrinsic RBC defect (membrane, enzyme, Hb)</td></tr>
<tr><td>DAT</td><td>Positive</td><td>Negative</td></tr>
<tr><td>Common causes</td><td>Rh (anti-D), ABO, Kell, c, E</td><td>G6PD, HS, PK def, α-thalassemia</td></tr>
<tr><td>Smear</td><td>Spherocytes (ABO), nRBCs (Rh)</td><td>Spherocytes (HS), bite cells (G6PD), targets (thal)</td></tr>
<tr><td>Severity</td><td>Rh: can be severe/hydrops. ABO: usually mild</td><td>G6PD: episodic severe. HS: variable. α-thal major: lethal</td></tr>
</tbody></table>`,
t2:`<p><strong>DAT-Positive Workup:</strong></p>
<ol class="sl">
<li><strong>Antibody identification</strong> — anti-D, anti-A/B, anti-Kell, anti-c, anti-E</li>
<li><strong>Maternal + infant blood type/Rh</strong></li>
<li><strong>Serial TSB</strong> — plot on 2022 AAP nomogram. Rise >0.5 mg/dL/hr = accelerated hemolysis</li>
<li><strong>Reticulocyte count</strong> — elevated in ABO/Rh; may be LOW in anti-Kell (erythropoiesis suppression)</li>
<li><strong>CBC</strong> — anemia severity, nucleated RBC count</li>
</ol>
<p><strong>Management:</strong></p>
<ul><li><strong>Phototherapy</strong> per 2022 AAP guidelines</li>
<li><strong>IVIG 0.5–1 g/kg</strong> — may reduce exchange transfusion need in Rh disease</li>
<li><strong>Exchange transfusion</strong> — double volume (160–180 mL/kg), removes ~85% circulating bilirubin</li>
<li><strong>pRBC transfusion</strong> for significant anemia</li></ul>
<div class="bx br">🚨 <strong>Anti-Kell:</strong> Suppresses erythropoiesis + causes hemolysis. Retic may be LOW. Anemia more severe than bilirubin suggests. Absence of jaundice does NOT exclude severe anemia.</div>`,
t3:`<p><strong>DAT-Negative Workup Algorithm:</strong></p>
<ol class="sl">
<li><strong>Peripheral smear:</strong> Spherocytes → HS or ABO; Bite cells/Heinz bodies → G6PD; Target cells → hemoglobinopathy; Schistocytes → DIC/microangiopathy</li>
<li><strong>G6PD quantitative assay</strong> — screen all unexplained DAT-neg jaundice. PITFALL: levels falsely NORMAL during hemolysis (reticulocytes have more G6PD). Repeat in 2–3 months.</li>
<li><strong>EMA binding test</strong> — decreased = hereditary spherocytosis. More reliable than osmotic fragility in neonates.</li>
<li><strong>Hb electrophoresis</strong> — HbF predominates in neonates. α-thal major shows Hb Bart's (γ4 tetramers).</li>
<li><strong>PK assay</strong> — if smear/other tests non-diagnostic; 2nd most common RBC enzymopathy.</li>
</ol>
<div class="bx bo">⚠️ <strong>G6PD is the #1 risk factor for kernicterus worldwide.</strong> Now on the RUSP for newborn screening in many US states. Jaundice can be rapid and severe.</div>`
},children:[
{name:"Rh / ABO /\nMinor Antigens",icon:"🅰️",type:"diagnosis",sub:"DAT+ · Immune hemolysis",edge:"DAT +",
info:{tabs:["Rh Disease","ABO Incompatibility","Minor Antigens","Exchange Transfusion"],
t0:`<p><strong>Rh HDFN:</strong></p>
<ul><li>Rh-neg mother sensitized to D antigen → anti-D IgG crosses placenta → destroys Rh-pos fetal RBCs</li>
<li>Spectrum: mild jaundice → severe anemia + jaundice → hydrops fetalis</li>
<li><strong>Prevention:</strong> RhoGAM 300 µg IM at 28 wk + within 72h of delivery. Reduced incidence >95%.</li>
<li>DAT strongly positive (3–4+). Smear: nucleated RBCs, polychromasia</li></ul>`,
t1:`<p><strong>ABO Incompatibility:</strong></p>
<ul><li>Mother O, baby A or B. Natural anti-A/B are IgG in group O mothers</li>
<li>Can occur in FIRST pregnancy (no prior sensitization needed)</li>
<li>Usually MILDER than Rh. DAT may be weakly positive or even negative</li>
<li>Rarely causes hydrops; primarily jaundice requiring phototherapy</li>
<li>Smear: spherocytes (mimic HS; context + DAT distinguish them)</li></ul>`,
t2:`<table class="rt"><thead><tr><th>Antibody</th><th>Frequency</th><th>Severity</th><th>Special Notes</th></tr></thead><tbody>
<tr><td>Anti-Kell</td><td>3rd most common</td><td>Can be SEVERE</td><td>Suppresses erythropoiesis → low retic is a PITFALL</td></tr>
<tr><td>Anti-c</td><td>Increasingly recognized</td><td>Moderate–severe</td><td>Can cause hydrops</td></tr>
<tr><td>Anti-E</td><td>Common</td><td>Usually mild</td><td>Rarely needs exchange</td></tr>
<tr><td>Anti-Duffy</td><td>Uncommon</td><td>Mild–moderate</td><td>Duffy-neg common in Black individuals</td></tr>
</tbody></table>`,
t3:`<p><strong>Exchange Transfusion Protocol:</strong></p>
<ul><li><strong>Indication:</strong> TSB at/above exchange threshold on 2022 AAP nomogram, OR rising >0.5/hr despite intensive phototherapy + IVIG</li>
<li><strong>Volume:</strong> Double blood volume = 160–180 mL/kg</li>
<li><strong>Blood:</strong> O Rh-neg, irradiated, CMV-safe, crossmatched against maternal + infant serum, Hct 40–50%</li>
<li><strong>Access:</strong> UVC with tip in IVC (preferred). Alternative: UVC + UAC isovolumetric</li>
<li><strong>Technique:</strong> Push-pull 5–10 mL/kg aliquots alternating</li>
<li><strong>Monitoring:</strong> Continuous cardiac. Glucose/Ca/K/bili after every 50–100 mL. CaGluconate 10% 1 mL per 100 mL blood exchanged (citrate chelates Ca)</li>
<li><strong>Removes:</strong> ~85% bilirubin, ~70% antibody-coated RBCs</li></ul>
<div class="bx br">🚨 <strong>Complications:</strong> Hypocalcemia, hyperkalemia, thrombocytopenia, infection, NEC, PVT, arrhythmia, air embolism. Mortality ~0.3–1%. Only at experienced centers.</div>`
}},
{name:"G6PD / HS /\nEnzymopathies",icon:"🧬",type:"diagnosis",sub:"DAT− · Non-immune hemolysis",edge:"DAT −",
info:{tabs:["G6PD Deficiency","Hereditary Spherocytosis","Other Conditions"],
t0:`<p><strong>G6PD Deficiency:</strong></p>
<ul><li>X-linked recessive; ~400 million affected worldwide. Males of African, Mediterranean, Asian descent.</li>
<li>G6PD maintains glutathione → protects RBCs from oxidative damage</li>
<li><strong>Neonatal presentation:</strong> severe jaundice days 2–5, often disproportionate to anemia</li>
<li><strong>Triggers:</strong> infection, naphthalene (mothballs), sulfonamides, primaquine, fava beans</li>
<li>Smear: bite cells, blister cells, Heinz bodies (require supravital stain)</li>
<li><strong>Diagnosis:</strong> G6PD quantitative assay. Levels falsely normal during hemolysis — repeat 2–3 months later</li></ul>`,
t1:`<p><strong>Hereditary Spherocytosis (HS):</strong></p>
<ul><li>AD in ~75% (ankyrin, spectrin, band 3). 25% de novo/AR.</li>
<li>Membrane cytoskeleton defects → spherical RBCs → splenic trapping/destruction</li>
<li>Neonatal: jaundice, anemia (may need transfusion), splenomegaly (may be absent)</li>
<li><strong>Diagnosis:</strong> Spherocytes + elevated MCHC >36 g/dL (most sensitive parameter). EMA binding test = preferred in neonates.</li>
<li>Family history positive in 75% — check parents' CBC and smear</li>
<li>Splenectomy reserved for severe disease, deferred until >5–6 years</li></ul>`,
t2:`<table class="dt"><thead><tr><th>Condition</th><th>Inheritance</th><th>Key Features</th><th>Diagnosis</th></tr></thead><tbody>
<tr><td>PK deficiency</td><td>AR</td><td>Chronic hemolysis, jaundice, splenomegaly</td><td>PK enzyme assay; PKLR gene</td></tr>
<tr><td>α-Thal major (Hb Bart's)</td><td>AR</td><td>All 4 α genes deleted → hydrops, usually lethal</td><td>Hb electrophoresis (Hb Bart's = γ4)</td></tr>
<tr><td>α-Thal HbH (3 gene)</td><td>AR</td><td>Mild-mod microcytic anemia, neonatal hemolysis possible</td><td>Hb electrophoresis</td></tr>
<tr><td>Hereditary elliptocytosis</td><td>AD</td><td>Usually mild; neonatal poikilocytosis</td><td>Smear: elliptocytes</td></tr>
</tbody></table>`
}}
]},
// ── Hypoproliferative ──
{name:"Hypoproliferative\nAnemia",icon:"⏸️",type:"diagnosis",sub:"Low reticulocyte count",edge:"Retic ↓\nor normal",
info:{tabs:["Definition","Differential","Anemia of Prematurity","Rare Congenital"],
t0:`<p>Hypoproliferative anemia = reticulocyte count LOW or inappropriately normal for degree of anemia — bone marrow not responding. Most commonly = anemia of prematurity. Rare: DBA, Fanconi, parvovirus, TAM.</p>`,
t1:`<table class="dt"><thead><tr><th>Condition</th><th>Frequency</th><th>Key Features</th><th>Diagnosis</th></tr></thead><tbody>
<tr><td><strong>Anemia of prematurity</strong></td><td>Very common</td><td>EPO suppression + short RBC lifespan + growth + phlebotomy</td><td>Clinical context; low retics in preterm at 4–8 wk</td></tr>
<tr><td><strong>DBA</strong></td><td>~7/million</td><td>Pure red cell aplasia, macrocytic, elevated HbF/eADA, anomalies 50%</td><td>Elevated eADA; RPS19 most common gene</td></tr>
<tr><td><strong>Parvovirus B19</strong></td><td>Rare neonatal</td><td>Transient aplastic crisis; absent retics; hydrops if in utero</td><td>IgM/PCR</td></tr>
<tr><td><strong>Fanconi anemia</strong></td><td>~1/160,000</td><td>Progressive pancytopenia + anomalies (thumbs, café-au-lait, short stature)</td><td>Chromosome breakage (DEB/MMC)</td></tr>
<tr><td><strong>TAM</strong></td><td>~10% of T21</td><td>Circulating blasts, hepatosplenomegaly, GATA1 mutation</td><td>Smear + flow cytometry</td></tr>
</tbody></table>`,
t2:`<p><strong>Anemia of Prematurity — Management:</strong></p>
<ul><li><strong>Pathophysiology:</strong> (1) EPO suppression, (2) short RBC lifespan (60–70d vs 90–120d), (3) rapid growth dilution, (4) iatrogenic phlebotomy (VLBW lose 10–20% blood volume/week)</li>
<li><strong>Nadir:</strong> 7–9 g/dL at 4–8 weeks</li>
<li><strong>Prevention:</strong> DCC (27% reduction), minimize draws, iron 2–4 mg/kg/day</li>
<li><strong>Transfusion:</strong> Per 2024 restrictive thresholds</li></ul>
<table class="rt"><thead><tr><th>Strategy</th><th>Evidence</th><th>Recommendation</th></tr></thead><tbody>
<tr><td>DCC 30–60 sec</td><td>+1.2 g/dL Hb, 27% fewer transfusions</td><td>✅ Strongly recommended</td></tr>
<tr><td>UCM</td><td>May = DCC; concern IVH &lt;28 wk</td><td>⚠️ Not recommended &lt;28 wk</td></tr>
<tr><td>Minimize phlebotomy</td><td>VLBW lose 10–20% BV/week</td><td>✅ Micro-sampling, POC</td></tr>
<tr><td>EPO</td><td>Modest; no NDI benefit (PENUT)</td><td>❌ Not routinely recommended</td></tr>
<tr><td>Iron supplementation</td><td>Supports erythropoiesis</td><td>✅ 2–4 mg/kg/day at 2–4 wk</td></tr>
</tbody></table>`,
t3:`<p><strong>Suspect rare congenital cause when:</strong></p>
<ul><li>Low retics in a TERM infant (AOP is a preterm diagnosis)</li>
<li>Macrocytic anemia (MCV >110 fL) without obvious cause</li>
<li>Physical anomalies + anemia = DBA or Fanconi</li>
<li>Pancytopenia = bone marrow failure syndrome</li>
<li>Circulating blasts + trisomy 21 = TAM</li>
<li>Anemia not responding to iron/EPO after weeks</li></ul>
<div class="bx bp">🔬 <strong>Refer to hematology for:</strong> unexplained term anemia, anomalies + anemia, persistent anemia, circulating blasts, pancytopenia.</div>`
},children:[
{name:"Anemia of\nPrematurity",icon:"👶",type:"action",sub:"Physiologic · 2024 CPG thresholds",edge:"Preterm\nnadir",
info:{tabs:["Transfusion Thresholds","Protocol","Prevention"],
t0:`<p><strong>2024 Neonatal Transfusion Network CPG</strong></p>
<table class="rt"><thead><tr><th>Week</th><th>On Resp Support (Hb)</th><th>No/Minimal Support (Hb)</th></tr></thead><tbody>
<tr><td>Week 1</td><td>&lt; 11</td><td>&lt; 10</td></tr>
<tr><td>Week 2</td><td>&lt; 10</td><td>&lt; 8.5</td></tr>
<tr><td>Week 3+</td><td>&lt; 9</td><td>&lt; 7</td></tr>
</tbody></table>
<p><em>Respiratory support = any invasive/non-invasive ventilation, CPAP, HFNC, or O₂ >21%.</em></p>`,
t1:`<ul><li><strong>Volume:</strong> 10–20 mL/kg (15 mL/kg most common)</li>
<li><strong>Rate:</strong> Over 2–4 hours via pump</li>
<li><strong>Product:</strong> pRBCs Hct ~60%, irradiated, leukoreduced, CMV-safe</li>
<li><strong>Type:</strong> Group O, Rh-compatible. Assigned-unit system (single donor for multiple transfusions)</li>
<li><strong>Expected rise:</strong> ~3 g/dL per 15 mL/kg</li>
<li><strong>Post-transfusion:</strong> Recheck Hb 4–6 hours</li>
<li><strong>Feeds:</strong> Continue at pre-transfusion rates</li></ul>`,
t2:`<p>See Anemia of Prematurity tab in parent node for complete prevention strategies including DCC, phlebotomy minimization, iron supplementation, and EPO evidence.</p>`
}},
{name:"DBA / Fanconi /\nInfection / TAM",icon:"🧪",type:"diagnosis",sub:"Rare congenital or infectious",edge:"Term +\nlow retic",
info:{tabs:["DBA","Fanconi","Parvovirus B19","TAM"],
t0:`<ul><li>Pure red cell aplasia; presents typically 2–6 months</li>
<li>Macrocytic anemia, elevated HbF, elevated eADA, low retics</li>
<li>Anomalies in 50%: triphalangeal/absent thumbs, cardiac (VSD/ASD), craniofacial (Pierre Robin)</li>
<li>~70% have ribosomal protein gene mutations (RPS19 = 25%)</li>
<li>Treatment: corticosteroids (70% respond), chronic transfusions, HSCT for severe</li>
<li>Elevated cancer risk: MDS, AML, osteosarcoma</li></ul>`,
t1:`<ul><li>Inherited bone marrow failure; progressive pancytopenia (may not manifest until age 5–10)</li>
<li>Neonatal clues: absent/hypoplastic thumbs (40%), café-au-lait spots (40%), short stature, renal anomalies (30%), cardiac (15%)</li>
<li><strong>Diagnosis:</strong> chromosome breakage test (DEB/MMC)</li>
<li>>20 FANC genes (AR except FANCB = X-linked)</li>
<li>Treatment: androgens, HSCT (only cure), cancer surveillance</li></ul>`,
t2:`<ul><li>Tropism for erythroid precursors; halts red cell production</li>
<li>Fetus: severe anemia → hydrops → fetal death (greatest risk 13–20 wk)</li>
<li>Neonate: transient aplastic crisis with retic near 0%, resolves 1–2 weeks</li>
<li>Diagnosis: B19 IgM (may be neg in neonates); PCR more reliable</li>
<li>Treatment: supportive; pRBC transfusion. In utero: intrauterine transfusion.</li></ul>`,
t3:`<ul><li>~10% of trisomy 21 neonates. Circulating megakaryoblasts, leukocytosis (WBC can be >100K), hepatosplenomegaly</li>
<li>GATA1 mutations on chromosome X</li>
<li>Self-resolving in 80% within 1–3 months</li>
<li><strong>BUT 20–30% develop AMKL within 1–4 years</strong></li>
<li>Diagnosis: smear (blasts), flow cytometry (CD41+/CD61+), GATA1 testing</li>
<li>Low-dose cytarabine for severe cases (hepatic failure, DIC)</li></ul>
<div class="bx bp">🔬 <strong>Any T21 neonate with blasts:</strong> hematology consult. Even if TAM resolves, serial CBC q3 months for 4 years to detect AMKL.</div>`
}}
]}
]},
// ═══════════════════════════ BRANCH 2: POLYCYTHEMIA ═══════════════════════════
{name:"POLYCYTHEMIA",icon:"🔺",type:"urgent",sub:"Venous Hct > 65%",edge:"High Hb/Hct",
info:{tabs:["Definition","Causes","Symptoms","Management Algorithm"],
t0:`<p><strong>Neonatal polycythemia:</strong> venous Hct > 65% or Hb > 22 g/dL. Prevalence 1–5% of term neonates. Venous Hct peaks at 6–12 hours. Viscosity increases exponentially above Hct 65%.</p>
<div class="bx bo">⚠️ <strong>NEVER diagnose or treat based on capillary Hct.</strong> Overestimates by 5–15%. Always confirm with VENOUS sample.</div>`,
t1:`<table class="dt"><thead><tr><th>Type</th><th>Mechanism</th><th>Causes</th></tr></thead><tbody>
<tr><td><strong>Active (↑ erythropoiesis)</strong></td><td>Chronic fetal hypoxia → ↑ EPO</td><td>IUGR/SGA, maternal DM, smoking, high altitude, T21/T18/T13, Beckwith-Wiedemann, CAH</td></tr>
<tr><td><strong>Passive (RBC transfusion)</strong></td><td>Extra RBC volume transferred</td><td>Prolonged DCC (>3 min), TTTS recipient, maternal-fetal transfusion, cord milking (if excessive)</td></tr>
</tbody></table>`,
t2:`<table class="dt"><thead><tr><th>System</th><th>Symptoms</th><th>Incidence</th></tr></thead><tbody>
<tr><td><strong>CNS</strong></td><td>Jitteriness, irritability, lethargy, poor feeding, seizures (rare)</td><td>Most common presenting symptoms</td></tr>
<tr><td><strong>Metabolic</strong></td><td>Hypoglycemia (↑ glucose consumption by excess RBCs)</td><td>12–40% — MOST COMMON</td></tr>
<tr><td><strong>Metabolic</strong></td><td>Hypocalcemia</td><td>1–11%</td></tr>
<tr><td><strong>GI</strong></td><td>Feeding intolerance, NEC (controversial)</td><td>Variable</td></tr>
<tr><td><strong>Renal</strong></td><td>Oliguria, hematuria, RVT</td><td>Uncommon</td></tr>
<tr><td><strong>Cardiopulmonary</strong></td><td>Cyanosis, tachypnea, cardiomegaly</td><td>Variable</td></tr>
<tr><td><strong>Hematologic</strong></td><td>Thrombocytopenia, hyperbilirubinemia</td><td>Common</td></tr>
</tbody></table>`,
t3:`<ol class="sl">
<li><strong>Confirm VENOUS Hct</strong></li>
<li><strong>Assess symptoms</strong> (CNS, GI, metabolic, respiratory)</li>
<li><strong>Check glucose and calcium</strong></li>
<li><strong>Decision:</strong><br>
• Hct 65–70% + asymptomatic → ↑ PO fluids 10–20%; recheck 12–24h; glucose q2–4h<br>
• Hct 65–70% + symptomatic → PET<br>
• Hct ≥ 70% regardless → PET</li>
</ol>
<p><strong>PET Protocol:</strong></p>
<ul><li><strong>Formula:</strong> Vol = BV × (Obs Hct − 55) / Obs Hct. BV = 80–100 mL/kg.</li>
<li><strong>Example:</strong> 3.5 kg, Hct 72%: (85×3.5) × (72−55)/72 = <strong>70 mL</strong></li>
<li><strong>Fluid:</strong> Normal saline (preferred over albumin/plasma)</li>
<li><strong>Access:</strong> UVC push-pull in 5 mL/kg aliquots</li>
<li><strong>Post-PET:</strong> Recheck Hct 4–6h. Glucose q2h for 12–24h.</li></ul>
<div class="bx bb">ℹ️ <strong>PET improves short-term symptoms but has NOT improved long-term neurodevelopmental outcomes</strong> (Cochrane review, Dempsey & Barrington).</div>`
},children:[
{name:"Asymptomatic\nHct 65–70%",icon:"👁️",type:"action",sub:"↑ PO fluids · Monitor glucose",edge:"No symptoms",
info:{tabs:["Management","Monitoring"],
t0:`<ul><li>Increase oral fluids 10–20%</li>
<li>Monitor glucose q2–4h (hypoglycemia in 12–40%)</li>
<li>Recheck venous Hct in 12–24h</li>
<li>Assess for new symptoms each nursing assessment</li>
<li>If symptoms develop or Hct rises ≥70% → proceed to PET</li></ul>`,
t1:`<table class="rt"><thead><tr><th>Test</th><th>Frequency</th><th>Action Trigger</th></tr></thead><tbody>
<tr><td>Glucose</td><td>q2–4h</td><td>&lt;45 → IV D10W; &lt;25 → D10W 2 mL/kg bolus</td></tr>
<tr><td>Venous Hct</td><td>12h and 24h</td><td>Rising or ≥70% → PET</td></tr>
<tr><td>Ionized Ca</td><td>Baseline</td><td>&lt;1.0 mmol/L → IV Ca gluconate</td></tr>
<tr><td>Clinical</td><td>q4h</td><td>New symptoms → reassess for PET</td></tr>
<tr><td>Bilirubin</td><td>Per jaundice protocol</td><td>Higher risk in polycythemia</td></tr>
</tbody></table>`
}},
{name:"Symptomatic or\nHct ≥ 70%",icon:"🔄",type:"emergency",sub:"Partial Exchange Transfusion (PET)",edge:"Symptoms\nor Hct ≥70%",
info:{tabs:["Indications","Step-by-Step PET","Complications"],
t0:`<ul><li>Venous Hct ≥ 70% regardless of symptoms</li>
<li>Venous Hct 65–70% WITH significant symptoms (seizures, respiratory distress, severe feeding intolerance, cyanosis)</li>
<li>Refractory hypoglycemia in setting of polycythemia</li></ul>`,
t1:`<ol class="sl">
<li>Confirm venous Hct. Calculate: Vol = BV × (Obs Hct − 55) / Obs Hct</li>
<li>Obtain informed consent (risks: NEC, infection, thrombosis)</li>
<li>Place UVC — confirm tip on X-ray (IVC above diaphragm)</li>
<li>Pre-PET labs: CBC, glucose, Ca, bili</li>
<li>Withdraw 5 mL/kg over 2–3 min → infuse equal NS → repeat until total volume exchanged</li>
<li>Monitor: HR, RR, BP, SpO₂ continuously during procedure</li>
<li>Post-PET: Hct (target 50–55%), glucose, Ca at 1h and 4–6h</li>
</ol>`,
t2:`<ul><li>NEC (lower risk with NS vs colloid replacement)</li>
<li>Infection (procedural)</li>
<li>Thrombocytopenia (dilutional, usually mild/transient)</li>
<li>Air embolism, vessel perforation, thrombosis (UVC-related)</li>
<li>Rebound polycythemia (recheck 4–6h and 24h)</li></ul>
<div class="bx bb">ℹ️ <strong>NS is the recommended replacement fluid</strong> (Cochrane: equivalent efficacy to albumin/plasma, lower cost, no infection risk, no NEC association).</div>`
}}
]},
// ═══════════════════════════ BRANCH 3: THROMBOCYTOPENIA ═══════════════════════════
{name:"THROMBO-\nCYTOPENIA",icon:"🩹",type:"decision",sub:"Platelets < 150,000/µL",edge:"Low\nplatelets",
info:{tabs:["Definition","Timing-Based Differential","PlaNet-2 Trial","Transfusion Thresholds"],
t0:`<p><strong>Neonatal thrombocytopenia:</strong> plt &lt; 150K/µL. Affects up to 25% of NICU admissions. Severity: mild 100–149K, moderate 50–99K, severe &lt; 50K.</p>
<p>Neonatal platelets are hyporesponsive in vitro but have adequate hemostasis in vivo (higher VWF, larger VWF multimers). Neonates tolerate lower plt counts before clinical bleeding.</p>`,
t1:`<table class="dt"><thead><tr><th>Timing</th><th>Cause</th><th>Typical Count</th><th>Key Features</th></tr></thead><tbody>
<tr><td rowspan="4"><strong>Early &lt;72h</strong></td><td>Placental insufficiency</td><td>50–100K</td><td>~75% of early cases; self-resolves day 7–10</td></tr>
<tr><td>NAIT</td><td>Often &lt;20K</td><td>Normal maternal plts; ICH risk 10–20%; FIRST pregnancy</td></tr>
<tr><td>TORCH</td><td>Variable</td><td>Hepatosplenomegaly, SGA, rash</td></tr>
<tr><td>Maternal ITP</td><td>Usually >50K</td><td>LOW maternal plts (distinguishes from NAIT)</td></tr>
<tr><td rowspan="3"><strong>Late >72h</strong></td><td>Sepsis/NEC</td><td>Variable</td><td>#1 late cause; falling plts may precede clinical NEC by 24–48h</td></tr>
<tr><td>Fungal (Candida)</td><td>Variable</td><td>VLBW + central lines + prolonged Abx</td></tr>
<tr><td>DIC</td><td>&lt;50K</td><td>↑PT + ↑aPTT + ↓Fib + ↑D-dimer</td></tr>
</tbody></table>
<div class="bx br">🚨 <strong>Precipitous drop from >150K to &lt;50K in 24h = SEPSIS until proven otherwise.</strong> Cultures and antibiotics immediately. Falling plts may be EARLIEST sign of NEC.</div>`,
t2:`<p><strong>PlaNet-2 (Curley et al., NEJM 2019; n=660 preterm &lt;34 wk with plt &lt;50K):</strong></p>
<p><strong>Liberal (transfuse &lt;50K) was WORSE than restrictive (&lt;25K):</strong></p>
<table class="rt"><thead><tr><th>Outcome</th><th>Restrictive (&lt;25K)</th><th>Liberal (&lt;50K)</th><th>p</th></tr></thead><tbody>
<tr><td>Death or major bleeding</td><td>19%</td><td>26%</td><td>0.02</td></tr>
<tr><td>Death alone</td><td>10%</td><td>14%</td><td>NS (trend)</td></tr>
</tbody></table>
<div class="bx bg">✓ <strong>Practice-changing:</strong> For stable preterm neonates without bleeding, transfuse only at plt &lt; 25,000/µL.</div>`,
t3:`<table class="rt"><thead><tr><th>Scenario</th><th>Threshold</th><th>Rationale</th></tr></thead><tbody>
<tr><td>Stable preterm, no bleeding</td><td>&lt; 25,000</td><td>PlaNet-2: restrictive safer</td></tr>
<tr><td>Unstable / minor bleeding</td><td>&lt; 50,000</td><td>Higher bleeding risk</td></tr>
<tr><td>Pre/post major surgery or LP</td><td>&lt; 50,000</td><td>Procedural risk</td></tr>
<tr><td>Active major hemorrhage / DIC</td><td>&lt; 100,000</td><td>Active consumption</td></tr>
<tr><td>NAIT with ICH risk</td><td>&lt; 30,000</td><td>HPA-matched + IVIG</td></tr>
<tr><td>Pre/post neurosurgery</td><td>&lt; 100,000</td><td>Intracranial risk</td></tr>
</tbody></table>
<p><strong>Dose:</strong> 10–15 mL/kg over 15–30 min (NOT slowly). Expected rise: 50–100K. Irradiated, leukoreduced. ABO-compatible preferred.</p>`
},children:[
{name:"Early-Onset\n(< 72h)",icon:"⏰",type:"decision",sub:"Placental insufficiency, NAIT, TORCH",edge:"< 72h",
info:{tabs:["Differential","NAIT vs ITP","Workup Algorithm"],
t0:`<table class="dt"><thead><tr><th>Consider</th><th>If Context Shows</th><th>Count</th><th>Next Step</th></tr></thead><tbody>
<tr><td>Placental insufficiency</td><td>IUGR, SGA, preeclampsia</td><td>50–100K</td><td>Monitor; resolves day 7–10</td></tr>
<tr><td>NAIT</td><td>Term, well, severe, NORMAL maternal plts</td><td>&lt;20K</td><td>Cranial US; HPA typing; IVIG</td></tr>
<tr><td>Maternal ITP</td><td>Known ITP; LOW maternal plts</td><td>>50K usually</td><td>Monitor; IVIG if &lt;20K</td></tr>
<tr><td>TORCH</td><td>HSM, SGA, rash, abnormal LFTs</td><td>Variable</td><td>TORCH screen; CMV urine PCR</td></tr>
<tr><td>Chromosomal</td><td>Dysmorphic features</td><td>Variable</td><td>Karyotype/microarray</td></tr>
</tbody></table>`,
t1:`<table class="dt"><thead><tr><th>Feature</th><th>NAIT</th><th>Maternal ITP</th></tr></thead><tbody>
<tr><td>Mechanism</td><td>Anti-HPA antibodies (anti-HPA-1a 80%)</td><td>Autoantibodies against BOTH maternal + fetal plts</td></tr>
<tr><td>Maternal plts</td><td><strong>NORMAL</strong></td><td><strong>LOW</strong></td></tr>
<tr><td>Severity</td><td>Often SEVERE (&lt;20K)</td><td>Usually mild (>50K)</td></tr>
<tr><td>First pregnancy</td><td><strong>YES</strong></td><td>Yes (if active ITP)</td></tr>
<tr><td>ICH risk</td><td><strong>10–20%</strong></td><td>&lt;1%</td></tr>
<tr><td>Treatment</td><td>HPA-matched plts + IVIG 1 g/kg</td><td>IVIG if &lt;20K; steroids for mother</td></tr>
</tbody></table>
<div class="bx br">🚨 <strong>KEY:</strong> Maternal plts NORMAL + baby severely thrombocytopenic = NAIT until proven otherwise.</div>`,
t2:`<ol class="sl">
<li><strong>Check maternal platelet count</strong> (most important first step)</li>
<li>Maternal plts NORMAL + neonatal &lt;50K → suspect NAIT → urgent cranial US → HPA typing → IVIG 1 g/kg</li>
<li>Maternal plts LOW → suspect ITP → monitor → IVIG if &lt;20K</li>
<li>IUGR/SGA + preeclampsia → likely placental insufficiency → resolves 7–10d</li>
<li>HSM + SGA + rash → TORCH screen → CMV urine PCR within 21 days</li>
<li>Dysmorphic → chromosomal studies</li>
</ol>`
},children:[
{name:"NAIT",icon:"⚠️",type:"emergency",sub:"Plt <20K · Normal maternal plts · ICH 10–20%",edge:"Maternal\nplts NORMAL",
info:{tabs:["Emergency Protocol","HPA System","Future Pregnancies"],
t0:`<ol class="sl">
<li><strong>URGENT cranial US</strong> — ICH in 10–20%</li>
<li><strong>Contact blood bank</strong> for HPA-1a-neg plts. If unavailable (24–48h), transfuse random donor plts as bridge.</li>
<li><strong>IVIG 1 g/kg IV</strong> over 4–6h. May repeat in 24h.</li>
<li><strong>Recheck plts q12h</strong> until stable and rising.</li>
<li><strong>HPA genotyping:</strong> maternal, paternal, infant blood + maternal anti-HPA antibodies.</li>
<li><strong>Hematology consult</strong></li>
<li>If ICH: neurosurgery, target plt >100K, neuroprotection.</li>
</ol>`,
t1:`<table class="rt"><thead><tr><th>Antigen</th><th>Frequency</th><th>Severity</th></tr></thead><tbody>
<tr><td>HPA-1a</td><td>~80% Caucasian NAIT</td><td>Often severe; high ICH risk</td></tr>
<tr><td>HPA-5b</td><td>~10–15%</td><td>Usually milder</td></tr>
<tr><td>HPA-1b</td><td>~5%</td><td>Variable</td></tr>
</tbody></table>
<p>~2% of Caucasians are HPA-1a negative. When HPA-1a-neg mother carries HPA-1a-pos fetus, ~10% chance of sensitization; ~30% of sensitized have affected infant.</p>`,
t2:`<ul><li>Recurrence: 80–90% if father homozygous; 50% if heterozygous</li>
<li>Severity equal or WORSE in subsequent pregnancies</li>
<li>Prenatal: maternal IVIG ± steroids from 20–28 wk; serial monitoring; planned delivery 36–37 wk; HPA-1a-neg plts at delivery</li>
<li>Paternal HPA genotyping guides risk</li>
<li>MFM + hematology referral for planning</li></ul>`
}},
{name:"Placental\nInsufficiency",icon:"🤰",type:"action",sub:"IUGR/preeclampsia · Resolves day 7–10",edge:"IUGR /\npreeclampsia",
info:{tabs:["Management","Course"],
t0:`<ul><li>Most common cause (~75% of early cases)</li>
<li>Mechanism: reduced placental thrombopoietin + ↓ megakaryocyte production</li>
<li>Typical nadir: 50–100K; rarely &lt;50K</li>
<li>Spontaneous recovery by day 7–10</li>
<li>Transfusion rarely needed (plts usually stay >25K)</li></ul>`,
t1:`<ul><li>Daily plt count until trending up (usually day 5–7)</li>
<li>If drops &lt;50K unexpectedly → reconsider diagnosis (NAIT? Infection?)</li>
<li>If drops &lt;25K stable → transfuse per PlaNet-2</li>
<li>Full recovery: plt normalizes day 10–14</li></ul>`
}}
]},
{name:"Late-Onset\n(> 72h)",icon:"🦠",type:"urgent",sub:"Sepsis/NEC most common cause",edge:"> 72h",
info:{tabs:["Differential","Sepsis Workup","NEC Warning"],
t0:`<ul><li><strong>Bacterial sepsis:</strong> #1 cause. Both Gram-pos and Gram-neg. Consumption + marrow suppression + DIC.</li>
<li><strong>NEC:</strong> Falling plts may PRECEDE clinical NEC by 24–48h.</li>
<li><strong>Fungal:</strong> Candida. Prolonged Abx + central lines + TPN + extreme prematurity.</li>
<li><strong>DIC:</strong> ↑PT + ↑aPTT + ↓fib + ↑D-dimer.</li>
<li><strong>Drug-induced:</strong> Heparin (HIT rare), indomethacin, vancomycin.</li></ul>`,
t1:`<ol class="sl">
<li><strong>Blood culture</strong> (peripheral ± central line)</li>
<li><strong>CBC with diff</strong> — I:T ratio, ANC</li>
<li><strong>CRP and/or procalcitonin</strong> (PCT rises earlier: 2–4h vs CRP 6–12h)</li>
<li><strong>UA + UCx</strong> (catheterized)</li>
<li><strong>CSF</strong> if warranted and infant stable</li>
<li><strong>DIC panel:</strong> PT, aPTT, fibrinogen, D-dimer</li>
<li><strong>Start empiric Abx:</strong> vancomycin + aminoglycoside (or pip-tazo/meropenem per local antibiogram)</li>
<li>Consider empiric antifungal if risk factors present</li>
</ol>`,
t2:`<div class="bx bo">⚠️ <strong>Falling plts + abdominal distension + metabolic acidosis in preterm = NEC until proven otherwise.</strong> Stat abdominal radiograph. NPO, OG to suction, IV antibiotics.</div>
<p>Bell Stage II+ NEC is almost always accompanied by thrombocytopenia. Platelet trajectory can guide clinical decision-making: a suddenly dropping plt count is an early warning sign.</p>`
},children:[
{name:"Sepsis / NEC\nWorkup & Treat",icon:"💉",type:"action",sub:"Cultures · Antibiotics · Serial plts",edge:"Evaluate",
info:{tabs:["Antibiotics","Platelet Mgmt","DIC Evaluation"],
t0:`<table class="rt"><thead><tr><th>Regimen</th><th>Coverage</th><th>When</th></tr></thead><tbody>
<tr><td>Vanc + Gent</td><td>MRSA, CoNS + Gram-neg</td><td>Standard first-line late-onset</td></tr>
<tr><td>Vanc + Cefepime</td><td>+ Pseudomonas</td><td>Resistant Gram-neg concern</td></tr>
<tr><td>Meropenem ± Vanc</td><td>Broadest + ESBL</td><td>Fulminant sepsis</td></tr>
<tr><td>+ Fluconazole/AmphoB</td><td>Candida</td><td>Extreme preterm + lines + Abx</td></tr>
</tbody></table>`,
t1:`<ul><li>Transfuse per PlaNet-2: &lt;25K stable, &lt;50K bleeding/critical</li>
<li>Serial plts q12–24h until trending up</li>
<li>Falling despite Abx → wrong coverage? Abscess? Fungal? Drug-induced? DIC?</li>
<li>Rising plt count = one of earliest signs of clinical improvement</li></ul>`,
t2:`<ul><li>Plts + ↑PT/aPTT + bleeding from multiple sites → evaluate for DIC</li>
<li>DIC = ↑PT + ↑aPTT + ↓fib (&lt;100) + ↑D-dimer + ↓plts + schistocytes</li>
<li><strong>#1 TREAT THE CAUSE.</strong> Replace: FFP 10–15 mL/kg, cryo 5–10 mL/kg (fib &lt;100), plts</li></ul>`
}}
]}
]},
// ═══════════════════════════ BRANCH 4: COAGULOPATHY ═══════════════════════════
{name:"COAGULO-\nPATHY",icon:"🧪",type:"decision",sub:"Prolonged PT/aPTT or bleeding",edge:"Abnormal\ncoag",
info:{tabs:["Normal Neonatal Coag","Pattern Recognition","Workup","Factor Replacement"],
t0:`<table class="rt"><thead><tr><th>Parameter</th><th>Term Neonate</th><th>Adult</th><th>Implication</th></tr></thead><tbody>
<tr><td>Vit K factors (II,VII,IX,X)</td><td>~50% adult</td><td>100%</td><td>PT/aPTT physiologically prolonged</td></tr>
<tr><td>Contact factors (XI,XII)</td><td>~30–50%</td><td>100%</td><td>aPTT can be very prolonged without bleeding</td></tr>
<tr><td>Protein C</td><td>~30–40%</td><td>100%</td><td>Natural anticoagulant; low = prothrombotic</td></tr>
<tr><td>VWF</td><td>150–200%</td><td>100%</td><td>Compensates for plt hyporesponsiveness</td></tr>
<tr><td>Fibrinogen</td><td>150–400 mg/dL</td><td>200–400</td><td>Slightly lower; fetal fibrinogen = dysfunctional</td></tr>
</tbody></table>
<div class="bx bb">ℹ️ Mild prolongation of PT (12–18s) and aPTT (25–70s) is NORMAL in neonates. Does NOT indicate a bleeding disorder.</div>`,
t1:`<table class="dt"><thead><tr><th>PT</th><th>aPTT</th><th>Plts</th><th>Fib</th><th>Most Likely</th></tr></thead><tbody>
<tr><td>↑</td><td>↑</td><td>↓</td><td>↓</td><td><strong>DIC</strong></td></tr>
<tr><td>↑</td><td>↑</td><td>N</td><td>N</td><td><strong>VKDB</strong> or liver disease</td></tr>
<tr><td>N</td><td>↑</td><td>N</td><td>N</td><td><strong>Hemophilia A or B</strong></td></tr>
<tr><td>N</td><td>N</td><td>N</td><td>N</td><td><strong>Factor XIII def</strong> (normal screening!) or plt function disorder</td></tr>
<tr><td>N</td><td>↑↑</td><td>N</td><td>N</td><td>Contact factor def (XII) — no bleeding risk</td></tr>
</tbody></table>`,
t2:`<ol class="sl">
<li><strong>Was vitamin K given?</strong> NO → presume VKDB → Vit K 1–2 mg IV + FFP if bleeding</li>
<li><strong>Infant sick?</strong> (Sepsis, asphyxia, NEC) → DIC most likely → treat underlying cause</li>
<li><strong>Use pattern table</strong> to narrow differential</li>
<li><strong>Isolated ↑aPTT + bleeding after circumcision</strong> → factor VIII and IX levels → hemophilia</li>
<li><strong>All tests normal but delayed umbilical stump bleeding (day 7–10)</strong> → factor XIII level</li>
<li><strong>Mixing study:</strong> Prolonged aPTT corrects with normal plasma = factor deficiency; does NOT correct = inhibitor</li>
</ol>`,
t3:`<table class="rt"><thead><tr><th>Product</th><th>Dose</th><th>Contains</th><th>Indication</th></tr></thead><tbody>
<tr><td>FFP</td><td>10–15 mL/kg</td><td>All factors</td><td>↑PT/aPTT with bleeding; DIC</td></tr>
<tr><td>Cryoprecipitate</td><td>5–10 mL/kg</td><td>Fibrinogen, VIII, XIII, VWF</td><td>Fib &lt;100; DIC</td></tr>
<tr><td>Vitamin K1</td><td>1–2 mg IV/IM</td><td>Vit K (promotes II,VII,IX,X)</td><td>VKDB; takes 4–6h for effect</td></tr>
<tr><td>Factor VIII conc</td><td>50 U/kg</td><td>Factor VIII</td><td>Hemophilia A</td></tr>
<tr><td>Factor IX conc</td><td>100 U/kg</td><td>Factor IX</td><td>Hemophilia B</td></tr>
<tr><td>Platelets</td><td>10–15 mL/kg</td><td>Platelets + plasma</td><td>Severe thrombocytopenia</td></tr>
</tbody></table>`
},children:[
{name:"VKDB",icon:"💊",type:"emergency",sub:"No vitamin K given · Bleeding",edge:"No Vit K\nat birth",
info:{tabs:["Three Forms","Emergency Treatment","Prevention"],
t0:`<table class="dt"><thead><tr><th>Type</th><th>Timing</th><th>Incidence</th><th>Presentation</th><th>Mortality</th></tr></thead><tbody>
<tr><td><strong>Early</strong></td><td>0–24h</td><td>Rare</td><td>ICH, intrathoracic</td><td>Severe; maternal drugs</td></tr>
<tr><td><strong>Classic</strong></td><td>Day 2–7</td><td>0.25–1.7%</td><td>Umbilical, GI, circumcision</td><td>Rarely fatal if treated</td></tr>
<tr><td><strong>Late</strong></td><td>2–12 wk</td><td>4–7/100K</td><td><strong>50% present with ICH</strong></td><td><strong>20% mortality</strong></td></tr>
</tbody></table>`,
t1:`<ol class="sl">
<li><strong>Vitamin K1 1–2 mg IV STAT</strong> (effect in 2–4h; full correction 12–24h)</li>
<li><strong>FFP 10–15 mL/kg</strong> for active significant bleeding (immediate factor replacement)</li>
<li>If ICH: emergent neurosurgery. Consider PCC (prothrombin complex concentrate) if available.</li>
<li>Recheck PT/aPTT at 4–6 hours</li>
<li>Supportive: monitor Hb (transfuse if anemic), neuro status, NPO if GI bleeding</li>
</ol>`,
t2:`<div class="bx bg">✓ <strong>IM vitamin K1 0.5–1 mg within 6 hours of birth for ALL newborns.</strong> Single injection prevents all three forms. AAP does NOT recommend oral vitamin K.</div>
<p><strong>When parents refuse:</strong></p>
<ul><li>Counsel clearly: late VKDB = 50% ICH, 20% mortality</li>
<li>If still refuse IM: offer oral (2 mg PO at birth, 1 wk, 4 wk) — LESS effective</li>
<li>Document discussion and refusal</li>
<li>Flag chart for close follow-up</li></ul>`
}},
{name:"DIC",icon:"🌡️",type:"emergency",sub:"Sepsis/asphyxia/NEC trigger",edge:"↑PT ↑aPTT\n↓Fib ↓Plts",
info:{tabs:["Pathophysiology","Diagnosis","Treatment"],
t0:`<p><strong>DIC paradox:</strong> Simultaneous THROMBOSIS (microthrombi → organ ischemia) AND HEMORRHAGE (factor/plt depletion → diffuse bleeding).</p>
<p><strong>Triggers:</strong> Sepsis (#1), perinatal asphyxia/HIE, NEC, severe hemolytic disease, Kasabach-Merritt, hypothermia, MAS/PPHN.</p>
<div class="bx br">🚨 <strong>DIC is NEVER a primary diagnosis.</strong> Always identify and treat the trigger. Factor replacement without treating the cause is futile.</div>`,
t1:`<table class="rt"><thead><tr><th>Test</th><th>DIC</th><th>Normal Neonate</th></tr></thead><tbody>
<tr><td>PT</td><td>Prolonged (>18–20s)</td><td>12–18s</td></tr>
<tr><td>aPTT</td><td>Prolonged (>70–80s)</td><td>25–70s</td></tr>
<tr><td>Fibrinogen</td><td>&lt;100 mg/dL</td><td>150–400</td></tr>
<tr><td>D-dimer</td><td>Markedly ↑</td><td>Elevated at birth (trend more useful)</td></tr>
<tr><td>Platelets</td><td>Low and FALLING</td><td>150–400K</td></tr>
<tr><td>Smear</td><td>Schistocytes</td><td>Occasional normal</td></tr>
</tbody></table>`,
t2:`<ol class="sl">
<li><strong>#1 TREAT THE CAUSE:</strong> Sepsis → Abx. NEC → NPO/Abx/surgery. Asphyxia → supportive/TH.</li>
<li><strong>Replace factors:</strong> FFP 10–15 mL/kg. Cryo 5–10 mL/kg (fib &lt;100). Plts 10–15 mL/kg.</li>
<li><strong>Maintain perfusion:</strong> Volume, inotropes, adequate ventilation.</li>
<li><strong>Monitor q4–6h:</strong> PT, aPTT, fib, plts, D-dimer.</li>
<li><strong>Heparin:</strong> Generally NOT used in neonatal DIC. Exception: purpura fulminans (protein C/S deficiency).</li>
</ol>`
}},
{name:"Hemophilia /\nLiver / Factor XIII",icon:"🏥",type:"diagnosis",sub:"Isolated factor deficiency or hepatic",edge:"Isolated ↑aPTT\nor liver dz",
info:{tabs:["Hemophilia A & B","Factor XIII Deficiency","Liver Disease"],
t0:`<p><strong>Hemophilia A (factor VIII def):</strong> X-linked; 1/5,000 males. Presents with circumcision/heel stick bleeding. Isolated ↑aPTT, normal PT. Severe &lt;1%, moderate 1–5%, mild 5–40%. Treat: factor VIII concentrate 50 U/kg.</p>
<p><strong>Hemophilia B (factor IX def):</strong> X-linked; 1/25,000. Clinically identical to A. Factor IX is vit K-dependent and normally low in neonates — confirm diagnosis at 3–6 months.</p>
<div class="bx bo">⚠️ Factor VIII reaches adult levels by 6 months gestation → hemophilia A CAN be diagnosed at birth. Factor IX is low normally → hemophilia B diagnosis unreliable until 3–6 months.</div>`,
t1:`<ul><li>Normal PT AND aPTT — NOT measured by standard screening tests</li>
<li>Classic: <strong>delayed umbilical stump bleeding</strong> (day 7–10)</li>
<li>ICH in 30%</li>
<li>Diagnosis: factor XIII activity level</li>
<li>Treatment: factor XIII concentrate; prophylaxis q4–6 weeks</li></ul>
<div class="bx bp">🔬 <strong>All screening tests normal + bleeding = think factor XIII.</strong> The one factor NOT measured by PT or aPTT.</div>`,
t2:`<ul><li>Liver synthesizes virtually all clotting factors except VIII and VWF</li>
<li>Causes: neonatal hemochromatosis, herpes hepatitis, metabolic (galactosemia, tyrosinemia), biliary atresia, hepatic ischemia</li>
<li>Pattern: BOTH PT and aPTT prolonged + low albumin + elevated direct bili + elevated transaminases</li>
<li>Distinguished from DIC by less prominent D-dimer/schistocytes (unless concurrent DIC)</li>
<li>Management: vitamin K 1 mg IV, FFP for active bleeding, treat underlying liver disease</li></ul>`
}}
]},
// ═══════════════════════════ BRANCH 5: NEUTROPHIL ABNORMALITIES ═══════════════════════════
{name:"NEUTROPHIL\nABNORMALITIES",icon:"🛡️",type:"decision",sub:"ANC abnormal on differential",edge:"WBC\ndifferential",
info:{tabs:["Normal Neonatal WBC","Neutropenia","Neutrophilia/Left Shift","Workup"],
t0:`<table class="rt"><thead><tr><th>Parameter</th><th>Birth (term)</th><th>12–24h</th><th>1 week</th></tr></thead><tbody>
<tr><td>Total WBC</td><td>9–30K</td><td>Peaks (30K+)</td><td>5–15K</td></tr>
<tr><td>ANC</td><td>6–26K</td><td>Peaks 12–24h</td><td>1–5K</td></tr>
<tr><td>I:T ratio</td><td>&lt;0.2</td><td>&lt;0.2</td><td>&lt;0.12</td></tr>
<tr><td>Lymphocytes</td><td>2–11K</td><td>—</td><td>Predominant by day 5–7</td></tr>
</tbody></table>
<p><em>Normal ranges are WIDE and vary by GA and postnatal age. Use Schmutz/Manroe reference charts.</em></p>`,
t1:`<table class="dt"><thead><tr><th>Status</th><th>Most Likely</th><th>Mechanism</th><th>Action</th></tr></thead><tbody>
<tr><td><strong>SICK</strong></td><td>Sepsis</td><td>Marrow exhaustion</td><td>Cultures + Abx IMMEDIATELY</td></tr>
<tr><td><strong>WELL preterm</strong></td><td>Maternal HTN</td><td>↓ placental G-CSF</td><td>Monitor; resolves 3–5 days</td></tr>
<tr><td><strong>WELL term</strong></td><td>Alloimmune</td><td>Maternal anti-neutrophil Ab</td><td>Self-limited (weeks)</td></tr>
<tr><td><strong>Persistent</strong></td><td>Congenital (Kostmann, cyclic)</td><td>Genetic</td><td>G-CSF; hematology</td></tr>
</tbody></table>`,
t2:`<ul><li><strong>Physiologic neutrophilia:</strong> Normal in first 24–48h (labor stress, maternal steroids). NOT infection.</li>
<li><strong>I:T ratio >0.2:</strong> Sensitivity ~80% but specificity only ~30%. Many false positives.</li>
<li><strong>Best approach:</strong> Combine WBC/ANC/I:T with clinical signs + CRP/PCT + blood culture</li>
<li><strong>Leukemoid reaction (WBC >50K):</strong> Severe infection, TAM (T21), or congenital leukemia → smear for blasts</li></ul>`,
t3:`<ol class="sl">
<li><strong>Correlate with clinical status:</strong> Sick + neutropenic = sepsis. Well + neutropenic = benign cause.</li>
<li><strong>Blood culture</strong></li>
<li><strong>CRP</strong> (serial at 24–48h; sensitivity improves with repeat). <strong>PCT</strong> (rises earlier; physiologic peak at 24h limits day-1 utility)</li>
<li><strong>Serial CBC q12–24h</strong> — trend more informative than single value</li>
<li>If blasts on smear → urgent hematology → flow cytometry</li>
<li>If persistent neutropenia in well infant → anti-neutrophil Ab, maternal HTN history, genetics if >2 weeks</li>
</ol>`
},children:[
{name:"Neutropenia\n(ANC < 1,000)",icon:"📉",type:"urgent",sub:"Sepsis vs maternal HTN vs alloimmune",edge:"ANC < 1K",
info:{tabs:["Sick vs Well Algorithm","G-CSF"],
t0:`<ol class="sl">
<li><strong>SICK?</strong> → Presume sepsis. Blood cx + empiric Abx immediately.</li>
<li><strong>WELL preterm + maternal preeclampsia/HTN?</strong> → Placental insufficiency. Monitor ANC daily. Resolves 3–5 days.</li>
<li><strong>WELL term + isolated neutropenia?</strong> → Consider alloimmune (maternal anti-neutrophil Ab). Self-limited.</li>
<li><strong>Persistent >2 wk or ANC &lt;200?</strong> → Congenital (Kostmann, cyclic, Shwachman-Diamond). Hematology referral.</li>
</ol>`,
t1:`<ul><li>G-CSF did NOT consistently reduce mortality in sepsis-associated neutropenia (Cochrane review)</li>
<li>NOT routinely recommended for sepsis</li>
<li>IS indicated for congenital neutropenia (chronic ANC &lt;200)</li>
<li>Dose: 5–10 µg/kg/day SC or IV</li></ul>`
}},
{name:"Neutrophilia /\nLeft Shift",icon:"📈",type:"action",sub:"ANC >20K or I:T >0.2",edge:"ANC >20K\nor left shift",

t1:`<p><strong>Common benign causes:</strong></p>
<ul><li>Physiologic leukocytosis of birth (peaks 12–24h)</li>
<li>Maternal betamethasone/dexamethasone (24–48h effect)</li>
<li>Crying, stress, cold exposure (demargination)</li>
<li>Post-seizure (transient)</li></ul>
<p><strong>When NOT to treat:</strong> Well-appearing, afebrile neonate with elevated WBC at 12–24h, no risk factors, normal CRP → observe, do NOT start antibiotics based on WBC alone.</p>`

// ════════════════════════════════════════════════════════════════════════
// D3 TREE RENDERING ENGINE
// ════════════════════════════════════════════════════════════════════════
const CM={
  assessment:{f:"#0f1d3a",s:"#60a5fa",t:"#60a5fa",b:"Assessment"},
  decision:{f:"#2a2006",s:"#fbbf24",t:"#fbbf24",b:"Decision Point"},
  emergency:{f:"#2a1215",s:"#f87171",t:"#f87171",b:"Emergency"},
  urgent:{f:"#2a1a0a",s:"#fb923c",t:"#fb923c",b:"Urgent"},
  action:{f:"#0a2a1a",s:"#4ade80",t:"#4ade80",b:"Action"},
  diagnosis:{f:"#1a0f2e",s:"#c084fc",t:"#c084fc",b:"Diagnosis"},
};
const svg=d3.select("#tc"),W=innerWidth,H=innerHeight;
svg.attr("width",W).attr("height",H);
const g=svg.append("g");
const zm=d3.zoom().scaleExtent([0.2,3]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zm);
const nW=148,nH=62;
const root=d3.hierarchy(T,d=>d.children);
root.x0=H/2;root.y0=0;
root.descendants().forEach(d=>{if(d.depth>1&&d.children){d._children=d.children;d.children=null;}});
const tl=d3.tree().nodeSize([nH+32,nW+85]);

function upd(src){
  const dur=420;tl(root);
  const nds=root.descendants(),lks=root.links();
  nds.forEach(d=>{d.y=d.depth*230;});
  // Links
  const lk=g.selectAll(".lk").data(lks,d=>d.target.data.name);
  const le=lk.enter().append("path").attr("class","lk").attr("d",()=>{const o={x:src.x0,y:src.y0};return dg(o,o);});
  lk.merge(le).transition().duration(dur).attr("d",d=>dg(d.source,d.target));
  lk.exit().transition().duration(dur).attr("d",()=>{const o={x:src.x,y:src.y};return dg(o,o);}).remove();
  // Link labels
  g.selectAll(".ll").remove();
  lks.forEach(d=>{if(d.target.data.edge){const ls=d.target.data.edge.split("\n"),mx=(d.source.x+d.target.x)/2,my=(d.source.y+d.target.y)/2;
  ls.forEach((l,i)=>{g.append("text").attr("class","ll").attr("x",my+12).attr("y",mx-4+i*11).text(l);});}});
  // Nodes
  const nd=g.selectAll(".ng").data(nds,d=>d.data.name);
  const ne=nd.enter().append("g").attr("class","ng").attr("transform",`translate(${src.y0},${src.x0})`).on("click",(e,d)=>{if(d.children){d._children=d.children;d.children=null;}else if(d._children){d.children=d._children;d._children=null;}upd(d);});
  ne.append("rect").attr("class","nr").attr("x",-nW/2).attr("y",-nH/2).attr("width",nW).attr("height",nH).attr("fill",d=>CM[d.data.type]?.f||"#1e293b").attr("stroke",d=>CM[d.data.type]?.s||"#475569");
  ne.append("text").attr("class","ni").attr("y",-12).text(d=>d.data.icon);
  ne.each(function(d){const ls=d.data.name.split("\n"),el=d3.select(this);
  ls.forEach((l,i)=>{el.append("text").attr("class","nl").attr("y",4+i*13).text(l);});
  if(d.data.sub){el.append("text").attr("class","ns").attr("y",4+ls.length*13+5).text(d.data.sub.substring(0,32));}});
  // Info badge
  ne.append("circle").attr("class","ib").attr("cx",nW/2-12).attr("cy",-nH/2+12).attr("r",10)
    .attr("fill",d=>CM[d.data.type]?.s||"#60a5fa").attr("fill-opacity",.2)
    .attr("stroke",d=>CM[d.data.type]?.s||"#60a5fa").attr("stroke-width",1.5)
    .on("click",(e,d)=>{e.stopPropagation();showP(d.data);});
  ne.append("text").attr("x",nW/2-12).attr("y",-nH/2+16).attr("text-anchor","middle").attr("font-size","12px").attr("fill","#e2e8f0").attr("pointer-events","none").attr("font-weight","700").text("i");
  // Expand indicator
  ne.append("text").attr("class","ei").attr("x",0).attr("y",nH/2+15).attr("text-anchor","middle").attr("font-size","10px").attr("fill","#475569");
  const nu=nd.merge(ne);
  nu.transition().duration(dur).attr("transform",d=>`translate(${d.y},${d.x})`);
  nu.select(".ei").text(d=>d._children?`▸ ${d._children.length} more`:"");
  nd.exit().transition().duration(dur).attr("transform",`translate(${src.y},${src.x})`).remove();
  nds.forEach(d=>{d.x0=d.x;d.y0=d.y;});
}
function dg(s,d){return`M${s.y} ${s.x}C${(s.y+d.y)/2} ${s.x},${(s.y+d.y)/2} ${d.x},${d.y} ${d.x}`;}
upd(root);
const iT=d3.zoomIdentity.translate(90,H/2-20).scale(0.82);
svg.call(zm.transform,iT);

// ═══ POPUP SYSTEM WITH TABS ═══
function showP(data){
  const ov=document.getElementById("po"),c=CM[data.type]||CM.assessment;
  document.getElementById("picon").textContent=data.icon;
  document.getElementById("picon").style.background=c.f;
  document.getElementById("picon").style.border=`1.5px solid ${c.s}`;
  document.getElementById("ptitle").textContent=data.name.replace(/\n/g," ");
  const te=document.getElementById("ptype");te.textContent=c.b;te.style.background=c.f;te.style.color=c.t;te.style.border=`1px solid ${c.s}`;
  let h="";
  if(data.info.tabs){
    h+=`<div class="tabs">`;
    data.info.tabs.forEach((t,i)=>{h+=`<button class="tb${i===0?' active':''}" onclick="swT(${i})">${t}</button>`;});
    h+=`</div>`;
    data.info.tabs.forEach((t,i)=>{h+=`<div class="tc${i===0?' active':''}" data-t="${i}">${data.info['t'+i]||''}</div>`;});
  }
  if(data.sub){h+=`<div class="bx bb" style="margin-top:16px">ℹ️ <strong>Summary:</strong> ${data.sub}</div>`;}
  document.getElementById("pbody").innerHTML=h;
  ov.classList.add("active");
  document.getElementById("pp").scrollTop=0;
}
function swT(i){document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('active',j===i));document.querySelectorAll('.tc').forEach((c,j)=>c.classList.toggle('active',j===i));}
function closeP(e){if(!e||e.target===document.getElementById("po"))document.getElementById("po").classList.remove("active");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeP();});
function resetZ(){svg.transition().duration(500).call(zm.transform,iT);}
function expAll(){root.descendants().forEach(d=>{if(d._children){d.children=d._children;d._children=null;}});upd(root);}
function colAll(){root.descendants().forEach(d=>{if(d.depth>0&&d.children){d._children=d.children;d.children=null;}});upd(root);}
addEventListener("resize",()=>{svg.attr("width",innerWidth).attr("height",innerHeight);});
</script>
<script src="../theme-bridge.js"></script>
