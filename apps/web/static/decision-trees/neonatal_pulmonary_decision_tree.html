<script>
const T={
name:"Neonatal\nResp Distress",icon:"🫁",type:"assessment",sub:"Tachypnea, grunting, retractions, cyanosis, O₂ need",edge:"",
info:{tabs:["Initial Assessment","Silverman-Andersen Score","CXR Patterns","Blood Gas Interpretation"],
t0:`<p>Respiratory distress is the most common reason for NICU admission. It can result from pulmonary disease, cardiac disease, or systemic illness (sepsis, metabolic). A systematic approach differentiates the etiology.</p>
<p><strong>Signs of respiratory distress:</strong></p>
<ul><li>Tachypnea (RR >60/min sustained)</li><li>Grunting (expiratory — maintaining positive end-expiratory pressure to prevent alveolar collapse)</li><li>Nasal flaring</li><li>Retractions (subcostal, intercostal, suprasternal)</li><li>Cyanosis (central)</li><li>Apnea / periodic breathing</li><li>Oxygen requirement (SpO₂ &lt;90% in room air)</li></ul>`,
t1:`<p><strong>Silverman-Andersen Respiratory Severity Score (0–10):</strong></p>
<table class="rt"><thead><tr><th>Parameter</th><th>0 (None)</th><th>1 (Moderate)</th><th>2 (Severe)</th></tr></thead><tbody>
<tr><td>Upper chest movement</td><td>Synchronized</td><td>Lag on inspiration</td><td>See-saw</td></tr>
<tr><td>Lower chest retractions</td><td>None</td><td>Just visible</td><td>Marked</td></tr>
<tr><td>Xiphoid retractions</td><td>None</td><td>Just visible</td><td>Marked</td></tr>
<tr><td>Nasal flaring</td><td>None</td><td>Minimal</td><td>Marked</td></tr>
<tr><td>Expiratory grunt</td><td>None</td><td>Audible with stethoscope</td><td>Audible without stethoscope</td></tr>
</tbody></table>
<p>Score 0–3: mild; 4–6: moderate; 7–10: severe (likely needs ventilatory support)</p>`,
t2:`<table class="dt"><thead><tr><th>CXR Pattern</th><th>Most Likely Diagnosis</th><th>Key Features</th></tr></thead><tbody>
<tr><td>Bilateral ground-glass + air bronchograms + low volumes</td><td><strong>RDS (surfactant deficiency)</strong></td><td>Preterm; symmetric; air bronchograms in both lungs</td></tr>
<tr><td>Hyperinflation + perihilar streaking + fluid in fissures</td><td><strong>TTN (transient tachypnea)</strong></td><td>Term/late-preterm; c-section; clears in 24–72h</td></tr>
<tr><td>Coarse irregular opacities + hyperinflation</td><td><strong>MAS (meconium aspiration)</strong></td><td>Post-term, meconium-stained; patchy, asymmetric</td></tr>
<tr><td>Unilateral white-out or mediastinal shift</td><td><strong>Pneumothorax, CDH, effusion</strong></td><td>Emergent if tension physiology</td></tr>
<tr><td>Cardiomegaly + pulmonary edema</td><td><strong>Cardiac disease</strong></td><td>Consider echo; structural vs cardiomyopathy</td></tr>
<tr><td>Air bronchograms + patchy opacities</td><td><strong>Pneumonia (GBS, E. coli)</strong></td><td>Indistinguishable from RDS on CXR; sepsis workup</td></tr>
</tbody></table>`,
t3:`<table class="rt"><thead><tr><th>Parameter</th><th>Normal Newborn</th><th>Notes</th></tr></thead><tbody>
<tr><td>pH</td><td>7.25–7.35</td><td>Slightly acidotic at birth; normalizes in hours</td></tr>
<tr><td>PaCO₂</td><td>35–45 mmHg</td><td>Hypercapnia = respiratory failure or permissive strategy</td></tr>
<tr><td>PaO₂</td><td>50–80 mmHg</td><td>Target varies by GA and condition; avoid hyperoxia in preterm</td></tr>
<tr><td>HCO₃</td><td>18–22 mEq/L</td><td>Low = metabolic acidosis (sepsis, asphyxia, IEM)</td></tr>
<tr><td>Base deficit</td><td>-2 to +2</td><td>Worsening BD = tissue hypoperfusion</td></tr>
<tr><td>Lactate</td><td>&lt;2.5 mmol/L</td><td>Elevated = inadequate oxygen delivery</td></tr>
</tbody></table>
<div class="bx bb">ℹ️ <strong>Preterm SpO₂ targets: 90–95%.</strong> Avoid sustained SpO₂ >95% in preterm infants — hyperoxia increases ROP, BPD, and mortality (BOOST-II, COT, SUPPORT trials). Lower alarm at 89%, upper alarm at 95%.</div>`
},children:[
// ═══ RDS ═══
{name:"RDS / Surfactant\nDeficiency",icon:"🔵",type:"urgent",sub:"Preterm · Ground-glass CXR · Surfactant therapy",edge:"Preterm +\nground-glass",
info:{tabs:["Definition","Surfactant Therapy","CPAP / LISA","Ventilation Targets"],
t0:`<p><strong>Respiratory Distress Syndrome (RDS):</strong> Caused by surfactant deficiency in preterm infants. Incidence inversely proportional to gestational age — ~80% at 28 wk, ~50% at 32 wk, ~15% at 34 wk.</p>
<ul><li>CXR: bilateral ground-glass opacities with air bronchograms, reduced lung volumes</li>
<li>Progressive respiratory failure over first 12–48 hours</li>
<li>Improves after 48–72 hours as endogenous surfactant production increases</li></ul>`,
t1:`<p><strong>Surfactant Administration — 2022 European Consensus (Sweet et al.):</strong></p>
<ul><li><strong>Indications:</strong> FiO₂ >0.30 on CPAP in infants &lt;30 wk, or FiO₂ >0.40 on CPAP at any GA with RDS</li>
<li><strong>Agent:</strong> Poractant alfa (Curosurf) 200 mg/kg preferred first dose (superior to 100 mg/kg dose per Ramanathan et al.); beractant (Survanta) 100 mg/kg; calfactant (Infasurf) 105 mg/kg</li>
<li><strong>Repeat dosing:</strong> May give up to 2–3 additional doses if ongoing O₂ requirement >0.30–0.40 on CPAP</li>
<li><strong>Route:</strong> LISA (Less Invasive Surfactant Administration) or INSURE (INtubate-SURfactant-Extubate) preferred over prolonged intubation</li></ul>`,
t2:`<p><strong>CPAP-First Approach:</strong></p>
<ul><li>SUPPORT trial (NEJM 2010): Early CPAP non-inferior to intubation/surfactant for death/BPD in ELBW</li>
<li>Start CPAP 5–7 cmH₂O in delivery room for spontaneously breathing preterm infants</li>
<li>LISA (thin catheter surfactant on CPAP) reduces need for MV vs INSURE</li>
<li>Avoid routine intubation — keep on CPAP unless FiO₂ escalating or apnea/respiratory failure</li></ul>
<div class="bx bg">✓ <strong>Less-Invasive Surfactant Administration (LISA):</strong> Surfactant given via thin catheter while infant remains on CPAP, avoiding intubation. Multiple RCTs show reduced BPD, less MV, shorter NICU stay vs standard intubation.</div>`,
t3:`<table class="rt"><thead><tr><th>Parameter</th><th>Target</th><th>Rationale</th></tr></thead><tbody>
<tr><td>SpO₂ (preterm)</td><td>90–95%</td><td>Avoid hyperoxia (>95% = ↑ ROP, BPD, mortality)</td></tr>
<tr><td>PaCO₂ (permissive)</td><td>45–65 mmHg</td><td>Permissive hypercapnia reduces ventilator-induced lung injury (accept pH >7.20)</td></tr>
<tr><td>Tidal volume</td><td>4–6 mL/kg</td><td>Volume-targeted ventilation reduces BPD vs pressure-targeted</td></tr>
<tr><td>PEEP</td><td>5–8 cmH₂O</td><td>Maintain FRC; prevent atelectrauma</td></tr>
<tr><td>PIP</td><td>Lowest achieving adequate TV</td><td>Minimize barotrauma</td></tr>
</tbody></table>`
},children:[
{name:"Surfactant\nAdministration",icon:"💉",type:"action",sub:"Curosurf 200mg/kg preferred · LISA",edge:"FiO₂ >0.30\non CPAP",
info:{tabs:["Dosing Table","LISA Technique"],
t0:`<table class="rt"><thead><tr><th>Agent</th><th>Dose</th><th>Volume</th><th>Notes</th></tr></thead><tbody>
<tr><td>Poractant alfa (Curosurf)</td><td>200 mg/kg initial</td><td>2.5 mL/kg</td><td>Higher dose superior; repeat 100 mg/kg q12h PRN</td></tr>
<tr><td>Beractant (Survanta)</td><td>100 mg/kg</td><td>4 mL/kg</td><td>Repeat q6h PRN up to 4 doses</td></tr>
<tr><td>Calfactant (Infasurf)</td><td>105 mg/kg</td><td>3 mL/kg</td><td>Repeat q12h PRN up to 3 doses</td></tr>
</tbody></table>`,
t1:`<p><strong>LISA (Less Invasive Surfactant Administration):</strong></p>
<ol class="sl">
<li>Infant on CPAP (spontaneously breathing)</li>
<li>Direct laryngoscopy to visualize vocal cords</li>
<li>Insert thin catheter (16F feeding tube or dedicated LISA catheter) through cords into trachea</li>
<li>Instill surfactant slowly over 1–3 minutes while infant continues to breathe on CPAP</li>
<li>Remove catheter. Continue CPAP.</li>
<li>Avoid positive pressure ventilation during/after procedure</li>
</ol>
<div class="bx bg">✓ <strong>LISA reduces need for mechanical ventilation by ~30% and may reduce BPD</strong> compared to INSURE or standard intubation methods.</div>`
}},
{name:"BPD\nPrevention",icon:"🛡️",type:"action",sub:"Minimize O₂ · Caffeine · Volume-target",edge:"Ongoing\nlung disease",
info:{tabs:["Prevention Bundle","Caffeine","NIV Strategies"],
t0:`<p><strong>BPD Prevention Bundle:</strong></p>
<ul><li>Antenatal steroids (most effective single intervention)</li>
<li>CPAP-first approach (avoid intubation if possible)</li>
<li>LISA/INSURE for surfactant delivery</li>
<li>Volume-targeted ventilation (Tv 4–6 mL/kg) when MV needed</li>
<li>Permissive hypercapnia (PaCO₂ 45–65, pH >7.20)</li>
<li>SpO₂ targets 90–95% (avoid hyperoxia)</li>
<li>Caffeine citrate starting from birth</li>
<li>Minimize postnatal steroids (consider low-dose hydrocortisone per PREMILOC)</li>
<li>Breast milk nutrition (reduces inflammation)</li>
<li>Vitamin A supplementation (modest benefit; underutilized)</li></ul>`,
t1:`<p><strong>Caffeine Citrate (CAP Trial, Schmidt et al., NEJM 2006):</strong></p>
<ul><li><strong>Loading:</strong> 20 mg/kg IV/PO</li>
<li><strong>Maintenance:</strong> 5–10 mg/kg/day IV/PO once daily</li>
<li>Start as early as possible (within first 48h of life) in infants &lt;1250g</li>
<li>Benefits: 36% reduction in BPD, improved neurodevelopment at 18–21 months and 5 years, earlier extubation, reduced PDA treatment</li>
<li>One of the MOST evidence-based therapies in neonatology</li></ul>`,
t2:`<p><strong>Non-Invasive Ventilation Escalation:</strong></p>
<table class="dt"><thead><tr><th>Mode</th><th>Settings</th><th>When</th></tr></thead><tbody>
<tr><td>CPAP</td><td>5–8 cmH₂O</td><td>First-line for RDS</td></tr>
<tr><td>HFNC (High-Flow)</td><td>2–8 L/min</td><td>Step-down from CPAP; similar efficacy in mild RDS</td></tr>
<tr><td>NIPPV/BiPAP</td><td>PIP 14–20, PEEP 5–7, Rate 20–40</td><td>Rescue from CPAP failure; may reduce intubation</td></tr>
<tr><td>NHFOV</td><td>MAP 8–12, Hz 8–12, ΔP 25–35</td><td>Emerging; limited evidence but growing use</td></tr>
</tbody></table>`
}}
]},
// ═══ TTN ═══
{name:"TTN",icon:"💧",type:"action",sub:"Term/late-preterm · C-section · Self-limited 24–72h",edge:"Term +\nhyperinflation\n+ fluid",
info:{tabs:["Definition","Diagnosis","Management"],
t0:`<p><strong>Transient Tachypnea of the Newborn (TTN):</strong> Delayed clearance of fetal lung fluid. Most common cause of respiratory distress in term/late-preterm infants.</p>
<ul><li>Risk factors: C-section (no labor = no catecholamine surge for fluid clearance), late-preterm, maternal DM, precipitous delivery, male sex</li>
<li>Self-limited: resolves in 24–72 hours</li>
<li>CXR: hyperinflation, perihilar streaking, fluid in fissures, mild cardiomegaly</li></ul>`,
t1:`<p><strong>TTN is a diagnosis of exclusion.</strong> Must rule out:</p>
<ul><li>Pneumonia/sepsis (clinical overlap — consider empiric antibiotics if risk factors present)</li>
<li>Pneumothorax (asymmetric CXR, acute deterioration)</li>
<li>Congenital heart disease (persistent hypoxemia, murmur)</li>
<li>RDS in late-preterm (can coexist with TTN)</li></ul>
<div class="bx bo">⚠️ <strong>If FiO₂ >0.40 or symptoms persist >72 hours, reconsider the diagnosis.</strong> True TTN rarely requires more than low-flow O₂ and resolves within 72h.</div>`,
t2:`<ul><li>Supportive care: supplemental O₂ to maintain SpO₂ >90–95%</li>
<li>CPAP may help if moderate distress (5–6 cmH₂O)</li>
<li>NPO until RR &lt;60–80 (aspiration risk with tachypnea); IV fluids</li>
<li>No benefit from furosemide or racemic epinephrine</li>
<li>Monitor for improvement — expect resolution by 24–72h</li></ul>`
}},
// ═══ MAS ═══
{name:"MAS",icon:"🟤",type:"urgent",sub:"Post-term · Meconium-stained · PPHN risk",edge:"Meconium\nstaining +\ndistress",
info:{tabs:["Pathophysiology","Management","PPHN in MAS"],
t0:`<p><strong>Meconium Aspiration Syndrome (MAS):</strong> Chemical pneumonitis and mechanical obstruction from aspirated meconium, causing ball-valve effect (air trapping), surfactant inactivation, and intense inflammatory response.</p>
<ul><li>Occurs in ~5% of deliveries with meconium-stained amniotic fluid</li>
<li>Risk factors: post-term (>42 wk), fetal distress/asphyxia, thick meconium</li>
<li>CXR: patchy, coarse, irregular opacities; hyperinflation; may see pneumothorax or pneumomediastinum</li>
<li><strong>NRP 2020:</strong> Routine tracheal suctioning of vigorous meconium-stained infants is NOT recommended. Intubation and suctioning only if infant is NOT breathing or HR &lt;100 after initial steps.</li></ul>`,
t1:`<ol class="sl">
<li><strong>Respiratory support:</strong> Supplemental O₂ → CPAP → mechanical ventilation if failing</li>
<li><strong>Surfactant:</strong> Consider if intubated and FiO₂ >0.50; may improve oxygenation by overcoming surfactant inactivation. Bolus lavage technique studied but not standard.</li>
<li><strong>Avoid overventilation:</strong> Air trapping → pneumothorax risk. Use longer expiratory times, avoid high PEEP.</li>
<li><strong>Antibiotics:</strong> Empiric amp/gent (meconium is a bacterial growth medium; risk of secondary infection)</li>
<li><strong>Supportive:</strong> Temperature control, fluid management, treat acidosis, minimal stimulation</li>
<li><strong>ECMO:</strong> Consider if severe hypoxemia despite maximal therapy (OI >40 sustained)</li>
</ol>`,
t2:`<p><strong>Persistent Pulmonary Hypertension (PPHN) complicates ~30% of MAS.</strong></p>
<ul><li>Mechanism: meconium causes pulmonary vasoconstriction + inflammation → right-to-left shunting through PDA/foramen ovale</li>
<li>Diagnosis: pre-/post-ductal SpO₂ difference >5–10%; echo shows elevated PA pressures, R→L shunting</li>
<li>Treatment: See PPHN branch</li></ul>`
}},
// ═══ PPHN ═══
{name:"PPHN",icon:"❤️",type:"emergency",sub:"Persistent pulmonary HTN · iNO · ECMO",edge:"Pre/post-ductal\nSpO₂ diff >5%",
info:{tabs:["Definition","Diagnosis","Treatment Algorithm","iNO Protocol"],
t0:`<p><strong>Persistent Pulmonary Hypertension of the Newborn (PPHN):</strong> Failure of normal postnatal fall in pulmonary vascular resistance → right-to-left shunting through PDA and/or foramen ovale → severe hypoxemia.</p>
<p><strong>Etiologies:</strong></p>
<ul><li><strong>Maladaptation:</strong> MAS, pneumonia, RDS, TTN (normal lung vasculature, abnormal transition)</li>
<li><strong>Maldevelopment:</strong> CDH, pulmonary hypoplasia (abnormal vascular structure)</li>
<li><strong>Idiopathic:</strong> Remodeled muscular pulmonary arteries (associated with maternal SSRI use, NSAID exposure)</li></ul>`,
t1:`<p><strong>Diagnostic evaluation:</strong></p>
<ol class="sl">
<li><strong>Pre-/post-ductal SpO₂:</strong> Right hand (pre-ductal) vs either foot (post-ductal). Difference >5–10% suggests R→L ductal shunting.</li>
<li><strong>Echocardiogram:</strong> Elevated RV pressure, TR jet velocity (estimates PA pressure), direction of shunting across PDA and PFO, rule out structural heart disease.</li>
<li><strong>CXR:</strong> May show underlying lung disease or clear lungs (idiopathic PPHN); may have decreased pulmonary vascularity.</li>
<li><strong>Blood gas:</strong> Severe hypoxemia (PaO₂ often &lt;50 mmHg despite 100% FiO₂)</li>
<li><strong>Oxygenation Index (OI):</strong> OI = (MAP × FiO₂ × 100) / PaO₂. OI >25 = severe; OI >40 = consider ECMO.</li>
</ol>`,
t2:`<p><strong>Stepwise Treatment:</strong></p>
<ol class="sl">
<li><strong>Optimize ventilation:</strong> Gentle ventilation targeting SpO₂ 90–97%. Correct acidosis. Maintain normal PaCO₂ (35–45 mmHg; mild alkalosis may help acutely but avoid sustained hyperventilation).</li>
<li><strong>Sedation:</strong> Minimize stimulation and agitation (worsen PVR). Fentanyl or morphine infusion.</li>
<li><strong>Inotropes:</strong> Maintain systemic BP > PA pressure. Dopamine, milrinone (PDE3 inhibitor — reduces PVR AND improves cardiac output), epinephrine.</li>
<li><strong>Inhaled Nitric Oxide (iNO):</strong> Start at 20 ppm if OI >15–25. Selective pulmonary vasodilator. ~60% response rate.</li>
<li><strong>Surfactant:</strong> If underlying parenchymal disease (MAS, pneumonia, RDS).</li>
<li><strong>High-Frequency Oscillatory Ventilation (HFOV):</strong> If conventional ventilation failing (optimizes lung recruitment + reduces barotrauma).</li>
<li><strong>ECMO:</strong> If OI >40 sustained, or OI >60 on any single measurement, despite maximal medical therapy. VA-ECMO preferred. Survival ~75–90% for respiratory ECMO.</li>
</ol>`,
t3:`<p><strong>iNO Protocol:</strong></p>
<table class="rt"><thead><tr><th>Parameter</th><th>Protocol</th></tr></thead><tbody>
<tr><td>Starting dose</td><td>20 ppm</td></tr>
<tr><td>Assess response</td><td>Improvement in PaO₂ or SpO₂ within 30–60 min</td></tr>
<tr><td>Non-responder</td><td>No significant improvement at 20 ppm after 30–60 min → unlikely to respond to higher doses</td></tr>
<tr><td>Weaning</td><td>Once FiO₂ &lt;0.60 and stable: wean iNO to 10 → 5 → 2 → 1 ppm → off. DO NOT abruptly discontinue (causes rebound PH).</td></tr>
<tr><td>Monitoring</td><td>Methemoglobin levels q12–24h (keep &lt;5%); NO₂ levels</td></tr>
</tbody></table>
<div class="bx br">🚨 <strong>NEVER abruptly stop iNO.</strong> Rebound pulmonary hypertension can be life-threatening. Always wean gradually over hours to days.</div>`
},children:[
{name:"iNO Therapy",icon:"🌬️",type:"action",sub:"20 ppm · 60% response rate",edge:"OI >15–25",
info:{tabs:["Protocol","Weaning"],
t0:`<ul><li>Start at 20 ppm if OI >15–25 or persistent hypoxemia despite optimal ventilation</li>
<li>Assess response within 30–60 minutes (↑ PaO₂ by ≥20 mmHg)</li>
<li>No benefit from doses >20 ppm (increases methemoglobin and NO₂ toxicity)</li>
<li>Non-responders: consider sildenafil, milrinone, HFOV, ECMO</li></ul>`,
t1:`<ol class="sl">
<li>Once FiO₂ weaned to &lt;0.60 and hemodynamically stable</li>
<li>Wean iNO: 20 → 10 → 5 → 2 → 1 ppm (each step over hours)</li>
<li>At 1 ppm, trial off with careful monitoring</li>
<li>If desaturation on wean: increase back to last effective dose and retry later</li>
<li>Rebound PPHN may occur — have iNO ready to restart</li>
</ol>`
}},
{name:"ECMO\nReferral",icon:"🏥",type:"emergency",sub:"OI >40 sustained · VA-ECMO · Survival 75–90%",edge:"OI >40\ndespite max Rx",
info:{tabs:["Criteria","Contraindications"],
t0:`<p><strong>ECMO Indications in PPHN:</strong></p>
<ul><li>OI >40 sustained (3–5 measurements) despite maximal therapy</li>
<li>OI >60 on any single measurement</li>
<li>Acute decompensation with cardiovascular collapse</li>
<li>PaO₂ &lt;40 mmHg despite 100% FiO₂ and iNO at 20 ppm</li>
<li>GA ≥34 weeks and weight ≥2 kg (relative requirements)</li>
<li>Survival: 75–90% for respiratory ECMO</li></ul>`,
t1:`<p><strong>Relative contraindications:</strong></p>
<ul><li>GA &lt;34 weeks or weight &lt;2 kg (high IVH risk from anticoagulation)</li>
<li>Severe IVH (Grade III–IV)</li>
<li>Major congenital anomalies incompatible with meaningful survival</li>
<li>Irreversible lung disease (severe pulmonary hypoplasia with inadequate lung tissue)</li>
<li>Mechanical ventilation >14 days (lower survival; increased lung injury)</li></ul>`
}}
]},
// ═══ PNEUMOTHORAX ═══
{name:"Pneumothorax",icon:"💨",type:"emergency",sub:"Emergent needle decompression if tension",edge:"Sudden\ndeterioration",
info:{tabs:["Diagnosis","Needle Decompression","Chest Tube"],
t0:`<p><strong>Neonatal pneumothorax:</strong> 1–2% of all neonates (many asymptomatic). Higher in preterm on MV (4–15%) and MAS (10–20%).</p>
<ul><li><strong>Tension pneumothorax:</strong> Mediastinal shift, cardiovascular compromise, EMERGENT needle decompression</li>
<li><strong>Transillumination:</strong> Fiberoptic light on chest wall — affected side glows brighter. Quick bedside test.</li>
<li><strong>CXR:</strong> Hyperlucent hemithorax, visible visceral pleural line, mediastinal shift (tension), collapsed lung</li></ul>`,
t1:`<p><strong>Needle Decompression (for tension pneumothorax — do NOT wait for CXR):</strong></p>
<ol class="sl">
<li>Identify affected side (decreased breath sounds, shift of heart sounds, transillumination positive)</li>
<li>18–22 gauge angiocatheter attached to 20 mL syringe via 3-way stopcock</li>
<li>Insert at 2nd intercostal space, midclavicular line (or 4th ICS, anterior axillary line)</li>
<li>Direct needle over the TOP of the rib (avoid neurovascular bundle on inferior rib margin)</li>
<li>Aspirate air → rush of air confirms pneumothorax → stabilization of vitals</li>
<li>Leave catheter in place as temporary drain until chest tube placed</li>
</ol>`,
t2:`<p><strong>Chest Tube Placement:</strong></p>
<ul><li>Indicated for: symptomatic pneumothorax, tension pneumothorax (after needle decompression), ongoing air leak</li>
<li>Site: 4th–5th intercostal space, anterior axillary line</li>
<li>Size: 8–10 Fr for term; 8 Fr for preterm</li>
<li>Connect to underwater seal with -10 to -20 cmH₂O suction</li>
<li>Confirm position on CXR</li>
<li>Remove when no air leak for 24–48 hours and lung re-expanded</li></ul>
<div class="bx br">🚨 <strong>Tension pneumothorax is a clinical diagnosis.</strong> If acute deterioration + unilateral decreased breath sounds + hemodynamic compromise → NEEDLE DECOMPRESSION IMMEDIATELY. Do not wait for CXR.</div>`
}},
// ═══ APNEA ═══
{name:"Apnea of\nPrematurity",icon:"⏸️",type:"decision",sub:"Caffeine first-line · Rule out secondary causes",edge:"Apnea/Brady\nin preterm",
info:{tabs:["Definition","Differential","Treatment"],
t0:`<p><strong>Apnea of prematurity (AOP):</strong> Cessation of breathing for ≥20 seconds, OR shorter pause accompanied by bradycardia (&lt;100 bpm) and/or oxygen desaturation (SpO₂ &lt;80%). Three types: central (no effort), obstructive (effort against obstruction), mixed (most common, ~50%).</p>
<ul><li>Affects virtually all infants &lt;28 weeks; ~50% of infants 30–34 weeks</li>
<li>AOP is a diagnosis of EXCLUSION — always rule out secondary causes first</li></ul>`,
t1:`<p><strong>Always rule out secondary causes before attributing to AOP:</strong></p>
<table class="dt"><thead><tr><th>Category</th><th>Causes</th></tr></thead><tbody>
<tr><td><strong>Infection</strong></td><td>Sepsis, NEC, meningitis — apnea may be first sign of LOS</td></tr>
<tr><td><strong>Neurologic</strong></td><td>IVH, seizures, hydrocephalus</td></tr>
<tr><td><strong>Metabolic</strong></td><td>Hypoglycemia, hypocalcemia, hyponatremia, IEM</td></tr>
<tr><td><strong>Thermal</strong></td><td>Hypothermia or hyperthermia</td></tr>
<tr><td><strong>Respiratory</strong></td><td>Airway obstruction, RDS worsening, pneumothorax</td></tr>
<tr><td><strong>GI</strong></td><td>GER (controversial association), NEC</td></tr>
<tr><td><strong>Hematologic</strong></td><td>Anemia (Hb &lt;7–8 g/dL)</td></tr>
<tr><td><strong>Drugs</strong></td><td>Maternal opioids, magnesium, sedatives</td></tr>
</tbody></table>
<div class="bx bo">⚠️ <strong>New onset or worsening apnea in a previously stable preterm infant = SEPSIS until proven otherwise.</strong> Full sepsis evaluation before attributing to AOP.</div>`,
t2:`<p><strong>Treatment:</strong></p>
<ul><li><strong>Caffeine citrate</strong> — first-line. Loading: 20 mg/kg PO/IV. Maintenance: 5–10 mg/kg/day. Most important pharmacologic intervention.</li>
<li><strong>CPAP (5–7 cmH₂O)</strong> — prevents obstructive component by splinting airway and maintaining FRC</li>
<li><strong>HFNC (1–4 L/min)</strong> — alternative to CPAP for mild cases</li>
<li><strong>NIPPV</strong> — may be more effective than CPAP alone for refractory apnea</li>
<li><strong>Doxapram</strong> — second-line respiratory stimulant; limited use in US</li>
<li><strong>Transfusion</strong> — if anemia contributing (Hb &lt;8 g/dL with symptomatic apnea)</li>
<li><strong>Positioning</strong> — prone positioning reduces apnea frequency in NICU (but NOT for home sleep — always supine for SIDS prevention)</li></ul>`
}},
// ═══ CDH ═══
{name:"Congenital\nDiaphragmatic\nHernia (CDH)",icon:"🫁",type:"emergency",sub:"Gentle ventilation · NO bag-mask · Surgical",edge:"Scaphoid abd\n+ bowel\nsounds in chest",
info:{tabs:["Presentation","DR Management","Ventilation Strategy"],
t0:`<p><strong>CDH:</strong> Defect in the diaphragm (left-sided ~85%) allowing abdominal organs to herniate into the chest → pulmonary hypoplasia + pulmonary hypertension. Incidence: ~1/2,500 births.</p>
<ul><li><strong>Diagnosis:</strong> Often prenatal (US). Postnatal: scaphoid abdomen, barrel chest, absent breath sounds on affected side, bowel sounds in chest, displaced heart sounds, respiratory distress</li>
<li><strong>CXR:</strong> Bowel loops in thorax, mediastinal shift away from hernia, nasogastric tube in chest</li>
<li>Severity depends on degree of pulmonary hypoplasia and PPHN</li></ul>`,
t1:`<p><strong>Delivery Room Management:</strong></p>
<ol class="sl">
<li><strong>IMMEDIATE intubation</strong> — do NOT bag-mask ventilate (inflates stomach/bowel in chest, compresses lungs further)</li>
<li><strong>Large-bore OG tube to continuous suction</strong> — decompress stomach and bowel</li>
<li><strong>Gentle ventilation:</strong> low PIP (&lt;25 cmH₂O), avoid high PEEP (>5 cmH₂O)</li>
<li><strong>Pre-ductal SpO₂ monitoring</strong> (right hand) — accept SpO₂ 80–95% initially</li>
<li><strong>Umbilical lines</strong> — UVC and UAC for access and monitoring</li>
<li><strong>NO chest compressions on affected side</strong></li>
<li><strong>Avoid high-frequency ventilation initially</strong> (can overdistend contralateral lung)</li>
</ol>
<div class="bx br">🚨 <strong>Do NOT bag-mask ventilate CDH.</strong> This inflates bowel in the chest and worsens lung compression. Intubate immediately.</div>`,
t2:`<p><strong>Gentle Ventilation Strategy (CDH EURO Consortium):</strong></p>
<ul><li>PIP &lt;25 cmH₂O (permissive hypercapnia: accept PaCO₂ up to 65 mmHg if pH >7.20)</li>
<li>PEEP 3–5 cmH₂O</li>
<li>Pre-ductal SpO₂ target: 80–95% initially, >85% after stabilization</li>
<li>iNO for PPHN component (variable response — pulmonary hypoplasia limits iNO effectiveness)</li>
<li>ECMO if failing maximal medical therapy (survival ~50% for CDH-ECMO, lower than non-CDH respiratory ECMO)</li>
<li><strong>Surgical repair:</strong> Delayed until physiologic stabilization (typically 24–72h or when PPHN controlled). Emergent surgery is NOT indicated.</li></ul>`
}}
]};

// ═══ D3 ENGINE (identical to standard) ═══
const CM={assessment:{f:"#0f1d3a",s:"#60a5fa",t:"#60a5fa",b:"Assessment"},decision:{f:"#2a2006",s:"#fbbf24",t:"#fbbf24",b:"Decision Point"},emergency:{f:"#2a1215",s:"#f87171",t:"#f87171",b:"Emergency"},urgent:{f:"#2a1a0a",s:"#fb923c",t:"#fb923c",b:"Urgent"},action:{f:"#0a2a1a",s:"#4ade80",t:"#4ade80",b:"Action"},diagnosis:{f:"#1a0f2e",s:"#c084fc",t:"#c084fc",b:"Diagnosis"}};
const svg=d3.select("#tc"),W=innerWidth,H=innerHeight;svg.attr("width",W).attr("height",H);const g=svg.append("g");const zm=d3.zoom().scaleExtent([0.2,3]).on("zoom",e=>g.attr("transform",e.transform));svg.call(zm);
const nW=148,nH=62;const root=d3.hierarchy(T,d=>d.children);root.x0=H/2;root.y0=0;
root.descendants().forEach(d=>{if(d.depth>1&&d.children){d._children=d.children;d.children=null;}});const tl=d3.tree().nodeSize([nH+32,nW+85]);
function upd(src){const dur=420;tl(root);const nds=root.descendants(),lks=root.links();nds.forEach(d=>{d.y=d.depth*230;});
const lk=g.selectAll(".lk").data(lks,d=>d.target.data.name);const le=lk.enter().append("path").attr("class","lk").attr("d",()=>{const o={x:src.x0,y:src.y0};return dg(o,o);});lk.merge(le).transition().duration(dur).attr("d",d=>dg(d.source,d.target));lk.exit().transition().duration(dur).attr("d",()=>{const o={x:src.x,y:src.y};return dg(o,o);}).remove();
g.selectAll(".ll").remove();lks.forEach(d=>{if(d.target.data.edge){const ls=d.target.data.edge.split("\n"),mx=(d.source.x+d.target.x)/2,my=(d.source.y+d.target.y)/2;ls.forEach((l,i)=>{g.append("text").attr("class","ll").attr("x",my+12).attr("y",mx-4+i*11).text(l);});}});
const nd=g.selectAll(".ng").data(nds,d=>d.data.name);const ne=nd.enter().append("g").attr("class","ng").attr("transform",`translate(${src.y0},${src.x0})`).on("click",(e,d)=>{if(d.children){d._children=d.children;d.children=null;}else if(d._children){d.children=d._children;d._children=null;}upd(d);});
ne.append("rect").attr("class","nr").attr("x",-nW/2).attr("y",-nH/2).attr("width",nW).attr("height",nH).attr("fill",d=>CM[d.data.type]?.f||"#1e293b").attr("stroke",d=>CM[d.data.type]?.s||"#475569");ne.append("text").attr("class","ni").attr("y",-12).text(d=>d.data.icon);
ne.each(function(d){const ls=d.data.name.split("\n"),el=d3.select(this);ls.forEach((l,i)=>{el.append("text").attr("class","nl").attr("y",4+i*13).text(l);});if(d.data.sub){el.append("text").attr("class","ns").attr("y",4+ls.length*13+5).text(d.data.sub.substring(0,32));}});
ne.append("circle").attr("class","ib").attr("cx",nW/2-12).attr("cy",-nH/2+12).attr("r",10).attr("fill",d=>CM[d.data.type]?.s||"#60a5fa").attr("fill-opacity",.2).attr("stroke",d=>CM[d.data.type]?.s||"#60a5fa").attr("stroke-width",1.5).on("click",(e,d)=>{e.stopPropagation();showP(d.data);});
ne.append("text").attr("x",nW/2-12).attr("y",-nH/2+16).attr("text-anchor","middle").attr("font-size","12px").attr("fill","#e2e8f0").attr("pointer-events","none").attr("font-weight","700").text("i");
ne.append("text").attr("class","ei").attr("x",0).attr("y",nH/2+15).attr("text-anchor","middle").attr("font-size","10px").attr("fill","#475569");
const nu=nd.merge(ne);nu.transition().duration(dur).attr("transform",d=>`translate(${d.y},${d.x})`);nu.select(".ei").text(d=>d._children?`▸ ${d._children.length} more`:"");
nd.exit().transition().duration(dur).attr("transform",`translate(${src.y},${src.x})`).remove();nds.forEach(d=>{d.x0=d.x;d.y0=d.y;});}
function dg(s,d){return`M${s.y} ${s.x}C${(s.y+d.y)/2} ${s.x},${(s.y+d.y)/2} ${d.x},${d.y} ${d.x}`;}
upd(root);const iT=d3.zoomIdentity.translate(90,H/2-20).scale(0.82);svg.call(zm.transform,iT);
function showP(data){const ov=document.getElementById("po"),c=CM[data.type]||CM.assessment;document.getElementById("picon").textContent=data.icon;document.getElementById("picon").style.background=c.f;document.getElementById("picon").style.border=`1.5px solid ${c.s}`;document.getElementById("ptitle").textContent=data.name.replace(/\n/g," ");const te=document.getElementById("ptype");te.textContent=c.b;te.style.background=c.f;te.style.color=c.t;te.style.border=`1px solid ${c.s}`;
let h="";if(data.info.tabs){h+=`<div class="tabs">`;data.info.tabs.forEach((t,i)=>{h+=`<button class="tb${i===0?' active':''}" onclick="swT(${i})">${t}</button>`;});h+=`</div>`;data.info.tabs.forEach((t,i)=>{h+=`<div class="tc${i===0?' active':''}" data-t="${i}">${data.info['t'+i]||''}</div>`;});}
if(data.sub){h+=`<div class="bx bb" style="margin-top:16px">ℹ️ <strong>Summary:</strong> ${data.sub}</div>`;}document.getElementById("pbody").innerHTML=h;ov.classList.add("active");document.getElementById("pp").scrollTop=0;}
function swT(i){document.querySelectorAll('.tb').forEach((b,j)=>b.classList.toggle('active',j===i));document.querySelectorAll('.tc').forEach((c,j)=>c.classList.toggle('active',j===i));}
function closeP(e){if(!e||e.target===document.getElementById("po"))document.getElementById("po").classList.remove("active");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeP();});
function resetZ(){svg.transition().duration(500).call(zm.transform,iT);}function expAll(){root.descendants().forEach(d=>{if(d._children){d.children=d._children;d._children=null;}});upd(root);}function colAll(){root.descendants().forEach(d=>{if(d.depth>0&&d.children){d._children=d.children;d.children=null;}});upd(root);}
