---
extends: default

rules:
  line-length:
    max: 160
    level: error
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  document-start:
    present: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
