# policies/secret-scanning/custom-patterns.yaml
#
# Custom secret-scanning patterns for the ruralpeds GitHub organization.
#
# These patterns supplement GitHub's built-in secret-scanning detectors with
# credential types specific to the ruralpeds toolchain.
#
# How to apply:
#   GitHub's Custom Patterns API requires GitHub Advanced Security.
#   Apply each pattern via:
#     POST /orgs/ruralpeds/secret-scanning/custom-patterns
#   or via Organization Settings → Code security and analysis →
#   Secret scanning → Custom patterns → "New pattern".
#
# API payload example (Tailscale):
#   {
#     "name": "Tailscale auth key",
#     "secret_type": "tailscale_auth_key",
#     "regex": "tskey-auth-[A-Za-z0-9]{30,}",
#     "push_protection_enabled": true
#   }
#
# Regulatory note:
#   Preventing committed credentials supports:
#     - HIPAA §164.312(a)(2)(i) — unique user identification
#     - NIST SSDF PO.5.1 — implement supporting toolchains
#     - OpenSSF Scorecard: Token-Permissions
#
# Last updated: 2026-04-24
# Owner: security@ruralpeds (on-call: see docs/security/secret-scanning.md)

patterns:
  - name: "Tailscale auth key"
    # Matches Tailscale authentication keys used for device enrollment.
    # These keys grant access to the WireGuard overlay network and, if leaked,
    # allow unauthorized devices to join the VPN.
    regex: 'tskey-auth-[A-Za-z0-9]{30,}'
    push_protection: true

  - name: "Anthropic API key"
    # Matches Anthropic Claude API keys (both standard and admin variants).
    # A leaked key allows unbounded LLM usage billed to the org.
    regex: 'sk-ant-(api03|admin01)-[A-Za-z0-9_-]{40,}'
    push_protection: true

  - name: "WordPress application password"
    # Matches the 24-character space-separated format generated by WordPress
    # for application passwords (introduced in WP 5.6).
    # Push protection is intentionally disabled because the pattern overlaps
    # with other base-32 encoded data — too many false positives for a hard
    # block. Alerts are still raised for human review.
    regex: '[A-Za-z0-9]{4}(?:\s[A-Za-z0-9]{4}){5}'
    push_protection: false   # too many false positives for hard block
