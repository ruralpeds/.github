[workspace]
resolver = "2"
members = [
    "crates/ped-core",
    "crates/ped-airway",
    "crates/ped-resus",
    "crates/ped-sepsis",
    "crates/ped-neonatal",
    "crates/ped-cardiac",
    "crates/ped-trauma",
    "crates/ped-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Timothy Hartzog"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# ============================================================================
# rust-sci-core — pulled from GitHub at build time
# All clinical computation, unit conversions, statistical functions, and
# growth chart calculations live here. The ped-* crates are thin wrappers
# that add mode-specific (neonatal/pediatric) logic and WASM bindings.
# ============================================================================
sci-units    = { git = "https://github.com/timothyhartzog/rust-sci-core.git", branch = "main" }
sci-stats    = { git = "https://github.com/timothyhartzog/rust-sci-core.git", branch = "main" }
sci-clinical = { git = "https://github.com/timothyhartzog/rust-sci-core.git", branch = "main" }
sci-growth   = { git = "https://github.com/timothyhartzog/rust-sci-core.git", branch = "main" }
sci-wasm     = { git = "https://github.com/timothyhartzog/rust-sci-core.git", branch = "main" }
