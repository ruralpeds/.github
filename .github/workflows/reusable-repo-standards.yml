name: "Reusable Repo Standards"
# Reusable repository standards and governance validation workflow.
# Derived from HEALTHCARE_ENTERPRISE_REPO_BLUEPRINT.md controls.
#
# Callers: uses: ruralpeds/.github/.github/workflows/reusable-repo-standards.yml@main
#
# Covers:
#   - Required governance files (AGENTS.md, SECURITY.md, CONTRIBUTING.md, README.md)
#   - Required docs/ files including docs/audit-events.md
#   - Audit events catalog validation (required event names present)
#   - Basic workflow pinning check (advisory)

on:
  workflow_call:
    inputs:
      standards-script-ref:
        description: "Git ref (branch/tag/SHA) to fetch scripts from ruralpeds/.github"
        type: string
        default: "main"
      run-audit-events-check:
        description: "Run audit events catalog validation"
        type: boolean
        default: true
      run-pinning-advisory:
        description: "Run advisory check for unpinned third-party actions"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── 1. Governance and required file structure ─────────────────────────────────
  governance:
    name: Governance file check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch standards scripts
        run: |
          mkdir -p _standards_scripts
          curl -sSfL \
            "https://raw.githubusercontent.com/ruralpeds/.github/${{ inputs.standards-script-ref }}/scripts/check_repo_standards.sh" \
            -o _standards_scripts/check_repo_standards.sh
          chmod +x _standards_scripts/check_repo_standards.sh
      - name: Check repository standards
        run: bash _standards_scripts/check_repo_standards.sh .

  # ── 2. Audit events catalog validation ────────────────────────────────────────
  audit-events:
    name: Audit events catalog
    if: ${{ inputs.run-audit-events-check }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch audit events check script
        run: |
          mkdir -p _standards_scripts
          curl -sSfL \
            "https://raw.githubusercontent.com/ruralpeds/.github/${{ inputs.standards-script-ref }}/scripts/check_audit_events_md.sh" \
            -o _standards_scripts/check_audit_events_md.sh
          chmod +x _standards_scripts/check_audit_events_md.sh
      - name: Validate docs/audit-events.md catalog
        run: bash _standards_scripts/check_audit_events_md.sh .

  # ── 3. Advisory: unpinned actions ────────────────────────────────────────────
  # This job warns (does not fail) when third-party actions are referenced by
  # a floating tag rather than a pinned commit SHA. Pinning prevents supply-
  # chain attacks. Advisory only so that teams can adopt incrementally.
  pinning-advisory:
    name: Action pinning advisory
    if: ${{ inputs.run-pinning-advisory }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check for unpinned third-party actions
        run: |
          FOUND=0
          while IFS= read -r -d '' file; do
            # Match "uses: <owner>/<repo>@<ref>" where ref is NOT a 40-char SHA
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\s+uses:\s+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[^#[:space:]]{1,39}$'; then
                # Exclude actions/* (trusted) and lines already pinned with comment
                REF=$(echo "$line" | grep -oE '@[^#[:space:]]+' | head -1 | tr -d '@')
                # A pinned SHA is exactly 40 hex characters
                if ! echo "$REF" | grep -qE '^[0-9a-f]{40}$'; then
                  echo "::warning file=$file::Unpinned action reference: $line — consider pinning to a commit SHA."
                  FOUND=$((FOUND + 1))
                fi
              fi
            done < "$file"
          done < <(find .github/workflows -name '*.yml' -o -name '*.yaml' -print0 2>/dev/null)

          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "Advisory: $FOUND unpinned action reference(s) found."
            echo "Pinning actions to commit SHAs protects against supply-chain attacks."
            echo "See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions"
          else
            echo "All detected action references appear to be pinned or are from trusted first-party actions."
          fi
          # Advisory only — exit 0 to avoid blocking merges
          exit 0
