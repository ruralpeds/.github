name: "Reusable Release Orchestrator"
# One-button conventional-commits release with full compliance evidence.
# Wraps release-please to generate the release PR, then on merge of the
# release PR builds + SBOMs + signs + creates the validation package.
#
# Regulatory drivers:
#   - IEC 62304 §5.8 — Software release
#   - 21 CFR Part 11 §11.10(a) — Validation of systems
#   - Semantic Versioning 2.0.0 (for deterministic change communication)
#
# Conventional Commits → automatic changelog, version bump, and release tag.

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release type (simple, python, rust, node, go, julia, etc.)"
        type: string
        default: "simple"
      package-name:
        description: "Package name (default: repo name)"
        type: string
        default: ""
      default-branch:
        description: "Default branch"
        type: string
        default: "main"
      include-component-in-tag:
        description: "Include component name in tag (monorepo mode)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── 1. release-please: propose a release PR ────────────────────────────────
  release-please:
    name: Generate release PR
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@e0b9d1885d92e9a93d5ce8656de60e3b806e542c # v4.1.3
        id: rp
        with:
          release-type: ${{ inputs.release-type }}
          package-name: ${{ inputs.package-name || github.event.repository.name }}
          default-branch: ${{ inputs.default-branch }}
          include-component-in-tag: ${{ inputs.include-component-in-tag }}

  # ── 2. When a release IS created, build the compliance evidence bundle ─────
  build-evidence:
    name: Build compliance evidence
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build release artifact(s)
        run: |
          set -euo pipefail
          # Placeholder build command. Override by providing a release-build.sh
          # script in the caller repo; otherwise this uses a generic 'make dist'.
          if [ -x ./scripts/release-build.sh ]; then
            ./scripts/release-build.sh
          elif [ -f Makefile ] && grep -q '^dist:' Makefile; then
            make dist
          elif [ -f pyproject.toml ]; then
            python3 -m pip install --user build
            python3 -m build
          elif [ -f Cargo.toml ]; then
            cargo build --release
            mkdir -p dist
            find target/release -maxdepth 1 -type f -executable -exec cp {} dist/ \;
          elif [ -f package.json ]; then
            npm ci && npm run build --if-present
            # Assume dist/ is produced
          else
            echo "::warning::No known build system — using repo tarball as the release artifact."
            mkdir -p dist
            git archive -o "dist/${{ github.event.repository.name }}-${{ needs.release-please.outputs.version }}.tar.gz" HEAD
          fi
          ls -la dist/ || true

      - name: Compute artifact hashes (for SLSA subjects)
        id: hash
        run: |
          set -euo pipefail
          cd dist
          # SLSA expects base64 of the digest file
          sha256sum * | tee ../checksums.txt
          HASHES=$(cat ../checksums.txt | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts for downstream jobs
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: release-artifacts
          path: dist/
          retention-days: 30

  # ── 3. SBOM ────────────────────────────────────────────────────────────────
  sbom:
    needs: [release-please, build-evidence]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: timothyhartzog/.github/.github/workflows/reusable-sbom.yml@main
    with:
      sbom-format: cyclonedx
      commit-sbom: true
      attach-to-release: true
    permissions:
      contents: write

  # ── 4. SLSA L3 provenance ──────────────────────────────────────────────────
  provenance:
    needs: [release-please, build-evidence]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: timothyhartzog/.github/.github/workflows/reusable-slsa.yml@main
    with:
      artifacts-hash-base64: ${{ needs.build-evidence.outputs.hashes }}
      upload-assets: true

  # ── 5. cosign keyless signing ──────────────────────────────────────────────
  sign:
    needs: [release-please, build-evidence]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: [self-hosted, mac-studio, arm64]
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-artifacts
          path: dist/
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: v2.4.1
      - name: Sign + attach
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          mkdir -p signatures
          for f in dist/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            cosign sign-blob --yes --bundle "signatures/${base}.sig.bundle" "$f"
          done
      - name: Attach signatures to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: signatures/*
          fail_on_unmatched_files: false

  # ── 6. Validation package export to the archive repo ──────────────────────
  export:
    needs: [release-please, sbom, provenance, sign]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: timothyhartzog/.github/.github/workflows/reusable-validation-export.yml@main
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      archive-dispatch-token: ${{ secrets.ARCHIVE_DISPATCH_TOKEN }}

  # ── 7. Audit ledger entry ─────────────────────────────────────────────────
  audit:
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' }}
    needs: [release-please, sbom, provenance, sign, export]
    uses: timothyhartzog/.github/.github/workflows/audit-log.yml@main
    with:
      include-deps: true
    permissions:
      contents: write
