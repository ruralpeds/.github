name: Reusable — Gap Lifecycle

# ─────────────────────────────────────────────────────────────────────────────
# Org-wide reusable workflow — Rural Peds Gap Analysis Standard v1.0
# Spec: https://github.com/ruralpeds/gap-analysis-standard/blob/main/SPEC.md
#
# Runs on the org self-hosted Mac Studio runner.
#
# Call from any ruralpeds consumer repo:
#
#   name: Gap Lifecycle
#   on:
#     pull_request:
#       types: [closed]
#   jobs:
#     lifecycle:
#       uses: ruralpeds/.github/.github/workflows/reusable-gap-lifecycle.yml@main
#       with:
#         gaps_file: 'GAPS.md'
#       secrets: inherit
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      gaps_file:
        description: 'Path to GAPS.md relative to repo root'
        type: string
        required: false
        default: 'GAPS.md'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: gap-lifecycle-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false   # never cancel mid-write to GAPS.md

jobs:
  update-gaps:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, apple-silicon]
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ruralpeds/.github for scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ruralpeds/.github
          path: .gap-scripts
          persist-credentials: false

      - name: Run update_gaps.py
        id: run
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_TIMESTAMP: ${{ github.event.pull_request.merged_at }}
          GAPS_FILE: ${{ inputs.gaps_file }}
        run: |
          MERGED_DATE=$(echo "$MERGED_TIMESTAMP" | cut -c1-10)
          python3 .gap-scripts/scripts/update_gaps.py \
            --gaps-file "$GAPS_FILE" \
            --pr-body "$PR_BODY" \
            --pr-number "$PR_NUMBER" \
            --merged-date "$MERGED_DATE"

      - name: Commit updated GAPS.md
        env:
          GAPS_FILE: ${{ inputs.gaps_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet "$GAPS_FILE"; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$GAPS_FILE"
            git commit -m "chore: auto-close gap(s) via PR #${PR_NUMBER} [skip ci]"
            git push
          fi

      - name: Job summary
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED_TIMESTAMP: ${{ github.event.pull_request.merged_at }}
        run: |
          {
            echo "## Gap Lifecycle"
            echo "**Runner:** $(hostname) \`[self-hosted, mac-studio]\`"
            echo "**PR:** #${PR_NUMBER} — ${PR_TITLE}"
            echo "**Merged:** ${MERGED_TIMESTAMP}"
          } >> "$GITHUB_STEP_SUMMARY"
