name: "Scan & Bootstrap All Repos"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no PRs)"
        type: boolean
        default: false
      target-repo:
        description: "Single repo (blank = all)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  GH_OWNER: ruralpeds

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.discover.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover repos
        id: discover
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        run: |
          if [ -n "${{ inputs.target-repo }}" ]; then
            echo 'repos=["${{ inputs.target-repo }}"]' >> $GITHUB_OUTPUT
          else
            REPOS=$(gh repo list "$GH_OWNER" --json name --limit 100 -q '.[].name' | jq -R -s 'split("
") | map(select(length > 0))' | jq -c '.')
            echo "repos=$REPOS" >> $GITHUB_OUTPUT
          fi

  bootstrap:
    needs: scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repo: ${{ fromJson(needs.scan.outputs.repos) }}
    steps:
      - name: Checkout .github (templates)
        uses: actions/checkout@v4
        with:
          path: templates
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GH_OWNER }}/${{ matrix.repo }}
          token: ${{ secrets.REPO_SETUP_TOKEN }}
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap
        id: bootstrap
        run: python templates/scripts/bootstrap_repo.py target templates "${{ inputs.dry-run || 'false' }}"
      - name: Create PR
        if: steps.bootstrap.outputs.changes == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        working-directory: target
        run: |
          BRANCH="auto/bootstrap-ci-audit"
          if gh pr list --repo "$GH_OWNER/${{ matrix.repo }}" --head "$BRANCH" --json number -q '.[0].number' 2>/dev/null | grep -q .; then
            echo "PR already exists, skipping"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add CI, testing, and audit log (auto-bootstrapped)"
          git push -u origin "$BRANCH"
          gh pr create \
            --repo "$GH_OWNER/${{ matrix.repo }}" \
            --title "Add CI, testing, and audit logging" \
            --body "Auto-generated by repo scanner. Review and merge to activate."
