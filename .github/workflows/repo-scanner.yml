name: "Scan & Bootstrap All Repos"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_OWNER: ruralpeds

jobs:
  scan:
    runs-on: [self-hosted, mac-studio]
    outputs:
      repos: ${{ steps.discover.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Discover repos
        id: discover
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        run: |
          REPOS=$(gh repo list "$GH_OWNER" --json name --limit 300 --jq '[.[].name]')
          echo "repos=$REPOS" >> $GITHUB_OUTPUT
          echo "Found $(echo "$REPOS" | jq 'length') repos"
