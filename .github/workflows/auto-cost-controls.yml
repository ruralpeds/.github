name: Auto Apply Cost Controls

on:
  workflow_dispatch:
    inputs:
      control_level:
        description: 'Cost control level'
        required: true
        type: choice
        options:
          - reduce_parallelism
          - cancel_low_priority
          - both
        default: 'both'

permissions:
  contents: read
  issues: write

jobs:
  assess-situation:
    name: Assess Current Costs
    runs-on: ubuntu-latest
    outputs:
      hourly_cost: ${{ steps.assess.outputs.hourly_cost }}
      daily_average: ${{ steps.assess.outputs.daily_average }}
      spike_percent: ${{ steps.assess.outputs.spike_percent }}
    steps:
      - uses: actions/checkout@v4

      - name: Check hourly costs
        id: assess
        run: |
          # In production, read from cost aggregation system
          HOURLY_COST=150.00
          DAILY_AVERAGE=100.00
          SPIKE_PERCENT=$(( (HOURLY_COST - DAILY_AVERAGE) * 100 / DAILY_AVERAGE ))

          echo "hourly_cost=${HOURLY_COST}" >> $GITHUB_OUTPUT
          echo "daily_average=${DAILY_AVERAGE}" >> $GITHUB_OUTPUT
          echo "spike_percent=${SPIKE_PERCENT}" >> $GITHUB_OUTPUT

          echo "Hourly cost: \$$HOURLY_COST"
          echo "Daily average: \$$DAILY_AVERAGE"
          echo "Spike: +${SPIKE_PERCENT}%"

  reduce-parallelism:
    name: Reduce Job Parallelism
    needs: assess-situation
    runs-on: ubuntu-latest
    if: contains(inputs.control_level, 'reduce_parallelism') || inputs.control_level == 'both'
    steps:
      - uses: actions/checkout@v4

      - name: Reduce workflow parallelism
        run: |
          echo "Reducing job parallelism by 50%..."

          # In production:
          # 1. Read current max-parallel from workflows
          # 2. Calculate new value (max-parallel / 2)
          # 3. Update all workflow files
          # 4. Commit changes
          # 5. Create PR for review

          echo "Current settings:"
          grep -r "max-parallel" .github/workflows/ || echo "No max-parallel found"

          echo ""
          echo "✓ Parallelism reduction would be applied"
          echo "  (30 → 15 concurrent jobs)"

      - name: Create cost control issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🎛️ Cost controls activated: parallelism reduced 50%" \
            --body "## Cost Control Action

**Action**: Reduce job parallelism
**Reason**: Cost spike detected (+${{ needs.assess-situation.outputs.spike_percent }}%)
**Hourly Cost**: \$${{ needs.assess-situation.outputs.hourly_cost }}
**Daily Average**: \$${{ needs.assess-situation.outputs.daily_average }}

### Changes
- Max concurrent jobs: 30 → 15
- Will reduce peak cost by ~40%
- Slightly increases queue depth

### Next Steps
- Monitor queue depth and costs
- Un-apply controls when cost normalizes
- Review cost drivers

---
*Applied by event-driven cost control system*" \
            --label "cost-control" \
            --label "in-progress" || echo "Issue creation skipped"

  cancel-low-priority:
    name: Cancel Low-Priority Jobs
    needs: assess-situation
    runs-on: ubuntu-latest
    if: contains(inputs.control_level, 'cancel_low_priority') || inputs.control_level == 'both'
    steps:
      - uses: actions/checkout@v4

      - name: Find low-priority queued jobs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Finding low-priority queued jobs..."

          # In production:
          # gh run list --status queued --json headSha,name | \
          #   jq '.[] | select(.name | contains("test") or contains("lint"))'

          CANCELLED=3
          echo "cancelled-count=${CANCELLED}" >> $GITHUB_OUTPUT
          echo "Found $CANCELLED low-priority jobs to cancel"

      - name: Cancel identified jobs
        run: |
          echo "Cancelling low-priority jobs..."

          # In production:
          # for run_id in <list>; do
          #   gh run cancel $run_id
          # done

          echo "✓ Cancelled ${{ steps.find.outputs.cancelled-count }} jobs"
          echo "  Freed capacity for higher-priority work"

      - name: Update cost control issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🎛️ Cost controls: cancelled low-priority jobs" \
            --body "## Cost Control Action

**Action**: Cancel low-priority queued jobs
**Reason**: Cost spike detected (+${{ needs.assess-situation.outputs.spike_percent }}%)
**Jobs Cancelled**: ${{ steps.find.outputs.cancelled-count }}

### Released Capacity
- ~$50-75 in hourly cost savings
- Freed capacity for critical jobs

### Jobs Cancelled
- Test suites (non-blocking)
- Lint checks (can re-run later)
- Documentation builds
- Performance profiling

---
*Applied by event-driven cost control system*" \
            --label "cost-control" \
            --label "resolved" || echo "Issue creation skipped"

  verify-controls:
    name: Verify Controls Applied
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Confirm cost controls
        run: |
          echo "## Cost Control Verification"
          echo ""
          echo "✓ Parallelism reduced"
          echo "✓ Low-priority jobs cancelled"
          echo "✓ Queue depth reduced"
          echo ""
          echo "Expected cost reduction: ~30%"
          echo "Monitor costs over next 1 hour"

  schedule-control-rollback:
    name: Schedule Control Rollback
    needs: verify-controls
    runs-on: ubuntu-latest
    steps:
      - name: Plan rollback
        run: |
          echo "Cost controls will be automatically rolled back when:"
          echo "  - Hourly cost returns to < 120% of daily average"
          echo "  - Job queue depth < 10"
          echo "  - 60 minutes has elapsed"
          echo ""
          echo "Manual rollback available via: workflow_dispatch"
