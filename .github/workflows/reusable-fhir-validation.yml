name: "FHIR Validation (US Core 6.1 Profiles)"

# Validate FHIR resources against US Core 6.1 profiles using HAPI FHIR validator.
#
# This workflow:
#   1. Downloads HAPI FHIR validator JAR
#   2. Loads US Core 6.1 IG + profiles
#   3. Validates each FHIR JSON resource
#   4. Reports violations: missing elements, invalid CodeSystems, invariant violations
#   5. Generates validation report (JSON + HTML)
#   6. Fails CI if validation errors exceed threshold
#
# Integration points:
#   - Follows reusable-synthea-fixtures.yml (uses generated FHIR bundles)
#   - Used by clinical test suites
#   - Reports to GitHub PR/commit
#
# Regulatory drivers:
#   - IEC 62304 §7.3 — Verification & data validation
#   - FDA: US Core profiles are standard for EHR integration
#   - HIPAA: profile conformance required for HL7/FHIR exchange

on:
  workflow_call:
    inputs:
      fixture_path:
        description: "Path to FHIR fixture directory (default: tests/fixtures/fhir/synthetic)"
        required: false
        type: string
        default: "tests/fixtures/fhir/synthetic"
      profile_version:
        description: "US Core version (6.1, 6.0, 5.0.1)"
        required: false
        type: string
        default: "6.1"
      fail_on_error:
        description: "Fail CI if validation errors > 0 (true/false)"
        required: false
        type: string
        default: "true"
      max_errors:
        description: "Maximum allowed validation errors before failing"
        required: false
        type: number
        default: 0

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate-fhir:
    name: Validate FHIR Resources
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 30
    outputs:
      validation_status: ${{ steps.validate.outputs.validation_status }}
      error_count: ${{ steps.validate.outputs.error_count }}
      warning_count: ${{ steps.validate.outputs.warning_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b  # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download HAPI FHIR validator
        run: |
          echo "=== Downloading HAPI FHIR Validator ==="
          mkdir -p /tmp/hapi-fhir
          cd /tmp/hapi-fhir
          
          # Download validator JAR
          wget -q https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.4.8/validator_cli.jar
          
          if [ -f validator_cli.jar ]; then
              echo "✅ Validator JAR downloaded ($(ls -lh validator_cli.jar | awk '{print $5}'))"
          else
              echo "❌ Failed to download validator"
              exit 1
          fi

      - name: Load US Core profiles
        run: |
          echo "=== Loading US Core ${{ inputs.profile_version }} Profiles ==="
          
          python3 <<'PYTHON_EOF'
          import subprocess
          import json
          
          # HAPI FHIR validator uses pre-built IG packages
          # US Core 6.1 package ID: hl7.fhir.us.core#6.1.0
          
          # Create validator configuration
          config = {
              "profiles": [
                  "http://hl7.org/fhir/us/core/StructureDefinition/us-core-patient",
                  "http://hl7.org/fhir/us/core/StructureDefinition/us-core-observation-lab",
                  "http://hl7.org/fhir/us/core/StructureDefinition/us-core-vital-signs",
                  "http://hl7.org/fhir/us/core/StructureDefinition/us-core-condition",
                  "http://hl7.org/fhir/us/core/StructureDefinition/us-core-medicationrequest"
              ],
              "ig_version": "${{ inputs.profile_version }}"
          }
          
          with open('/tmp/validator_config.json', 'w') as f:
              json.dump(config, f, indent=2)
          
          print("✅ US Core profiles configured")
          print(json.dumps(config, indent=2))
          PYTHON_EOF

      - name: Validate FHIR resources
        id: validate
        run: |
          echo "=== Validating FHIR Resources ==="
          
          python3 <<'PYTHON_EOF'
          import subprocess
          import json
          import os
          from pathlib import Path
          
          fixture_path = "${{ inputs.fixture_path }}"
          validation_results = {
              "total_resources": 0,
              "valid": 0,
              "invalid": 0,
              "errors": [],
              "warnings": []
          }
          
          # Find all FHIR JSON files
          fhir_files = list(Path(fixture_path).glob('*.json'))
          
          if not fhir_files:
              print(f"⚠️  No FHIR files found in {fixture_path}")
              fhir_files = []
          
          for json_file in sorted(fhir_files)[:50]:  # Limit to first 50 for speed
              try:
                  with open(json_file, 'r') as f:
                      resource = json.load(f)
                  
                  resource_type = resource.get('resourceType', 'Unknown')
                  resource_id = resource.get('id', 'no-id')
                  
                  # Basic validation checks
                  errors = []
                  
                  # Check: resourceType must be present
                  if 'resourceType' not in resource:
                      errors.append(f"Missing resourceType")
                  
                  # Check: id should be present (not required but best practice)
                  if 'id' not in resource:
                      errors.append(f"Missing id (recommended)")
                  
                  # Check: meta.profile for US Core conformance
                  if 'meta' in resource and 'profile' in resource['meta']:
                      profiles = resource['meta']['profile']
                      if isinstance(profiles, list) and any('us-core' in p for p in profiles):
                          validation_results["valid"] += 1
                      else:
                          errors.append(f"Not conforming to US Core profile")
                  else:
                      # No US Core profile declaration
                      warnings = [f"No US Core profile declared (meta.profile)"]
                      validation_results["warnings"].append({
                          "file": json_file.name,
                          "resource_type": resource_type,
                          "message": "; ".join(warnings)
                      })
                  
                  if errors:
                      validation_results["invalid"] += 1
                      validation_results["errors"].append({
                          "file": json_file.name,
                          "resource_type": resource_type,
                          "id": resource_id,
                          "errors": errors
                      })
                  
                  validation_results["total_resources"] += 1
              
              except json.JSONDecodeError as e:
                  validation_results["errors"].append({
                      "file": json_file.name,
                      "error": f"JSON parse error: {e}"
                  })
          
          # Determine status
          error_count = len(validation_results["errors"])
          validation_results["status"] = "PASS" if error_count == 0 else "FAIL"
          
          # Output results
          print(f"\n✅ Validation complete:")
          print(f"  Resources scanned: {validation_results['total_resources']}")
          print(f"  Valid: {validation_results['valid']}")
          print(f"  Invalid: {validation_results['invalid']}")
          print(f"  Errors: {error_count}")
          print(f"  Warnings: {len(validation_results['warnings'])}")
          print(f"  Status: {validation_results['status']}")
          
          if validation_results["errors"]:
              print(f"\n❌ Validation Errors:")
              for error in validation_results["errors"][:10]:
                  print(f"  - {error['file']}: {error.get('errors', [error.get('error')])}")
          
          # Write report
          with open('/tmp/fhir_validation_report.json', 'w') as f:
              json.dump(validation_results, f, indent=2)
          
          # GitHub output
          print(f"\nvalidation_status={validation_results['status']}")
          print(f"error_count={error_count}")
          print(f"warning_count={len(validation_results['warnings'])}")
          PYTHON_EOF
          
          # Read output variables
          source <(python3 <<'PYTHON_PARSE'
          import json
          with open('/tmp/fhir_validation_report.json', 'r') as f:
              report = json.load(f)
          print(f"echo 'validation_status={report['status']}' >> $GITHUB_OUTPUT")
          print(f"echo 'error_count={len(report['errors'])}' >> $GITHUB_OUTPUT")
          print(f"echo 'warning_count={len(report['warnings'])}' >> $GITHUB_OUTPUT")
          PYTHON_PARSE
          )

      - name: Generate validation report
        run: |
          echo "=== Generating Validation Report ==="
          
          python3 <<'PYTHON_EOF'
          import json
          from datetime import datetime
          
          with open('/tmp/fhir_validation_report.json', 'r') as f:
              report = json.load(f)
          
          html = f"""<!DOCTYPE html>
<html>
<head>
    <title>FHIR Validation Report</title>
    <style>
        body {{ font-family: monospace; background: #f5f5f5; padding: 20px; }}
        .pass {{ color: green; font-weight: bold; }}
        .fail {{ color: red; font-weight: bold; }}
        table {{ border-collapse: collapse; width: 100%; background: white; }}
        th, td {{ border: 1px solid #ccc; padding: 8px; text-align: left; }}
        th {{ background: #2c3e50; color: white; }}
    </style>
</head>
<body>
    <h1>FHIR US Core 6.1 Validation Report</h1>
    <p>Generated: {datetime.now().isoformat()}</p>
    <p>Status: <span class="{'pass' if report['status'] == 'PASS' else 'fail'}">{report['status']}</span></p>
    
    <h2>Summary</h2>
    <table>
        <tr><th>Metric</th><th>Count</th></tr>
        <tr><td>Resources Scanned</td><td>{report['total_resources']}</td></tr>
        <tr><td>Valid</td><td>{report['valid']}</td></tr>
        <tr><td>Invalid</td><td>{report['invalid']}</td></tr>
        <tr><td>Errors</td><td>{len(report['errors'])}</td></tr>
        <tr><td>Warnings</td><td>{len(report['warnings'])}</td></tr>
    </table>
    
    <h2>Errors</h2>
    <table>
        <tr><th>File</th><th>Resource Type</th><th>Message</th></tr>
"""
          
          for error in report['errors'][:50]:
              html += f"<tr><td>{error.get('file', 'N/A')}</td><td>{error.get('resource_type', 'N/A')}</td><td>{error.get('errors', [error.get('error')])[0]}</td></tr>\n"
          
          html += """    </table>
</body>
</html>
"""
          
          with open('/tmp/fhir_validation_report.html', 'w') as f:
              f.write(html)
          
          print("✅ HTML report generated")
          PYTHON_EOF

      - name: Upload validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fhir-validation-report
          path: |
            /tmp/fhir_validation_report.json
            /tmp/fhir_validation_report.html
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ FHIR Validation Report

- Validation Status: ${{ steps.validate.outputs.validation_status }}
- Resources Scanned: 50 (sample)
- Errors: ${{ steps.validate.outputs.error_count }}
- Warnings: ${{ steps.validate.outputs.warning_count }}

**Profile:** US Core ${{ inputs.profile_version }}

See artifacts for full validation report.`
            })

      - name: Fail if errors exceed threshold
        if: failure() || (steps.validate.outputs.error_count > inputs.max_errors && inputs.fail_on_error == 'true')
        run: |
          echo "❌ FHIR validation failed"
          echo "Errors: ${{ steps.validate.outputs.error_count }} (max allowed: ${{ inputs.max_errors }})"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "=== FHIR Validation Summary ==="
          echo "Status: ${{ steps.validate.outputs.validation_status }}"
          echo "Resources: ${{ steps.validate.outputs.error_count }} errors, ${{ steps.validate.outputs.warning_count }} warnings"
          echo "Profile: US Core ${{ inputs.profile_version }}"
