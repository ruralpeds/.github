name: "Audit Log Integrity Verification"

# Nightly integrity check for audit logs.
#
# Regulatory drivers:
#   - HIPAA §164.312(b) — audit controls (integrity, tamper-detection)
#   - 21 CFR Part 11 §11.10(d) — record integrity
#   - IEC 62304 — change log integrity (no retroactive edits)
#
# Current implementation validates the governance ledger format and
# detects obvious tampering. Full Merkle-chain + Sigstore verification
# is implemented in issue #23 (scripts/chain/verify.py).

on:
  schedule:
    - cron: "0 1 * * *"  # Nightly at 1 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify Audit Log Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for Merkle chain (issue #23)
        id: chain_check
        run: |
          if [ -f "audit-log/chain.ndjson" ]; then
            echo "chain_exists=true" >> $GITHUB_OUTPUT
            echo "Merkle chain found — full verification active"
          else
            echo "chain_exists=false" >> $GITHUB_OUTPUT
            echo "Merkle chain not yet initialised (pending issue #23) — running basic ledger checks"
          fi

      # -----------------------------------------------------------------------
      # Basic ledger validation (always runs — governs governance-ledger.jsonl)
      # -----------------------------------------------------------------------
      - name: Validate governance ledger
        run: |
          LEDGER="audit-log/governance-ledger.jsonl"

          if [ ! -f "$LEDGER" ]; then
            echo "⚠️  No governance ledger found at $LEDGER — skipping"
            exit 0
          fi

          python3 - "$LEDGER" <<'PYEOF'
          import json, sys, datetime

          ledger_path = sys.argv[1]
          raw = open(ledger_path).read().strip()

          if not raw:
            print("⚠️  Ledger is empty — skipping")
            sys.exit(0)

          # Support both JSONL (one object per line) and a JSON array / single object
          events = []
          for line in raw.splitlines():
            line = line.strip()
            if not line or line in ('{', '}', '[', ']', ','):
              continue
            # Try standalone JSON object per segment (pretty-printed)
          try:
            obj = json.loads(raw)
            if isinstance(obj, list):
              events = obj
            elif isinstance(obj, dict):
              events = [obj]
          except json.JSONDecodeError:
            # Try JSONL
            for i, line in enumerate(raw.splitlines(), 1):
              line = line.strip()
              if not line:
                continue
              try:
                events.append(json.loads(line))
              except json.JSONDecodeError as e:
                print(f"Line {i}: invalid JSON — {e}")
                sys.exit(1)

          print(f"Ledger entries parsed: {len(events)}")

          now = datetime.datetime.now(datetime.timezone.utc)
          errors = 0
          for i, ev in enumerate(events, 1):
            if "timestamp" not in ev:
              print(f"Entry {i}: missing 'timestamp'")
              errors += 1
              continue
            try:
              ts = datetime.datetime.fromisoformat(ev["timestamp"].replace("Z", "+00:00"))
              if ts > now:
                print(f"Entry {i}: future timestamp {ev['timestamp']} — possible tampering")
                errors += 1
            except ValueError as e:
              print(f"Entry {i}: bad timestamp — {e}")
              errors += 1

          if errors:
            print(f"❌ {errors} validation error(s) found")
            sys.exit(1)
          else:
            print("✅ Governance ledger: all entries valid")
          PYEOF

      # -----------------------------------------------------------------------
      # Full Merkle-chain verification (only when chain.ndjson exists, i.e. #23)
      # -----------------------------------------------------------------------
      - name: Verify Merkle chain
        if: steps.chain_check.outputs.chain_exists == 'true'
        run: |
          python3 scripts/chain/verify.py audit-log/chain.ndjson

      - name: Summary
        if: always()
        run: |
          echo "## Audit Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.chain_check.outputs.chain_exists }}" == "true" ]; then
            echo "- Mode: **Full Merkle-chain + Sigstore** verification" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Mode: **Basic ledger validation** (Merkle chain pending issue #23)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Run: \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Only open a new issue if no open security alert already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,audit,critical',
              state: 'open',
            });
            if (existing.data.length > 0) {
              console.log(`Open security issue already exists (#${existing.data[0].number}) — skipping duplicate`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 SECURITY ALERT: Audit Log Tampering Detected',
              body: [
                '**Audit log integrity check FAILED.**',
                '',
                '**Action Required:**',
                '1. Review audit logs in git history',
                '2. Check for unauthorized modifications',
                '3. Contact security team',
                '',
                `**Run Details:**`,
                `- Run ID: ${context.runId}`,
                `- Check: audit-verify.yml`,
                `- Time: ${new Date().toISOString()}`,
                '',
                `See: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['security', 'critical', 'audit'],
            });
