name: Bootstrap Gaps — Org Sweep

# ─────────────────────────────────────────────────────────────────────────────
# Sweeps every non-archived ruralpeds repo and ensures each has:
#   - GAPS.md at repo root
#   - .github/workflows/gaps.yml (calls reusable-gap-lifecycle.yml)
#   - Gap Analysis block appended to CLAUDE.md (if CLAUDE.md exists)
#
# Runs on the Mac Studio self-hosted runner (org-scoped GitHub App token).
# Trigger manually from Actions tab, or schedule as needed.
#
# Inputs:
#   dry_run  — preview what would change without committing anything
#   repo     — bootstrap a single repo (leave blank for all repos)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would change without committing'
        type: boolean
        default: false
        required: false
      repo:
        description: 'Single repo name to bootstrap (blank = all repos)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: gap-bootstrap-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Bootstrap Gap Analysis — All Repos
    runs-on: [self-hosted, apple-silicon]
    timeout-minutes: 30

    steps:
      - name: Checkout .github repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276b0f2ebde5d8cd729c4d5  # v1.11.0
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds

      - name: Install dependencies
        run: |
          pip3 install requests --quiet --break-system-packages 2>/dev/null \
            || pip3 install requests --quiet

      - name: Run bootstrap sweep
        env:
          GH_PAT: ${{ steps.app-token.outputs.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          ARGS=(--token "$GH_PAT" --org ruralpeds)
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_REPO" ]; then
            ARGS+=(--repo "$INPUT_REPO")
          fi
          python3 scripts/bootstrap_gaps_sweep.py "${ARGS[@]}"

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gap-sweep-report-${{ github.run_number }}
          path: /tmp/gap_sweep_report.json
          retention-days: 30

      - name: Print summary
        if: always()
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          REPORT=/tmp/gap_sweep_report.json
          {
            echo "## Gap Bootstrap Sweep"
            echo ""
            echo "**Runner:** $(hostname)"
            echo "**Dry run:** ${INPUT_DRY_RUN}"
            echo "**Target repo:** ${INPUT_REPO:-ALL}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            BOOTSTRAPPED=$(python3 -c \
              "import json;d=json.load(open('$REPORT'));print(sum(1 for r in d if r['status']=='bootstrapped'))")
            ALREADY=$(python3 -c \
              "import json;d=json.load(open('$REPORT'));print(sum(1 for r in d if r['status']=='already_bootstrapped'))")
            ERRORS=$(python3 -c \
              "import json;d=json.load(open('$REPORT'));print(sum(1 for r in d if r['status']=='error'))")
            {
              echo "| Result | Count |"
              echo "|--------|-------|"
              echo "| ✅ Bootstrapped | ${BOOTSTRAPPED} |"
              echo "| ✓ Already done | ${ALREADY} |"
              echo "| ❌ Errors | ${ERRORS} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
