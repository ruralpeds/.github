name: Build — Render BUILD.md

# Regenerates BUILD.md from .build/manifest.yaml whenever the manifest
# changes. Commits the rendered file back to the source branch (or PR branch
# for pull_request events).
#
# Source of truth: .build/manifest.yaml
# Renderer: scripts/render_build_md.py (provided by ruralpeds/.github)

on:
  push:
    branches: [main]
    paths:
      - '.build/manifest.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.build/manifest.yaml'
      - 'BUILD.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-md-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install renderer deps
        run: pip install --quiet "ruamel.yaml>=0.18,<0.19" "jsonschema>=4.0"

      - name: Validate manifest against schema
        run: |
          python - <<'PY'
          import json
          import jsonschema
          from ruamel.yaml import YAML
          schema = json.load(open(".build/schema.json"))
          manifest = YAML(typ="safe").load(open(".build/manifest.yaml"))
          jsonschema.validate(manifest, schema)
          print("manifest OK:", len(manifest.get("features", [])), "features")
          PY

      - name: Render BUILD.md
        run: |
          python scripts/render_build_md.py \
            --manifest .build/manifest.yaml \
            --template templates/build-management/BUILD.template.md \
            --out BUILD.md

      - name: Commit BUILD.md if changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet BUILD.md; then
            echo "No change."; exit 0
          fi
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add BUILD.md
          git commit -m "chore(build): regenerate BUILD.md from manifest"
          git push

      - name: Fail PR if BUILD.md drifted from manifest
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet BUILD.md; then
            echo "::error::BUILD.md is out of sync with .build/manifest.yaml. Run scripts/render_build_md.py locally."
            git diff BUILD.md | head -200
            exit 1
          fi
