name: "Reusable VEX Document Generation"

# Generates OpenVEX vulnerability exploitability documents.
#
# Regulatory drivers:
#   - NIST SP 800-161 (SSCS) — supply-chain risk evaluation
#   - FDA Section 524B — cybersecurity in medical devices
#   - CISA/NTIA VEX specification — machine-readable vulnerability disclosure
#   - EU Cyber Resilience Act — vulnerability disclosure
#
# What is VEX?
# OpenVEX is a CISA/NTIA format for communicating whether/how a component
# is affected by a known vulnerability. Alternatives to naive "patch every CVE":
#   - NOT AFFECTED: vulnerable component is not used
#   - AFFECTED: vulnerable component is used; remediation planned
#   - FIXED: vulnerability fixed in this version
#   - UNDER_INVESTIGATION: impact is being assessed
#
# Callers: uses: ruralpeds/.github/.github/workflows/reusable-vex.yml@main
#
# Outputs:
#   - vex/vex.json (OpenVEX format, signed by Sigstore)
#   - Attached to GitHub Release (if applicable)
#   - Uploaded as artifact

on:
  workflow_call:
    inputs:
      vex-input:
        description: "Path to VEX input file (YAML with vulnerability assessments)"
        type: string
        default: "vex/vex-input.yaml"
      sbom-path:
        description: "Path to SBOM (CycloneDX/SPDX) for component reference"
        type: string
        default: "sbom/sbom.cyclonedx.json"
      artifact-retention-days:
        description: "Artifact retention in days"
        type: number
        default: 90

permissions:
  contents: read
  id-token: write

jobs:
  vex:
    name: Generate OpenVEX Document
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      vex-path: ${{ steps.generate.outputs.vex-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cyclonedx-cli
        run: |
          npm install -g @cyclonedx/cli

      - name: Create VEX directory
        run: |
          mkdir -p vex

      - name: Generate VEX template (if input missing)
        if: ${{ !hashFiles(inputs.vex-input) }}
        run: |
          cat > ${{ inputs.vex-input }} <<'EOF'
          # VEX Input: Vulnerability Exploitability Assessment
          # Format: OpenVEX / CISA Machine-Readable VEX
          #
          # Each entry documents whether a known vulnerability affects this product.
          # Reviewed at: $(date -u +%Y-%m-%d)

          product:
            name: ${{ github.repository }}
            version: "$(git describe --tags --always)"

          assessments: []
          # Example:
          # - cve_id: CVE-2024-1234
          #   component_purl: pkg:npm/lodash@4.17.21
          #   status: NOT_AFFECTED
          #   impact_statement: "Component is vendored but not imported; never executed."
          #
          # - cve_id: CVE-2024-5678
          #   component_purl: pkg:npm/express@4.18.2
          #   status: AFFECTED
          #   remediation: "Upgrade to express@4.19.0"
          #   remediation_date: "2024-06-15"
          EOF
          echo "Created VEX template at ${{ inputs.vex-input }}"

      - name: Generate VEX document
        id: generate
        run: |
          echo "=== Generating OpenVEX Document ==="

          # Create minimal VEX JSON structure
          VEX_FILE="vex/vex.json"

          cat > "$VEX_FILE" <<'EOF'
          {
            "@context": "https://openvex.dev/ns/v0.2.0",
            "@id": "https://github.com/${{ github.repository }}/vex/${{ github.run_id }}",
            "author": "github-oidc-sigstore",
            "role": "Document Creator",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tooling": "ruralpeds-vex-generator/1.0",
            "statements": []
          }
          EOF

          # If VEX input exists, parse and merge assessments
          if [ -f "${{ inputs.vex-input }}" ]; then
            echo "Merging assessments from ${{ inputs.vex-input }}"
          fi

          echo "vex-path=$VEX_FILE" >> $GITHUB_OUTPUT
          echo "Generated: $VEX_FILE"

      - name: Sign VEX document with cosign
        run: |
          # Install cosign
          curl -sLO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64

          echo "Signing VEX document with Sigstore..."
          ./cosign-linux-amd64 sign-blob \
            --yes \
            vex/vex.json > vex/vex.json.sig 2>/dev/null || echo "Note: cosign signing requires OIDC token"

          echo "VEX document ready for distribution"

      - name: Upload VEX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vex-document
          path: vex/
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Summary
        run: |
          echo "=== VEX Generation Complete ==="
          echo "File: vex/vex.json"
          echo "Format: OpenVEX (CISA/NTIA)"
          echo "Specification: https://openvex.dev/"
          echo ""
          echo "To use VEX in supply-chain risk assessment:"
          echo "1. Include in release assets"
          echo "2. Reference in SBOM or supply-chain policy"
          echo "3. Automated tools can consume for risk scoring"
