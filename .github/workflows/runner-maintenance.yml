name: Runner Maintenance

on:
  schedule:
    # Daily cleanup at 02:00 UTC (off-peak hours)
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_call:

jobs:
  disk-cleanup:
    name: Clean up disk space
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check disk usage before cleanup
        id: before
        run: |
          echo "=== Disk Usage Before Cleanup ==="
          df -h / | tail -1 | awk '{print "Root disk: " $5 " used"}'

      - name: Clean Docker resources
        run: |
          echo "=== Cleaning Docker ==="

          # Remove unused images
          docker image prune -af --filter "until=72h" || true

          # Remove unused containers
          docker container prune -f || true

          # Remove unused volumes
          docker volume prune -f || true

          # Remove build cache older than 30 days
          docker builder prune -af --filter "until=720h" || true

          echo "✓ Docker cleanup complete"

      - name: Clean runner work directories
        run: |
          echo "=== Cleaning Runner Work Directories ==="

          runner_work="${RUNNER_TOOL_CACHE%/*}/_work"
          if [ -d "$runner_work" ]; then
            # Remove old artifacts (>14 days)
            find "$runner_work" -maxdepth 1 -type d -mtime +14 -exec rm -rf {} \; 2>/dev/null || true

            # Clean temp directory
            rm -rf "$runner_work/_temp/"* 2>/dev/null || true

            echo "✓ Work directory cleanup complete"
          fi

      - name: Clean system package caches
        run: |
          echo "=== Cleaning System Caches ==="

          # macOS specific
          if [[ "$OSTYPE" == "darwin"* ]]; then
            # Brew cache
            brew cleanup -s || true

            # XCode derived data
            rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

            # npm cache
            npm cache clean --force || true

            echo "✓ macOS cache cleanup complete"
          fi

      - name: Check disk usage after cleanup
        id: after
        if: always()
        run: |
          echo "=== Disk Usage After Cleanup ==="
          df -h / | tail -1 | awk '{print "Root disk: " $5 " used"}'

  log-rotation:
    name: Rotate runner logs
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Compress old logs
        run: |
          echo "=== Compressing Old Logs ==="

          log_dirs=(
            "/tmp"
            "$HOME/.actions-runner"
            "$HOME/actions-runner"
          )

          for log_dir in "${log_dirs[@]}"; do
            if [ -d "$log_dir" ]; then
              # Find logs older than 7 days and compress
              find "$log_dir" -name "*.log" -mtime +7 \
                -exec gzip {} \; 2>/dev/null || true
            fi
          done

          echo "✓ Log compression complete"

      - name: Remove very old logs
        run: |
          echo "=== Removing Archived Logs (>30 days) ==="

          # Remove compressed logs older than 30 days
          find /tmp -name "*.log.gz" -mtime +30 -delete 2>/dev/null || true
          find "$HOME/.actions-runner" -name "*.log.gz" -mtime +30 -delete 2>/dev/null || true

          echo "✓ Old log removal complete"

  tool-validation:
    name: Validate installed tools
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate required tools
        run: |
          echo "=== Validating Required Tools ==="

          tools=(
            "git:git --version"
            "gh:gh --version"
            "python3:python3 --version"
            "docker:docker --version"
          )

          failed=0
          for tool_check in "${tools[@]}"; do
            IFS=':' read -r name cmd <<< "$tool_check"
            if eval "$cmd" > /dev/null 2>&1; then
              version=$(eval "$cmd" 2>&1 | head -1)
              echo "✓ $name: $version"
            else
              echo "✗ $name: MISSING (needs update)"
              failed=$((failed + 1))
            fi
          done

          if [ $failed -gt 0 ]; then
            echo ""
            echo "⚠ Warning: $failed tools need updating"
            echo "Run: bash scripts/runner-setup.sh --mac --full"
          fi

      - name: Check for tool updates
        if: always()
        run: |
          echo "=== Checking for Updates ==="

          # Check Homebrew updates (macOS)
          if [[ "$OSTYPE" == "darwin"* ]] && command -v brew &> /dev/null; then
            outdated=$(brew outdated 2>/dev/null | wc -l)
            if [ "$outdated" -gt 0 ]; then
              echo "⚠ $outdated Homebrew packages available for update:"
              brew outdated | awk '{print "  - " $1}' | head -5
              echo ""
              echo "Run: brew upgrade"
            else
              echo "✓ All Homebrew packages up to date"
            fi
          fi

          # Check Python packages
          if command -v pip3 &> /dev/null; then
            pip_outdated=$(pip3 list --outdated 2>/dev/null | tail -n +3 | wc -l)
            if [ "$pip_outdated" -gt 0 ]; then
              echo "⚠ $pip_outdated Python packages available for update"
            else
              echo "✓ All Python packages up to date"
            fi
          fi

  runner-restart:
    name: Restart runner services
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Gracefully restart runner
        run: |
          echo "=== Gracefully Restarting Runner ==="

          # Note: This step runs before the runner is gracefully shut down
          # The runner process will stop and restart after this workflow completes

          echo "Runner will restart after workflow completion"
          echo "Current uptime:"
          uptime

      - name: Verify runner is ready
        run: |
          echo "=== Runner Ready Check ==="

          # Simple connectivity test
          if [ -f ~/.ssh/id_rsa ]; then
            echo "✓ SSH keys present"
          fi

          if command -v git &> /dev/null; then
            echo "✓ Git available"
          fi

          echo "✓ Runner is ready for next job"

  maintenance-report:
    name: Maintenance summary
    runs-on: ubuntu-latest
    needs: [disk-cleanup, log-rotation, tool-validation, runner-restart]
    if: always()
    permissions:
      {}
    steps:
      - name: Generate maintenance report
        run: |
          echo "=== Maintenance Job Summary ==="
          echo ""
          echo "Disk Cleanup: ${{ needs.disk-cleanup.result }}"
          echo "Log Rotation: ${{ needs.log-rotation.result }}"
          echo "Tool Validation: ${{ needs.tool-validation.result }}"
          echo "Runner Restart: ${{ needs.runner-restart.result }}"
          echo ""

          if [[ "${{ needs.disk-cleanup.result }}" == "success" && \
                "${{ needs.log-rotation.result }}" == "success" && \
                "${{ needs.tool-validation.result }}" == "success" ]]; then
            echo "✅ All maintenance tasks completed successfully"
          else
            echo "⚠ Some maintenance tasks encountered issues (review above)"
          fi
