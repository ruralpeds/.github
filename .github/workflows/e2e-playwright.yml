name: "E2E — Playwright"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "20"
      working-directory:
        description: "Working directory"
        type: string
        default: "."
      package-manager:
        description: "Package manager (npm, yarn, pnpm)"
        type: string
        default: "npm"
      test-directory:
        description: "Playwright test directory"
        type: string
        default: ""
      base-url:
        description: "Application base URL for testing"
        type: string
        default: ""
      start-command:
        description: "Command to start the dev server (e.g. 'npm run dev')"
        type: string
        default: ""
      start-wait-time:
        description: "Seconds to wait for dev server to start"
        type: number
        default: 30
      browsers:
        description: "JSON array of browsers to test (chromium, firefox, webkit)"
        type: string
        default: '["chromium"]'
      retries:
        description: "Number of retries for flaky tests"
        type: number
        default: 2
      shards:
        description: "Number of parallel shards"
        type: number
        default: 1
      test-timeout:
        description: "Test timeout in minutes"
        type: number
        default: 30
      upload-report:
        description: "Upload HTML report"
        type: boolean
        default: true
      upload-traces:
        description: "Upload traces on failure"
        type: boolean
        default: true
    secrets:
      E2E_BASE_URL:
        description: "Base URL override from secrets"
        required: false

jobs:
  install:
    name: Install & cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install project dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Install Playwright browsers
        working-directory: ${{ inputs.working-directory }}
        run: npx playwright install --with-deps ${{ join(fromJson(inputs.browsers), ' ') }}
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}

  test:
    name: "E2E (${{ matrix.browser }}${{ inputs.shards > 1 && format(', shard {0}/{1}', matrix.shard, inputs.shards) || '' }})"
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.test-timeout) }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(inputs.browsers) }}
        shard: ${{ fromJson(format('[{0}]', join(fromJson(format('[{0}]', (inputs.shards == 1 && '1' || inputs.shards == 2 && '1,2' || inputs.shards == 3 && '1,2,3' || '1,2,3,4'))), ','))) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Restore Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers (if cache miss)
        working-directory: ${{ inputs.working-directory }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start application server
        if: inputs.start-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          ${{ inputs.start-command }} &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

          # Wait for server to be ready
          WAIT_TIME=${{ inputs.start-wait-time }}
          BASE="${{ inputs.base-url || secrets.E2E_BASE_URL || 'http://localhost:3000' }}"
          echo "Waiting up to ${WAIT_TIME}s for $BASE ..."
          for i in $(seq 1 "$WAIT_TIME"); do
            if curl -sf "$BASE" > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Server process exited unexpectedly"
              exit 1
            fi
            sleep 1
          done
          if ! curl -sf "$BASE" > /dev/null 2>&1; then
            echo "::error::Server did not start within ${WAIT_TIME}s"
            exit 1
          fi
      - name: Run Playwright tests
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_URL: ${{ inputs.base-url || secrets.E2E_BASE_URL || '' }}
          PLAYWRIGHT_RETRIES: ${{ inputs.retries }}
        run: |
          ARGS="--project=${{ matrix.browser }} --retries=${{ inputs.retries }}"

          if [ "${{ inputs.shards }}" -gt 1 ]; then
            ARGS="$ARGS --shard=${{ matrix.shard }}/${{ inputs.shards }}"
          fi

          if [ -n "${{ inputs.test-directory }}" ]; then
            ARGS="$ARGS ${{ inputs.test-directory }}"
          fi

          if [ -n "$BASE_URL" ]; then
            export PLAYWRIGHT_BASE_URL="$BASE_URL"
          fi

          npx playwright test $ARGS
      - name: Stop server
        if: always() && env.SERVER_PID != ''
        run: kill "$SERVER_PID" 2>/dev/null || true
      - name: Upload HTML report
        if: inputs.upload-report && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test traces on failure
        if: inputs.upload-traces && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-traces-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-screenshots-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            ${{ inputs.working-directory }}/test-results/**/*.png
            ${{ inputs.working-directory }}/test-results/**/*.jpg
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-videos-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

  merge-reports:
    name: Merge reports
    needs: test
    if: always() && inputs.upload-report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Download all reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          pattern: playwright-report-*
          path: all-reports/
      - name: Merge reports
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -d ../all-reports ] && [ "$(ls -A ../all-reports 2>/dev/null)" ]; then
            npm install -g playwright-merge-html-reports 2>/dev/null || true
            echo "Reports downloaded to all-reports/"
            ls -la ../all-reports/
          else
            echo "No reports to merge"
          fi
      - name: Upload merged report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report-merged
          path: all-reports/
          retention-days: 14
          if-no-files-found: ignore
