name: "EHR Sandbox Validation"

# Validates core FHIR integration paths against sandbox endpoints.
# Default mode is dry-run for safe planning and checklist execution.

'on':
  workflow_dispatch:
    inputs:
      sandbox_provider:
        description: "Target sandbox provider"
        type: choice
        options:
          - epic
          - cerner
        default: epic
      dry_run:
        description: "Run validation in dry-run mode"
        type: boolean
        default: true
      base_url:
        description: "FHIR base URL (required when dry_run=false)"
        type: string
        default: ""
  workflow_call:
    inputs:
      sandbox_provider:
        description: "Target sandbox provider"
        type: string
        default: "epic"
      dry_run:
        description: "Run validation in dry-run mode"
        type: boolean
        default: true
      base_url:
        description: "FHIR base URL (required when dry_run=false)"
        type: string
        default: ""
    secrets:
      SMART_FHIR_TOKEN:
        description: "OAuth bearer token for sandbox"
        required: false

permissions:
  contents: read

concurrency:
  group: ehr-sandbox-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate ${{ inputs.sandbox_provider || 'epic' }} sandbox"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate provider input
        run: |
          PROVIDER="${{ inputs.sandbox_provider || 'epic' }}"
          if [ "$PROVIDER" != "epic" ] && [ "$PROVIDER" != "cerner" ]; then
            echo "::error::sandbox_provider must be epic or cerner"
            exit 1
          fi

      - name: Dry-run checklist
        if: inputs.dry_run == true
        run: |
          echo "Running in dry-run mode. No external API calls will be made."
          echo "Checklist:"
          echo "1) Validate mapping rules exist in docs/ehr-integration/FHIR_MAPPING.md"
          echo "2) Validate sandbox plan exists in docs/ehr-integration/SANDBOX_VALIDATION_PLAN.md"
          echo "3) Confirm test matrix EHR-01..EHR-10"

      - name: Validate required runtime inputs
        if: inputs.dry_run == false
        env:
          BASE_URL: ${{ inputs.base_url }}
          SMART_FHIR_TOKEN: ${{ secrets.SMART_FHIR_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::base_url is required when dry_run=false"
            exit 1
          fi

          if [ -z "$SMART_FHIR_TOKEN" ]; then
            echo "::error::SMART_FHIR_TOKEN secret is required when dry_run=false"
            exit 1
          fi

      - name: Live sandbox smoke test
        if: inputs.dry_run == false
        env:
          BASE_URL: ${{ inputs.base_url }}
          SMART_FHIR_TOKEN: ${{ secrets.SMART_FHIR_TOKEN }}
        run: |
          set -e

          HEALTH_CODE=$(curl -sS -o /tmp/capability.json -w "%{http_code}" \
            -H "Authorization: Bearer $SMART_FHIR_TOKEN" \
            -H "Accept: application/fhir+json" \
            "$BASE_URL/metadata")

          if [ "$HEALTH_CODE" -lt 200 ] || [ "$HEALTH_CODE" -ge 300 ]; then
            echo "::error::CapabilityStatement check failed with HTTP $HEALTH_CODE"
            exit 1
          fi

          PATIENT_CODE=$(curl -sS -o /tmp/patient-search.json -w "%{http_code}" \
            -H "Authorization: Bearer $SMART_FHIR_TOKEN" \
            -H "Accept: application/fhir+json" \
            "$BASE_URL/Patient?_count=1")

          if [ "$PATIENT_CODE" -lt 200 ] || [ "$PATIENT_CODE" -ge 300 ]; then
            echo "::error::Patient search failed with HTTP $PATIENT_CODE"
            exit 1
          fi

          OBS_CODE=$(curl -sS -o /tmp/observation-search.json -w "%{http_code}" \
            -H "Authorization: Bearer $SMART_FHIR_TOKEN" \
            -H "Accept: application/fhir+json" \
            "$BASE_URL/Observation?_count=1")

          if [ "$OBS_CODE" -lt 200 ] || [ "$OBS_CODE" -ge 300 ]; then
            echo "::error::Observation search failed with HTTP $OBS_CODE"
            exit 1
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ehr-sandbox-validation-${{ github.run_id }}
          path: |
            /tmp/capability.json
            /tmp/patient-search.json
            /tmp/observation-search.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          echo "## EHR Sandbox Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Provider | ${{ inputs.sandbox_provider || 'epic' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ inputs.dry_run || true }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run || true }}" = "false" ]; then
            echo "| Metadata endpoint | checked |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Patient search | checked |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Observation search | checked |" >> "$GITHUB_STEP_SUMMARY"
          fi
