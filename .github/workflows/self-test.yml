name: Self-Test (.github org repo)

# Static + functional checks that run on this `.github` repo itself.
# Without this, a broken workflow YAML or policy JSON could ship to main and
# break every consumer org-wide before anyone notices.
#
# Closes GAP-003 in `.gap-analysis/GAP_ANALYSIS.md`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows / YAML / JSON / Shell / Markdown
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: "3.12"

      - name: Set up Go (for actionlint)
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed  # v5.1.0
        with:
          go-version: "1.22"

      - name: Install linters
        run: |
          set -euo pipefail
          pip install --quiet "yamllint==1.35.1"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: actionlint — every workflow file under .github/workflows/
        run: |
          set -euo pipefail
          actionlint -color
          # actionlint exits 0 when no issues; non-zero on findings.

      - name: Guard against stray /workflows/ at repo root
        run: |
          set -euo pipefail
          if [ -d workflows ] && find workflows -maxdepth 2 -name '*.yml' -o -name '*.yaml' | grep -q .; then
            echo "::error::Stray workflow YAML found under /workflows/ — GitHub Actions only loads .github/workflows/. Move or delete these files (see GAP-002)."
            find workflows -maxdepth 2 \( -name '*.yml' -o -name '*.yaml' \)
            exit 1
          fi
          echo "OK — no stray workflow YAML at repo root."

      - name: yamllint — workflows + rulesets + infra
        run: |
          set -euo pipefail
          set -- .github/workflows/ policies/rulesets/
          if [ -d infrastructure/kubernetes ]; then
            set -- "$@" infrastructure/kubernetes/
          fi
          if [ -d infrastructure/prometheus ]; then
            set -- "$@" infrastructure/prometheus/
          fi
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable, comments: disable, document-start: disable}}" \
            "$@"

      - name: Validate policy JSON (custom-properties + rulesets)
        run: |
          set -euo pipefail
          jq empty policies/custom-properties.json
          for f in policies/rulesets/*.json; do
            echo "validating $f"
            jq empty "$f"
          done

      - name: shellcheck — shell scripts under scripts/
        run: |
          set -euo pipefail
          files="$(find scripts -type f -name '*.sh' | sort)"
          if [ -z "$files" ]; then
            echo "No shell scripts found under scripts/."
            exit 0
          fi
          printf '%s\n' "$files" | while IFS= read -r file; do
            echo "linting $file"
            shellcheck -S warning "$file"
          done

  warning-only-link-check:
    # Markdown link-check is flaky (remote hosts, rate limiting). We run it as
    # an advisory job so a transient 5xx doesn't block merges. Per
    # `.github/instructions/workflows.instructions.md`, advisory checks live in
    # a `warning-only-*` job, not as `continue-on-error: true` on a real step.
    name: Link-check (advisory)
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Markdown link-check — user-visible top-level docs
        run: |
          set -euo pipefail
          config_file="$(mktemp)"
          trap 'rm -f "$config_file"' EXIT
          printf '{"timeout":"15s","retryOn429":true,"aliveStatusCodes":[200,206,403]}' > "$config_file"
          npx --yes markdown-link-check@3.12.2 \
            --quiet \
            --config "$config_file" \
            README.md INSTALL.md CONTRIBUTING.md SECURITY.md \
            docs/WORKFLOW_CATALOG.md \
            .gap-analysis/README.md \
            .gap-analysis/GAP_ANALYSIS.md

  test:
    name: Pytest — scripts/ + tests/
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          set -euo pipefail
          pip install --quiet pytest "ruamel.yaml>=0.18,<0.19" "python-dateutil>=2.8" "jsonschema>=4.0"

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          pytest tests/ -q
