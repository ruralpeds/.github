name: Clinical Audit Sweep

# ─────────────────────────────────────────────────────────────────────────────
# Scheduled org-wide sweep: discovers every Rust and Julia repo in ruralpeds,
# fans out to reusable-clinical-audit.yml for each, then logs a summary.
#
# Schedule: Monday 06:30 UTC — 30 min after build-status sweep so repo HEAD
# states are stable before we scan.
#
# workflow_dispatch allows re-running against a single repo or enabling
# fail_on_flagged for a one-off compliance check.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "30 6 1 * *"   # Monthly on the 1st 06:30 UTC (was weekly Mondays)
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Single repo to audit (e.g. ruralpeds/peds-calculators). Leave blank for full sweep."
        type: string
        required: false
        default: ""
      fail_on_flagged:
        description: "Fail individual audit jobs if any function is flagged"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Discover repos and log the matrix but do not run audits"
        type: boolean
        required: false
        default: false

concurrency:
  group: "clinical-audit-sweep"
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Job 1: discover — enumerate all Rust and Julia repos
# ---------------------------------------------------------------------------
jobs:
  discover:
    name: Discover repos
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      repo_count: ${{ steps.build-matrix.outputs.repo_count }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1  # v1.11.1
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds

      - name: Build repo matrix
        id: build-matrix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TARGET_REPO="${{ inputs.target_repo }}"

          if [ -n "$TARGET_REPO" ]; then
            LANG=$(gh api "repos/$TARGET_REPO" --jq '.language // "unknown"')
            MATRIX=$(jq -cn \
              --arg repo "$TARGET_REPO" \
              --arg lang "$LANG" \
              '[{"repo": $repo, "language": ($lang | ascii_downcase)}]')
            REPO_COUNT=1
          else
            RUST_JSON=$(gh repo list ruralpeds \
              --language Rust --no-archived --limit 1000 \
              --json nameWithOwner \
              --jq '[.[] | {"repo": .nameWithOwner, "language": "rust"}]')

            JULIA_JSON=$(gh repo list ruralpeds \
              --language Julia --no-archived --limit 1000 \
              --json nameWithOwner \
              --jq '[.[] | {"repo": .nameWithOwner, "language": "julia"}]')

            MATRIX=$(jq -cn \
              --argjson rust "$RUST_JSON" \
              --argjson julia "$JULIA_JSON" \
              '($rust + $julia) | unique_by(.repo)')

            REPO_COUNT=$(echo "$MATRIX" | jq 'length')
          fi

          echo "Discovered $REPO_COUNT repo(s):"
          echo "$MATRIX" | jq -r '.[] | "  \(.repo) (\(.language))"'

          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "repo_count=$REPO_COUNT" >> "$GITHUB_OUTPUT"

      - name: Dry run — log matrix and stop
        if: inputs.dry_run
        run: |
          echo "DRY RUN — the following repos would be audited:"
          echo '${{ steps.build-matrix.outputs.matrix }}' \
            | jq -r '.[] | "  \(.repo) (\(.language))"'
          echo ""
          echo "Set dry_run=false to execute the sweep."

  # ---------------------------------------------------------------------------
  # Job 2: audit — matrix fan-out, one reusable-clinical-audit call per repo
  # ---------------------------------------------------------------------------
  audit:
    name: "Audit ${{ matrix.repo }}"
    needs: discover
    if: >-
      !inputs.dry_run &&
      needs.discover.outputs.repo_count != '0'
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
      max-parallel: 3
      fail-fast: false   # always audit all repos; don't cancel on one failure
    uses: ruralpeds/.github/.github/workflows/reusable-clinical-audit.yml@main
    with:
      target_repo: ${{ matrix.repo }}
      language: ${{ matrix.language }}
      fail_on_flagged: ${{ inputs.fail_on_flagged || false }}
      commit_registry: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Job 3: summary — runs unconditionally after audit jobs complete
  # ---------------------------------------------------------------------------
  summary:
    name: Sweep summary
    needs: [discover, audit]
    if: always()
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write sweep summary
        run: |
          {
            echo "## Clinical Audit Sweep — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Repos discovered | ${{ needs.discover.outputs.repo_count }} |"
            echo "| Discover job | ${{ needs.discover.result }} |"
            echo "| Audit jobs | ${{ needs.audit.result }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo ""
            case "${{ needs.audit.result }}" in
              success) echo "> All audit jobs completed. Check each repo's \`.clinical-audit/registry.yaml\` for pending/flagged functions." ;;
              failure) echo "> **One or more audit jobs failed.** Review individual job logs above." ;;
              skipped) echo "> Audit jobs were skipped (dry run or no repos discovered)." ;;
              *)        echo "> Audit result: ${{ needs.audit.result }}" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
