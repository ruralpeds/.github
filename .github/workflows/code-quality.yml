name: "Code Quality & Compliance"

on:
  workflow_call:
    inputs:
      run-codeql:
        description: "Run GitHub CodeQL analysis"
        type: boolean
        default: true
      run-dependency-review:
        description: "Run dependency review (PRs only)"
        type: boolean
        default: true
      run-license-check:
        description: "Run license compliance check"
        type: boolean
        default: true
      run-repo-hygiene:
        description: "Run repository hygiene checks"
        type: boolean
        default: true
      codeql-languages:
        description: "JSON array of CodeQL languages to analyze"
        type: string
        default: ""
      allowed-licenses:
        description: "Comma-separated allowed SPDX license IDs"
        type: string
        default: "MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD,Unlicense,CC0-1.0,CC-BY-4.0,BlueOak-1.0.0,Python-2.0"
      forbidden-licenses:
        description: "Comma-separated forbidden SPDX license IDs"
        type: string
        default: "GPL-2.0,GPL-3.0,AGPL-3.0,SSPL-1.0,EUPL-1.1,EUPL-1.2"
      working-directory:
        description: "Working directory"
        type: string
        default: "."

jobs:
  # ─────────────────────────────────────────────
  # CodeQL — deep semantic code analysis
  # ─────────────────────────────────────────────
  detect-languages:
    name: Detect CodeQL languages
    if: inputs.run-codeql
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect languages for CodeQL
        id: detect
        run: |
          if [ -n '${{ inputs.codeql-languages }}' ] && [ '${{ inputs.codeql-languages }}' != '' ]; then
            echo 'languages=${{ inputs.codeql-languages }}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LANGS="["
          FIRST=true
          # JavaScript/TypeScript
          if find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" | head -1 | grep -q .; then
            [ "$FIRST" = false ] && LANGS="$LANGS,"
            LANGS="$LANGS\"javascript-typescript\""
            FIRST=false
          fi
          # Python
          if find . -name "*.py" | head -1 | grep -q .; then
            [ "$FIRST" = false ] && LANGS="$LANGS,"
            LANGS="$LANGS\"python\""
            FIRST=false
          fi
          # Go
          if [ -f go.mod ]; then
            [ "$FIRST" = false ] && LANGS="$LANGS,"
            LANGS="$LANGS\"go\""
            FIRST=false
          fi
          # Java/Kotlin
          if find . -name "*.java" -o -name "*.kt" | head -1 | grep -q .; then
            [ "$FIRST" = false ] && LANGS="$LANGS,"
            LANGS="$LANGS\"java-kotlin\""
            FIRST=false
          fi
          # C/C++
          if find . -name "*.c" -o -name "*.cpp" -o -name "*.h" | head -1 | grep -q .; then
            [ "$FIRST" = false ] && LANGS="$LANGS,"
            LANGS="$LANGS\"c-cpp\""
            FIRST=false
          fi
          # Ruby
          if find . -name "*.rb" | head -1 | grep -q .; then
            [ "$FIRST" = false ] && LANGS="$LANGS,"
            LANGS="$LANGS\"ruby\""
            FIRST=false
          fi
          LANGS="$LANGS]"

          if [ "$LANGS" = "[]" ]; then
            echo "No CodeQL-supported languages detected"
            echo 'languages=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Detected languages: $LANGS"
            echo "languages=$LANGS" >> "$GITHUB_OUTPUT"
          fi

  codeql:
    name: "CodeQL (${{ matrix.language }})"
    needs: detect-languages
    if: inputs.run-codeql && needs.detect-languages.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect-languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ─────────────────────────────────────────────
  # Dependency Review — new vuln/license on PRs
  # ─────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    if: inputs.run-dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: ${{ inputs.forbidden-licenses }}
          comment-summary-in-pr: always

  # ─────────────────────────────────────────────
  # License Compliance — audit all dependencies
  # ─────────────────────────────────────────────
  license-check:
    name: License compliance
    if: inputs.run-license-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Node.js licenses
        if: hashFiles('package.json') != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm install --ignore-scripts 2>/dev/null || true
          npx license-checker --json --out license-report-node.json 2>/dev/null || true

          if [ -f license-report-node.json ]; then
            FORBIDDEN="${{ inputs.forbidden-licenses }}"
            python3 -c "
          import json, sys
          report = json.load(open('license-report-node.json'))
          forbidden = set('$FORBIDDEN'.split(','))
          violations = []
          for pkg, info in report.items():
              lic = info.get('licenses', 'UNKNOWN')
              for f in forbidden:
                  if f in str(lic):
                      violations.append((pkg, lic))
          if violations:
              print(f'::error::{len(violations)} packages with forbidden licenses:')
              for pkg, lic in violations[:20]:
                  print(f'  - {pkg}: {lic}')
              sys.exit(1)
          else:
              print(f'License check passed: {len(report)} packages scanned')
          "
          fi
      - name: Check Python licenses
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install pip-licenses 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          pip-licenses --format=json --output-file=license-report-python.json 2>/dev/null || true

          if [ -f license-report-python.json ]; then
            FORBIDDEN="${{ inputs.forbidden-licenses }}"
            python3 -c "
          import json, sys
          report = json.load(open('license-report-python.json'))
          forbidden = set('$FORBIDDEN'.split(','))
          violations = []
          for pkg in report:
              lic = pkg.get('License', 'UNKNOWN')
              for f in forbidden:
                  if f in str(lic):
                      violations.append((pkg.get('Name'), lic))
          if violations:
              print(f'::error::{len(violations)} packages with forbidden licenses:')
              for name, lic in violations[:20]:
                  print(f'  - {name}: {lic}')
              sys.exit(1)
          else:
              print(f'License check passed: {len(report)} packages scanned')
          "
          fi
      - name: Check Rust licenses
        if: hashFiles('Cargo.toml') != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo install cargo-license 2>/dev/null || true
          cargo license --json > license-report-rust.json 2>/dev/null || true
          if [ -f license-report-rust.json ]; then
            echo "Rust license report generated"
            python3 -c "
          import json
          r = json.load(open('license-report-rust.json'))
          print(f'Rust packages scanned: {len(r)}')
          " 2>/dev/null || true
          fi
      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            ${{ inputs.working-directory }}/license-report-*.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Repo Hygiene — branch protection, standards
  # ─────────────────────────────────────────────
  repo-hygiene:
    name: Repository hygiene
    if: inputs.run-repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          SCORE=0
          TOTAL=0

          check_file() {
            TOTAL=$((TOTAL + 1))
            if [ -f "$1" ]; then
              echo "  [pass] $1"
              SCORE=$((SCORE + 1))
            else
              echo "  ::warning::[missing] $1 — $2"
            fi
          }

          echo "=== Repository Standards Check ==="

          check_file "README.md" "Every project needs a README"
          check_file "LICENSE" "License file required for open source compliance"
          check_file ".gitignore" "Prevents accidental commits of secrets/artifacts"
          check_file "SECURITY.md" "Vulnerability disclosure policy (required for production)"
          check_file "CODEOWNERS" "Ensures PRs get reviewed by the right people"

          # Check for CI
          CI_FOUND=false
          TOTAL=$((TOTAL + 1))
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$f" ]; then
              CI_FOUND=true
              break
            fi
          done
          if [ "$CI_FOUND" = "true" ]; then
            echo "  [pass] CI workflows present"
            SCORE=$((SCORE + 1))
          else
            echo "  ::warning::[missing] No CI workflows found"
          fi

          echo ""
          echo "Score: $SCORE/$TOTAL"
          if [ "$SCORE" -lt 3 ]; then
            echo "::warning::Repository hygiene score is low ($SCORE/$TOTAL) — review missing items above"
          fi
      - name: Check for outdated patterns
        run: |
          # Check for common anti-patterns
          ISSUES=0

          # Large files that shouldn't be committed
          LARGE_FILES=$(find . -not -path "./.git/*" -size +5M -type f 2>/dev/null)
          if [ -n "$LARGE_FILES" ]; then
            echo "::warning::Large files (>5MB) found in repo:"
            echo "$LARGE_FILES" | head -10
            ISSUES=$((ISSUES + 1))
          fi

          # TODO/FIXME/HACK with no issue reference
          DEBT=$(grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.py" --include="*.js" --include="*.ts" \
                   --include="*.go" --include="*.rs" --include="*.jl" --include="*.rb" . 2>/dev/null | \
                   grep -v ".git/" | grep -v "node_modules/" | wc -l)
          if [ "$DEBT" -gt 0 ]; then
            echo "::notice::Found $DEBT TODO/FIXME/HACK comments — consider tracking as issues"
          fi

          # Check for console.log / print debugging left in
          DEBUG_STMTS=$(grep -rn "console\.log\|debugger;\|import pdb\|breakpoint()" \
                         --include="*.py" --include="*.js" --include="*.ts" . 2>/dev/null | \
                         grep -v ".git/" | grep -v "node_modules/" | grep -v "test" | wc -l)
          if [ "$DEBUG_STMTS" -gt 0 ]; then
            echo "::warning::Found $DEBUG_STMTS debug statements in non-test code"
          fi
