# ──────────────────────────────────────────────────────────────
# Manual Julia Sync — run on demand
#
# Use this to:
#   • Backfill issues for commits that predate the automation
#   • Re-run after fixing the script
#   • Generate a cumulative task list for a range of commits
#
# Inputs:
#   base_ref — the "before" commit/tag/branch  (default: HEAD~1)
#   head_ref — the "after"  commit/tag/branch   (default: HEAD)
# ──────────────────────────────────────────────────────────────
name: Manual Julia Sync

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to diff from (commit SHA, tag, or branch)"
        required: false
        default: "HEAD~1"
      head_ref:
        description: "Head ref to diff to"
        required: false
        default: "HEAD"
      dry_run:
        description: "Dry run — print the issue body but don't create it"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  create-julia-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Peds repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Analyse diff and create issue
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          PEDS_REPO: timothyhartzog/Peds
          JULIA_REPO: timothyhartzog/pedsedu-jl
          SYNC_BASE_REF: ${{ github.event.inputs.base_ref }}
          SYNC_HEAD_REF: ${{ github.event.inputs.head_ref }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/sync_julia_tasks.py
