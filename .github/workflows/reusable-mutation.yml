name: "Reusable Mutation Testing"
# Runs mutation testing to measure test-suite quality beyond line coverage.
# Test "coverage" measures which code was executed, not whether bugs would
# be caught. Mutation testing introduces small code changes (mutants) and
# verifies the test suite catches them. A killed mutant = good test; a
# survived mutant = test gap.
#
# Regulatory drivers:
#   - FDA Computer Software Assurance (Sept 2022) — risk-based test adequacy
#   - IEC 62304 §5.5.3 — Software unit verification
#   - ISO 13485:2016 §7.3.6 — Design and development verification
#
# Callers: uses: timothyhartzog/.github/.github/workflows/reusable-mutation.yml@main
#
# Supported languages (auto-detected):
#   - Rust   → cargo-mutants
#   - Python → mutmut
#   - Node   → Stryker (requires stryker.conf.js or stryker.conf.json)
#   - Julia  → not widely-supported; skipped with a notice

on:
  workflow_call:
    inputs:
      language:
        description: "Force a language: rust, python, node (auto-detects if empty)"
        type: string
        default: ""
      min-score:
        description: "Minimum mutation score percentage to pass"
        type: number
        default: 70
      fail-under-min:
        description: "Fail the workflow if score is below min-score"
        type: boolean
        default: false
      timeout-minutes:
        description: "Max runtime for the mutation run"
        type: number
        default: 45
      test-paths:
        description: "Paths to mutate (newline-separated). Empty = language default."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  mutate:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect language
        id: detect
        run: |
          set -euo pipefail
          LANG="${{ inputs.language }}"
          if [ -z "$LANG" ]; then
            if [ -f Cargo.toml ]; then LANG=rust
            elif [ -f pyproject.toml ] || [ -f setup.py ] || [ -f requirements.txt ]; then LANG=python
            elif [ -f package.json ]; then LANG=node
            elif [ -f Project.toml ]; then LANG=julia
            else
              echo "::warning::Could not detect language; nothing to mutate."
              LANG=none
            fi
          fi
          echo "lang=$LANG" >> "$GITHUB_OUTPUT"
          echo "Detected language: $LANG"

      # ── Rust: cargo-mutants ─────────────────────────────────────────────────
      - name: Setup Rust
        if: steps.detect.outputs.lang == 'rust'
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce78e0234b8f96b7ae60248 # stable
        with:
          toolchain: stable

      - name: Install cargo-mutants
        if: steps.detect.outputs.lang == 'rust'
        run: cargo install cargo-mutants --locked --version 24.11.2

      - name: Run cargo-mutants
        if: steps.detect.outputs.lang == 'rust'
        id: rust-mutants
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p mutation-results
          cargo mutants --json --output mutation-results/ --timeout-multiplier 2.0 || true
          # Compute score
          python3 <<'PY'
          import json, os, pathlib
          mj = pathlib.Path("mutation-results/mutants.out/outcomes.json")
          if not mj.exists():
              print("No outcomes.json produced")
              exit
          data = json.loads(mj.read_text())
          outcomes = data.get("outcomes", [])
          total = len(outcomes)
          killed = sum(1 for o in outcomes if o.get("summary") == "CAUGHT")
          score = round(100 * killed / total, 1) if total else 0.0
          print(f"Total: {total}, Killed: {killed}, Score: {score}%")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\nkilled={killed}\nscore={score}\n")
          PY

      # ── Python: mutmut ─────────────────────────────────────────────────────
      - name: Setup Python
        if: steps.detect.outputs.lang == 'python'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Python deps + mutmut
        if: steps.detect.outputs.lang == 'python'
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
          pip install mutmut==3.2.0 pytest

      - name: Run mutmut
        if: steps.detect.outputs.lang == 'python'
        id: python-mutmut
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p mutation-results
          # Configure mutmut to use pytest
          cat > setup.cfg.mutmut <<'EOF'
          [mutmut]
          runner = python -m pytest -x --tb=no -q
          EOF
          mutmut run --paths-to-mutate src || true
          mutmut results > mutation-results/mutmut-results.txt || true
          # Compute score from mutmut's output
          python3 <<'PY'
          import os, re, subprocess
          out = subprocess.run(["mutmut", "results"], capture_output=True, text=True).stdout
          killed = len(re.findall(r"^\s*\w+\s*$", out, re.MULTILINE)) if "killed" in out.lower() else 0
          # mutmut doesn't emit a machine-readable summary easily; use its junit export if possible
          subprocess.run(["mutmut", "junitxml"], capture_output=True, text=True, stdout=open("mutation-results/mutmut.xml", "w"))
          # Very rough score parse:
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse("mutation-results/mutmut.xml")
              root = tree.getroot()
              total = int(root.attrib.get("tests", "0"))
              failures = int(root.attrib.get("failures", "0"))
              # failures in mutmut xml = survived mutants; killed = total - failures
              killed = total - failures
              score = round(100 * killed / total, 1) if total else 0.0
          except Exception:
              total = killed = 0
              score = 0.0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\nkilled={killed}\nscore={score}\n")
          print(f"Total: {total}, Killed: {killed}, Score: {score}%")
          PY

      # ── Node: Stryker ──────────────────────────────────────────────────────
      - name: Setup Node
        if: steps.detect.outputs.lang == 'node'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install Stryker
        if: steps.detect.outputs.lang == 'node'
        run: |
          set -euo pipefail
          npm install --no-save \
            @stryker-mutator/core@8.6.0 \
            @stryker-mutator/jest-runner@8.6.0 \
            @stryker-mutator/typescript-checker@8.6.0 || true

      - name: Run Stryker
        if: steps.detect.outputs.lang == 'node'
        id: node-stryker
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p mutation-results
          npx stryker run --reporters json,progress || true
          # Stryker writes reports/mutation/mutation.json by default
          python3 <<'PY'
          import json, os, pathlib
          p = pathlib.Path("reports/mutation/mutation.json")
          if not p.exists():
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("total=0\nkilled=0\nscore=0\n")
              exit
          data = json.loads(p.read_text())
          killed = 0; survived = 0; timed_out = 0; no_coverage = 0
          for file_data in data.get("files", {}).values():
              for m in file_data.get("mutants", []):
                  s = m.get("status")
                  if s == "Killed": killed += 1
                  elif s == "Survived": survived += 1
                  elif s == "Timeout": timed_out += 1
                  elif s == "NoCoverage": no_coverage += 1
          total = killed + survived + timed_out + no_coverage
          # Stryker's mutation score includes timeouts as killed
          score = round(100 * (killed + timed_out) / total, 1) if total else 0.0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\nkilled={killed+timed_out}\nscore={score}\n")
          print(f"Total: {total}, Killed+Timeout: {killed+timed_out}, Score: {score}%")
          # Move report to mutation-results
          import shutil
          shutil.copytree("reports/mutation", "mutation-results/stryker", dirs_exist_ok=True)
          PY

      - name: Julia notice
        if: steps.detect.outputs.lang == 'julia'
        run: |
          echo "::notice::Mutation testing is not well-supported for Julia. Consider MutationTesting.jl (experimental) or rely on strong unit tests + integration tests."
          echo "score=n/a" >> "$GITHUB_OUTPUT"

      - name: Compute final verdict
        id: verdict
        run: |
          set -euo pipefail
          LANG="${{ steps.detect.outputs.lang }}"
          MIN="${{ inputs.min-score }}"
          # Pull the score from whichever job ran
          SCORE="${{ steps.rust-mutants.outputs.score || steps.python-mutmut.outputs.score || steps.node-stryker.outputs.score || '0' }}"
          TOTAL="${{ steps.rust-mutants.outputs.total || steps.python-mutmut.outputs.total || steps.node-stryker.outputs.total || '0' }}"
          KILLED="${{ steps.rust-mutants.outputs.killed || steps.python-mutmut.outputs.killed || steps.node-stryker.outputs.killed || '0' }}"

          {
            echo "# Mutation Testing Results"
            echo ""
            echo "- **Language:** $LANG"
            echo "- **Mutants generated:** $TOTAL"
            echo "- **Mutants killed:** $KILLED"
            echo "- **Mutation score:** $SCORE%"
            echo "- **Minimum required:** $MIN%"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.fail-under-min }}" = "true" ] && [ "$LANG" != "julia" ] && [ "$LANG" != "none" ]; then
            # Float compare via python
            python3 -c "
          import sys
          s = float('$SCORE' or 0)
          m = float('$MIN')
          if s < m:
              print(f'::error::Mutation score {s}% below required {m}%')
              sys.exit(1)
          print(f'Mutation score {s}% meets the {m}% threshold.')
          "
          fi

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: mutation-results-${{ github.run_id }}
          path: mutation-results/
          retention-days: 90
          if-no-files-found: ignore
