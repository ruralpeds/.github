name: "Cost Killswitch"

# Manually triggered kill-switch for GitHub Actions cost runaways.
# Disables high-cost workflows across the ruralpeds org based on chosen preset.
#
# Auth: GitHub App token only.
#   - vars.TH_BOT_APP_ID + secrets.TH_BOT_PRIVATE_KEY (required)
#
# Per .github/instructions/workflows.instructions.md, org-wide dispatch
# automation must use a GitHub App token, never a long-lived PAT. The job
# fails closed if App credentials are unavailable.
#
# The App must have:
#   - actions: write on every target repo
#   - administration: read to list workflows

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Preset to apply"
        type: choice
        required: true
        default: "all"
        options:
          - rust-sci-core-extras
          - cancel-running
          - all
      dry_run:
        description: "Dry run (print actions only, do not disable/cancel)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: cost-killswitch
  cancel-in-progress: false

jobs:
  killswitch:
    name: Apply ${{ inputs.target }} (dry_run=${{ inputs.dry_run }})
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          persist-credentials: false

      - name: Require App credentials
        run: |
          if [ -z "${{ vars.TH_BOT_APP_ID }}" ] || [ -z "${{ secrets.TH_BOT_PRIVATE_KEY }}" ]; then
            echo "::error::App credentials missing. Configure both vars.TH_BOT_APP_ID and secrets.TH_BOT_PRIVATE_KEY."
            echo "::error::This workflow performs org-wide control-plane actions; PAT fallback is not permitted."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276b0f2ebde5d8cd729c4d5  # v1
        with:
          app-id: ${{ vars.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Export token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Mask explicitly so any future debug output redacts the token, in
          # addition to the implicit masking provided by create-github-app-token.
          echo "::add-mask::$APP_TOKEN"
          echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
          echo "::notice::Using GitHub App installation token"

      - name: Run killswitch
        env:
          ORG: ${{ github.repository_owner }}
        run: |
          args=(--target "${{ inputs.target }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/cost_killswitch.sh "${args[@]}" | tee killswitch.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Cost Killswitch — ${{ inputs.target }}"
            echo ""
            echo "- dry_run: \`${{ inputs.dry_run }}\`"
            echo "- triggered by: @${{ github.actor }}"
            echo ""
            echo "### Output"
            echo '```'
            cat killswitch.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: killswitch-log-${{ github.run_number }}
          path: killswitch.log
          retention-days: 30
