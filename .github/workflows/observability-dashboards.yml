name: Observability - Dashboard Generation

on:
  workflow_run:
    workflows: ['Observability - Alert Detection']
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate dashboards for (YYYY-MM-DD)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate-dashboards:
    name: Generate Dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create dashboard directory
        run: mkdir -p audit-log/observability/dashboards

      - name: Generate dashboards
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          python3 scripts/dashboard-generator.py \
            --metrics-file audit-log/observability/aggregated/aggregated-${DATE}.json \
            --alerts-file audit-log/observability/alerts/alerts-${DATE}.json \
            --output-dir audit-log/observability/dashboards \
            --date "${DATE}"

          # Create index
          cat > audit-log/observability/dashboards/README.md <<'EOF'
          # CI/CD Observability Dashboards

          Real-time visibility into GitHub Actions infrastructure health, performance, and cost.

          ## Dashboards

          - [Summary](dashboard-summary.md) - Overview and quick status
          - [Status](dashboard-status.md) - Queue depth, job success rate, alerts
          - [Performance](dashboard-performance.md) - Duration trends, slowest workflows, regressions
          - [Health](dashboard-health.md) - System resources, reliability metrics

          ## Metrics

          - **Raw Metrics**: `audit-log/observability/daily/metrics-raw-*.jsonl`
          - **Aggregated**: `audit-log/observability/aggregated/aggregated-*.json`
          - **Alerts**: `audit-log/observability/alerts/alerts-*.json`

          ## Quick Links

          - [Alert Runbooks](../../docs/runbooks/)
          - [Observability Plan](../../docs/PHASE_5C_OBSERVABILITY_PLAN.md)
          EOF

      - name: Archive dashboards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboards-${{ github.run_id }}
          path: audit-log/observability/dashboards/
          retention-days: 90

  publish-dashboards:
    name: Publish Dashboards
    needs: generate-dashboards
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Download generated dashboards
        uses: actions/download-artifact@v4
        with:
          name: dashboards-${{ github.run_id }}
          path: public/dashboards

      - name: Copy static files
        run: |
          mkdir -p public/css
          cat > public/css/style.css <<'EOF'
          body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
          }
          h1 { color: #0366d6; border-bottom: 2px solid #0366d6; padding-bottom: 10px; }
          h2 { color: #24292e; margin-top: 24px; }
          table { border-collapse: collapse; width: 100%; }
          th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
          th { background-color: #f6f8fa; }
          .critical { color: #d73a49; font-weight: bold; }
          .warning { color: #e36209; font-weight: bold; }
          .healthy { color: #28a745; font-weight: bold; }
          EOF

      - name: Create index page
        run: |
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>CI/CD Observability</title>
            <link rel="stylesheet" href="css/style.css">
            <meta charset="utf-8">
          </head>
          <body>
            <h1>CI/CD Observability Platform</h1>

            <p>Real-time visibility into GitHub Actions infrastructure health, performance, and cost.</p>

            <h2>Dashboards</h2>
            <ul>
              <li><a href="dashboards/dashboard-summary.md">Summary Dashboard</a></li>
              <li><a href="dashboards/dashboard-status.md">Status Dashboard</a></li>
              <li><a href="dashboards/dashboard-performance.md">Performance Dashboard</a></li>
              <li><a href="dashboards/dashboard-health.md">Health Dashboard</a></li>
            </ul>

            <h2>Documentation</h2>
            <ul>
              <li><a href="https://github.com/ruralpeds/.github/blob/main/docs/PHASE_5C_OBSERVABILITY_PLAN.md">Observability Architecture</a></li>
              <li><a href="https://github.com/ruralpeds/.github/blob/main/docs/runbooks/">Alert Runbooks</a></li>
            </ul>

            <hr>
            <p><small>Generated by Observability Platform</small></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check observability system health
        run: |
          echo "## Observability System Health Check"
          echo ""

          # Check if required directories exist
          REQUIRED_DIRS=(
            "audit-log/observability/daily"
            "audit-log/observability/aggregated"
            "audit-log/observability/alerts"
            "audit-log/observability/dashboards"
          )

          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir exists"
            else
              echo "⚠️  $dir missing (will be created on first run)"
            fi
          done

          # Check if required scripts exist
          REQUIRED_SCRIPTS=(
            "scripts/collect-metrics.sh"
            "scripts/metrics-aggregator.py"
            "scripts/alert-detector.py"
            "scripts/dashboard-generator.py"
          )

          echo ""
          for script in "${REQUIRED_SCRIPTS[@]}"; do
            if [ -f "$script" ]; then
              echo "✅ $script exists"
            else
              echo "❌ $script missing"
            fi
          done

          echo ""
          echo "✅ Observability system health check complete"
