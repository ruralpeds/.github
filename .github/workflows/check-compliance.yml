name: "Check Compliance"

on:
  schedule:
    # Every Monday at 7 AM UTC (after repo-scanner at 6 AM)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub org or username to scan (defaults to repo owner)"
        required: false
        type: string
        default: ""
      fail-on-non-compliant:
        description: "Fail the workflow if any repos are non-compliant"
        required: false
        type: boolean
        default: false
      create-issue:
        description: "Create a GitHub issue with the compliance summary"
        required: false
        type: boolean
        default: true

jobs:
  compliance-check:
    name: Scan org CI compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run compliance check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_SETUP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ORG="${{ inputs.org || github.repository_owner }}"
          python3 scripts/check_compliance.py "$ORG" \
            --output compliance-report \
            ${{ inputs.fail-on-non-compliant && '--fail-on-non-compliant' || '' }}

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ github.run_number }}
          path: compliance-report/
          retention-days: 30

      - name: Create GitHub issue with compliance summary
        if: (inputs.create-issue == true || inputs.create-issue == '') && steps.check.outputs.non_compliant != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REPO_SETUP_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('compliance-report/compliance.json', 'utf8'));
            const nonCompliant = report.repos.filter(r => !r.compliant);

            let body = `## CI & Audit Compliance Report\n\n`;
            body += `**Scanned:** ${report.checked_at}\n`;
            body += `**Total repos:** ${report.total} | **Compliant:** ${report.compliant} | **Non-compliant:** ${nonCompliant.length}\n\n`;

            if (nonCompliant.length > 0) {
              body += `### ❌ Non-Compliant Repos\n\n`;
              body += `| Repo | Languages | Missing |\n|------|-----------|--------|\n`;
              for (const r of nonCompliant) {
                const langs = (r.languages || []).join(', ') || 'unknown';
                const missing = (r.missing || []).join(', ');
                body += `| [${r.repo}](https://github.com/${report.org}/${r.repo}) | ${langs} | ${missing} |\n`;
              }
              body += `\n`;
            }

            body += `### ✅ Compliant Repos\n\n`;
            const compliant = report.repos.filter(r => r.compliant);
            body += compliant.map(r => `- [${r.repo}](https://github.com/${report.org}/${r.repo})`).join('\n');
            body += `\n\n_Run [\`repo-scanner.yml\`](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/repo-scanner.yml) to auto-bootstrap missing workflows._`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Compliance: ${nonCompliant.length} repos need attention (${new Date().toISOString().split('T')[0]})`,
              body: body,
              labels: ['compliance', 'automated'],
            });
