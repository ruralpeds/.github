# ──────────────────────────────────────────────────────────────
# Sync Julia Tasks — timothyhartzog/Peds → timothyhartzog/pedsedu-jl
#
# On every push to main, this workflow:
#   1. Diffs the commit(s) to detect new/changed files
#   2. Categorises changes (crates, decision-trees, content,
#      components, WASM bindings, knowledge registry, tests)
#   3. Creates a structured GitHub Issue in pedsedu-jl with a
#      task checklist mapping each Rust/Svelte addition to its
#      Julia equivalent
# ──────────────────────────────────────────────────────────────
name: Sync Julia Tasks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-julia-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Peds repo (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Analyse diff and create issue
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          PEDS_REPO: timothyhartzog/Peds
          JULIA_REPO: timothyhartzog/pedsedu-jl
        run: python scripts/sync_julia_tasks.py
