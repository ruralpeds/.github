name: "Release"

on:
  workflow_call:
    inputs:
      release-type:
        description: "Release type: auto (from commits), major, minor, patch"
        type: string
        default: "auto"
      draft:
        description: "Create as draft release"
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
      generate-changelog:
        description: "Auto-generate changelog from conventional commits"
        type: boolean
        default: true
      tag-prefix:
        description: "Version tag prefix"
        type: string
        default: "v"
      working-directory:
        description: "Working directory"
        type: string
        default: "."
      build-command:
        description: "Build command to run before release (blank = skip)"
        type: string
        default: ""
      node-version:
        description: "Node.js version (for JS projects)"
        type: string
        default: "20"
    outputs:
      version:
        description: "The released version"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "The created git tag"
        value: ${{ jobs.release.outputs.tag }}
      release-url:
        description: "URL of the GitHub release"
        value: ${{ jobs.release.outputs.release-url }}
      changelog:
        description: "Generated changelog"
        value: ${{ jobs.release.outputs.changelog }}

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.new_tag }}
      release-url: ${{ steps.gh-release.outputs.url }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          # Try to get latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No previous tags found, starting from 0.0.0"
          else
            VER="${LATEST_TAG#${{ inputs.tag-prefix }}}"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "Current version: $VER (tag: $LATEST_TAG)"
          fi

      - name: Determine version bump
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
        run: |
          if [ "$RELEASE_TYPE" != "auto" ]; then
            echo "type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
            echo "Explicit bump: $RELEASE_TYPE"
            exit 0
          fi

          # Analyze conventional commits since last tag
          if [ -n "$CURRENT_TAG" ]; then
            RANGE="$CURRENT_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log "$RANGE" --format="%s" 2>/dev/null || git log --format="%s")

          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            # Breaking change: "feat!:", "fix!:", "BREAKING CHANGE" in body
            if echo "$msg" | grep -qE '^[a-z]+!:|BREAKING CHANGE'; then
              HAS_BREAKING=true
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              HAS_FEAT=true
            elif echo "$msg" | grep -qE '^fix(\(.+\))?:'; then
              HAS_FIX=true
            fi
          done <<< "$COMMITS"

          if [ "$HAS_BREAKING" = true ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            echo "Breaking changes detected -> major"
          elif [ "$HAS_FEAT" = true ]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            echo "New features detected -> minor"
          elif [ "$HAS_FIX" = true ]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "Bug fixes detected -> patch"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "No conventional commits found, defaulting to patch"
          fi

      - name: Calculate new version
        id: version
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP="${{ steps.bump.outputs.type }}"
          PREFIX="${{ inputs.tag-prefix }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="${PREFIX}${NEW_VERSION}"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Release: $CURRENT -> $NEW_VERSION ($BUMP) [tag: $NEW_TAG]"

      - name: Generate changelog
        id: changelog
        if: inputs.generate-changelog
        run: |
          CURRENT_TAG="${{ steps.current.outputs.tag }}"
          NEW_TAG="${{ steps.version.outputs.new_tag }}"

          if [ -n "$CURRENT_TAG" ]; then
            RANGE="$CURRENT_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          CHANGELOG=""

          # Breaking changes
          BREAKING=$(git log "$RANGE" --format="%s" | grep -E '^[a-z]+!:|BREAKING CHANGE' || true)
          if [ -n "$BREAKING" ]; then
            CHANGELOG="$CHANGELOG## Breaking Changes\n"
            while IFS= read -r line; do
              [ -n "$line" ] && CHANGELOG="$CHANGELOG- $line\n"
            done <<< "$BREAKING"
            CHANGELOG="$CHANGELOG\n"
          fi

          # Features
          FEATS=$(git log "$RANGE" --format="%s" | grep -E '^feat(\(.+\))?:' | grep -v '!:' || true)
          if [ -n "$FEATS" ]; then
            CHANGELOG="$CHANGELOG## Features\n"
            while IFS= read -r line; do
              [ -n "$line" ] && CHANGELOG="$CHANGELOG- ${line#feat*: }\n"
            done <<< "$FEATS"
            CHANGELOG="$CHANGELOG\n"
          fi

          # Bug fixes
          FIXES=$(git log "$RANGE" --format="%s" | grep -E '^fix(\(.+\))?:' | grep -v '!:' || true)
          if [ -n "$FIXES" ]; then
            CHANGELOG="$CHANGELOG## Bug Fixes\n"
            while IFS= read -r line; do
              [ -n "$line" ] && CHANGELOG="$CHANGELOG- ${line#fix*: }\n"
            done <<< "$FIXES"
            CHANGELOG="$CHANGELOG\n"
          fi

          # Other changes
          OTHERS=$(git log "$RANGE" --format="%s" | grep -vE '^(feat|fix)(\(.+\))?(!)?: |^Merge ' || true)
          if [ -n "$OTHERS" ]; then
            CHANGELOG="$CHANGELOG## Other Changes\n"
            while IFS= read -r line; do
              [ -n "$line" ] && CHANGELOG="$CHANGELOG- $line\n"
            done <<< "$OTHERS"
            CHANGELOG="$CHANGELOG\n"
          fi

          # Contributors
          CONTRIBUTORS=$(git log "$RANGE" --format="%an" | sort -u)
          if [ -n "$CONTRIBUTORS" ]; then
            CHANGELOG="$CHANGELOG## Contributors\n"
            while IFS= read -r name; do
              [ -n "$name" ] && CHANGELOG="$CHANGELOG- $name\n"
            done <<< "$CONTRIBUTORS"
          fi

          # Write to file and output
          echo -e "$CHANGELOG" > CHANGELOG_RELEASE.md
          echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

          echo "--- Generated changelog ---"
          echo -e "$CHANGELOG"

      - name: Update version in project files
        working-directory: ${{ inputs.working-directory }}
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # package.json (Node.js)
          if [ -f package.json ]; then
            TMP=$(mktemp)
            python3 -c "
          import json
          with open('package.json') as f:
              pkg = json.load(f)
          pkg['version'] = '$NEW_VERSION'
          with open('$TMP', 'w') as f:
              json.dump(pkg, f, indent=2)
              f.write('\n')
          "
            mv "$TMP" package.json
            echo "Updated package.json -> $NEW_VERSION"
          fi

          # Cargo.toml (Rust)
          if [ -f Cargo.toml ]; then
            sed -i "0,/^version = .*/s//version = \"$NEW_VERSION\"/" Cargo.toml
            echo "Updated Cargo.toml -> $NEW_VERSION"
          fi

          # pyproject.toml (Python)
          if [ -f pyproject.toml ]; then
            sed -i "s/^version = .*/version = \"$NEW_VERSION\"/" pyproject.toml
            echo "Updated pyproject.toml -> $NEW_VERSION"
          fi

          # VERSION file
          if [ -f VERSION ]; then
            echo "$NEW_VERSION" > VERSION
            echo "Updated VERSION -> $NEW_VERSION"
          fi

      - name: Build (optional)
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Setup Node if needed
          if echo "${{ inputs.build-command }}" | grep -qE 'npm|yarn|pnpm|npx'; then
            echo "Node.js build detected"
          fi
          ${{ inputs.build-command }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage version file changes (if any)
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          fi

      - name: Create tag
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin HEAD --tags
          echo "Created and pushed tag: $NEW_TAG"

      - name: Create GitHub Release
        id: gh-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          ARGS="--title \"$NEW_TAG\" --tag \"$NEW_TAG\""

          if [ "${{ inputs.draft }}" = "true" ]; then
            ARGS="$ARGS --draft"
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS="$ARGS --prerelease"
          fi

          if [ -f CHANGELOG_RELEASE.md ]; then
            BODY_FILE="CHANGELOG_RELEASE.md"
          else
            BODY_FILE=""
          fi

          if [ -n "$BODY_FILE" ]; then
            URL=$(gh release create "$NEW_TAG" \
              --title "$NEW_TAG" \
              --notes-file "$BODY_FILE" \
              ${{ inputs.draft == true && '--draft' || '' }} \
              ${{ inputs.prerelease == true && '--prerelease' || '' }} \
              2>&1 | tail -1)
          else
            URL=$(gh release create "$NEW_TAG" \
              --title "$NEW_TAG" \
              --generate-notes \
              ${{ inputs.draft == true && '--draft' || '' }} \
              ${{ inputs.prerelease == true && '--prerelease' || '' }} \
              2>&1 | tail -1)
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Release created: $URL"
