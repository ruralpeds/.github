name: "Dependency EOL Tracker"
# Monitors end-of-life (EOL) status for runtime dependencies using endoflife.date.
# Opens / updates an issue when dependencies approach or pass EOL.
#
# Regulatory drivers:
#   - NIST SSDF RV.1.2 — Review, analyze, test, and prioritize vulnerability reports
#   - FDA Cybersecurity Premarket Guidance (Sept 2023) — maintenance planning
#   - HIPAA §164.308(a)(5)(ii)(B) — protection from malicious software
#
# Runs monthly (1st at 10:00 UTC) and on workflow_dispatch.
#
# Consumes the CycloneDX SBOM at sbom/sbom.cyclonedx.json if present; otherwise
# checks a hard-coded set of common runtime platforms.

on:
  schedule:
    - cron: "0 10 1 * *"  # 1st of each month at 10:00 UTC
  workflow_dispatch:
    inputs:
      warn-within-days:
        description: "Warn if EOL is within N days (default 180)"
        type: number
        default: 180

permissions:
  contents: read
  issues: write

jobs:
  eol-check:
    name: Check dependency EOL status
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Check EOL status
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WARN_DAYS: ${{ inputs.warn-within-days || 180 }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          from datetime import datetime, timezone, date
          from pathlib import Path

          warn_days = int(os.environ["WARN_DAYS"])

          # Try to read the SBOM; if not present, fall back to language detection
          products_to_check = set()
          sbom_path = Path("sbom/sbom.cyclonedx.json")
          if sbom_path.exists():
              data = json.loads(sbom_path.read_text())
              # Map PURL types / component names to endoflife.date product names.
              # Highly selective — only runtime platforms, not every library.
              PRODUCT_MAP = {
                  "node": "nodejs",
                  "python": "python",
                  "ruby": "ruby",
                  "go": "go",
                  "rust": "rust",
                  "java": "java",
                  "postgres": "postgresql",
                  "postgresql": "postgresql",
                  "mysql": "mysql",
                  "redis": "redis",
                  "nginx": "nginx",
                  "alpine": "alpine",
                  "ubuntu": "ubuntu",
                  "debian": "debian",
                  "django": "django",
                  "flask": "flask",
                  "fastapi": "fastapi",
                  "rails": "rails",
              }
              for c in data.get("components", []):
                  name = (c.get("name") or "").lower()
                  purl = c.get("purl") or ""
                  # Match against the known-runtime list
                  for key, product in PRODUCT_MAP.items():
                      if key == name or f"/{key}@" in purl or purl.startswith(f"pkg:{key}"):
                          products_to_check.add(product)

          # If still empty, fall back to language auto-detection from the repo
          if not products_to_check:
              print("No runtime platforms detected in SBOM; auto-detecting from repo files.")
              checks = {
                  "package.json": "nodejs",
                  "pyproject.toml": "python",
                  "requirements.txt": "python",
                  "Cargo.toml": "rust",
                  "go.mod": "go",
                  "Gemfile": "ruby",
              }
              for fn, prod in checks.items():
                  if Path(fn).exists():
                      products_to_check.add(prod)

          if not products_to_check:
              print("No runtime platforms to check.")
              sys.exit(0)

          print(f"Checking EOL for: {sorted(products_to_check)}")

          findings = []
          today = date.today()

          for product in sorted(products_to_check):
              try:
                  url = f"https://endoflife.date/api/{product}.json"
                  with urllib.request.urlopen(url, timeout=15) as r:
                      cycles = json.loads(r.read())
              except Exception as e:
                  print(f"::warning::Could not fetch {product} EOL data: {e}")
                  continue

              # For each supported major cycle, compute days to EOL
              for cycle in cycles[:5]:  # only most recent 5 cycles
                  eol_val = cycle.get("eol")
                  if eol_val in (False, True, None):
                      # 'false' means "active"; 'true' means "eol" with no date
                      continue
                  try:
                      eol_date = date.fromisoformat(eol_val)
                  except (TypeError, ValueError):
                      continue
                  days_to_eol = (eol_date - today).days
                  if days_to_eol <= warn_days:
                      findings.append({
                          "product": product,
                          "cycle": cycle.get("cycle"),
                          "eol_date": eol_val,
                          "days_to_eol": days_to_eol,
                          "latest": cycle.get("latest"),
                          "lts": cycle.get("lts", False),
                      })

          # Write a summary
          rpt = Path("eol-report.md")
          lines = [
              "# Dependency End-of-Life Report",
              "",
              f"**Generated:** {datetime.now(timezone.utc).isoformat()}",
              f"**Warning threshold:** {warn_days} days",
              f"**Platforms checked:** {', '.join(sorted(products_to_check))}",
              "",
          ]
          if findings:
              lines.append(f"## ⚠️ {len(findings)} cycle(s) at/past EOL or within {warn_days} days")
              lines.append("")
              lines.append("| Product | Cycle | EOL date | Days to EOL | Latest | LTS |")
              lines.append("|---|---|---|---|---|---|")
              for f in sorted(findings, key=lambda x: x["days_to_eol"]):
                  status_icon = "❌" if f["days_to_eol"] < 0 else "⚠️"
                  lines.append(f"| {status_icon} {f['product']} | {f['cycle']} | {f['eol_date']} | {f['days_to_eol']} | {f['latest']} | {f['lts']} |")
              lines.append("")
              lines.append("## Remediation")
              lines.append("")
              lines.append("For each cycle within the warning window:")
              lines.append("1. Evaluate whether your deployment actually uses this cycle (SBOM query)")
              lines.append("2. If yes, plan an upgrade PR; include testing scope in CR-YYYY-NNN")
              lines.append("3. If not used, close this alert with a note indicating which cycle is actually deployed")
          else:
              lines.append(f"✅ All runtime platform cycles have more than {warn_days} days to EOL.")
          rpt.write_text("\n".join(lines))

          # Also emit JSON for downstream processing
          Path("eol-findings.json").write_text(json.dumps({
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "warn_days": warn_days,
              "findings": findings,
          }, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(rpt.read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"finding_count={len(findings)}\n")

          # Prepare issue-body artifact
          Path("eol-issue-body.md").write_text(rpt.read_text())
          PY

      - name: Open / update tracking issue
        if: ${{ steps.check.outputs.finding_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="[EOL TRACKING] Dependencies approaching or past end-of-life"
          # Check for an existing open issue with this title
          EXISTING=$(gh issue list --label "dependency-eol" --state open --json number,title \
            --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file eol-issue-body.md
          else
            echo "Creating new issue"
            gh issue create \
              --title "$TITLE" \
              --label "dependency-eol,maintenance,needs-review" \
              --body-file eol-issue-body.md
          fi

      - name: Upload EOL artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: eol-report-${{ github.run_id }}
          path: |
            eol-report.md
            eol-findings.json
          retention-days: 90
          if-no-files-found: ignore
