name: Update Build Audit Log

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-audit-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for accurate audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate audit log
        run: python scripts/generate_audit_log.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet BUILD_AUDIT_LOG.md build-log.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated audit log
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BUILD_AUDIT_LOG.md build-log.json
          git commit -m "chore: update build audit log [skip ci]"
          git push
