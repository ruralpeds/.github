name: "Audit Log"

on:
  workflow_call:
    inputs:
      audit-branch:
        description: "Branch to store audit logs (empty = same branch in audit-log/ dir)"
        type: string
        default: ""
      include-deps:
        description: "Include dependency snapshot"
        type: boolean
        default: true
      include-test-summary:
        description: "Include test result summary"
        type: boolean
        default: true
      retention-entries:
        description: "Max audit entries to retain (0 = unlimited)"
        type: number
        default: 500

jobs:
  audit:
    name: Generate audit entry
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gather build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"
          echo "event=${GITHUB_EVENT_NAME}" >> "$GITHUB_OUTPUT"

          # Creation date: first commit date
          CREATED=$(git log --reverse --format=%aI | head -1)
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

          # Last modified: latest commit date
          MODIFIED=$(git log -1 --format=%aI)
          echo "modified=$MODIFIED" >> "$GITHUB_OUTPUT"

          # Commit details
          echo "commit_msg=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
          echo "commit_author=$(git log -1 --format='%an <%ae>')" >> "$GITHUB_OUTPUT"

          # Tag if present
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Collect dependency snapshot
        if: inputs.include-deps
        run: |
          mkdir -p audit-data
          # Node.js
          if [ -f package-lock.json ]; then
            npm list --json --all 2>/dev/null > audit-data/deps-node.json || true
          fi
          if [ -f yarn.lock ]; then
            echo "yarn.lock present" > audit-data/deps-yarn.txt
          fi
          # Python
          if [ -f requirements.txt ]; then
            cp requirements.txt audit-data/deps-python-requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            cp pyproject.toml audit-data/deps-python-pyproject.toml
          fi
          # Rust
          if [ -f Cargo.lock ]; then
            cp Cargo.lock audit-data/deps-rust-Cargo.lock
          fi
          # Go
          if [ -f go.sum ]; then
            cp go.sum audit-data/deps-go.sum
          fi
          # Julia
          if [ -f Manifest.toml ]; then
            cp Manifest.toml audit-data/deps-julia-Manifest.toml
          fi

      - name: Generate comprehensive audit entry
        env:
          META_SHA: ${{ steps.meta.outputs.sha }}
          META_SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          META_BRANCH: ${{ steps.meta.outputs.branch }}
          META_REPO: ${{ steps.meta.outputs.repo }}
          META_TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          META_RUN_ID: ${{ steps.meta.outputs.run_id }}
          META_RUN_NUMBER: ${{ steps.meta.outputs.run_number }}
          META_ACTOR: ${{ steps.meta.outputs.actor }}
          META_EVENT: ${{ steps.meta.outputs.event }}
          META_CREATED: ${{ steps.meta.outputs.created }}
          META_MODIFIED: ${{ steps.meta.outputs.modified }}
          META_COMMIT_MSG: ${{ steps.meta.outputs.commit_msg }}
          META_COMMIT_AUTHOR: ${{ steps.meta.outputs.commit_author }}
          META_TAG: ${{ steps.meta.outputs.tag }}
          INCLUDE_DEPS: ${{ inputs.include-deps }}
          RETENTION: ${{ inputs.retention-entries }}
        run: |
          python3 << 'PYEOF'
          import json, os, glob
          from datetime import datetime, timezone

          repo = os.environ["META_REPO"]
          sha = os.environ["META_SHA"]
          short = os.environ["META_SHORT_SHA"]

          # --- Build the audit entry ---
          entry = {
              "id": f"{datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')}_{short}",
              "schema_version": "2.0",
              "timestamp": os.environ["META_TIMESTAMP"],
              "repository": repo,
              "date_created": os.environ.get("META_CREATED", ""),
              "date_modified": os.environ.get("META_MODIFIED", ""),
              "build": {
                  "run_id": os.environ["META_RUN_ID"],
                  "run_number": os.environ["META_RUN_NUMBER"],
                  "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
                  "event": os.environ["META_EVENT"],
                  "actor": os.environ["META_ACTOR"],
                  "runner_os": os.environ.get("RUNNER_OS", ""),
              },
              "commit": {
                  "sha": sha,
                  "short_sha": short,
                  "message": os.environ.get("META_COMMIT_MSG", ""),
                  "author": os.environ.get("META_COMMIT_AUTHOR", ""),
                  "branch": os.environ["META_BRANCH"],
                  "tag": os.environ.get("META_TAG") or None,
              },
              "references": {
                  "commit_url": f"https://github.com/{repo}/commit/{sha}",
                  "run_url": f"https://github.com/{repo}/actions/runs/{os.environ['META_RUN_ID']}",
                  "tree_url": f"https://github.com/{repo}/tree/{sha}",
                  "compare_url": f"https://github.com/{repo}/compare/{short}^...{short}",
              },
              "status": "success",
          }

          # Add dependency snapshot
          if os.environ.get("INCLUDE_DEPS") == "true":
              deps = {}
              for f in sorted(glob.glob("audit-data/deps-*")):
                  name = os.path.basename(f).replace("deps-", "")
                  try:
                      content = open(f).read()
                      if f.endswith(".json"):
                          deps[name] = json.loads(content)
                      else:
                          deps[name] = content.strip()[:5000]  # Cap size
                  except Exception:
                      pass
              if deps:
                  entry["dependencies"] = deps

          # --- Update the ledger ---
          os.makedirs("audit-log", exist_ok=True)
          ledger_path = "audit-log/ledger.json"

          if os.path.exists(ledger_path):
              try:
                  ledger = json.loads(open(ledger_path).read())
              except Exception:
                  ledger = None
          else:
              ledger = None

          if not ledger:
              ledger = {
                  "schema_version": "2.0",
                  "created_at": entry["timestamp"],
                  "repository": repo,
                  "builds": [],
                  "summary": {},
              }

          ledger["last_updated"] = entry["timestamp"]

          # Deduplicate by SHA
          existing = {b["commit"]["sha"] for b in ledger["builds"]}
          if sha not in existing:
              ledger["builds"].append(entry)
          else:
              for b in ledger["builds"]:
                  if b["commit"]["sha"] == sha:
                      b["date_modified"] = entry["timestamp"]
                      b["build"] = entry["build"]
                      break

          # Enforce retention
          retention = int(os.environ.get("RETENTION", "500"))
          if retention > 0 and len(ledger["builds"]) > retention:
              ledger["builds"] = ledger["builds"][-retention:]

          # Update summary
          builds = ledger["builds"]
          contributors = sorted(set(b["build"]["actor"] for b in builds if b.get("build", {}).get("actor")))
          ledger["summary"] = {
              "total_builds": len(builds),
              "first_build": builds[0]["timestamp"] if builds else None,
              "last_build": builds[-1]["timestamp"] if builds else None,
              "date_created": builds[0].get("date_created", "") if builds else "",
              "date_last_modified": entry["date_modified"],
              "contributors": contributors,
          }

          # Write ledger
          with open(ledger_path, "w") as f:
              json.dump(ledger, f, indent=2)
          print(f"Ledger updated: {len(builds)} builds tracked")

          # Write individual entry
          entry_path = f"audit-log/{entry['id']}.json"
          with open(entry_path, "w") as f:
              json.dump(entry, f, indent=2)
          print(f"Entry: {entry_path}")
          PYEOF

      - name: Commit audit log to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          AUDIT_BRANCH="${{ inputs.audit-branch }}"

          if [ -n "$AUDIT_BRANCH" ]; then
            # Store on separate branch
            if git ls-remote --heads origin "$AUDIT_BRANCH" | grep -q .; then
              git fetch origin "$AUDIT_BRANCH"
              git checkout "$AUDIT_BRANCH"
            else
              git checkout --orphan "$AUDIT_BRANCH"
              git rm -rf . 2>/dev/null || true
            fi
            cp -r audit-log/ .
            git add audit-log/
          else
            # Store in same branch under audit-log/
            git add audit-log/
          fi

          if git diff --cached --quiet; then
            echo "No new audit entries"
          else
            git commit -m "audit: build ${{ steps.meta.outputs.short_sha }} @ ${{ steps.meta.outputs.timestamp }}"
            PUSH_BRANCH="${AUDIT_BRANCH:-${{ steps.meta.outputs.branch }}}"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:"$PUSH_BRANCH"; then
                echo "Push succeeded"
                break
              fi
              WAIT=$((attempt * 2))
              echo "Push failed, retrying in ${WAIT}s..."
              sleep "$WAIT"
            done
          fi
