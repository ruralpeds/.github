# .github/workflows/org-dashboard.yml
# Standalone scheduled workflow — lives in ruralpeds/.github
# Publishes a static health dashboard for all ruralpeds/* repos to GitHub Pages.
#
# Page shows, per repo:
#   • Classification (clinical-software / library / docs / etc.)
#   • AUDIT.yaml freshness (green < interval, yellow ≥ interval, red missing)
#   • Latest compliance run status (success/failure/none)
#   • SBOM age
#   • Branch protection status
#   • Last push date
#   • FDA class, HIPAA flag
#   • Open security alerts count

name: Org Health Dashboard

on:
  schedule:
    - cron: '0 12 */2 * *'   # every other day at noon UTC (content rarely changes daily)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/org-dashboard.yml'
      - 'scripts/build_dashboard.py'
      - 'dashboard-template/**'

permissions:
  contents: read
  actions:  read
  pages:    write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, mac-studio, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Install deps
        run: |
          python3 -m pip install --user pyyaml python-dateutil jinja2

      - name: Build dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          ORG:      ruralpeds
        run: |
          python3 scripts/build_dashboard.py \
              --org "$ORG" \
              --output _site \
              --template dashboard-template

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
