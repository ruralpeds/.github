name: "FDA Review Monitoring"

# Validates that the Q2-Q3 2027 FDA review and clearance planning artifacts
# are present and cover weekly monitoring plus deficiency-response readiness.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fda-review-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate FDA review monitoring
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate review monitoring artifacts
        run: |
          set -euo pipefail

          REVIEW_PLAN="compliance-metrics/Q2-Q3-2027-review-and-clearance.md"
          SUBMISSION_PLAN="compliance-metrics/Q1-2027-FDA-submission.md"
          POST_CLEARANCE_PLAN="compliance-metrics/Q4-2027-post-clearance-deployment.md"
          POST_MARKET_WORKFLOW=".github/workflows/post-market-tracker.yml"
          READINESS_REPORT="/tmp/fda-review-monitoring.txt"

          test -f "$REVIEW_PLAN"
          test -f "$SUBMISSION_PLAN"
          test -f "$POST_CLEARANCE_PLAN"
          test -f "$POST_MARKET_WORKFLOW"

          grep -q "FDA portal checked weekly" "$REVIEW_PLAN"
          grep -q "Deficiency notice received" "$REVIEW_PLAN"
          grep -q "Expected FDA Decision" "$REVIEW_PLAN"
          grep -q "Deficiency Response Contingency Plan" "$SUBMISSION_PLAN"
          grep -q "Post-Clearance Setup" "$POST_CLEARANCE_PLAN"

          {
            echo "review_plan=$REVIEW_PLAN"
            echo "submission_plan=$SUBMISSION_PLAN"
            echo "post_clearance_plan=$POST_CLEARANCE_PLAN"
            echo "post_market_workflow=$POST_MARKET_WORKFLOW"
            echo "weekly_monitoring=verified"
            echo "deficiency_response=verified"
            echo "clearance_handoff=verified"
          } | tee "$READINESS_REPORT"

      - name: Upload monitoring artifact
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: fda-review-monitoring-${{ github.run_id }}
          path: |
            /tmp/fda-review-monitoring.txt
            compliance-metrics/Q2-Q3-2027-review-and-clearance.md
            compliance-metrics/Q1-2027-FDA-submission.md
            compliance-metrics/Q4-2027-post-clearance-deployment.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          {
            echo "## FDA Review Monitoring"
            echo ""
            echo "| Artifact | Path |"
            echo "|---|---|"
            echo "| Review plan | compliance-metrics/Q2-Q3-2027-review-and-clearance.md |"
            echo "| Submission contingency source | compliance-metrics/Q1-2027-FDA-submission.md |"
            echo "| Post-clearance handoff | compliance-metrics/Q4-2027-post-clearance-deployment.md |"
            echo "| Post-market workflow | .github/workflows/post-market-tracker.yml |"
          } >> "$GITHUB_STEP_SUMMARY"
