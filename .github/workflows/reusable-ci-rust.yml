name: "Reusable CI — Rust"
# Reusable Rust CI workflow for healthcare enterprise repositories.
# Derived from HEALTHCARE_ENTERPRISE_REPO_BLUEPRINT.md controls.
#
# Callers: uses: ruralpeds/.github/.github/workflows/reusable-ci-rust.yml@main
#
# Covers: fmt, clippy, stable test matrix, optional nightly, caching,
#         artifact upload for test reports.

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Primary Rust toolchain (default: stable)"
        type: string
        default: "stable"
      run-nightly:
        description: "Also run tests on nightly toolchain"
        type: boolean
        default: false
      working-directory:
        description: "Directory containing Cargo.toml"
        type: string
        default: "."
      run-clippy:
        description: "Run clippy lints (fail on warnings)"
        type: boolean
        default: true
      run-fmt:
        description: "Run rustfmt check"
        type: boolean
        default: true
      cargo-features:
        description: "Comma-separated feature flags to pass to cargo"
        type: string
        default: ""
      test-timeout-minutes:
        description: "Timeout in minutes for the test job"
        type: number
        default: 20
      upload-test-report:
        description: "Upload test results artifact if present"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── 1. Format ────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    if: ${{ inputs.run-fmt }}
    runs-on: [self-hosted, mac-studio, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain (${{ inputs.toolchain }}) + rustfmt
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce78e0234b8f96b7ae60248  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
      - name: Check formatting
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt --all -- --check

  # ── 2. Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    if: ${{ inputs.run-clippy }}
    runs-on: [self-hosted, mac-studio, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain (${{ inputs.toolchain }}) + clippy
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce78e0234b8f96b7ae60248  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.7
        with:
          workspaces: "${{ inputs.working-directory }} -> target"
      - name: Run clippy
        working-directory: ${{ inputs.working-directory }}
        run: |
          FEATURES_FLAG=""
          if [ -n "${{ inputs.cargo-features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.cargo-features }}"
          fi
          cargo clippy --all-targets $FEATURES_FLAG -- -D warnings

  # ── 3. Tests (stable) ────────────────────────────────────────────────────────
  test-stable:
    name: "Test (stable)"
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: ${{ fromJson(inputs.test-timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain (${{ inputs.toolchain }})
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce78e0234b8f96b7ae60248  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.7
        with:
          workspaces: "${{ inputs.working-directory }} -> target"
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: |
          FEATURES_FLAG=""
          if [ -n "${{ inputs.cargo-features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.cargo-features }}"
          fi
          cargo build --all-targets $FEATURES_FLAG
      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          FEATURES_FLAG=""
          if [ -n "${{ inputs.cargo-features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.cargo-features }}"
          fi
          cargo test --all-targets $FEATURES_FLAG 2>&1 | tee test-results.txt
      - name: Run doc tests
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --doc
      - name: Upload test report
        if: ${{ inputs.upload-test-report && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-rust-stable
          path: "${{ inputs.working-directory }}/test-results.txt"
          retention-days: 7
          if-no-files-found: ignore

  # ── 4. Tests (nightly, optional) ─────────────────────────────────────────────
  test-nightly:
    name: "Test (nightly)"
    if: ${{ inputs.run-nightly }}
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: ${{ fromJson(inputs.test-timeout-minutes) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce78e0234b8f96b7ae60248  # stable
        with:
          toolchain: nightly
      - name: Restore Rust cache (nightly)
        uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609 # v2.7.7
        with:
          workspaces: "${{ inputs.working-directory }} -> target"
          key: nightly
      - name: Run tests on nightly
        working-directory: ${{ inputs.working-directory }}
        run: |
          FEATURES_FLAG=""
          if [ -n "${{ inputs.cargo-features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.cargo-features }}"
          fi
          cargo test --all-targets $FEATURES_FLAG 2>&1 | tee test-results-nightly.txt
      - name: Upload nightly test report
        if: ${{ inputs.upload-test-report && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-rust-nightly
          path: "${{ inputs.working-directory }}/test-results-nightly.txt"
          retention-days: 7
          if-no-files-found: ignore
