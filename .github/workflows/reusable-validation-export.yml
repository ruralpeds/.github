name: "Reusable Validation Package Export"
# On release, gathers the complete validation evidence bundle (SBOM, SLSA,
# signatures, RTM, risk file, test evidence, PHI scan, review history) into
# a single artifact and dispatches it to timothyhartzog/Github-workflow for
# long-term retention.
#
# Regulatory drivers:
#   - GAMP 5 §4.2 — Validation package for regulated systems
#   - IEC 62304 §5.8 — Software release
#   - 21 CFR 820.30(j) — Design history file
#   - HIPAA §164.316(b)(2)(i) — 6-year record retention
#
# Pairs with timothyhartzog/Github-workflow/.github/workflows/import-validation-package.yml
# which receives the repository_dispatch and deposits the bundle.

on:
  workflow_call:
    inputs:
      archive-repo:
        description: "Target archive repository"
        type: string
        default: "timothyhartzog/Github-workflow"
      version:
        description: "Release version (default: github.ref_name)"
        type: string
        default: ""
      include-paths:
        description: "Newline-separated paths to include in the bundle"
        type: string
        default: |
          sbom/
          risk/
          traceability/
          audit-log/
          docs/data-classification.md
          docs/threat-model.md
          docs/audit-events.md
          README.md
          LICENSE
    secrets:
      archive-dispatch-token:
        description: "Token with repository_dispatch permission on the archive repo"
        required: true

permissions:
  contents: read

jobs:
  export:
    name: Export validation package
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME:-unknown}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Build validation bundle
        id: build
        run: |
          set -euo pipefail
          BUNDLE_DIR="validation-bundle"
          mkdir -p "$BUNDLE_DIR"

          # Copy included paths
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ -e "$path" ]; then
              mkdir -p "$BUNDLE_DIR/$(dirname "$path")"
              cp -r "$path" "$BUNDLE_DIR/$(dirname "$path")/" 2>/dev/null \
                || cp "$path" "$BUNDLE_DIR/$(dirname "$path")/" 2>/dev/null \
                || echo "::warning::Could not copy $path"
            else
              echo "::notice::Path $path not present — skipping."
            fi
          done <<< "${{ inputs.include-paths }}"

          # Manifest
          cat > "$BUNDLE_DIR/MANIFEST.md" <<EOF
          # Validation Package Manifest

          **Repository:** ${{ github.repository }}
          **Version:** ${{ steps.ver.outputs.version }}
          **Commit:** ${{ github.sha }}
          **Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Workflow run:** ${{ github.run_id }}

          ## Contents

          $(find "$BUNDLE_DIR" -type f -not -name MANIFEST.md | sort | sed 's|^'"$BUNDLE_DIR"'/|- `|;s|$|`|')

          ## Regulatory basis

          - GAMP 5 §4.2 — Validation package
          - IEC 62304 §5.8 — Software release
          - 21 CFR 820.30(j) — Design history file
          - HIPAA §164.316(b)(2)(i) — 6-year record retention

          ## Verification

          - SBOM: \`cosign verify-blob sbom.cyclonedx.json --bundle <sig>\`
          - SLSA: \`slsa-verifier verify-artifact ...\`
          - Tag signature: \`git verify-tag ${{ steps.ver.outputs.version }}\`
          EOF

          # Tarball
          tar -czf "validation-bundle.tar.gz" -C "$BUNDLE_DIR" .
          SIZE=$(stat -c%s "validation-bundle.tar.gz")
          HASH=$(sha256sum "validation-bundle.tar.gz" | awk '{print $1}')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Bundle: $SIZE bytes, SHA-256 $HASH"

      - name: Upload bundle as release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: validation-bundle.tar.gz
          fail_on_unmatched_files: false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: validation-bundle-${{ github.run_id }}
          path: |
            validation-bundle.tar.gz
            validation-bundle/MANIFEST.md
          retention-days: 365

      - name: Dispatch to archive repo
        env:
          GH_TOKEN: ${{ secrets.archive-dispatch-token }}
          ARCHIVE_REPO: ${{ inputs.archive-repo }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ github.sha }}
          HASH: ${{ steps.build.outputs.hash }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Trigger the import-validation-package workflow in the archive repo.
          # We dispatch with URL references so the importer fetches the bundle
          # from this release's assets.
          # Note: the archive import workflow will `gh release download` the
          # artifacts via the GH_TOKEN it has.
          cat > dispatch.json <<EOF
          {
            "event_type": "validation-package-import",
            "client_payload": {
              "source_repo": "$REPO",
              "version": "$VERSION",
              "release_tag": "$VERSION",
              "commit_sha": "$SHA",
              "bundle_sha256": "$HASH",
              "workflow_run_id": "$RUN_ID"
            }
          }
          EOF

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$ARCHIVE_REPO/dispatches" \
            --data @dispatch.json \
          && echo "✓ Dispatched to $ARCHIVE_REPO" \
          || {
            echo "::warning::Dispatch to $ARCHIVE_REPO failed. Ensure archive-dispatch-token has repository_dispatch permission on $ARCHIVE_REPO."
            cat dispatch.json
          }

      - name: Summary
        run: |
          {
            echo "# Validation Package Exported"
            echo ""
            echo "- **Repo:** ${{ github.repository }}"
            echo "- **Version:** ${{ steps.ver.outputs.version }}"
            echo "- **Bundle size:** ${{ steps.build.outputs.size }} bytes"
            echo "- **SHA-256:** \`${{ steps.build.outputs.hash }}\`"
            echo "- **Archive destination:** \`${{ inputs.archive-repo }}\`"
            echo ""
            echo "See MANIFEST.md in the uploaded artifact for the full content listing."
          } >> "$GITHUB_STEP_SUMMARY"
