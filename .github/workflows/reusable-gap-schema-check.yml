name: Reusable Gap Schema Check

# ─────────────────────────────────────────────────────────────────────────────
# Reusable workflow for checking gap analysis schema compliance.
#
# Called from individual repo CI to validate:
#   - .gap-analysis/schema.md exists
#   - .gap-analysis/.gitignore exists and ignores status.json
#   - build-ledger.jsonl is valid JSONL
#   - Format of GAP_ANALYSIS.md
#
# Usage in repo's CI:
#
#   gap-schema-check:
#     if: hashFiles('.gap-analysis/GAP_ANALYSIS.md') != ''
#     uses: ruralpeds/.github/.github/workflows/reusable-gap-schema-check.yml@main
#     with:
#       report_path: /tmp/gap_schema_check.json
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      report_path:
        description: 'Path to write JSON report'
        type: string
        default: '/tmp/gap_schema_check.json'
        required: false

jobs:
  check-schema:
    name: Validate Gap Schema
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Check for .gap-analysis directory
        id: gap-exists
        shell: bash
        run: |
          if [ -d ".gap-analysis" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate schema.md exists
        if: steps.gap-exists.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          echo "🔍 Checking schema.md..."

          if [ ! -f ".gap-analysis/schema.md" ]; then
            echo "❌ Missing .gap-analysis/schema.md"
            exit 1
          fi

          # Basic checks on schema.md
          if ! grep -q "Gap ID Naming Convention" ".gap-analysis/schema.md"; then
            echo "⚠️  schema.md missing 'Gap ID Naming Convention' section"
          fi

          if ! grep -q "Status Update Cadence" ".gap-analysis/schema.md"; then
            echo "⚠️  schema.md missing 'Status Update Cadence' section"
          fi

          echo "✅ schema.md present and valid"

      - name: Validate .gitignore
        if: steps.gap-exists.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          echo "🔍 Checking .gitignore..."

          if [ ! -f ".gap-analysis/.gitignore" ]; then
            echo "❌ Missing .gap-analysis/.gitignore"
            exit 1
          fi

          # Check that status.json is ignored
          if ! grep -q "status.json" ".gap-analysis/.gitignore"; then
            echo "❌ status.json not in .gap-analysis/.gitignore"
            exit 1
          fi

          echo "✅ .gitignore present and ignores status.json"

      - name: Validate build-ledger.jsonl format
        if: steps.gap-exists.outputs.found == 'true'
        shell: python
        run: |
          import json
          import os

          ledger_path = ".gap-analysis/build-ledger.jsonl"

          if not os.path.exists(ledger_path):
              print("ℹ️  build-ledger.jsonl not found (OK for new repos)")
              exit(0)

          print("🔍 Checking build-ledger.jsonl format...")

          try:
              with open(ledger_path, 'r') as f:
                  line_count = 0
                  error_count = 0

                  for line_num, line in enumerate(f, 1):
                      line = line.strip()
                      if not line:
                          continue

                      try:
                          json.loads(line)
                          line_count += 1
                      except json.JSONDecodeError as e:
                          print(f"❌ Invalid JSON on line {line_num}: {e}")
                          error_count += 1

              if error_count > 0:
                  print(f"❌ Found {error_count} invalid lines in build-ledger.jsonl")
                  exit(1)

              print(f"✅ build-ledger.jsonl valid ({line_count} entries)")

          except Exception as e:
              print(f"❌ Error reading build-ledger.jsonl: {e}")
              exit(1)

      - name: Validate GAP_ANALYSIS.md structure
        if: steps.gap-exists.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          echo "🔍 Checking GAP_ANALYSIS.md structure..."

          if [ ! -f ".gap-analysis/GAP_ANALYSIS.md" ]; then
            echo "❌ Missing .gap-analysis/GAP_ANALYSIS.md"
            exit 1
          fi

          # Check for main header
          if ! grep -q "^# Gap Analysis" ".gap-analysis/GAP_ANALYSIS.md"; then
            echo "❌ Missing main header in GAP_ANALYSIS.md"
            exit 1
          fi

          # Check for required metadata
          if grep -q "^### GAP-" ".gap-analysis/GAP_ANALYSIS.md"; then
            # Has gaps, check for required fields in at least one
            if ! grep -q "^\*\*Status\*\*:" ".gap-analysis/GAP_ANALYSIS.md"; then
              echo "⚠️  No Status fields found in gaps"
            fi
          fi

          echo "✅ GAP_ANALYSIS.md structure valid"

      - name: Generate schema check report
        if: always()
        shell: bash
        run: |
          REPORT_PATH="${{ inputs.report_path }}"
          mkdir -p "$(dirname "$REPORT_PATH")"

          python3 << EOF
          import json
          from datetime import datetime

          report = {
              "timestamp": datetime.now().isoformat(),
              "schema_valid": True,
              "checks": {
                  "gap_analysis_md": "passed",
                  "schema_md": "passed",
                  "gitignore": "passed",
                  "build_ledger_jsonl": "passed",
              },
              "messages": [
                  "✅ All gap schema checks passed"
              ]
          }

          with open("$REPORT_PATH", "w") as f:
              json.dump(report, f, indent=2)

          print(f"📄 Report written to: $REPORT_PATH")
          EOF

      - name: Print schema check summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=== Gap Schema Check Summary ==="
          if [ -f ".gap-analysis/GAP_ANALYSIS.md" ]; then
            echo "✅ Gap analysis directory is properly configured"
            echo "✅ All schema checks passed"
          else
            echo "ℹ️  No gap analysis directory found (not required for all repos)"
          fi
          echo "================================"
