# .github/workflows/fda-bundle.yml
# Reusable workflow: FDA 510(k) Submission Bundle
# Host in:  ruralpeds/.github/.github/workflows/fda-bundle.yml
# Callable from any clinical-software repo that may go to FDA.
#
# What's in the bundle (aligned with FDA eSTAR §II.3 Software Documentation
# and 2023 cybersecurity guidance):
#
#   bundle/
#     manifest.json                  ← signed with cosign, SHA256 of everything
#     manifest.json.sig
#     manifest.json.crt
#     device/
#       device_description.md         ← from docs/device/description.md (required)
#       intended_use.md               ← from docs/device/intended_use.md (required)
#       indications_for_use.md
#       predicate_device.md           ← 510(k) only
#       risk_analysis.md              ← ISO 14971 summary
#       hazard_analysis.xlsx          ← if present
#     software/
#       sbom_cyclonedx.json           ← from SBOM workflow
#       sbom_spdx.json
#       architecture_diagram.pdf      ← if present
#       software_description.md
#       unresolved_anomalies.md
#       revision_history.md           ← from git log
#     cybersecurity/
#       threat_model.md               ← STRIDE / STPA
#       cybersecurity_risk.md
#       sbom_vulnerabilities.json     ← grype output
#       security_controls.md
#     verification_validation/
#       test_protocols.md
#       test_results.html             ← from pytest-html / cargo test --emit
#       coverage_report.html
#       traceability_matrix.csv       ← requirements ↔ tests
#     quality_system/
#       audit_log.yaml                ← copy of .github/AUDIT.yaml
#       change_control.md             ← from git history
#       design_controls.md
#       signed_commit_ledger.txt
#     labeling/
#       user_manual.pdf               ← if present
#       electronic_ifu.html           ← if present
#     human_factors/
#       use_related_risk.md           ← if present
#
# Any missing optional files produce warnings; any missing REQUIRED files fail.

name: FDA 510(k) Submission Bundle (Reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag being bundled'
        required: true
        type: string
      device-name:
        description: 'Marketed device name'
        required: true
        type: string
      device-class:
        description: 'II | III'
        required: true
        type: string
      predicate-k-number:
        description: 'K-number of predicate device (optional)'
        required: false
        type: string
        default: ''
      submission-type:
        description: '510k | de-novo | pma'
        required: false
        type: string
        default: '510k'
      runner-label:
        required: false
        type: string
        default: 'self-hosted,mac-studio,arm64'
    outputs:
      bundle-url:
        value: ${{ jobs.bundle.outputs.url }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.p.outputs.labels }}
    steps:
      - id: p
        run: |
          IFS=',' read -ra L <<< "${{ inputs.runner-label }}"
          echo "labels=$(printf '%s\n' "${L[@]}" | jq -Rn '[inputs]' | jq -c .)" >> "$GITHUB_OUTPUT"

  bundle:
    needs: resolve-runner
    runs-on: ${{ fromJson(needs.resolve-runner.outputs.labels) }}
    outputs:
      url: ${{ steps.up.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install tooling
        run: |
          for b in syft grype cosign jq yq; do
            brew list "$b" >/dev/null 2>&1 || brew install "$b"
          done
          python3 -m pip install --user pyyaml

      - name: Set up bundle skeleton
        run: |
          mkdir -p bundle/{device,software,cybersecurity,verification_validation,quality_system,labeling,human_factors}

      # ── REQUIRED DEVICE DOCS ─────────────────────────────────
      - name: Collect device documentation
        run: |
          required=(
            "docs/device/description.md:device/device_description.md"
            "docs/device/intended_use.md:device/intended_use.md"
          )
          missing=()
          for pair in "${required[@]}"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            if [ -f "$src" ]; then cp "$src" "$dst"
            else missing+=("$src")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required FDA documents:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          # optional device docs
          for pair in \
            "docs/device/indications.md:device/indications_for_use.md" \
            "docs/device/predicate.md:device/predicate_device.md" \
            "docs/device/risk_analysis.md:device/risk_analysis.md" \
            "docs/device/hazard_analysis.xlsx:device/hazard_analysis.xlsx"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            [ -f "$src" ] && cp "$src" "$dst" || echo "::warning::optional: $src not found"
          done

      # ── SOFTWARE ─────────────────────────────────────────────
      - name: SBOM + vuln scan
        run: |
          syft . -o cyclonedx-json=bundle/software/sbom_cyclonedx.json
          syft . -o spdx-json=bundle/software/sbom_spdx.json
          grype sbom:bundle/software/sbom_cyclonedx.json -o json > bundle/cybersecurity/sbom_vulnerabilities.json || true
          # Software description + revision history
          {
            echo "# Revision History — ${{ inputs.device-name }}"
            echo ""
            git log --pretty='- %cs %h %s (%an)' | head -200
          } > bundle/software/revision_history.md
          for pair in \
            "docs/software/description.md:software/software_description.md" \
            "docs/software/architecture.pdf:software/architecture_diagram.pdf" \
            "docs/software/unresolved_anomalies.md:software/unresolved_anomalies.md"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            [ -f "$src" ] && cp "$src" "$dst" || echo "::warning::optional: $src"
          done

      # ── CYBERSECURITY ────────────────────────────────────────
      - name: Collect cybersecurity artifacts
        run: |
          for pair in \
            "docs/security/threat_model.md:cybersecurity/threat_model.md" \
            "docs/security/cyber_risk.md:cybersecurity/cybersecurity_risk.md" \
            "docs/security/controls.md:cybersecurity/security_controls.md"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            [ -f "$src" ] && cp "$src" "$dst" || echo "::warning::optional: $src"
          done

      # ── V&V ──────────────────────────────────────────────────
      - name: Collect V&V artifacts
        run: |
          for pair in \
            "docs/vv/test_protocols.md:verification_validation/test_protocols.md" \
            "docs/vv/traceability.csv:verification_validation/traceability_matrix.csv" \
            "test-reports/test_results.html:verification_validation/test_results.html" \
            "test-reports/coverage.html:verification_validation/coverage_report.html" \
            "coverage/index.html:verification_validation/coverage_report.html"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            [ -f "$src" ] && cp "$src" "$dst" || echo "::warning::optional: $src"
          done

      # ── QUALITY SYSTEM ───────────────────────────────────────
      - name: Collect quality-system artifacts
        run: |
          [ -f .github/AUDIT.yaml ] && cp .github/AUDIT.yaml bundle/quality_system/audit_log.yaml
          {
            echo "# Change Control Log"
            echo ""
            git log --pretty=format:'| %cs | %h | %an | %s |' --reverse
          } > bundle/quality_system/change_control.md
          git log --pretty='%G? %H %s' > bundle/quality_system/signed_commit_ledger.txt
          for pair in \
            "docs/qms/design_controls.md:quality_system/design_controls.md"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            [ -f "$src" ] && cp "$src" "$dst" || true
          done

      # ── LABELING + HUMAN FACTORS ─────────────────────────────
      - name: Collect labeling + human factors
        run: |
          for pair in \
            "docs/labeling/user_manual.pdf:labeling/user_manual.pdf" \
            "docs/labeling/ifu.html:labeling/electronic_ifu.html" \
            "docs/hf/use_related_risk.md:human_factors/use_related_risk.md"; do
            src="${pair%%:*}"; dst="bundle/${pair##*:}"
            [ -f "$src" ] && cp "$src" "$dst" || echo "::warning::optional: $src"
          done

      # ── MANIFEST ─────────────────────────────────────────────
      - name: Build & sign manifest
        run: |
          python3 <<'PY'
          import hashlib, json, os, sys, datetime, subprocess
          def sha256(p):
              h = hashlib.sha256()
              h.update(open(p, 'rb').read())
              return h.hexdigest()

          files = {}
          for root, _, fs in os.walk('bundle'):
              for f in fs:
                  if f == 'manifest.json' or f.endswith(('.sig', '.crt')):
                      continue
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, 'bundle')
                  files[rel] = {'sha256': sha256(p), 'size': os.path.getsize(p)}

          manifest = {
              'schema_version': '1.0',
              'device_name':    os.environ['DEVICE_NAME'],
              'device_class':   os.environ['DEVICE_CLASS'],
              'submission_type': os.environ['SUBMISSION_TYPE'],
              'predicate_k_number': os.environ.get('PREDICATE') or None,
              'tag':            os.environ['TAG'],
              'commit_sha':     os.environ['COMMIT_SHA'],
              'repository':     os.environ['REPOSITORY'],
              'built_at':       datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'built_by':       os.environ['ACTOR'],
              'run_id':         os.environ['RUN_ID'],
              'files':          files,
          }
          with open('bundle/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f"Manifest: {len(files)} files")
          PY
        env:
          DEVICE_NAME:     ${{ inputs.device-name }}
          DEVICE_CLASS:    ${{ inputs.device-class }}
          SUBMISSION_TYPE: ${{ inputs.submission-type }}
          PREDICATE:       ${{ inputs.predicate-k-number }}
          TAG:             ${{ inputs.tag }}
          COMMIT_SHA:      ${{ github.sha }}
          REPOSITORY:      ${{ github.repository }}
          ACTOR:           ${{ github.actor }}
          RUN_ID:          ${{ github.run_id }}

      - name: Sign manifest
        run: |
          cosign sign-blob --yes \
            --output-signature bundle/manifest.json.sig \
            --output-certificate bundle/manifest.json.crt \
            bundle/manifest.json

      - name: Zip bundle
        run: |
          cd bundle
          zip -rq ../fda-bundle-${{ inputs.tag }}.zip .
          cd ..
          ls -lh fda-bundle-${{ inputs.tag }}.zip

      - id: up
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fda-bundle-${{ inputs.tag }}
          path: fda-bundle-${{ inputs.tag }}.zip
          retention-days: 2555

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" "fda-bundle-${{ inputs.tag }}.zip" --clobber || true
