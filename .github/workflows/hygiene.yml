name: Repo Hygiene

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC Mondays (stale thresholds are 45–90 days; daily was redundant)
  pull_request:
    branches: [main]
    paths:
      - 'workflows/**'
      - '.github/workflows/**'
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  block-stray-workflows-dir:
    name: Block stray top-level /workflows/ directory
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Fail if /workflows/*.yml exists
        run: |
          if compgen -G "workflows/*.yml" > /dev/null || compgen -G "workflows/*.yaml" > /dev/null; then
            echo "::error::A top-level /workflows/ directory has reappeared. GitHub Actions only loads .github/workflows/. See GAP-002."
            ls -la workflows/ || true
            exit 1
          fi
          echo "OK: no stray workflows directory."

  stale:
    runs-on: [self-hosted, mac-studio, arm64]
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639  # v9
        with:
          # --- Pull Request policy ---
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: |
            This PR has had no activity for 45 days and is being marked stale.
            It will auto-close in 14 days unless there is new activity or one
            of the `keep`, `pinned`, `in-progress`, or `security` labels is applied.
          close-pr-message: |
            Closing as stale. Reopen anytime if you want to pick it back up.
          exempt-pr-labels: 'keep,pinned,in-progress,security'
          delete-branch: true

          # --- Issue policy (gentler than PRs) ---
          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: stale
          stale-issue-message: |
            This issue has had no activity for 90 days and is being marked stale.
            It will auto-close in 30 days unless there is new activity or one
            of the `keep`, `pinned`, `bug`, or `security` labels is applied.
          close-issue-message: |
            Closing as stale. Reopen anytime.
          exempt-issue-labels: 'keep,pinned,bug,security'

          # --- Safety rails ---
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true