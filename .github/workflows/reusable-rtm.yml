name: "Reusable Requirements Traceability Matrix (RTM)"
# Scans PRs, commits, test names, and issues to build a Requirements
# Traceability Matrix linking User Needs → Functional Requirements →
# Design Specs → Implementations → Tests → Verification evidence.
#
# Regulatory drivers:
#   - GAMP 5 §4.2 — Requirements, risk, and life-cycle approach
#   - IEC 62304 §5.2 — Software requirements analysis
#   - ISO 13485:2016 §7.3.9 — Control of design and development changes
#   - 21 CFR 820.30(g) — Design validation
#
# Callers: uses: timothyhartzog/.github/.github/workflows/reusable-rtm.yml@main
#
# Requirement ID convention (required across all clinical repos):
#   - REQ-<REPO>-<NNN>  — User requirement (URS)
#   - FRS-<REPO>-<NNN>  — Functional requirement
#   - DS-<REPO>-<NNN>   — Design specification
#   - HAZ-<REPO>-<NNN>  — Hazard
#   - CR-YYYY-NNN       — Change request (in Github-workflow repo)
#   - CAPA-YYYY-NNN     — CAPA (in Github-workflow repo)
#
# References to requirements are parsed from:
#   - Commit messages (case-insensitive grep for the IDs above)
#   - PR titles and descriptions
#   - Issue bodies (for open requirements)
#   - Test function/method names (e.g., test_req_peds_042_normal_hr)
#   - Code comments (// Implements REQ-PEDS-042)
#
# Outputs:
#   - traceability/rtm.json   — machine-readable matrix
#   - traceability/rtm.md     — human-readable table
#   - Gap report: requirements without tests, tests without requirements
#
# Runs:
#   - On push to main (keeps matrix current)
#   - On schedule (weekly full rebuild)
#   - On workflow_dispatch (ad-hoc)

on:
  workflow_call:
    inputs:
      requirement-prefixes:
        description: "Space-separated list of ID prefixes to track (default: REQ FRS DS HAZ)"
        type: string
        default: "REQ FRS DS HAZ"
      test-pattern:
        description: "Regex to extract req ID from test names (default: matches req_<repo>_<nnn>)"
        type: string
        default: '(req|frs|ds|haz)_[a-z0-9-]+_[0-9]+'
      commit-rtm:
        description: "Commit the RTM to the traceability/ directory"
        type: boolean
        default: true
      fail-on-orphans:
        description: "Fail if requirements exist without tests, or tests without requirement references"
        type: boolean
        default: false
      min-coverage-pct:
        description: "Minimum requirements-with-tests coverage percentage to pass"
        type: number
        default: 80

permissions:
  contents: read

jobs:
  rtm:
    name: Build RTM
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml requests --quiet

      - name: Build RTM
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIXES: ${{ inputs.requirement-prefixes }}
          TEST_PATTERN: ${{ inputs.test-pattern }}
        run: |
          set -euo pipefail
          mkdir -p traceability
          python3 <<'PY'
          import os, re, json, subprocess, sys, glob, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path
          from collections import defaultdict

          prefixes = os.environ.get("PREFIXES", "REQ FRS DS HAZ").split()
          test_pattern_str = os.environ.get("TEST_PATTERN", r'(req|frs|ds|haz)_[a-z0-9-]+_[0-9]+')
          test_pat = re.compile(test_pattern_str, re.IGNORECASE)

          # Regex to find requirement IDs in any text.
          # Matches e.g. REQ-PEDS-042, FRS-PedNeoSim-007, HAZ-BIOS-012.
          id_pat = re.compile(
              r"\b(" + "|".join(prefixes) + r")-[A-Za-z0-9]+-\d+\b"
          )

          requirements = {}

          def ensure(rid):
              rid = rid.upper()
              if rid not in requirements:
                  requirements[rid] = {
                      "id": rid,
                      "type": rid.split("-")[0],
                      "repo_token": rid.split("-")[1] if rid.count("-") >= 2 else "",
                      "found_in": {"code": [], "tests": [], "commits": [], "issues": [], "prs": []},
                      "status": "unknown",
                  }
              return requirements[rid]

          # 1. Scan source and doc files for requirement refs
          text_ext = {".py", ".rs", ".jl", ".go", ".js", ".ts", ".tsx", ".jsx", ".md", ".toml", ".yml", ".yaml"}
          for p in Path(".").rglob("*"):
              if p.is_dir():
                  continue
              if any(part.startswith(".git") for part in p.parts):
                  continue
              if p.suffix not in text_ext:
                  continue
              try:
                  content = p.read_text(errors="replace")
              except Exception:
                  continue
              for m in id_pat.finditer(content):
                  rid = m.group(0).upper()
                  # Classify location: test vs code vs doc
                  path_str = str(p)
                  if "/test" in path_str or path_str.startswith("test") or "_test." in path_str or ".test." in path_str:
                      bucket = "tests"
                  elif p.suffix == ".md":
                      bucket = "issues"  # treat docs as spec refs
                  else:
                      bucket = "code"
                  ensure(rid)["found_in"][bucket].append(path_str)

          # 2. Scan git log for requirement refs in commit messages
          log_output = subprocess.run(
              ["git", "log", "--pretty=format:%H|%ai|%s%n%b%n==END=="],
              capture_output=True, text=True, check=True
          ).stdout
          entries = log_output.split("==END==\n")
          for entry in entries:
              if not entry.strip(): continue
              lines = entry.strip().split("\n", 1)
              header = lines[0]
              body = lines[1] if len(lines) > 1 else ""
              try:
                  sha, date, msg = header.split("|", 2)
              except ValueError:
                  continue
              for m in id_pat.finditer(msg + " " + body):
                  rid = m.group(0).upper()
                  ensure(rid)["found_in"]["commits"].append({
                      "sha": sha[:7], "date": date, "msg": msg[:80]
                  })

          # 3. Query GitHub for issues and PRs
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          if repo and token:
              for kind in ("issues", "pulls"):
                  url = f"https://api.github.com/repos/{repo}/{kind}?state=all&per_page=100"
                  try:
                      req = urllib.request.Request(url, headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                      })
                      with urllib.request.urlopen(req, timeout=15) as r:
                          items = json.loads(r.read())
                      for item in items:
                          text = (item.get("title") or "") + " " + (item.get("body") or "")
                          for m in id_pat.finditer(text):
                              rid = m.group(0).upper()
                              bucket = "prs" if kind == "pulls" else "issues"
                              ensure(rid)["found_in"][bucket].append({
                                  "number": item.get("number"),
                                  "title": (item.get("title") or "")[:80],
                                  "state": item.get("state"),
                              })
                  except Exception as e:
                      print(f"::warning::Failed to query {kind}: {e}")

          # 4. Compute status per requirement
          for rid, r in requirements.items():
              has_test = len(r["found_in"]["tests"]) > 0
              has_code = len(r["found_in"]["code"]) > 0
              has_commit = len(r["found_in"]["commits"]) > 0
              if has_test and has_code:
                  r["status"] = "verified"
              elif has_code and not has_test:
                  r["status"] = "implemented-untested"
              elif not has_code and not has_test and has_commit:
                  r["status"] = "referenced-only"
              elif has_test and not has_code:
                  r["status"] = "test-without-impl"
              else:
                  r["status"] = "unknown"

          # 5. Summary statistics
          total = len(requirements)
          by_status = defaultdict(int)
          for r in requirements.values():
              by_status[r["status"]] += 1
          verified = by_status["verified"]
          coverage = round(100 * verified / total, 1) if total else 0.0

          now = datetime.now(timezone.utc).isoformat()
          matrix = {
              "schema_version": "1.0",
              "generated_at": now,
              "repository": repo,
              "totals": {
                  "requirements": total,
                  "verified": verified,
                  "implemented_untested": by_status["implemented-untested"],
                  "referenced_only": by_status["referenced-only"],
                  "test_without_impl": by_status["test-without-impl"],
                  "coverage_pct": coverage,
              },
              "requirements": sorted(requirements.values(), key=lambda r: r["id"]),
          }

          Path("traceability/rtm.json").write_text(json.dumps(matrix, indent=2))

          # 6. Human-readable Markdown
          md = []
          md.append(f"# Requirements Traceability Matrix")
          md.append("")
          md.append(f"**Repository:** `{repo}`  ")
          md.append(f"**Generated:** {now}  ")
          md.append(f"**Coverage:** {coverage}% ({verified}/{total} verified)")
          md.append("")
          md.append("## Summary")
          md.append("")
          md.append("| Status | Count |")
          md.append("|---|---|")
          md.append(f"| Verified (impl + tests + commits) | {by_status['verified']} |")
          md.append(f"| Implemented but untested | {by_status['implemented-untested']} |")
          md.append(f"| Referenced only (no impl) | {by_status['referenced-only']} |")
          md.append(f"| Tests without implementation | {by_status['test-without-impl']} |")
          md.append(f"| **Total** | **{total}** |")
          md.append("")
          md.append("## Requirements detail")
          md.append("")
          md.append("| ID | Type | Status | #Code | #Tests | #Commits | #Issues | #PRs |")
          md.append("|---|---|---|---|---|---|---|---|")
          for r in sorted(requirements.values(), key=lambda r: r["id"]):
              md.append(
                  f"| `{r['id']}` | {r['type']} | {r['status']} | "
                  f"{len(r['found_in']['code'])} | {len(r['found_in']['tests'])} | "
                  f"{len(r['found_in']['commits'])} | {len(r['found_in']['issues'])} | "
                  f"{len(r['found_in']['prs'])} |"
              )
          md.append("")

          # 7. Gap report
          md.append("## Gap report")
          md.append("")
          untested = [r for r in requirements.values() if r["status"] == "implemented-untested"]
          orphan_tests = [r for r in requirements.values() if r["status"] == "test-without-impl"]
          md.append(f"### Implemented requirements missing tests ({len(untested)})")
          md.append("")
          for r in sorted(untested, key=lambda r: r["id"]):
              md.append(f"- `{r['id']}` — in: {', '.join(r['found_in']['code'][:3])}")
          md.append("")
          md.append(f"### Tests referencing requirements not found in code ({len(orphan_tests)})")
          md.append("")
          for r in sorted(orphan_tests, key=lambda r: r["id"]):
              md.append(f"- `{r['id']}` — test refs: {', '.join(r['found_in']['tests'][:3])}")

          Path("traceability/rtm.md").write_text("\n".join(md))

          # 8. GitHub Actions outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              f.write(f"verified={verified}\n")
              f.write(f"coverage={coverage}\n")
              f.write(f"untested_count={len(untested)}\n")
              f.write(f"orphan_test_count={len(orphan_tests)}\n")

          print(f"RTM built: {total} requirements, {verified} verified ({coverage}%)")
          PY

      - name: Add to step summary
        run: |
          {
            echo "## Requirements Traceability Matrix"
            echo ""
            echo "- **Requirements tracked:** ${{ steps.build.outputs.total }}"
            echo "- **Verified:** ${{ steps.build.outputs.verified }}"
            echo "- **Coverage:** ${{ steps.build.outputs.coverage }}%"
            echo "- **Untested implementations:** ${{ steps.build.outputs.untested_count }}"
            echo "- **Orphan tests:** ${{ steps.build.outputs.orphan_test_count }}"
            echo ""
            echo "Full RTM at [\`traceability/rtm.md\`](traceability/rtm.md)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        if: ${{ inputs.fail-on-orphans }}
        run: |
          set -euo pipefail
          COV="${{ steps.build.outputs.coverage }}"
          MIN="${{ inputs.min-coverage-pct }}"
          # Portable float compare via python
          python3 -c "
          import sys
          cov = float('${COV}')
          mn = float('${MIN}')
          if cov < mn:
              print(f'::error::RTM coverage {cov}% below required {mn}%')
              sys.exit(1)
          print(f'RTM coverage {cov}% meets the {mn}% threshold.')
          "

      - name: Upload RTM artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: rtm-${{ github.run_id }}
          path: traceability/
          retention-days: 365

      - name: Commit RTM to repo
        if: ${{ inputs.commit-rtm }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet traceability/ 2>/dev/null; then
            echo "No RTM changes."
            exit 0
          fi
          git add traceability/
          git commit -m "chore(rtm): regenerate traceability matrix [skip ci]

          Requirements: ${{ steps.build.outputs.total }}
          Verified: ${{ steps.build.outputs.verified }}
          Coverage: ${{ steps.build.outputs.coverage }}%"
          git push || echo "::warning::Could not push RTM update."
