name: "CI — Node.js"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "20"
      node-versions:
        description: "JSON array of Node.js versions for matrix (overrides node-version)"
        type: string
        default: ""
      working-directory:
        description: "Working directory"
        type: string
        default: "."
      package-manager:
        description: "Package manager (npm, yarn, pnpm)"
        type: string
        default: "npm"
      run-lint:
        description: "Run linting"
        type: boolean
        default: true
      run-typecheck:
        description: "Run type checking"
        type: boolean
        default: true
      run-security-audit:
        description: "Run security audit"
        type: boolean
        default: true
      test-timeout:
        description: "Test timeout in minutes"
        type: number
        default: 15
      upload-coverage:
        description: "Upload coverage artifacts"
        type: boolean
        default: true

jobs:
  detect:
    name: Detect configuration
    runs-on: ubuntu-latest
    outputs:
      has-lint: ${{ steps.check.outputs.has-lint }}
      has-typecheck: ${{ steps.check.outputs.has-typecheck }}
      has-test: ${{ steps.check.outputs.has-test }}
      has-build: ${{ steps.check.outputs.has-build }}
      matrix: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - name: Check available scripts
        id: check
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ ! -f package.json ]; then
            echo "::error::No package.json found in ${{ inputs.working-directory }}"
            exit 1
          fi
          has_script() {
            node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$1'] ? 0 : 1)" 2>/dev/null && echo true || echo false
          }
          echo "has-lint=$(has_script lint)" >> "$GITHUB_OUTPUT"
          echo "has-typecheck=$(has_script typecheck)" >> "$GITHUB_OUTPUT"
          echo "has-test=$(has_script test)" >> "$GITHUB_OUTPUT"
          echo "has-build=$(has_script build)" >> "$GITHUB_OUTPUT"
      - name: Build version matrix
        id: matrix
        run: |
          if [ -n '${{ inputs.node-versions }}' ] && [ '${{ inputs.node-versions }}' != '' ]; then
            echo 'versions=${{ inputs.node-versions }}' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["${{ inputs.node-version }}"]' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: detect
    if: needs.detect.outputs.has-lint == 'true' && inputs.run-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Run linter
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn lint ;;
            pnpm) pnpm lint ;;
            *)    npm run lint ;;
          esac

  typecheck:
    name: Type check
    needs: detect
    if: needs.detect.outputs.has-typecheck == 'true' && inputs.run-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Run type check
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn typecheck ;;
            pnpm) pnpm typecheck ;;
            *)    npm run typecheck ;;
          esac

  security-audit:
    name: Security audit
    needs: detect
    if: inputs.run-security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Run audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn audit --level high || echo "::warning::Vulnerabilities found" ;;
            pnpm) pnpm audit --audit-level high || echo "::warning::Vulnerabilities found" ;;
            *)    npm audit --audit-level=high || echo "::warning::Vulnerabilities found" ;;
          esac

  test:
    name: "Test (Node ${{ matrix.node-version }})"
    needs: detect
    if: needs.detect.outputs.has-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.test-timeout) }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn test --ci --coverage --forceExit 2>/dev/null || yarn test ;;
            pnpm) pnpm test -- --ci --coverage --forceExit 2>/dev/null || pnpm test ;;
            *)    npm test -- --ci --coverage --forceExit 2>/dev/null || npm test ;;
          esac
      - name: Upload coverage
        if: inputs.upload-coverage && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            ${{ inputs.working-directory }}/test-results/
            ${{ inputs.working-directory }}/junit*.xml
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    needs: [detect, test]
    if: needs.detect.outputs.has-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            yarn) yarn build ;;
            pnpm) pnpm build ;;
            *)    npm run build ;;
          esac
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-output
          path: |
            ${{ inputs.working-directory }}/dist/
            ${{ inputs.working-directory }}/build/
          retention-days: 3
          if-no-files-found: ignore
