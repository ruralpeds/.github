name: "Reusable Risk File Aggregator (ISO 14971)"
# Aggregates all repository issues labeled `hazard` into a consolidated
# risk management file per ISO 14971:2019.
#
# Regulatory drivers:
#   - ISO 14971:2019 — Medical devices — Application of risk management
#   - IEC 62304:2006+AMD1:2015 §7 — Software risk management
#   - 21 CFR 820.30(g) — Design validation (risk considerations)
#   - FDA Cybersecurity in Medical Devices (Sept 2023) — threat modeling
#
# Callers: uses: timothyhartzog/.github/.github/workflows/reusable-risk-file.yml@main
#
# Hazard issues must use the template at
# `timothyhartzog/Github-workflow/templates/issue-templates/hazard.md`.
#
# Outputs committed to the caller repo:
#   - risk/hazard-analysis.md         — consolidated human-readable risk table
#   - risk/risk-summary.json          — machine-readable summary
#   - risk/risk-management-plan.md    — generated if missing (scaffold only)
#   - risk/residual-risk-acceptance.md — generated if missing (scaffold only)

on:
  workflow_call:
    inputs:
      hazard-label:
        description: "Issue label that identifies hazards"
        type: string
        default: "hazard"
      include-closed:
        description: "Include closed hazard issues (historical record)"
        type: boolean
        default: true
      commit-output:
        description: "Commit generated files to the repo"
        type: boolean
        default: true
      fail-on-unmitigated-high:
        description: "Fail if any hazard has unaccepted high residual risk (RPN ≥ 12)"
        type: boolean
        default: true
      high-rpn-threshold:
        description: "RPN value considered unacceptably high without explicit acceptance"
        type: number
        default: 12

permissions:
  contents: read

jobs:
  aggregate:
    name: Aggregate hazard issues
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Build risk files
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          HAZARD_LABEL: ${{ inputs.hazard-label }}
          INCLUDE_CLOSED: ${{ inputs.include-closed }}
          HIGH_RPN: ${{ inputs.high-rpn-threshold }}
        run: |
          set -euo pipefail
          mkdir -p risk
          python3 <<'PY'
          import os, re, json, sys, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ["GH_TOKEN"]
          label = os.environ["HAZARD_LABEL"]
          include_closed = os.environ["INCLUDE_CLOSED"].lower() == "true"
          high_rpn = int(os.environ["HIGH_RPN"])
          state = "all" if include_closed else "open"

          def gh_api(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read())

          # Paginate through issues
          issues = []
          page = 1
          while True:
              items = gh_api(f"/repos/{repo}/issues?state={state}&labels={label}&per_page=100&page={page}")
              if not items:
                  break
              # Exclude PRs (they come through the issues endpoint too)
              issues.extend(i for i in items if "pull_request" not in i)
              if len(items) < 100:
                  break
              page += 1

          print(f"Fetched {len(issues)} hazard issue(s)")

          # Parsers for the hazard template
          def extract_checkbox(body, section_heading):
              """Find the first checked item (- [x]) under a ## heading."""
              pattern = re.compile(
                  rf"##\s*{re.escape(section_heading)}.*?\n(.*?)(?=\n##\s|\Z)",
                  re.DOTALL | re.IGNORECASE
              )
              m = pattern.search(body)
              if not m: return None
              block = m.group(1)
              cm = re.search(r"-\s*\[x\]\s*(.+)", block, re.IGNORECASE)
              return cm.group(1).strip() if cm else None

          def extract_rating(value, letter):
              """Extract the numeric rating (e.g., 'S3' -> 3)."""
              if not value: return None
              m = re.search(rf"{letter}(\d)", value)
              return int(m.group(1)) if m else None

          def extract_text(body, heading):
              pattern = re.compile(
                  rf"##\s*{re.escape(heading)}.*?\n(.*?)(?=\n##\s|\Z)",
                  re.DOTALL | re.IGNORECASE
              )
              m = pattern.search(body)
              return m.group(1).strip() if m else ""

          def extract_id(title):
              m = re.search(r"(HAZ-[A-Z0-9-]+-\d+)", title, re.IGNORECASE)
              return m.group(1).upper() if m else None

          parsed = []
          for issue in issues:
              body = issue.get("body") or ""
              title = issue.get("title") or ""
              haz_id = extract_id(title)

              sev_text = extract_checkbox(body, "Severity")
              sev = extract_rating(sev_text, "S")
              prob_text = extract_checkbox(body, "Probability of occurrence")
              prob = extract_rating(prob_text, "P")
              rpn = (sev * prob) if (sev and prob) else None

              residual_acceptable = None
              residual_section = extract_text(body, "Residual risk")
              if residual_section:
                  if re.search(r"-\s*\[x\]\s*Acceptable", residual_section, re.IGNORECASE):
                      residual_acceptable = True
                  elif re.search(r"-\s*\[x\]\s*Unacceptable", residual_section, re.IGNORECASE):
                      residual_acceptable = False

              parsed.append({
                  "haz_id": haz_id,
                  "issue_number": issue["number"],
                  "issue_url": issue["html_url"],
                  "title": title,
                  "state": issue["state"],
                  "description": extract_text(body, "Hazard description"),
                  "hazardous_situation": extract_text(body, "Hazardous situation"),
                  "harm": extract_text(body, "Harm"),
                  "severity": sev,
                  "probability": prob,
                  "pre_mitigation_rpn": rpn,
                  "residual_acceptable": residual_acceptable,
                  "controls_text": extract_text(body, "Risk controls"),
                  "references_text": extract_text(body, "References"),
              })

          # Flag compliance issues
          flags = []
          for h in parsed:
              if not h["haz_id"]:
                  flags.append(f"Issue #{h['issue_number']} has no HAZ-... ID in title")
              if h["severity"] is None:
                  flags.append(f"{h['haz_id'] or '#'+str(h['issue_number'])}: no severity rating")
              if h["probability"] is None:
                  flags.append(f"{h['haz_id'] or '#'+str(h['issue_number'])}: no probability rating")
              if h["pre_mitigation_rpn"] and h["pre_mitigation_rpn"] >= high_rpn \
                 and h["residual_acceptable"] is not True:
                  flags.append(f"{h['haz_id']}: RPN {h['pre_mitigation_rpn']} ≥ {high_rpn} and residual risk not accepted")

          # Write risk-summary.json
          now = datetime.now(timezone.utc).isoformat()
          summary = {
              "schema_version": "1.0",
              "generated_at": now,
              "repository": repo,
              "total_hazards": len(parsed),
              "open_hazards": sum(1 for h in parsed if h["state"] == "open"),
              "closed_hazards": sum(1 for h in parsed if h["state"] == "closed"),
              "severity_distribution": {s: sum(1 for h in parsed if h["severity"]==s) for s in range(1,6)},
              "high_rpn_count": sum(1 for h in parsed if h.get("pre_mitigation_rpn") and h["pre_mitigation_rpn"] >= high_rpn),
              "compliance_flags": flags,
              "hazards": parsed,
          }
          Path("risk/risk-summary.json").write_text(json.dumps(summary, indent=2))

          # Write hazard-analysis.md
          md = []
          md.append("# Hazard Analysis")
          md.append("")
          md.append(f"**Repository:** `{repo}`  ")
          md.append(f"**Generated:** {now}  ")
          md.append(f"**Regulatory basis:** ISO 14971:2019, IEC 62304 §7")
          md.append("")
          md.append("_This file is auto-generated from issues labeled `" + label + "`._")
          md.append("_Do not edit directly — update the source issues instead._")
          md.append("")
          md.append("## Summary")
          md.append("")
          md.append("| Metric | Value |")
          md.append("|---|---|")
          md.append(f"| Total hazards | {summary['total_hazards']} |")
          md.append(f"| Open | {summary['open_hazards']} |")
          md.append(f"| Closed | {summary['closed_hazards']} |")
          md.append(f"| High RPN (≥{high_rpn}) | {summary['high_rpn_count']} |")
          md.append(f"| Compliance flags | {len(flags)} |")
          md.append("")
          md.append("## Severity distribution")
          md.append("")
          md.append("| Severity | Count |")
          md.append("|---|---|")
          for s in range(1,6):
              cnt = summary['severity_distribution'].get(s, 0)
              md.append(f"| S{s} | {cnt} |")
          md.append("")

          if flags:
              md.append("## ⚠️ Compliance flags")
              md.append("")
              for f in flags:
                  md.append(f"- {f}")
              md.append("")

          md.append("## Hazard register")
          md.append("")
          md.append("| ID | State | S | P | RPN | Residual accepted | Description |")
          md.append("|---|---|---|---|---|---|---|")
          for h in sorted(parsed, key=lambda x: (x.get("haz_id") or "")):
              accepted = {True:"✅", False:"❌", None:"—"}.get(h["residual_acceptable"], "—")
              rpn = h["pre_mitigation_rpn"] or "—"
              haz_id = h.get("haz_id") or f"(no-id #{h['issue_number']})"
              desc = (h["description"] or "").replace("\n"," ").replace("|","\\|")[:80]
              md.append(f"| [{haz_id}]({h['issue_url']}) | {h['state']} | {h['severity'] or '—'} | {h['probability'] or '—'} | {rpn} | {accepted} | {desc} |")
          md.append("")

          md.append("## Hazard detail")
          md.append("")
          for h in sorted(parsed, key=lambda x: (x.get("haz_id") or "")):
              haz_id = h.get("haz_id") or f"issue-{h['issue_number']}"
              md.append(f"### {haz_id}")
              md.append("")
              md.append(f"- **Issue:** [{h['title']}]({h['issue_url']}) ({h['state']})")
              md.append(f"- **Description:** {h['description'] or '—'}")
              md.append(f"- **Hazardous situation:** {h['hazardous_situation'] or '—'}")
              md.append(f"- **Harm:** {h['harm'] or '—'}")
              md.append(f"- **Severity:** {h['severity'] or '—'} / Probability: {h['probability'] or '—'} / RPN: {h['pre_mitigation_rpn'] or '—'}")
              if h["controls_text"]:
                  md.append(f"- **Controls:** {h['controls_text'][:300]}")
              md.append("")
          Path("risk/hazard-analysis.md").write_text("\n".join(md))

          # Scaffold optional supporting files if missing
          rmp = Path("risk/risk-management-plan.md")
          if not rmp.exists():
              rmp.write_text(f"""# Risk Management Plan

          **Repository:** `{repo}`
          **Standard:** ISO 14971:2019
          **Last review:** _(to be filled at first review cycle)_

          ## Scope
          Software risks arising from this repository's components when deployed
          in clinical settings. Includes cybersecurity risks per FDA Sept 2023
          Premarket Cybersecurity Guidance.

          ## Risk management team
          - Risk manager: _(assign)_
          - Clinical reviewer: _(assign)_
          - Technical reviewer: _(assign)_

          ## Risk acceptability criteria
          See `risk/residual-risk-acceptance.md`.

          ## Risk analysis techniques
          - Top-down: use-case hazard analysis
          - Bottom-up: fault tree analysis for critical paths
          - Cybersecurity: STRIDE threat modeling (see `docs/threat-model.md`)

          ## Review cycle
          - New hazards: at each release
          - Full risk file review: annually
          - After any Class 1 incident or CAPA closure
          """)

          rra = Path("risk/residual-risk-acceptance.md")
          if not rra.exists():
              rra.write_text(f"""# Residual Risk Acceptance Criteria

          **Repository:** `{repo}`

          ## Acceptability matrix (RPN = Severity × Probability)

          | RPN range | Category | Action |
          |---|---|---|
          | 1-4   | Acceptable | No additional controls required |
          | 5-11  | Tolerable  | Mitigate if reasonably practicable (ALARP) |
          | 12-15 | Unacceptable without acceptance | Requires explicit review + clinical director approval |
          | 16-25 | Unacceptable | Redesign mandatory |

          ## Acceptance workflow
          For any hazard with post-mitigation RPN ≥ 12, the hazard issue must include:
          1. Documented benefit-risk analysis
          2. Clinical director signature (via `review-stamp-v2.yml` with meaning = `risk-accepted`)
          3. Linked residual risk statement in product labeling / documentation

          ## Annual review
          All accepted residual risks are re-reviewed annually. Changes in clinical
          practice or new adverse-event data may require re-evaluation.
          """)

          # GitHub Actions outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={summary['total_hazards']}\n")
              f.write(f"open={summary['open_hazards']}\n")
              f.write(f"high_rpn={summary['high_rpn_count']}\n")
              f.write(f"flags={len(flags)}\n")

          # Step summary
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(Path("risk/hazard-analysis.md").read_text())

          PY

      - name: Enforce unmitigated-high gate
        if: ${{ inputs.fail-on-unmitigated-high }}
        run: |
          set -euo pipefail
          FLAGS="${{ steps.build.outputs.flags }}"
          if [ "${FLAGS:-0}" != "0" ]; then
            echo "::error::${FLAGS} ISO 14971 compliance flag(s) in hazard register."
            echo "See the workflow summary for the list; update the source issues."
            exit 1
          fi
          echo "All hazards have complete S/P/RPN data and accepted residuals."

      - name: Upload risk files
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: risk-file-${{ github.run_id }}
          path: risk/
          retention-days: 365

      - name: Commit risk files
        if: ${{ inputs.commit-output }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risk/
          if ! git diff --cached --quiet; then
            git commit -m "chore(risk): regenerate ISO 14971 risk file [skip ci]

            Hazards: ${{ steps.build.outputs.total }} total, ${{ steps.build.outputs.open }} open
            High RPN: ${{ steps.build.outputs.high_rpn }}"
            git push || echo "::warning::Could not push risk-file update."
          fi
