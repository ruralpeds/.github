name: "Mutation Testing (Weekly)"

# Measure test quality via mutation testing (kill rate).
#
# This workflow:
#   1. Runs mutation testing tool (cargo-mutants for Rust, mutmut for Python)
#   2. Generates mutants (random code modifications)
#   3. Executes test suite against each mutant
#   4. Counts killed vs survived mutants → kill rate
#   5. Reports gap: tests that should have caught a mutant but didn't
#   6. Fails CI if kill rate < Class threshold
#
# Mutation Testing = code coverage + test quality
#   - Code coverage: "is this line tested?" (yes/no)
#   - Mutation testing: "would tests catch a bug in this line?" (pass/fail)
#
# Integration points:
#   - Runs weekly (not per-PR, too expensive)
#   - Generates report artifact (mutation-report.json)
#   - Updates IEC 62304 traceability matrix with kill rate
#
# Regulatory drivers:
#   - IEC 62304 §7.3 — Verification test effectiveness
#   - FDA: mutation testing demonstrates test rigor
#   - FDA guidance: "sufficient testing to detect failures"

on:
  workflow_call:
    inputs:
      language:
        description: "Language (rust, python, javascript)"
        required: true
        type: string
      class:
        description: "Safety class (a, b, c)"
        required: true
        type: string
      test_command:
        description: "Command to run test suite (e.g., 'cargo test --release')"
        required: true
        type: string

permissions:
  contents: read
  checks: write

jobs:
  mutation-test:
    name: Run Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      kill_rate: ${{ steps.mutate.outputs.kill_rate }}
      mutants_killed: ${{ steps.mutate.outputs.mutants_killed }}
      mutants_survived: ${{ steps.mutate.outputs.mutants_survived }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set mutation thresholds by class
        run: |
          if [ "${{ inputs.class }}" = "a" ]; then
              MIN_KILL=0
          elif [ "${{ inputs.class }}" = "b" ]; then
              MIN_KILL=70
          else
              # class c
              MIN_KILL=85
          fi
          echo "MIN_KILL_RATE=$MIN_KILL" >> $GITHUB_ENV

      - name: Set up Rust
        if: inputs.language == 'rust'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-mutants
        if: inputs.language == 'rust'
        run: |
          cargo install cargo-mutants
          echo "✅ cargo-mutants installed"

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mutmut
        if: inputs.language == 'python'
        run: |
          pip install mutmut pytest
          echo "✅ mutmut installed"

      - name: Set up Node
        if: inputs.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install stryker
        if: inputs.language == 'javascript'
        run: |
          npm install -g stryker stryker-cli
          echo "✅ stryker installed"

      - name: Run mutation tests (Rust)
        if: inputs.language == 'rust'
        id: mutate
        run: |
          echo "=== Running Cargo Mutants ==="
          
          # Run mutations
          cargo mutants --output /tmp/mutants.json --test-tool cargo || true
          
          python3 <<'PYTHON_EOF'
          import json
          
          try:
              with open('/tmp/mutants.json', 'r') as f:
                  results = json.load(f)
          except:
              results = {"summary": {"killed": 0, "survived": 0, "unviable": 0}}
          
          summary = results.get('summary', {})
          killed = summary.get('killed', 0)
          survived = summary.get('survived', 0)
          total = killed + survived
          
          kill_rate = (killed / total * 100) if total > 0 else 0
          
          print(f"Mutants killed: {killed}")
          print(f"Mutants survived: {survived}")
          print(f"Kill rate: {kill_rate:.1f}%")
          
          # Output for GitHub
          with open('/tmp/mutation_results.json', 'w') as f:
              json.dump({
                  'killed': killed,
                  'survived': survived,
                  'kill_rate': kill_rate,
                  'language': 'rust'
              }, f)
          PYTHON_EOF
          
          # Extract output
          source <(python3 <<'PYTHON_PARSE'
          import json
          with open('/tmp/mutation_results.json', 'r') as f:
              r = json.load(f)
          print(f"echo 'kill_rate={r['kill_rate']}' >> $GITHUB_OUTPUT")
          print(f"echo 'mutants_killed={r['killed']}' >> $GITHUB_OUTPUT")
          print(f"echo 'mutants_survived={r['survived']}' >> $GITHUB_OUTPUT")
          PYTHON_PARSE
          )

      - name: Run mutation tests (Python)
        if: inputs.language == 'python'
        id: mutate_py
        run: |
          echo "=== Running mutmut ==="
          
          mutmut run --tests-dir tests --output-file /tmp/mutants.json || true
          
          python3 <<'PYTHON_EOF'
          import json
          import subprocess
          
          # Get mutmut results via CLI
          result = subprocess.run(['mutmut', 'results', '--json'], capture_output=True, text=True)
          
          try:
              results = json.loads(result.stdout)
              killed = results.get('killed', 0)
              survived = results.get('survived', 0)
          except:
              killed = 0
              survived = 0
          
          total = killed + survived
          kill_rate = (killed / total * 100) if total > 0 else 0
          
          print(f"Mutants killed: {killed}")
          print(f"Mutants survived: {survived}")
          print(f"Kill rate: {kill_rate:.1f}%")
          
          with open('/tmp/mutation_results.json', 'w') as f:
              json.dump({
                  'killed': killed,
                  'survived': survived,
                  'kill_rate': kill_rate,
                  'language': 'python'
              }, f)
          PYTHON_EOF
          
          source <(python3 <<'PYTHON_PARSE'
          import json
          with open('/tmp/mutation_results.json', 'r') as f:
              r = json.load(f)
          print(f"echo 'kill_rate={r['kill_rate']}' >> $GITHUB_OUTPUT")
          print(f"echo 'mutants_killed={r['killed']}' >> $GITHUB_OUTPUT")
          print(f"echo 'mutants_survived={r['survived']}' >> $GITHUB_OUTPUT")
          PYTHON_PARSE
          )

      - name: Check mutation results
        run: |
          kill_rate=$(cat /tmp/mutation_results.json | python3 -c "import sys, json; print(json.load(sys.stdin)['kill_rate'])")
          
          echo "=== Mutation Testing Results ==="
          echo "Kill rate: ${kill_rate}%"
          echo "Minimum required: ${{ env.MIN_KILL_RATE }}%"
          echo ""
          
          if (( $(echo "${kill_rate} >= ${{ env.MIN_KILL_RATE }}" | bc -l) )); then
              echo "✅ Kill rate meets Class ${{ inputs.class }} threshold"
          else
              echo "❌ Kill rate below threshold"
              exit 1
          fi

      - name: Generate mutation report
        run: |
          echo "=== Generating Mutation Report ==="
          
          python3 <<'PYTHON_EOF'
          import json
          from datetime import datetime
          
          with open('/tmp/mutation_results.json', 'r') as f:
              results = json.load(f)
          
          report = {
              'timestamp': datetime.now().isoformat(),
              'language': results['language'],
              'mutation_testing': {
                  'killed': results['killed'],
                  'survived': results['survived'],
                  'kill_rate_percent': results['kill_rate']
              },
              'thresholds': {
                  'class_a': {'min_kill_rate': 0},
                  'class_b': {'min_kill_rate': 70},
                  'class_c': {'min_kill_rate': 85}
              },
              'status': 'PASS' if results['kill_rate'] >= 70 else 'FAIL'
          }
          
          with open('coverage/mutation.json', 'w') as f:
              json.dump(report, f, indent=2)
          
          print("✅ Mutation report written to coverage/mutation.json")
          PYTHON_EOF

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: coverage/mutation.json
          retention-days: 90

      - name: Summary
        run: |
          echo "=== Mutation Testing Summary ==="
          echo "Language: ${{ inputs.language }}"
          echo "Class: ${{ inputs.class }}"
          echo "Kill rate: ${{ steps.mutate.outputs.kill_rate || steps.mutate_py.outputs.kill_rate }}%"
          echo "Mutants killed: ${{ steps.mutate.outputs.mutants_killed || steps.mutate_py.outputs.mutants_killed }}"
          echo "Mutants survived: ${{ steps.mutate.outputs.mutants_survived || steps.mutate_py.outputs.mutants_survived }}"
