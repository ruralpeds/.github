name: "CI — Julia"

on:
  workflow_call:
    inputs:
      julia-version:
        description: "Julia version"
        type: string
        default: "1"
      julia-versions:
        description: "JSON array of Julia versions for matrix"
        type: string
        default: ""
      working-directory:
        description: "Working directory"
        type: string
        default: "."
      run-format-check:
        description: "Run JuliaFormatter check"
        type: boolean
        default: true
      test-timeout:
        description: "Test timeout in minutes"
        type: number
        default: 30

jobs:
  detect:
    name: Detect configuration
    runs-on: ubuntu-latest
    outputs:
      has-project: ${{ steps.check.outputs.has-project }}
      has-tests: ${{ steps.check.outputs.has-tests }}
      matrix: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Check project
        id: check
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f Project.toml ]; then
            echo "has-project=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Project.toml found in ${{ inputs.working-directory }}"
            echo "has-project=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -d test ] || [ -f test/runtests.jl ]; then
            echo "has-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-tests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build version matrix
        id: matrix
        run: |
          if [ -n '${{ inputs.julia-versions }}' ] && [ '${{ inputs.julia-versions }}' != '' ]; then
            echo 'versions=${{ inputs.julia-versions }}' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["${{ inputs.julia-version }}"]' >> "$GITHUB_OUTPUT"
          fi

  format-check:
    name: Format check
    needs: detect
    if: inputs.run-format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ inputs.julia-version }}
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add("JuliaFormatter")'
      - name: Check formatting
        working-directory: ${{ inputs.working-directory }}
        run: |
          julia -e '
          using JuliaFormatter
          result = format(".", verbose=true, overwrite=false)
          if result == false
              @error "Some files are not formatted. Run `using JuliaFormatter; format(\".\")` locally."
              exit(1)
          end
          '

  test:
    name: "Test (Julia ${{ matrix.julia-version }})"
    needs: detect
    if: needs.detect.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.test-timeout) }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Build package
        working-directory: ${{ inputs.working-directory }}
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'
      - name: Process coverage
        if: always()
        working-directory: ${{ inputs.working-directory }}
        run: |
          julia -e '
          using Pkg
          Pkg.add("CoverageTools")
          using CoverageTools
          coverage = process_folder("src")
          LCOV.writefile("lcov.info", coverage)
          covered, total = get_summary(coverage)
          pct = total > 0 ? round(covered / total * 100, digits=1) : 0.0
          println("Coverage: $covered/$total lines ($pct%)")
          ' || echo "::warning::Coverage processing failed"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-julia-${{ matrix.julia-version }}
          path: ${{ inputs.working-directory }}/lcov.info
          retention-days: 7
          if-no-files-found: ignore
