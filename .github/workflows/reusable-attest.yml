name: "Reusable Build Attestation (GitHub Attestations)"
# Generates in-toto build-provenance attestations via GitHub's native
# attestation feature. This is the simplest way to get SLSA-style provenance
# for repositories that don't need the full slsa-github-generator pipeline.
#
# Regulatory drivers:
#   - NIST SSDF PS.3.2 — Archive and protect each software release
#   - CISA Secure Software Development Attestation Common Form
#   - FDA Premarket Cybersecurity Guidance (Sept 2023)
#
# Produces:
#   - A signed in-toto attestation of the artifact (stored by GitHub)
#   - Verifiable via `gh attestation verify <artifact> --repo timothyhartzog/<repo>`
#
# Note: For SLSA L3 certification, prefer reusable-slsa.yml which uses the
# slsa-framework/slsa-github-generator. GitHub Attestations are SLSA L2-3
# depending on repo settings.

on:
  workflow_call:
    inputs:
      artifact-path:
        description: "Path or glob of artifacts to attest"
        type: string
        required: true
      attestation-name:
        description: "Name suffix for the attestation (appears in listing)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    name: Generate build attestation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: ${{ inputs.artifact-path }}

      - name: Summary
        run: |
          {
            echo "# Build Attestation Generated"
            echo ""
            echo "GitHub attestation created for \`${{ inputs.artifact-path }}\`."
            echo ""
            echo "## Verification"
            echo ""
            echo '```'
            echo "gh attestation verify <artifact> --repo ${{ github.repository }}"
            echo '```'
            echo ""
            echo "The attestation is publicly queryable via the GitHub API and is"
            echo "cryptographically bound to the source commit, workflow run, and"
            echo "artifact SHA-256."
          } >> "$GITHUB_STEP_SUMMARY"
