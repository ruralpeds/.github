name: Deadline Breach Notification

# Detects P0/P1 gaps with breached deadlines and sends notifications
# Scheduled daily + manual trigger for testing

on:
  schedule:
    # Run Mon/Thu at 06:00 UTC (was daily). Deadlines are tracked in days, twice
    # weekly catches breaches without daily cost.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      slack_webhook:
        description: 'Slack webhook URL (uses SLACK_WEBHOOK_URL env var if not provided)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deadline-breach-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect-breaches:
    name: Detect deadline breaches
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    outputs:
      breaches_found: ${{ steps.detect.outputs.breaches_found }}
      critical_count: ${{ steps.detect.outputs.critical_count }}
      overdue_count: ${{ steps.detect.outputs.overdue_count }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.11'

      - name: Detect deadline breaches
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/deadline_calculator.py \
            --token "$GH_TOKEN" \
            --org ruralpeds \
            --output /tmp/deadlines.json

          python3 << 'PYEOF'
          import json
          from datetime import datetime

          with open('/tmp/deadlines.json') as f:
              report = json.load(f)

          summary = report['summary']
          breaches = [g for g in report['deadlines'] if g['urgency_level'] == 'critical']
          overdue = [g for g in report['deadlines'] if g['overdue_days'] is not None]

          print(f"breaches_found={len(breaches) > 0}".lower(), file=open("$GITHUB_OUTPUT", "a"))
          print(f"critical_count={summary['critical_urgency']}", file=open("$GITHUB_OUTPUT", "a"))
          print(f"overdue_count={summary['overdue_gaps']}", file=open("$GITHUB_OUTPUT", "a"))

          if overdue:
              print("\n❌ OVERDUE GAPS DETECTED:")
              for gap in overdue:
                  print(f"  - {gap['gap_id']} ({gap['repo']}): {gap['overdue_days']} days overdue")
          else:
              print("\n✅ No overdue gaps detected")
          PYEOF

      - name: Upload deadline metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: deadline-metrics-${{ github.run_number }}
          path: /tmp/deadlines.json
          retention-days: 90

  notify-breaches:
    name: Notify about breaches
    needs: detect-breaches
    if: needs.detect-breaches.outputs.breaches_found == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 5

    steps:
      - name: Download deadline metrics
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          name: deadline-metrics-${{ github.run_number }}

      - name: Post Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || github.event.inputs.slack_webhook }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request

          webhook_url = os.environ.get('SLACK_WEBHOOK_URL', '')
          if not webhook_url:
              print("⚠️  SLACK_WEBHOOK_URL not configured, skipping Slack notification")
              exit(0)

          with open('deadlines.json') as f:
              report = json.load(f)

          summary = report['summary']
          critical = [g for g in report['deadlines'] if g['urgency_level'] == 'critical']
          overdue = [g for g in report['deadlines'] if g['overdue_days'] is not None]

          # Build Slack message
          blocks = [
              {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": "⏰ Gap Deadline Breach Alert" if overdue else "📅 Gap Deadline Status Check",
                      "emoji": True,
                  }
              },
              {
                  "type": "section",
                  "fields": [
                      {
                          "type": "mrkdwn",
                          "text": f"*Critical:*\n{summary['critical_urgency']} gaps",
                      },
                      {
                          "type": "mrkdwn",
                          "text": f"*Overdue:*\n{summary['overdue_gaps']} gaps",
                      },
                  ]
              },
          ]

          if overdue:
              blocks.append({"type": "divider"})
              blocks.append({
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*🚨 OVERDUE GAPS (Immediate Action Required):*",
                  }
              })

              for gap in overdue[:5]:  # Show top 5 overdue
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*{gap['gap_id']}* ({gap['repo']})\n"
                                  f"Owner: {gap['owner']} | Overdue: {gap['overdue_days']} days\n"
                                  f"Status: {gap['status']} | Priority: {gap['priority']}",
                      }
                  })

              if len(overdue) > 5:
                  blocks.append({
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"_...and {len(overdue) - 5} more overdue gaps_",
                      }
                  })

          blocks.extend([
              {"type": "divider"},
              {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": f"<https://github.com/${{ github.repository }}/blob/main/docs/gap-analysis-dashboard.md|View Full Dashboard> | "
                              f"<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Report>",
                  }
              }
          ])

          payload = {
              "text": f"Gap Deadline Alert: {summary['overdue_gaps']} overdue" if overdue else "Gap deadline status: All on track",
              "blocks": blocks,
          }

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
              webhook_url,
              data=data,
              headers={"Content-Type": "application/json"},
          )

          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print("✓ Slack notification sent")
                  else:
                      print(f"⚠️  Slack returned {response.status}")
          except Exception as e:
              print(f"⚠️  Failed to send Slack notification: {e}")
          PYEOF

  create-breach-issue:
    name: Create/update GitHub issue for breaches
    needs: detect-breaches
    if: needs.detect-breaches.outputs.overdue_count > 0
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Download deadline metrics
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          name: deadline-metrics-${{ github.run_number }}

      - name: Create or update issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('deadlines.json', 'utf8'));

            const overdue = report.deadlines.filter(g => g.overdue_days !== null);
            if (overdue.length === 0) {
              console.log('No overdue gaps, skipping issue creation');
              process.exit(0);
            }

            // Build issue body
            let body = '## 🚨 Gap Deadline Breaches\n\n';
            body += `**Report Generated:** ${report.timestamp}\n\n`;
            body += `**Summary:** ${overdue.length} gaps overdue\n\n`;

            body += '### Overdue Gaps\n\n';
            body += '| Gap | Repo | Owner | Overdue | Status |\n';
            body += '|-----|------|-------|---------|--------|\n';

            for (const gap of overdue) {
              body += `| ${gap.gap_id} | ${gap.repo} | ${gap.owner} | ${gap.overdue_days}d | ${gap.status} |\n`;
            }

            body += '\n**Action Required:**\n';
            body += '- Owners: Update target completion dates or escalate blockers\n';
            body += '- Leads: Review capacity and rebalance P0/P1 workload\n';
            body += '- Review: [Gap Analysis Dashboard](../../blob/main/docs/gap-analysis-dashboard.md)\n';

            // Find existing issue or create new one
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['gap-analysis', 'deadline-breach'],
              state: 'open',
            });

            if (issues.data.length > 0) {
              // Update existing issue
              const issueNumber = issues.data[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body,
              });
              console.log(`Updated issue #${issueNumber}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Gap Deadline Breaches (${overdue.length} gaps overdue)`,
                body: body,
                labels: ['gap-analysis', 'deadline-breach', 'automated'],
              });
              console.log(`Created issue #${issue.data.number}`);
            }
