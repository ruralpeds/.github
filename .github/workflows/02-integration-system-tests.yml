# GitHub Actions: SDLC Phase 3 Gates (Verification & Validation)
# Compliance: IEC 62304 §5.5 (Verification) + §5.6 (Validation)
# Purpose: Integration tests, system tests, compliance verification

name: Integration & System Tests (SDLC Gates 3-4)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'infrastructure/**'
      - '.github/workflows/02-*.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/platform

jobs:
  # =========================================================================
  # Gate 3: Integration Tests
  # =========================================================================
  integration-tests:
    name: Integration Tests (API + Database)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: audit_trail_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: audit_trail
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-integration pytest-asyncio httpx

      - name: Initialize database schema
        run: |
          # Run all migrations
          for migration in infrastructure/database/*.sql; do
            psql -h localhost -U audit_trail_user -d audit_trail \
              -f "$migration" > /dev/null 2>&1
          done
        env:
          PGPASSWORD: test_password

      - name: Run integration tests
        run: |
          echo "🔗 SDLC Gate 3: Verification - Integration Tests"

          pytest tests/integration \
            --cov=src \
            --cov-report=term-missing \
            --junit-xml=integration-results.xml \
            -v --tb=short

        env:
          DATABASE_URL: postgresql://audit_trail_user:test_password@localhost/audit_trail
          REDIS_URL: redis://localhost:6379

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: integration-results.xml

      - name: Audit trail verification test
        run: |
          echo "🔐 Verify audit trail immutability and chain integrity"

          # Test 1: Verify immutability constraint
          psql -h localhost -U audit_trail_user -d audit_trail <<EOF
          -- Insert test event
          INSERT INTO audit_trail (
            event_id, timestamp, unix_timestamp, user_id, action_type,
            resource_type, resource_id, event_json, event_hash,
            signature, signature_timestamp, merkle_chain_hash
          ) VALUES (
            'TEST-INT-001', NOW(), EXTRACT(EPOCH FROM NOW())::BIGINT, 'test_user',
            'integration_test', 'TEST', 'test-id-001',
            '{"test":"data"}', 'hash123',
            'signature123', NOW(), 'merkle123'
          );

          -- Attempt DELETE (should fail)
          \set QUIET_MESSAGE 1
          DELETE FROM audit_trail WHERE event_id='TEST-INT-001';
          \set QUIET_MESSAGE 0

          -- Verify event still exists
          SELECT COUNT(*) as event_count FROM audit_trail
          WHERE event_id='TEST-INT-001';
          EOF

        env:
          PGPASSWORD: test_password

  # =========================================================================
  # Gate 4: System Tests & Compliance Verification
  # =========================================================================
  system-tests:
    name: System Tests (FHIR, EHR Integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest fhirclient hl7apy

      - name: Run system tests
        run: |
          echo "🏥 SDLC Gate 4: Validation - System Tests"

          pytest tests/system \
            --junit-xml=system-results.xml \
            -v --tb=short

      - name: FHIR conformance tests
        run: |
          echo "📋 FHIR US Core 6.1 Conformance Validation"

          # Test: FHIR patient resource
          python -m pytest tests/system/test_fhir_compliance.py::TestFHIRPatient \
            -v

          # Test: FHIR observation (vitals)
          python -m pytest tests/system/test_fhir_compliance.py::TestFHIRObservation \
            -v

          # Test: FHIR medication
          python -m pytest tests/system/test_fhir_compliance.py::TestFHIRMedication \
            -v

      - name: EHR integration tests
        run: |
          echo "🔗 EHR Integration Testing"

          # Test: Export to EHR (FHIR)
          python -m pytest tests/system/test_ehr_integration.py::TestEHRExport \
            -v

          # Test: Import from EHR (OAuth token validation)
          python -m pytest tests/system/test_ehr_integration.py::TestEHRImport \
            -v

      - name: Upload system test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: system-test-results
          path: system-results.xml

  # =========================================================================
  # Compliance Verification
  # =========================================================================
  compliance-verification:
    name: Compliance Verification (IEC 62304, CFR Part 11, HIPAA)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: IEC 62304 Design Traceability
        run: |
          echo "📐 IEC 62304: Design Traceability Matrix"

          # Check that each requirement has corresponding design + test
          python3 <<'EOF'
          import os
          import json

          # Requirements mapping
          requirements = {
            "REQ-AUTH": {
              "design": ["src/auth.py"],
              "tests": ["tests/unit/test_auth.py", "tests/integration/test_auth.py"]
            },
            "REQ-AUDIT": {
              "design": ["src/audit_trail.py"],
              "tests": ["tests/unit/test_audit.py", "tests/integration/test_audit.py"]
            }
          }

          print("Traceability Matrix:")
          print("| Requirement | Design | Tests | Status |")
          print("|---|---|---|---|")

          for req, mapping in requirements.items():
            design_files = [f for f in mapping["design"] if os.path.exists(f)]
            test_files = [f for f in mapping["tests"] if os.path.exists(f)]

            status = "✅ COMPLETE" if (design_files and test_files) else "❌ INCOMPLETE"
            print(f"| {req} | {len(design_files)}/{len(mapping['design'])} | {len(test_files)}/{len(mapping['tests'])} | {status} |")

          EOF

      - name: CFR Part 11 Verification
        run: |
          echo "📋 CFR Part 11: Audit Trail Compliance"

          # Check for audit trail features
          python3 <<'EOF'
          import os

          checks = {
            "Immutable storage": "src/audit_trail.py",
            "Digital signatures": "src/digital_signature.py",
            "Encrypted transport": "src/tls_config.py",
            "User authentication": "src/auth.py",
            "Access control": "src/rbac.py",
            "Audit logging": "src/audit_trail.py"
          }

          print("CFR Part 11 Requirements Checklist:")
          print("| Requirement | Implementation | Status |")
          print("|---|---|---|")

          for req, file in checks.items():
            status = "✅" if os.path.exists(file) else "❌"
            print(f"| {req} | {file} | {status} |")

          EOF

      - name: HIPAA Security Rule Verification
        run: |
          echo "🔐 HIPAA: Security Rule Compliance"

          # Check encryption configuration
          grep -r "AES-256-GCM" infrastructure/kubernetes infrastructure/terraform \
            && echo "✅ Encryption algorithm verified" \
            || echo "❌ Encryption algorithm not configured"

          # Check access control
          grep -r "REQUIRE_MFA" infrastructure/kubernetes \
            && echo "✅ MFA requirement verified" \
            || echo "❌ MFA not required"

          # Check encryption in transit
          grep -r "TLS\|tls\|https" src/ \
            && echo "✅ TLS configured" \
            || echo "❌ TLS not configured"

  # =========================================================================
  # Security Scanning (Container, SBOM)
  # =========================================================================
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t test-image:latest . -f Dockerfile || true

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-image:latest'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-image-results.sarif

  # =========================================================================
  # V&V Summary
  # =========================================================================
  verification-summary:
    name: V&V Summary (Gates 3-4 Complete)
    runs-on: ubuntu-latest
    needs: [integration-tests, system-tests, compliance-verification]
    if: always()

    steps:
      - name: Generate V&V summary
        run: |
          echo "## Verification & Validation Summary (SDLC Gates 3-4)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "| 3️⃣ Integration | API + Database | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| 3️⃣ Integration | Audit Trail | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 3️⃣ Integration | Tests | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.system-tests.result }}" == "success" ]; then
            echo "| 4️⃣ Validation | FHIR Compliance | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| 4️⃣ Validation | EHR Integration | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 4️⃣ Validation | System Tests | ❌ FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.compliance-verification.result }}" == "success" ]; then
            echo "| Compliance | IEC 62304 | ✅ VERIFIED |" >> $GITHUB_STEP_SUMMARY
            echo "| Compliance | CFR Part 11 | ✅ VERIFIED |" >> $GITHUB_STEP_SUMMARY
            echo "| Compliance | HIPAA | ✅ VERIFIED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Compliance | Verification | ⚠️ WARNINGS |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if V&V gates failed
        if: |
          needs.integration-tests.result == 'failure' ||
          needs.system-tests.result == 'failure'
        run: |
          echo "❌ V&V gates failed. PR cannot advance to release."
          exit 1
