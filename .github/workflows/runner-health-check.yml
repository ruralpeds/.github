name: Runner Health Check

on:
  workflow_dispatch:
  schedule:
    # Run daily at 06:00 UTC to monitor runner health and disk usage
    # (was every 6 hours; daily is sufficient for disk/health trends)
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # Monitor self-hosted runner health
  # -----------------------------------------------------------------------
  monitor-runners:
    permissions: {}
    concurrency:
      group: runner-health-check-${{ matrix.runner-label.name }}
      cancel-in-progress: false
    strategy:
      matrix:
        runner-label:
          - { name: "Mac Studio (Primary)", labels: ["self-hosted", "mac-studio", "arm64"] }
          - { name: "MacBook Pro (Secondary)", labels: ["self-hosted", "macbook-pro"], continue-on-error: true }
      fail-fast: false

    name: Check ${{ matrix.runner-label.name }}
    runs-on: ${{ matrix.runner-label.labels }}
    timeout-minutes: 5
    continue-on-error: ${{ matrix.runner-label.continue-on-error == true }}

    steps:
      - name: System Information
        id: sysinfo
        run: |
          echo "=== SYSTEM INFORMATION ==="
          echo "Hostname: $(hostname)"
          echo "Kernel: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo "OS Version: $(sw_vers -productVersion)"
          echo "Build: $(sw_vers -buildVersion)"
          echo ""
          echo "CPU Cores: $(sysctl -n hw.logicalcpu)"
          echo "Memory (GB): $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))"
          echo ""
          echo "=== DISK USAGE ==="
          df -h | grep -E '(^Filesystem|/$|/Volumes)'

      - name: Runner Status
        id: runner
        run: |
          echo "=== RUNNER STATUS ==="
          runner_dir="${RUNNER_TOOL_CACHE%/*}"
          if [ -z "$runner_dir" ]; then
            runner_dir=~/actions-runner
          fi

          if [ -d "$runner_dir" ]; then
            echo "Runner directory: $runner_dir"
            echo "Runner config exists: $([ -f $runner_dir/.runner ] && echo 'yes' || echo 'no')"
            echo "Runner credentials: $([ -f $runner_dir/.credentials ] && echo 'yes' || echo 'no')"
          fi

          # Get runner name from environment
          echo "Runner name: ${RUNNER_NAME}"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner temp: ${RUNNER_TEMP}"
          echo "Runner tool cache: ${RUNNER_TOOL_CACHE}"

      - name: Verify Tools
        id: tools
        run: |
          echo "=== REQUIRED TOOLS CHECK ==="

          tools=(
            "git:git --version"
            "gh:gh --version"
            "python3:python3 --version"
            "docker:docker --version"
          )

          failed=0
          for tool_check in "${tools[@]}"; do
            IFS=':' read -r name cmd <<< "$tool_check"
            if eval "$cmd" > /dev/null 2>&1; then
              echo "✓ $name: OK"
              version=$(eval "$cmd" 2>&1 | head -1)
              echo "  $version"
            else
              echo "✗ $name: MISSING"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "=== OPTIONAL TOOLS ==="

          optional_tools=(
            "node:node --version"
            "ruby:ruby --version"
            "java:java -version"
          )

          for tool_check in "${optional_tools[@]}"; do
            IFS=':' read -r name cmd <<< "$tool_check"
            if eval "$cmd" > /dev/null 2>&1; then
              version=$(eval "$cmd" 2>&1 | head -1)
              echo "✓ $name: $version"
            else
              echo "○ $name: not installed"
            fi
          done

          [ $failed -eq 0 ] && echo "" && echo "All required tools present" || exit 1

      - name: Docker Status
        id: docker
        run: |
          echo "=== DOCKER DAEMON CHECK ==="
          if docker info > /dev/null 2>&1; then
            echo "✓ Docker daemon running"
            echo ""
            echo "Docker version:"
            docker version --format 'Client: {{.Client.Version}}\nServer: {{.Server.Version}}'
            echo ""
            echo "Images on disk: $(docker images -q | wc -l)"
            echo "Containers (running): $(docker ps -q | wc -l)"
            echo "Containers (total): $(docker ps -aq | wc -l)"
          else
            echo "✗ Docker daemon not running"
            exit 1
          fi

      - name: GitHub CLI Auth
        id: auth
        run: |
          echo "=== GITHUB CLI AUTHENTICATION ==="
          if gh auth status; then
            echo ""
            echo "✓ GitHub CLI authenticated"
          else
            echo "✗ GitHub CLI not authenticated"
            exit 1
          fi

      - name: Disk Space Alert
        id: diskcheck
        if: always()
        run: |
          echo "=== DISK SPACE ANALYSIS ==="

          # Get disk usage percentage
          disk_usage=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')

          echo "Root disk usage: ${disk_usage}%"

          if [ "$disk_usage" -gt 90 ]; then
            echo "⚠ CRITICAL: Disk usage >90%"
            # List largest files/dirs
            echo ""
            echo "Largest directories:"
            du -sh /* 2>/dev/null | sort -rh | head -10
            exit 1
          elif [ "$disk_usage" -gt 80 ]; then
            echo "⚠ WARNING: Disk usage >80%"
          else
            echo "✓ Disk usage healthy"
          fi

      - name: Memory Status
        id: memory
        if: always()
        run: |
          echo "=== MEMORY STATUS ==="

          total_memory=$(sysctl -n hw.memsize)
          total_mb=$((total_memory / 1024 / 1024))

          # Get approximate free memory (rough estimation from vm_stat)
          vm_output=$(vm_stat)
          free_pages=$(echo "$vm_output" | grep "Pages free" | awk '{print $3}' | tr -d '.')
          page_size=4096
          free_mb=$((free_pages * page_size / 1024 / 1024))

          echo "Total memory: ${total_mb}MB"
          echo "Free memory: ~${free_mb}MB"

          used_pct=$((100 - (100 * free_mb / total_mb)))
          echo "Used: ~${used_pct}%"

          if [ "$used_pct" -gt 90 ]; then
            echo "⚠ WARNING: Memory usage >90%"
            ps aux | sort -k 3,3rn | head -5
          else
            echo "✓ Memory usage healthy"
          fi

      - name: Runner Logs Summary
        id: logs
        if: always()
        run: |
          echo "=== RUNNER LOG FILES ==="

          # Check for common log locations
          log_locations=(
            "/tmp/actions-runner.log"
            "/tmp/actions-runner.err"
            "$HOME/.actions-runner-logs"
          )

          for log_file in "${log_locations[@]}"; do
            if [ -f "$log_file" ]; then
              size=$(du -h "$log_file" | awk '{print $1}')
              lines=$(wc -l < "$log_file")
              echo "$log_file: $size ($lines lines)"

              # Show recent errors
              if grep -i "error\|fatal\|failed" "$log_file" > /dev/null 2>&1; then
                echo "  Recent errors detected:"
                grep -i "error\|fatal\|failed" "$log_file" | tail -3 | sed 's/^/    /'
              fi
            fi
          done

      - name: Job Health Summary
        if: always()
        run: |
          echo "=== HEALTH CHECK COMPLETE ==="
          echo "Runner: ${{ matrix.runner-label.name }}"
          echo "Status: ${{ job.status }}"
          echo "Time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  # -----------------------------------------------------------------------
  # Create summary report
  # -----------------------------------------------------------------------
  report:
    name: Health Check Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [monitor-runners]
    permissions: {}

    steps:
      - name: Check Results
        run: |
          echo "=== RUNNER HEALTH CHECK REPORT ==="
          echo ""
          echo "Job Status Summary:"
          echo "  Overall result: ${{ job.status }}"
          echo ""

          # Parse job results
          if [ "${{ needs.monitor-runners.result }}" = "success" ]; then
            echo "✓ All runners healthy"
          elif [ "${{ needs.monitor-runners.result }}" = "failure" ]; then
            echo "✗ One or more runners have issues"
          elif [ "${{ needs.monitor-runners.result }}" = "skipped" ]; then
            echo "⊘ Health check was skipped"
          fi

      - name: Notify if Issues
        if: failure()
        run: |
          echo "⚠ Runner health check failed"
          echo "Review runner status: https://github.com/${{ github.repository }}/settings/actions/runners"
