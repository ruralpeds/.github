name: "Dependency Audit Inventory"

# Generates Q3 dependency inventory CSV used by compliance-metrics reporting.
# This workflow is read-only and publishes artifact output for review.

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: dependency-audit-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate dependency inventory
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build inventory CSV
        run: |
          bash scripts/dependency-audit/build-inventory.sh

      - name: Upload inventory artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: dependency-inventory-${{ github.run_id }}
          path: compliance-metrics/dependency-inventory-q3-2026.csv
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          echo "## Dependency Inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated: compliance-metrics/dependency-inventory-q3-2026.csv" >> "$GITHUB_STEP_SUMMARY"
