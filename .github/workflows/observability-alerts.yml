name: Observability - Alert Detection

on:
  workflow_run:
    workflows: ['Observability - Daily Metrics Collection']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to detect alerts for (YYYY-MM-DD)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  detect-alerts:
    name: Detect Alert Conditions
    runs-on: ubuntu-latest
    outputs:
      alert-count: ${{ steps.detect.outputs.alert-count }}
      critical-count: ${{ steps.detect.outputs.critical-count }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Detect alert conditions
        id: detect
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          python3 scripts/alert-detector.py \
            --input-file audit-log/observability/aggregated/aggregated-${DATE}.json \
            --rules-file config/alert-rules.json \
            --output-dir audit-log/observability/alerts \
            --date "${DATE}"

          # Extract alert counts from generated report
          if [ -f "audit-log/observability/alerts/alerts-${DATE}.json" ]; then
            ALERT_COUNT=$(python3 -c "
              import json
              with open('audit-log/observability/alerts/alerts-${DATE}.json') as f:
                data = json.load(f)
                print(data.get('alert_count', 0))
            ")
            CRITICAL_COUNT=$(python3 -c "
              import json
              with open('audit-log/observability/alerts/alerts-${DATE}.json') as f:
                data = json.load(f)
                print(data.get('critical_count', 0))
            ")
            echo "alert-count=${ALERT_COUNT}" >> $GITHUB_OUTPUT
            echo "critical-count=${CRITICAL_COUNT}" >> $GITHUB_OUTPUT
          fi

      - name: Archive alerts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ github.run_id }}
          path: audit-log/observability/alerts/alerts-*.json
          retention-days: 90

  create-issues:
    name: Create Issues for Critical Alerts
    needs: detect-alerts
    runs-on: ubuntu-latest
    if: needs.detect-alerts.outputs.critical-count > 0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create issue for critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          ALERTS_FILE="audit-log/observability/alerts/alerts-${DATE}.json"

          if [ ! -f "${ALERTS_FILE}" ]; then
            echo "No alerts file found"
            exit 0
          fi

          python3 -c "
          import json
          import subprocess

          with open('${ALERTS_FILE}') as f:
            data = json.load(f)

          critical_alerts = [a for a in data.get('alerts', []) if a.get('severity') == 'critical']

          if not critical_alerts:
            print('No critical alerts to report')
            exit(0)

          # Create issue for each critical alert
          for alert in critical_alerts[:5]:  # Limit to 5 issues per run
            rule = alert.get('rule', 'unknown')
            details = alert.get('details', {})

            title = f'🔴 Critical Alert: {rule.replace(\"_\", \" \").title()}'
            body = f'''## Alert Details

**Rule:** {rule}
**Severity:** Critical

### Metrics
'''
            for k, v in details.items():
              body += f'- **{k}**: {v}\n'

            body += f'''

### Action Required
See [Alert Runbooks](docs/runbooks/) for remediation steps.

---
*Generated by Observability Platform*
'''

            # Check if issue already exists
            result = subprocess.run(
              ['gh', 'issue', 'list', '--label', f'alert:{rule}', '--json', 'number'],
              capture_output=True, text=True
            )

            if result.returncode == 0 and result.stdout.strip():
              print(f'Issue already exists for {rule}')
            else:
              subprocess.run(
                ['gh', 'issue', 'create', '--title', title, '--body', body, '--label', f'alert:{rule}'],
                check=True
              )
              print(f'Created issue for {rule}')
          "

  notify-alerts:
    name: Notify Alert Status
    needs: detect-alerts
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Report alert summary
        run: |
          echo "## Alert Detection Summary"
          echo ""
          echo "Total Alerts: ${{ needs.detect-alerts.outputs.alert-count }}"
          echo "Critical: ${{ needs.detect-alerts.outputs.critical-count }}"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          if [ "${{ needs.detect-alerts.outputs.critical-count }}" -gt 0 ]; then
            echo "🔴 **ACTION REQUIRED**: Critical alerts detected"
          fi
