name: Auto Bootstrap Gap Analysis — Monthly

# ─────────────────────────────────────────────────────────────────────────────
# Monthly automated bootstrap of .gap-analysis/ system across Rust/Julia repos.
#
# Scheduled:
#   - First day of month at 3 AM EST
#
# Trigger:
#   - Manual via workflow_dispatch for ad-hoc runs
#
# Process:
#   1. Discovers all non-archived Rust and Julia repos without .gap-analysis/
#   2. Creates .gap-analysis/ directory with templates
#   3. Commits and pushes changes to each repo
#   4. Creates GitHub issue summarizing results
#
# Reports:
#   - GitHub issue in ruralpeds/.github with bootstrap summary
#   - Artifact with detailed JSON report
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # First day of month at 3 AM EST (8 AM UTC)
    - cron: '0 8 1 * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would change without committing'
        type: boolean
        default: false
        required: false
      single_repo:
        description: 'Optional: bootstrap single repo (leave blank for all)'
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: gap-bootstrap-auto
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Auto Bootstrap Gap Analysis
    runs-on: [self-hosted, apple-silicon]
    timeout-minutes: 60

    steps:
      - name: Checkout .github repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276b0f2ebde5d8cd729c4d5  # v1.11.0
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds

      - name: Set up Python
        uses: actions/setup-python@0b93645e9e0d6c9253c40eb526b59a8f8f93149d  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run bootstrap
        id: bootstrap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SINGLE_REPO: ${{ inputs.single_repo || '' }}
        run: |
          ARGS=(--token "$GH_TOKEN" --org ruralpeds)

          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ -n "$SINGLE_REPO" ]; then
            ARGS+=(--repo "$SINGLE_REPO")
          fi

          python3 scripts/bootstrap_gap_analysis_new.py "${ARGS[@]}"

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gap-bootstrap-report-${{ github.run_number }}
          path: /tmp/gap_bootstrap_report.json
          retention-days: 30

      - name: Parse bootstrap results
        if: always()
        id: results
        shell: python
        run: |
          import json

          try:
              with open('/tmp/gap_bootstrap_report.json', 'r') as f:
                  report = json.load(f)

              print(f"bootstrapped={report['summary']['bootstrapped']}", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print(f"already_done={report['summary']['already_bootstrapped']}", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print(f"errors={report['summary']['errors']}", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print(f"dry_run={report['dry_run']}", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          except Exception as e:
              print(f"Error parsing report: {e}", file=sys.stderr)
              print(f"bootstrapped=0", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print(f"already_done=0", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print(f"errors=1", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              print(f"dry_run=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
        env:
          REPORT_PATH: /tmp/gap_bootstrap_report.json

      - name: Create GitHub issue with results
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Parse report
            let report = {};
            const reportPath = '/tmp/gap_bootstrap_report.json';

            if (fs.existsSync(reportPath)) {
              try {
                report = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
              } catch (e) {
                console.error('Error parsing report:', e);
              }
            }

            const summary = report.summary || {
              bootstrapped: 0,
              already_bootstrapped: 0,
              errors: 0
            };

            const isDryRun = report.dry_run || false;
            const dryRunBadge = isDryRun ? '⚠️ DRY RUN' : '✅ PRODUCTION';

            // Build issue body
            let body = `## Gap Analysis Auto-Bootstrap Report\n\n`;
            body += `**Timestamp:** ${new Date().toISOString()}\n`;
            body += `**Status:** ${dryRunBadge}\n`;
            body += `**Workflow:** ${context.runId}\n\n`;

            body += `### Summary\n`;
            body += `| Result | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| ✅ Bootstrapped | ${summary.bootstrapped} |\n`;
            body += `| ✓ Already done | ${summary.already_bootstrapped} |\n`;
            body += `| ❌ Errors | ${summary.errors} |\n\n`;

            if (summary.bootstrapped > 0) {
              body += `### Bootstrapped Repos\n`;
              const bootstrapped = report.bootstrapped_repos || [];
              if (bootstrapped.length > 0) {
                bootstrapped.forEach(repo => {
                  body += `- \`${repo}\`\n`;
                });
              }
              body += `\n`;
            }

            if (summary.errors > 0) {
              body += `### ⚠️ Errors\n`;
              body += `Check the workflow run for detailed error messages.\n\n`;
            }

            body += `### Details\n`;
            body += `- **Script:** \`scripts/bootstrap_gap_analysis_new.py\`\n`;
            body += `- **Org:** \`ruralpeds\`\n`;
            body += `- **Target repos:** Rust and Julia (non-archived)\n`;
            body += `- **Artifact:** [gap-bootstrap-report-${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

            // Create or update issue
            const title = `[AUTO] Gap Analysis Bootstrap — ${new Date().toLocaleDateString()}`;

            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                labels: 'gap-analysis,auto-generated'
              });

              // If issue from today exists, update it
              const today = new Date().toLocaleDateString();
              const existingIssue = issues.data.find(i => i.title.includes(today));

              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: body
                });
                console.log(`Updated existing issue #${existingIssue.number}`);
              } else {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['gap-analysis', 'auto-generated']
                });
                console.log(`Created issue #${issue.data.number}`);
              }
            } catch (error) {
              console.error('Error creating/updating issue:', error);
            }

  verify:
    name: Verify Bootstrap Integrity
    runs-on: [self-hosted, mac-studio, arm64]
    needs: bootstrap
    if: always()

    steps:
      - name: Download bootstrap report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4
        with:
          name: gap-bootstrap-report-${{ github.run_number }}

      - name: Check for errors
        shell: bash
        run: |
          if [ ! -f gap_bootstrap_report.json ]; then
            echo "⚠️  No report found"
            exit 0
          fi

          ERRORS=$(python3 -c "import json; r=json.load(open('gap_bootstrap_report.json')); print(r.get('summary', {}).get('errors', 0))")

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Bootstrap had errors"
            cat gap_bootstrap_report.json | python3 -m json.tool
            exit 1
          fi

          echo "✅ Bootstrap completed successfully"

      - name: Print summary to console
        shell: bash
        run: |
          if [ -f gap_bootstrap_report.json ]; then
            echo "=== Bootstrap Summary ==="
            python3 -m json.tool < gap_bootstrap_report.json
          fi
