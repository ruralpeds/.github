name: "Origin Label Enforcement"
# Requires every pull request to carry exactly one `origin:*` label identifying
# whether the code was written by a human, AI-assisted, AI-authored, or agentic.
# This is the foundation of AI governance per the AI-assisted-development policy.
#
# Regulatory drivers:
#   - FDA GMLP Principles 5, 7 — human-AI team composition
#   - FDA PCCP (Dec 2024) — traceability of AI-driven changes
#   - EU AI Act Article 14 — human oversight of high-risk AI systems
#   - NIST AI RMF Map 3.5 — human oversight processes
#
# This workflow is designed to be a REQUIRED STATUS CHECK on clinical repos
# (via ruleset). PRs without exactly one origin:* label will be blocked.
#
# Valid labels:
#   origin:human         — No AI assistance beyond autocomplete
#   origin:ai-assisted   — AI suggested; human edited substantially (< 50% AI)
#   origin:ai-authored   — AI wrote majority (> 50%); human reviewed
#   origin:agentic       — Agent (Claude Code, Copilot agent) executed multi-step changes
#
# Additional enforcement for origin:ai-authored and origin:agentic:
#   - PR body must contain an <!-- ai-session-summary --> block (validated)
#   - Reviewer must add `review:verified-human-understood` before merge

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      required-for-draft:
        description: "Enforce on draft PRs too"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Verify origin label
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 3
    if: ${{ github.event.pull_request.draft == false || inputs.required-for-draft }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate label set
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LABELS_JSON=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          # Extract origin labels
          ORIGIN_LABELS=$(echo "$LABELS_JSON" | jq -r '.[] | select(startswith("origin:"))')
          COUNT=$(echo "$ORIGIN_LABELS" | grep -c . || echo 0)

          # Valid origin values
          VALID="origin:human origin:ai-assisted origin:ai-authored origin:agentic"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::PR is missing an origin:* label."
            echo "Please add exactly one of: $VALID"
            echo "See policies/ai-assisted-development.md for the definition of each."
            echo "verdict=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::PR has multiple origin:* labels ($COUNT found). Keep exactly one."
            echo "Found: $ORIGIN_LABELS"
            echo "verdict=multiple" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Validate the single label is from the allowed set
          LABEL=$(echo "$ORIGIN_LABELS" | head -1)
          if ! echo " $VALID " | grep -q " $LABEL "; then
            echo "::error::Unknown origin label: $LABEL"
            echo "Allowed: $VALID"
            echo "verdict=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "verdict=ok" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "::notice::Origin label OK: $LABEL"

      - name: Validate AI session summary (if ai-authored or agentic)
        if: ${{ steps.check.outputs.label == 'origin:ai-authored' || steps.check.outputs.label == 'origin:agentic' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')

          # Check for the session-summary block
          if ! echo "$BODY" | grep -q "<!-- ai-session-summary -->"; then
            echo "::error::PR is labeled ${{ steps.check.outputs.label }} but missing AI session summary block."
            echo "Add an <!-- ai-session-summary --> block per policies/ai-assisted-development.md."
            exit 1
          fi

          # Check required fields
          python3 <<'PY'
          import os, re, sys
          body = os.popen(f"gh pr view {os.environ['PR_NUMBER']} --json body --jq .body").read()
          m = re.search(r"<!-- ai-session-summary -->(.*?)<!-- /ai-session-summary -->", body, re.DOTALL)
          if not m:
              print("::error::Missing closing <!-- /ai-session-summary --> marker.")
              sys.exit(1)
          block = m.group(1)
          required = ["agent:", "session_started:", "intent:", "phi_used_in_prompts:",
                      "credentials_used_in_prompts:", "reviewer_will_verify:"]
          missing = [f for f in required if f not in block]
          if missing:
              print(f"::error::AI session summary missing required fields: {', '.join(missing)}")
              sys.exit(1)
          # Enforce PHI/credential negatives
          if re.search(r"phi_used_in_prompts:\s*(?:true|True|TRUE|yes|Yes)", block):
              print("::error::phi_used_in_prompts is true — this is a policy violation. Open an incident-response issue.")
              sys.exit(1)
          if re.search(r"credentials_used_in_prompts:\s*(?:true|True|TRUE|yes|Yes)", block):
              print("::error::credentials_used_in_prompts is true — rotate credentials immediately and open an incident.")
              sys.exit(1)
          print("::notice::AI session summary validated.")
          PY

      - name: Require verified-human-understood (ai-authored / agentic)
        if: ${{ (steps.check.outputs.label == 'origin:ai-authored' || steps.check.outputs.label == 'origin:agentic') && github.event.pull_request.state == 'open' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q "^review:verified-human-understood$"; then
            echo "::notice::AI-origin PR has verified-human-understood label."
          else
            # Advisory for open PRs — becomes an error only if the PR is labeled "ready-to-merge"
            echo "::warning::AI-origin PR does NOT yet have review:verified-human-understood label. Required before merge per policies/ai-assisted-development.md."
          fi

      - name: Post helper comment on missing label
        if: ${{ failure() && github.event.action == 'opened' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "## Origin label required

          This PR needs exactly one \`origin:*\` label before it can be merged.

          | Label | Use when |
          |---|---|
          | \`origin:human\` | You wrote the code; AI was limited to autocomplete (or none) |
          | \`origin:ai-assisted\` | AI suggested code; you edited substantially (< 50% AI) |
          | \`origin:ai-authored\` | AI wrote majority; you reviewed — _also requires AI session summary in description_ |
          | \`origin:agentic\` | An AI agent executed multi-step changes — _requires AI session summary + scope declaration_ |

          See [\`policies/ai-assisted-development.md\`](https://github.com/timothyhartzog/Github-workflow/blob/main/policies/ai-assisted-development.md) for the full policy.

          If this is a non-clinical repo and origin labels aren't applicable, remove the repo from the ruleset that requires this check." || true
