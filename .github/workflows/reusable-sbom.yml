name: "Reusable SBOM Generation"
# Generates a CycloneDX Software Bill of Materials (SBOM) for any repo.
#
# Regulatory drivers:
#   - FDA Cybersecurity in Medical Devices: Content of Premarket Submissions
#     (Section 524B, September 2023) — SBOM required for premarket submissions
#   - Executive Order 14028 (May 2021) — federal software purchasers require SBOM
#   - NTIA "Minimum Elements for a Software Bill of Materials" (July 2021)
#   - NIST SP 800-218 (SSDF) PS.3.2 — archive and protect each software release
#   - EU Cyber Resilience Act (expected 2027)
#
# Callers: uses: ruralpeds/.github/.github/workflows/reusable-sbom.yml@main
#
# Outputs:
#   - CycloneDX JSON SBOM at sbom/sbom.cyclonedx.json
#   - SPDX JSON SBOM at sbom/sbom.spdx.json (optional)
#   - Uploaded as workflow artifact (retained 90 days)
#   - Committed to the repo (if commit-sbom input is true)
#   - Attached to the GitHub Release (if running on a release event)
#
# NTIA minimum elements covered:
#   - Supplier name          (derived from package metadata)
#   - Component name         ✓
#   - Version                ✓
#   - Other unique identifiers (PURL, CPE) ✓
#   - Dependency relationship ✓
#   - Author of SBOM data    (GitHub Actions run)
#   - Timestamp              ✓
#   - Cryptographic hash     (SHA-256 in bom-ref)

on:
  workflow_call:
    inputs:
      sbom-format:
        description: "SBOM format(s) to generate: 'cyclonedx', 'spdx', or 'both'"
        type: string
        default: "cyclonedx"
      commit-sbom:
        description: "Commit the generated SBOM to the repo in sbom/ directory"
        type: boolean
        default: true
      attach-to-release:
        description: "Attach SBOM to the GitHub Release (when triggered by a release event)"
        type: boolean
        default: true
      scan-target:
        description: "Path to scan. '.' for whole repo; or a specific artifact path."
        type: string
        default: "."
      artifact-retention-days:
        description: "How many days to retain the SBOM workflow artifact"
        type: number
        default: 90
      fail-on-license-deny:
        description: "Fail if SBOM contains any denied license (GPL-3.0, AGPL-3.0)"
        type: boolean
        default: true
      working-directory:
        description: "Working directory for scans"
        type: string
        default: "."
      attest-sbom:
        description: >
          Create a Sigstore-signed SBOM attestation binding this SBOM to the
          artifact at subject-path. Requires id-token: write and
          attestations: write on the calling workflow.
        type: boolean
        default: false
      subject-path:
        description: >
          Glob of artifact file(s) the SBOM describes (e.g. 'dist/*.tar.gz').
          Required when attest-sbom is true. The SBOM is cryptographically
          bound to the digest(s) of these files.
        type: string
        default: ""
    outputs:
      sbom-path:
        description: "Path to the generated CycloneDX SBOM"
        value: ${{ jobs.sbom.outputs.sbom-path }}
      component-count:
        description: "Number of components in the SBOM"
        value: ${{ jobs.sbom.outputs.component-count }}
      attestation-url:
        description: "URL to the SBOM attestation in the GitHub UI (empty if attest-sbom is false)"
        value: ${{ jobs.sbom.outputs.attestation-url }}

permissions:
  contents: read
  id-token: write      # for OIDC signing when attest-sbom is true
  attestations: write  # for GitHub Attestations API when attest-sbom is true

jobs:
  sbom:
    name: Generate SBOM (${{ inputs.sbom-format }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # to commit sbom/ back to the repo
      id-token: write   # for OIDC signing when attest-sbom is true
      attestations: write  # for GitHub Attestations API when attest-sbom is true
    outputs:
      sbom-path: ${{ steps.generate.outputs.sbom-path }}
      component-count: ${{ steps.summarize.outputs.component-count }}
      attestation-url: ${{ steps.attest-sbom.outputs.attestation-url }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ── 1. Prepare sbom/ directory ──────────────────────────────────────────
      - name: Prepare sbom directory
        run: |
          mkdir -p sbom
          # Record the generation context for audit purposes.
          cat > sbom/generation-context.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "workflow": "${{ github.workflow }}",
            "actor": "${{ github.actor }}",
            "ntia_minimum_elements": "covered",
            "fda_524b_compliant": "cyclonedx-1.5+",
            "generator": "anchore/sbom-action (Syft backend)"
          }
          EOF

      # ── 2. Generate CycloneDX SBOM (primary format — FDA/EO 14028 preferred) ─
      - name: Generate CycloneDX SBOM
        if: ${{ inputs.sbom-format == 'cyclonedx' || inputs.sbom-format == 'both' }}
        id: cyclonedx
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: ${{ inputs.scan-target }}
          format: cyclonedx-json
          output-file: sbom/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # ── 3. Generate SPDX SBOM (secondary format — some auditors require SPDX) ─
      - name: Generate SPDX SBOM
        if: ${{ inputs.sbom-format == 'spdx' || inputs.sbom-format == 'both' }}
        id: spdx
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: ${{ inputs.scan-target }}
          format: spdx-json
          output-file: sbom/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Record primary SBOM path
        id: generate
        run: |
          if [ -f sbom/sbom.cyclonedx.json ]; then
            echo "sbom-path=sbom/sbom.cyclonedx.json" >> "$GITHUB_OUTPUT"
          elif [ -f sbom/sbom.spdx.json ]; then
            echo "sbom-path=sbom/sbom.spdx.json" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No SBOM file was produced."
            exit 1
          fi

      # ── 4. Summarize findings (components, licenses) ────────────────────────
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Summarize SBOM
        id: summarize
        run: |
          set -euo pipefail
          SBOM="${{ steps.generate.outputs.sbom-path }}"

          if [[ "$SBOM" == *.cyclonedx.json ]]; then
            COMPONENT_COUNT=$(jq '[.components[]?] | length' "$SBOM")
            # Licenses: CycloneDX puts them at .components[].licenses[].license.id
            jq -r '[.components[]? | (.licenses // [])[] | (.license.id // .license.name // "UNKNOWN")] | sort | unique | .[]' "$SBOM" > sbom/licenses.txt
          else
            COMPONENT_COUNT=$(jq '[.packages[]?] | length' "$SBOM")
            jq -r '[.packages[]? | (.licenseDeclared // .licenseConcluded // "NOASSERTION")] | sort | unique | .[]' "$SBOM" > sbom/licenses.txt
          fi
          echo "component-count=$COMPONENT_COUNT" >> "$GITHUB_OUTPUT"
          LICENSE_COUNT=$(wc -l < sbom/licenses.txt)
          echo "license-count=$LICENSE_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "# Software Bill of Materials (SBOM) Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Format | $(basename $SBOM) |"
            echo "| Components | $COMPONENT_COUNT |"
            echo "| Unique licenses | $LICENSE_COUNT |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Generated at | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
            echo "## Licenses detected"
            echo ""
            echo '```'
            cat sbom/licenses.txt
            echo '```'
            echo ""
            echo "## Regulatory basis"
            echo ""
            echo "- FDA Cybersecurity in Medical Devices (Section 524B, Sept 2023)"
            echo "- Executive Order 14028 (May 2021)"
            echo "- NTIA Minimum Elements for a Software Bill of Materials (July 2021)"
            echo ""
            echo "_Generated by \`reusable-sbom.yml\` from \`ruralpeds/.github\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5. Enforce license denylist ─────────────────────────────────────────
      - name: Enforce license denylist
        if: ${{ inputs.fail-on-license-deny }}
        run: |
          set -euo pipefail
          # Runtime deny list for a medical-software / commercial context.
          # GPL-3.0 and AGPL-3.0 carry strong copyleft; some healthcare
          # deployments have historically struggled with compliance.
          # NOTE: For development tools, check the specific license carefully.
          DENY_REGEX='^(GPL-3\.0(-or-later|-only)?|AGPL-3\.0(-or-later|-only)?|SSPL-1\.0|Commons-Clause|BUSL-1\.1)$'
          VIOLATIONS=$(grep -E "$DENY_REGEX" sbom/licenses.txt || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Denied license(s) detected in SBOM:"
            echo "$VIOLATIONS" | while read -r lic; do
              echo "::error::  - $lic"
            done
            echo ""
            echo "These licenses are denied for runtime dependencies by organizational policy."
            echo "If the violation is a development-only dependency, filter the SBOM and re-run."
            exit 1
          fi
          echo "No denied licenses detected."

      # ── 6. Upload SBOM as workflow artifact ─────────────────────────────────
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: sbom-${{ github.run_id }}
          path: sbom/
          retention-days: ${{ inputs.artifact-retention-days }}

      # ── 7. Commit SBOM to repository (for long-term auditability) ──────────
      - name: Commit SBOM to repo
        if: ${{ inputs.commit-sbom }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code sbom/ 2>/dev/null; then
            echo "No SBOM changes to commit."
            exit 0
          fi

          git add sbom/
          git commit -m "chore(sbom): regenerate SBOM for ${{ github.sha }}

          Component count: ${{ steps.summarize.outputs.component-count }}
          Licenses: ${{ steps.summarize.outputs.license-count }}
          Regulatory basis: FDA 524B, EO 14028, NTIA minimum elements
          Generated by: ${{ github.workflow }} run ${{ github.run_id }}

          [skip ci]"

          # Push via the existing ambient GITHUB_TOKEN. If this reusable
          # workflow is called from a PR from a fork, this push will fail
          # gracefully and the SBOM remains available as an artifact.
          git push || {
            echo "::warning::Could not push SBOM commit (likely a fork PR); artifact is still available."
          }

      # ── 8. Attest SBOM (bind SBOM to artifact via Sigstore) ────────────────
      - name: Attest SBOM
        id: attest-sbom
        if: ${{ inputs.attest-sbom && inputs.subject-path != '' }}
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b  # v2.4.0
        with:
          subject-path: ${{ inputs.subject-path }}
          sbom-path: sbom/sbom.cyclonedx.json

      # ── 9. Attach SBOM to GitHub Release (when applicable) ─────────────────
      - name: Attach SBOM to Release
        if: ${{ inputs.attach-to-release && github.event_name == 'release' }}
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            sbom/sbom.cyclonedx.json
            sbom/sbom.spdx.json
            sbom/licenses.txt
            sbom/generation-context.json
          fail_on_unmatched_files: false
