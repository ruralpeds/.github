name: Build WASM

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-wasm.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build-wasm:
    name: Build ped-wasm → apps/web/wasm-pkg
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build ped-wasm
        run: |
          wasm-pack build \
            --target web \
            --out-dir apps/web/wasm-pkg \
            --out-name ped_wasm \
            --release \
            crates/ped-wasm

      - name: Show build output size
        run: |
          echo "=== WASM build output ==="
          ls -lh apps/web/wasm-pkg/
          wc -c apps/web/wasm-pkg/ped_wasm_bg.wasm

      - name: Upload wasm-pkg as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: apps/web/wasm-pkg/
          retention-days: 30

      # Commit wasm-pkg back to main if this is a push (not a PR)
      - name: Commit built WASM to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/wasm-pkg/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No WASM changes to commit."
          else
            git commit -m "chore(wasm): rebuild ped-wasm [skip ci]"
            git push
          fi
