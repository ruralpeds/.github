name: "Post-Market Surveillance Tracker"

# Automates post-market event capture per 21 CFR 806 and IEC 62304 §7.4.
#
# Triggers when an issue is labeled `post-market` (opened or edited).
# Appends a JSONL entry to dhf/post-market/complaints.jsonl and
# posts a confirmation comment on the issue.
#
# Regulatory drivers:
#   - 21 CFR Part 806 — Medical Device Reports (adverse events)
#   - 21 CFR Part 11 §11.10(d) — Audit trail for regulated records
#   - IEC 62304 §7.4 — Post-market software monitoring
#   - HIPAA §164.312(b) — Audit controls
#
# Required permissions:
#   contents: write  (to commit complaints.jsonl)
#   issues: write    (to post confirmation comment)
#
# NOTE: Never log PHI in complaints.jsonl. The template instructs reporters
#       not to include real patient data; this workflow records only metadata
#       (issue number, title, URL, timestamp, actor).

on:
  issues:
    types:
      - labeled
      - edited

permissions:
  contents: write
  issues: write

jobs:
  track-event:
    name: Record post-market event
    if: >
      github.event.action == 'labeled' && github.event.label.name == 'post-market' ||
      github.event.action == 'edited' && contains(toJSON(github.event.issue.labels), '"post-market"')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true  # needed for the commit-and-push step

      - name: Extract event metadata
        id: meta
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"
          ACTOR="${{ github.event.sender.login }}"
          ACTION="${{ github.event.action }}"

          # Sanitise title for JSON: escape double-quotes and backslashes
          SAFE_TITLE=$(echo "$ISSUE_TITLE" | sed 's/\\/\\\\/g; s/"/\\"/g')

          echo "timestamp=$TIMESTAMP"           >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER"     >> "$GITHUB_OUTPUT"
          echo "safe_title=$SAFE_TITLE"         >> "$GITHUB_OUTPUT"
          echo "issue_url=$ISSUE_URL"           >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR"                   >> "$GITHUB_OUTPUT"
          echo "action=$ACTION"                 >> "$GITHUB_OUTPUT"

      - name: Append to WORM audit log
        id: append
        run: |
          mkdir -p dhf/post-market

          ENTRY=$(cat <<EOF
          {"timestamp":"${{ steps.meta.outputs.timestamp }}","event_type":"post-market-event","action":"${{ steps.meta.outputs.action }}","issue_number":${{ steps.meta.outputs.issue_number }},"title":"${{ steps.meta.outputs.safe_title }}","repo":"${{ github.repository }}","actor":"${{ steps.meta.outputs.actor }}","event_url":"${{ steps.meta.outputs.issue_url }}"}
          EOF
          )

          # Strip leading whitespace from heredoc
          ENTRY=$(echo "$ENTRY" | xargs)

          echo "$ENTRY" >> dhf/post-market/complaints.jsonl

          # Validate it is well-formed JSON before committing
          echo "$ENTRY" | python3 -c "import json,sys; json.load(sys.stdin); print('JSON valid')"

          ENTRY_COUNT=$(wc -l < dhf/post-market/complaints.jsonl)
          echo "entry_count=$ENTRY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit audit log entry
        run: |
          git config user.email "actions@github.com"
          git config user.name "post-market-tracker[bot]"
          git add dhf/post-market/complaints.jsonl
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "audit(post-market): record event for issue #${{ steps.meta.outputs.issue_number }} [skip ci]"
          git push

      - name: Post confirmation comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const entryCount = '${{ steps.append.outputs.entry_count }}';
            const timestamp  = '${{ steps.meta.outputs.timestamp }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Post-Market Event Recorded',
                '',
                `✅ This event has been logged to \`dhf/post-market/complaints.jsonl\` (entry #${entryCount}) at \`${timestamp}\`.`,
                '',
                '**Next steps:**',
                '1. Complete the root-cause and regulatory-disposition sections if not already filled in.',
                '2. If **FDA Reportable**, file a MedWatch report within 30 days (21 CFR 803).',
                '3. If a **CAPA** is required, open a linked issue with label `capa`.',
                '4. Assign this issue to the responsible engineer for investigation.',
                '',
                '_Powered by `post-market-tracker.yml` — 21 CFR 806 / IEC 62304 §7.4_',
              ].join('\n'),
            });

      - name: Step summary
        if: always()
        run: |
          echo "## Post-Market Event Tracker" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Issue | #${{ steps.meta.outputs.issue_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | ${{ steps.meta.outputs.action }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | ${{ steps.meta.outputs.timestamp }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total entries | ${{ steps.append.outputs.entry_count }} |" >> "$GITHUB_STEP_SUMMARY"
