name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json', 'apps/web/package.json') }}
          restore-keys: node-${{ runner.os }}-

      # ------------------------------------------------------------------
      # Build WASM: compile Rust crates to WebAssembly
      # ------------------------------------------------------------------
      - name: Build WASM package
        run: |
          cd crates/ped-wasm
          wasm-pack build --target web --release --out-dir ../../apps/web/wasm-pkg
          echo "WASM built: $(ls -la ../../apps/web/wasm-pkg/*.wasm 2>/dev/null | head -1)"

      # ------------------------------------------------------------------
      # Build SvelteKit: full static site with WASM integration
      # ------------------------------------------------------------------
      - name: Install Node dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Build SvelteKit app
        working-directory: apps/web
        run: npm run build

      # ------------------------------------------------------------------
      # Merge: SvelteKit build output + static assets
      # ------------------------------------------------------------------
      - name: Assemble site
        run: |
          mkdir -p _site
          # SvelteKit build output is the primary site
          cp -r apps/web/build/* _site/
          # Copy any static assets not already handled by SvelteKit
          # (decision trees, DOCX files, education downloads)
          if [ -d apps/web/static ]; then
            cp -rn apps/web/static/* _site/ 2>/dev/null || true
          fi
          echo "Site assembled: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
