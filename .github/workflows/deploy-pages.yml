name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ------------------------------------------------------------------
      # Phase 1: Serve static content directly
      # Decision trees, calculators, education downloads all work without
      # a SvelteKit build. The SvelteKit app build is added in Phase 2
      # once wasm-pack CI is configured.
      # ------------------------------------------------------------------
      
      - name: Build static site
        run: |
          mkdir -p _site
          cp -r apps/web/static/* _site/
          echo "Site built: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
