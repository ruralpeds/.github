name: Backfill SLSA v1 Provenance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to backfill provenance for'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  backfill-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Get release commit information
        id: release-info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          ARTIFACT_SUBJECT="${{ inputs.release_tag }}:${COMMIT_SHA:0:8}"
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "artifact_subject=${ARTIFACT_SUBJECT}" >> $GITHUB_OUTPUT

      - name: Generate SLSA v1 provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: '.'
          subject-digest: sha256:${{ hashFiles('.github/**', 'dhf/**', 'compliance-metrics/**') }}
          push-to-registry: false

      - name: Create attestation metadata file
        run: |
          cat > /tmp/provenance-metadata.json << 'EOF'
          {
            "release_tag": "${{ inputs.release_tag }}",
            "commit_sha": "${{ steps.release-info.outputs.commit_sha }}",
            "backfill_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "builder": "GitHub Actions",
            "workflow": "backfill-slsa-provenance.yml",
            "attestation_type": "slsa_provenance_v1"
          }
          EOF
          cat /tmp/provenance-metadata.json

      - name: Upload attestation metadata
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-${{ inputs.release_tag }}
          path: /tmp/provenance-metadata.json
          retention-days: 90

      - name: Print attestation verification command
        run: |
          echo "Attestation generated for release: ${{ inputs.release_tag }}"
          echo "Commit: ${{ steps.release-info.outputs.commit_sha }}"
          echo ""
          echo "To verify attestation, run:"
          echo "gh attestation verify --repo \${{ github.repository }} \\"
          echo "  --cert-identity https://token.actions.githubusercontent.com \\"
          echo "  --cert-oidc-issuer https://token.actions.githubusercontent.com"
