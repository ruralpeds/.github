name: "Reusable Container Image Signing (cosign)"

# Signs OCI container images with cosign keyless signing.
#
# Regulatory drivers:
#   - NIST SP 800-218 (SSDF) PO.3 — provenance, PO.5 — provenance verification
#   - SLSA v1.0 — signed container attestations
#   - FDA Section 524B — supply-chain security
#   - OpenSSF Best Practices — signed artifacts
#
# Callers: uses: ruralpeds/.github/.github/workflows/reusable-container-sign.yml@main
#
# Process:
#   1. Build container image (caller responsibility; this workflow signs an existing image)
#   2. Keyless signing via GitHub OIDC + Sigstore Fulcio + Rekor ledger
#   3. Attestation uploaded to image repository
#   4. Image digest + signature recorded in audit log
#
# Verification:
#   cosign verify --certificate-identity-regexp=https://github.com/ruralpeds/ \
#     ghcr.io/ruralpeds/myapp:latest
#
# Outputs:
#   - Signed image digest
#   - Signature attached to OCI image manifest

on:
  workflow_call:
    inputs:
      image-uri:
        description: "Full image URI (registry/org/repo:tag or @digest)"
        type: string
        required: true
      registry:
        description: "Image registry (ghcr.io, docker.io, etc.)"
        type: string
        default: "ghcr.io"
      registry-username:
        description: "Registry username (defaults to github.actor)"
        type: string
        default: ""
      registry-token-secret:
        description: "Name of secret containing registry token"
        type: string
        default: "GITHUB_TOKEN"

permissions:
  contents: read
  id-token: write  # Required for Sigstore OIDC
  packages: write  # Required for ghcr.io push

jobs:
  sign:
    name: Sign Container Image (cosign keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      signed-image: ${{ inputs.image-uri }}
      digest: ${{ steps.sign.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.2'

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username || github.actor }}
          password: ${{ secrets[inputs.registry-token-secret] }}

      - name: Sign image (keyless via Sigstore)
        id: sign
        env:
          COSIGN_YES: "true"
        run: |
          echo "=== Signing Container Image ==="
          IMAGE_URI="${{ inputs.image-uri }}"
          echo "Image: $IMAGE_URI"
          echo ""

          # Sign with GitHub OIDC + Sigstore Fulcio
          cosign sign \
            --yes \
            "$IMAGE_URI"

          # Extract digest from signed image
          DIGEST=$(cosign triangulate "$IMAGE_URI" 2>/dev/null || echo "unknown")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Signature Verification Command ==="
          echo "cosign verify \\"
          echo "  --certificate-identity-regexp='https://github.com/ruralpeds/' \\"
          echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\"
          echo "  $IMAGE_URI"

      - name: Attach attestation (SBOM)
        run: |
          echo "Note: SBOM attestation should be attached separately via reusable-sbom.yml"
          echo "See: cosign attest --attestation sbom.json ${{ inputs.image-uri }}"

      - name: Record to audit log
        run: |
          cat >> /tmp/audit-entry.json <<'EOF'
          {
            "event_type": "container-signed",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "image": "${{ inputs.image-uri }}",
            "digest": "${{ steps.sign.outputs.digest }}",
            "signer": "github-oidc-sigstore",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF
          cat /tmp/audit-entry.json
