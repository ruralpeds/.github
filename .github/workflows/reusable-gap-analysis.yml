name: Reusable — Gap Analysis Lifecycle

# Single org-level workflow that handles every gap-analysis state transition.
# Called from each repo's .github/workflows/gap-analysis-lifecycle.yml caller.
#
# Inputs are intentionally narrow; all parsing logic lives in
# scripts/gap_lifecycle.py inside ruralpeds/.github.

on:
  workflow_call:
    inputs:
      event:
        description: "branch_opened | pr_opened | pr_edited | pr_merged | pr_closed_unmerged | audit"
        required: true
        type: string
      gap_id:
        description: "Optional override; usually parsed from branch/PR by the script"
        required: false
        type: string
      pr_number:
        description: "PR number when applicable"
        required: false
        type: string
      branch_ref:
        description: "Branch ref (refs/heads/gap/NNN-slug) when applicable"
        required: false
        type: string
      merge_sha:
        description: "Merge commit SHA when applicable"
        required: false
        type: string
      actor:
        description: "GitHub actor login"
        required: false
        type: string
        default: ${{ github.actor }}
    secrets:
      bot_token:
        description: "Optional override for GITHUB_TOKEN (use a PAT to bypass branch protection on auto-commits)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout caller repo (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.bot_token || secrets.GITHUB_TOKEN }}

      - name: Checkout org .github (for shared script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ruralpeds/.github
          ref: main
          path: .org-github
          token: ${{ secrets.bot_token || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify .gap-analysis directory exists
        id: verify
        shell: bash
        run: |
          if [ ! -d .gap-analysis ]; then
            echo "::warning::Repo has no .gap-analysis/ directory; skipping lifecycle event."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f .gap-analysis/GAP_ANALYSIS.md ]; then
            echo "::warning::Repo has no .gap-analysis/GAP_ANALYSIS.md; skipping lifecycle event."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # branch_opened
      # ------------------------------------------------------------------
      - name: Handle branch_opened
        if: steps.verify.outputs.skip != 'true' && inputs.event == 'branch_opened'
        shell: bash
        env:
          BRANCH_REF: ${{ inputs.branch_ref }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          GAP_ID=$(python .org-github/scripts/gap_lifecycle.py extract-id --branch "${BRANCH_REF#refs/heads/}" || echo "")
          if [ -z "$GAP_ID" ]; then
            echo "::notice::Branch ${BRANCH_REF} does not match gap/NNN-... pattern; nothing to do."
            exit 0
          fi
          echo "Branch references $GAP_ID; advancing status."
          python .org-github/scripts/gap_lifecycle.py advance \
            --repo . \
            --gap "$GAP_ID" \
            --to "In Progress" \
            --trigger branch_opened \
            --branch "${BRANCH_REF#refs/heads/}" \
            --actor "$ACTOR" \
            --sha "${GITHUB_SHA:0:7}"

      # ------------------------------------------------------------------
      # pr_opened or pr_edited
      # ------------------------------------------------------------------
      - name: Handle pr_opened/pr_edited
        if: steps.verify.outputs.skip != 'true' && (inputs.event == 'pr_opened' || inputs.event == 'pr_edited')
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ACTOR: ${{ inputs.actor }}
          GH_TOKEN: ${{ secrets.bot_token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Get PR title via gh CLI (stable, no extra inputs needed)
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)
          GAP_ID=$(python .org-github/scripts/gap_lifecycle.py extract-id --pr-title "$PR_TITLE" || echo "")
          if [ -z "$GAP_ID" ]; then
            echo "::warning::PR #$PR_NUMBER title does not start with GAP-NNN:; cannot link."
            gh pr comment "$PR_NUMBER" --body "⚠️ Gap Analysis: this PR's title does not start with \`GAP-NNN:\`. The lifecycle workflow could not link it to a gap. Please update the title to follow \`GAP-NNN: <description>\` and the link will be made on the next \`edited\` event."
            exit 0
          fi
          python .org-github/scripts/gap_lifecycle.py link-pr \
            --repo . \
            --gap "$GAP_ID" \
            --pr "$PR_NUMBER" \
            --actor "$ACTOR"

      # ------------------------------------------------------------------
      # pr_merged
      # ------------------------------------------------------------------
      - name: Handle pr_merged
        if: steps.verify.outputs.skip != 'true' && inputs.event == 'pr_merged'
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          ACTOR: ${{ inputs.actor }}
          GH_TOKEN: ${{ secrets.bot_token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          # Primary gap from title; secondary gaps from "Also closes:" line in body
          PRIMARY=$(python .org-github/scripts/gap_lifecycle.py extract-id --pr-title "$PR_TITLE" || echo "")
          SECONDARY=$(python .org-github/scripts/gap_lifecycle.py extract-id --pr-body "$PR_BODY" || echo "")
          ALL_GAPS="$PRIMARY $SECONDARY"
          for GAP in $ALL_GAPS; do
            [ -z "$GAP" ] && continue
            python .org-github/scripts/gap_lifecycle.py complete \
              --repo . \
              --gap "$GAP" \
              --pr "$PR_NUMBER" \
              --merge-sha "$MERGE_SHA" \
              --actor "$ACTOR"
          done

      # ------------------------------------------------------------------
      # pr_closed_unmerged
      # ------------------------------------------------------------------
      - name: Handle pr_closed_unmerged
        if: steps.verify.outputs.skip != 'true' && inputs.event == 'pr_closed_unmerged'
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ACTOR: ${{ inputs.actor }}
          GH_TOKEN: ${{ secrets.bot_token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)
          GAP_ID=$(python .org-github/scripts/gap_lifecycle.py extract-id --pr-title "$PR_TITLE" || echo "")
          if [ -z "$GAP_ID" ]; then
            echo "::notice::PR #$PR_NUMBER closed without a recognizable gap reference; nothing to do."
            exit 0
          fi
          python .org-github/scripts/gap_lifecycle.py revert-to-progress \
            --repo . \
            --gap "$GAP_ID" \
            --pr "$PR_NUMBER" \
            --actor "$ACTOR"

      # ------------------------------------------------------------------
      # audit (scheduled)
      # ------------------------------------------------------------------
      - name: Handle audit
        if: steps.verify.outputs.skip != 'true' && inputs.event == 'audit'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.bot_token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python .org-github/scripts/gap_lifecycle.py audit --repo . --report-file /tmp/audit-report.md
          if [ -s /tmp/audit-report.md ]; then
            cat /tmp/audit-report.md >> "$GITHUB_STEP_SUMMARY"
            # Open a single tracking issue if drift detected
            if grep -q "^DRIFT" /tmp/audit-report.md; then
              gh issue create \
                --title "Gap Analysis audit drift detected ($(date -u +%Y-%m-%d))" \
                --body-file /tmp/audit-report.md \
                --label gap-analysis,audit-drift || true
            fi
          fi

      # ------------------------------------------------------------------
      # Always: regenerate status.json + commit if anything changed
      # ------------------------------------------------------------------
      - name: Regenerate status.json
        if: steps.verify.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .org-github/scripts/gap_lifecycle.py sync-index --repo .

      - name: Commit any changes
        if: steps.verify.outputs.skip != 'true' && inputs.event != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet .gap-analysis/; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "ruralpeds-gap-bot"
          git config user.email "gap-bot@ruralpeds.invalid"
          git add .gap-analysis/
          git commit -m "chore(gap-analysis): ${{ inputs.event }} [skip ci]" \
            -m "Automated by reusable-gap-analysis.yml from ruralpeds/.github" \
            -m "Event: ${{ inputs.event }}" \
            -m "Actor: ${{ inputs.actor }}"
          # Push to whatever branch we're on
          BRANCH="${GITHUB_REF#refs/heads/}"
          # On pull_request events, GITHUB_REF is refs/pull/N/merge — fall back to head ref
          if [[ "$GITHUB_REF" == refs/pull/* ]]; then
            BRANCH="${GITHUB_HEAD_REF}"
          fi
          git push origin "HEAD:$BRANCH"
