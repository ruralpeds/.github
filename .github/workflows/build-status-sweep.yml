name: CI Build Status Sweep — All Gap-Tracked Repos

# ─────────────────────────────────────────────────────────────────────────────
# EVENT-DRIVEN (+ daily sync) to synchronise CI build statuses with gap
# lifecycle statuses across all ruralpeds repos carrying .gap-analysis/GAP_ANALYSIS.md
# (Rust, Julia, and the .github org repo itself).
#
# Triggers:
#   1. workflow_run: When ci-rust.yml, ci-julia.yml, etc. complete (real-time)
#   2. pull_request: When GAP-NNN PR opens/syncs (immediate feedback)
#   3. schedule: Daily at 6 AM UTC (catch any missed events; ~90% fewer API calls)
#   4. workflow_dispatch: Manual override (for testing/remediation)
#
# For each detected change it:
#   1. Finds open PRs targeting production branches (main, master, release/*)
#   2. Extracts GAP-NNN from branch name or PR title
#   3. Reads the latest CI run status on that branch
#   4. Calls reusable-build-status.yml with the appropriate signal
#   5. Calls reusable-readme-gap-status.yml to refresh the README gap table
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Real-time: Trigger when CI workflows complete (all gap-tracked repos)
  workflow_run:
    workflows: ['ci-rust.yml', 'ci-julia.yml', 'self-test.yml']
    types: [completed]

  # Real-time: Trigger when GAP-NNN PR opened/updated
  pull_request:
    types: [opened, synchronize]
    branches: [main, master, develop, 'release/**']

  # Daily sync: Catch any missed events (6 AM UTC = 1 AM EST / 10 PM PST)
  schedule:
    - cron: "0 6 * * *"

  # Manual: Override for testing/remediation
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Limit sweep to a single repo (owner/repo). Leave blank for all repos."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print actions but do not update gaps or READMEs"
        type: boolean
        required: false
        default: false
      skip_readme:
        description: "Skip README gap-status refresh"
        type: boolean
        required: false
        default: false

jobs:
  discover:
    name: Discover gap-tracked repos and open PRs
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      readme_repos: ${{ steps.build-matrix.outputs.readme_repos }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds

      - name: Determine target repos
        id: target-repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TRIGGER: ${{ github.event_name }}
          SINGLE_REPO: ${{ inputs.target_repo }}
          PR_REPO: ${{ github.repository }}
          WF_REPO: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail

          if [ -n "$SINGLE_REPO" ]; then
            # Manual override: scan specific repo
            repos="$SINGLE_REPO"
          elif [ "$TRIGGER" = "pull_request" ]; then
            # Event-driven: triggered by PR on specific repo
            repos="$PR_REPO"
            echo "Event-driven (pull_request): targeting $repos"
          elif [ "$TRIGGER" = "workflow_run" ]; then
            # Event-driven: triggered by CI completion on specific repo
            repos="$WF_REPO"
            echo "Event-driven (workflow_run): targeting $repos"
          else
            # Schedule or manual dispatch: full discovery
            echo "Full discovery mode (schedule or dispatch)"
            # Discover all Rust and Julia repos, plus the .github org repo itself
            rust_repos=$(gh repo list ruralpeds --language Rust --limit 100 \
              --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null || true)
            julia_repos=$(gh repo list ruralpeds --language Julia --limit 100 \
              --json nameWithOwner --jq '.[].nameWithOwner' 2>/dev/null || true)
            # .github always included — it hosts the gap analysis tooling itself
            repos=$(printf '%s\n%s\nruralpeds/.github\n' "$rust_repos" "$julia_repos" \
              | sort -u | grep -v '^$')
          fi

          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      - name: Build sweep matrix
        id: build-matrix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOS: ${{ steps.target-repos.outputs.repos }}
        run: |
          set -euo pipefail

          repos="$REPOS"

          # Filter to only repos that actually have .gap-analysis/GAP_ANALYSIS.md
          # (Event-driven triggers: usually 1-3 repos; Schedule: all repos)
          gap_repos=""
          repo_count=$(echo "$repos" | wc -w | tr -d ' ')
          echo "Checking $repo_count repo(s) for .gap-analysis/…"

          for repo in $repos; do
            exists=$(gh api "repos/${repo}/contents/.gap-analysis/GAP_ANALYSIS.md" \
              --jq '.name' 2>/dev/null || echo "")
            if [ -n "$exists" ]; then
              gap_repos="$gap_repos $repo"
              echo "  ✓ $repo has .gap-analysis/"
            else
              echo "  - $repo no .gap-analysis/ — skipping"
            fi
          done

          gap_count=$(echo "$gap_repos" | wc -w | tr -d ' ')
          echo "Repos with gap analysis: $gap_count"

          entries="[]"
          readme_repos="[]"

          for repo in $gap_repos; do
            echo "Scanning PRs for $repo …"

            # Collect README repo list (all repos with gap analysis get README refresh)
            readme_repos=$(python3 -c "
          import json, sys
          lst = json.loads(sys.argv[1])
          lst.append(sys.argv[2])
          print(json.dumps(lst))
          " "$readme_repos" "$repo")

            # Open PRs targeting main or master
            prs=$(gh pr list \
              --repo "$repo" \
              --state open \
              --base "main" \
              --json number,headRefName,title \
              --limit 50 2>/dev/null || echo "[]")
            prs_master=$(gh pr list \
              --repo "$repo" \
              --state open \
              --base "master" \
              --json number,headRefName,title \
              --limit 50 2>/dev/null || echo "[]")

            all_prs=$(python3 -c "
          import json, sys
          a = json.loads(sys.argv[1])
          b = json.loads(sys.argv[2])
          seen = set()
          out = []
          for item in a + b:
              k = item['number']
              if k not in seen:
                  seen.add(k)
                  out.append(item)
          print(json.dumps(out))
          " "$prs" "$prs_master")

            new_entries=$(python3 - "$repo" "$all_prs" <<'PYEOF'
          import json, subprocess, sys, re

          repo   = sys.argv[1]
          prs    = json.loads(sys.argv[2])
          GAP_RE = re.compile(r'GAP-\d{3,4}')
          entries = []

          for pr in prs:
              branch = pr.get('headRefName', '')
              title  = pr.get('title', '')
              pr_num = str(pr.get('number', ''))

              m = GAP_RE.search(branch) or GAP_RE.search(title)
              if not m:
                  continue
              gap_id = m.group(0)

              try:
                  run_json = subprocess.check_output([
                      'gh', 'run', 'list',
                      '--repo', repo,
                      '--branch', branch,
                      '--limit', '1',
                      '--json', 'status,conclusion,databaseId,headSha',
                  ], text=True, stderr=subprocess.DEVNULL)
                  runs = json.loads(run_json)
              except Exception:
                  runs = []

              if not runs:
                  continue

              run        = runs[0]
              status     = run.get('status', '')
              conclusion = run.get('conclusion', '')
              run_id     = str(run.get('databaseId', ''))
              sha        = run.get('headSha', '')

              if status in ('in_progress', 'queued'):
                  ci_signal = 'started'
              elif status == 'completed' and conclusion == 'success':
                  ci_signal = 'passed'
              elif status == 'completed' and conclusion in ('failure', 'timed_out', 'cancelled'):
                  ci_signal = 'failed'
              else:
                  continue

              entries.append({
                  'repo':      repo,
                  'gap_id':    gap_id,
                  'ci_status': ci_signal,
                  'branch':    branch,
                  'pr_number': pr_num,
                  'sha':       sha,
                  'run_id':    run_id,
              })

          print(json.dumps(entries))
          PYEOF
          )

            entries=$(python3 -c "
          import json, sys
          print(json.dumps(json.loads(sys.argv[1]) + json.loads(sys.argv[2])))
          " "$entries" "$new_entries")
          done

          matrix=$(python3 -c "
          import json, sys
          items = json.loads(sys.argv[1])
          print(json.dumps({'include': items}))
          " "$entries")

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "readme_repos=$readme_repos" >> "$GITHUB_OUTPUT"

          count=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$entries")
          echo "Total CI status entries: $count"
          echo "Repos with gap analysis: $(echo $gap_repos | wc -w | tr -d ' ')"

      - name: Log trigger mode & API savings
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$TRIGGER" in
            pull_request)
              echo "📌 Trigger: pull_request event (PR opened/updated)"
              echo "   Expected API calls: ~15-20 (event-driven)"
              echo "   vs. 30-min polling: ~25 calls × 48/day = 1,200/day"
              echo "   Savings: ~98% reduction"
              ;;
            workflow_run)
              echo "✅ Trigger: workflow_run event (CI completed)"
              echo "   Expected API calls: ~10-15 (immediate response)"
              echo "   vs. 30-min polling: ~25 calls × 48/day = 1,200/day"
              echo "   Savings: ~98% reduction"
              ;;
            schedule)
              echo "🔄 Trigger: schedule (daily sync fallback)"
              echo "   Expected API calls: ~25-30 (full discovery)"
              echo "   Frequency: 1x/day (6 AM UTC)"
              echo "   vs. 30-min polling: 48x/day"
              echo "   Savings: ~98% reduction in polling frequency"
              ;;
            workflow_dispatch)
              echo "🚀 Trigger: manual workflow_dispatch"
              echo "   Expected API calls: ~25-30 (full discovery or targeted)"
              echo "   Use case: Testing, remediation, on-demand"
              ;;
            *)
              echo "❓ Trigger: $TRIGGER (unknown)"
              ;;
          esac

  update-gap-status:
    name: "${{ matrix.gap_id }} / ${{ matrix.repo }} — ${{ matrix.ci_status }}"
    needs: discover
    if: >-
      inputs.dry_run != 'true' &&
      needs.discover.outputs.matrix != '{"include":[]}' &&
      needs.discover.outputs.matrix != ''
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4
    uses: ruralpeds/.github/.github/workflows/reusable-build-status.yml@main
    with:
      target_repo: ${{ matrix.repo }}
      gap_id: ${{ matrix.gap_id }}
      ci_status: ${{ matrix.ci_status }}
      branch: ${{ matrix.branch }}
      pr_number: ${{ matrix.pr_number }}
      sha: ${{ matrix.sha }}
      run_id: ${{ matrix.run_id }}
    secrets:
      TH_BOT_APP_ID: ${{ secrets.TH_BOT_APP_ID }}
      TH_BOT_PRIVATE_KEY: ${{ secrets.TH_BOT_PRIVATE_KEY }}

  refresh-readmes:
    name: "Refresh README — ${{ matrix.repo }}"
    needs: [discover, update-gap-status]
    if: >-
      inputs.skip_readme != 'true' &&
      inputs.dry_run != 'true' &&
      needs.discover.outputs.readme_repos != '[]' &&
      needs.discover.outputs.readme_repos != ''
    strategy:
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.readme_repos) }}
      fail-fast: false
      max-parallel: 4
    uses: ruralpeds/.github/.github/workflows/reusable-readme-gap-status.yml@main
    with:
      target_repo: ${{ matrix.repo }}
    secrets:
      TH_BOT_APP_ID: ${{ secrets.TH_BOT_APP_ID }}
      TH_BOT_PRIVATE_KEY: ${{ secrets.TH_BOT_PRIVATE_KEY }}
