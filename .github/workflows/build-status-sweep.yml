name: CI Build Status Sweep — All Rust Repos

# ─────────────────────────────────────────────────────────────────────────────
# Runs every 30 minutes (and on demand) to synchronise CI build statuses with
# gap lifecycle statuses across all ruralpeds Rust repositories.
#
# For each Rust repo it:
#   1. Finds open PRs targeting production branches (main, master, release/*)
#   2. Extracts GAP-NNN from branch name or PR title
#   3. Reads the latest CI run status on that branch
#   4. Calls reusable-build-status.yml with the appropriate signal
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Limit sweep to a single repo (owner/repo). Leave blank for all Rust repos."
        required: false
        default: ""
      dry_run:
        description: "Dry run — print actions but do not update gaps"
        type: boolean
        required: false
        default: false

jobs:
  discover:
    name: Discover Rust repos and open PRs
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds

      - name: Build sweep matrix
        id: build-matrix
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SINGLE_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail

          # Discover repos
          if [ -n "$SINGLE_REPO" ]; then
            repos="$SINGLE_REPO"
          else
            repos=$(gh repo list ruralpeds --language Rust --limit 100 --json nameWithOwner \
              --jq '.[].nameWithOwner')
          fi

          entries="[]"
          for repo in $repos; do
            echo "Scanning $repo …"

            # Open PRs targeting production branches
            prs=$(gh pr list \
              --repo "$repo" \
              --state open \
              --base "main" \
              --json number,headRefName,title \
              --limit 50 2>/dev/null || echo "[]")

            # Also check master and release/* branches
            prs_master=$(gh pr list \
              --repo "$repo" \
              --state open \
              --base "master" \
              --json number,headRefName,title \
              --limit 50 2>/dev/null || echo "[]")

            all_prs=$(echo "$prs $prs_master" | python3 -c "
          import json, sys
          parts = sys.stdin.read().split()
          combined = []
          seen = set()
          for chunk in parts:
              try:
                  items = json.loads(chunk)
                  for item in items:
                      k = item['number']
                      if k not in seen:
                          seen.add(k)
                          combined.append(item)
              except Exception:
                  pass
          print(json.dumps(combined))
          ")

            # Extract GAP IDs and CI status for each PR
            new_entries=$(echo "$all_prs" | python3 -c "
          import json, subprocess, sys, re

          prs = json.load(sys.stdin)
          GAP_RE = re.compile(r'GAP-\d{3,4}')
          entries = []

          for pr in prs:
              branch = pr.get('headRefName', '')
              title  = pr.get('title', '')
              pr_num = str(pr.get('number', ''))

              # Extract GAP ID from branch name first, then PR title
              m = GAP_RE.search(branch) or GAP_RE.search(title)
              if not m:
                  continue
              gap_id = m.group(0)

              # Get latest CI run on this branch
              try:
                  run_json = subprocess.check_output([
                      'gh', 'run', 'list',
                      '--repo', '$repo',
                      '--branch', branch,
                      '--limit', '1',
                      '--json', 'status,conclusion,databaseId,headSha',
                  ], text=True)
                  runs = json.loads(run_json)
              except Exception:
                  runs = []

              if not runs:
                  continue

              run = runs[0]
              status     = run.get('status', '')
              conclusion = run.get('conclusion', '')
              run_id     = str(run.get('databaseId', ''))
              sha        = run.get('headSha', '')

              # Map to CI signal
              if status == 'in_progress' or status == 'queued':
                  ci_signal = 'started'
              elif status == 'completed' and conclusion == 'success':
                  ci_signal = 'passed'
              elif status == 'completed' and conclusion in ('failure', 'timed_out', 'cancelled'):
                  ci_signal = 'failed'
              else:
                  continue  # skip skipped/neutral/action_required

              entries.append({
                  'repo':      '$repo',
                  'gap_id':    gap_id,
                  'ci_status': ci_signal,
                  'branch':    branch,
                  'pr_number': pr_num,
                  'sha':       sha,
                  'run_id':    run_id,
              })

          print(json.dumps(entries))
          ")

            entries=$(python3 -c "
          import json, sys
          a = json.loads('$entries'.replace(\"'\", '\"') if False else sys.argv[1])
          b = json.loads(sys.argv[2])
          print(json.dumps(a + b))
          " "$entries" "$new_entries")
          done

          echo "matrix=$(echo "$entries" | python3 -c "import json,sys; items=json.load(sys.stdin); print(json.dumps({'include': items}))")" >> "$GITHUB_OUTPUT"
          echo "Total entries: $(echo "$entries" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")"

  update:
    name: "${{ matrix.gap_id }} / ${{ matrix.repo }} — ${{ matrix.ci_status }}"
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' && needs.discover.outputs.matrix != '' }}
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4
    uses: ruralpeds/.github/.github/workflows/reusable-build-status.yml@main
    with:
      target_repo: ${{ matrix.repo }}
      gap_id: ${{ matrix.gap_id }}
      ci_status: ${{ matrix.ci_status }}
      branch: ${{ matrix.branch }}
      pr_number: ${{ matrix.pr_number }}
      sha: ${{ matrix.sha }}
      run_id: ${{ matrix.run_id }}
    secrets:
      TH_BOT_APP_ID: ${{ secrets.TH_BOT_APP_ID }}
      TH_BOT_PRIVATE_KEY: ${{ secrets.TH_BOT_PRIVATE_KEY }}
