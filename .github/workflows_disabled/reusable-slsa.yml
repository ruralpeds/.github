name: "Reusable SLSA L3 Build Provenance"
# Generates SLSA Level 3 build provenance for release artifacts.
#
# Regulatory drivers:
#   - NIST SSDF PS.3.2 — Archive and protect each software release
#   - FDA Premarket Cybersecurity Guidance (Sept 2023) — Supply-chain integrity
#   - NIST SP 800-204D — Strategies for the Integration of Software Supply Chain
#     Security in DevSecOps CI/CD Pipelines
#   - CISA Secure Software Development Attestation Common Form (Mar 2024)
#   - Executive Order 14028
#
# Callers: uses: timothyhartzog/.github/.github/workflows/reusable-slsa.yml@main
#
# Behavior:
#   - Accepts a list of artifact files + their SHA-256 hashes
#   - Invokes the upstream slsa-framework/slsa-github-generator workflow
#   - The generator produces an in-toto attestation (SLSA v1.0 predicate)
#     signed by Sigstore keyless (Fulcio short-lived cert + Rekor log)
#   - The resulting .intoto.jsonl file can be verified with slsa-verifier
#
# SLSA Level 3 requirements satisfied:
#   - Source: version-controlled, two-person reviewed (via branch rulesets)
#   - Build: scripted, authenticated, service-hosted, isolated, parameterless
#   - Provenance: authenticated, service-generated, non-falsifiable
#
# Verification (by the end user):
#   $ slsa-verifier verify-artifact <artifact> \
#       --provenance-path <slsa.intoto.jsonl> \
#       --source-uri github.com/timothyhartzog/<repo> \
#       --source-tag <version>

on:
  workflow_call:
    inputs:
      artifacts-hash-base64:
        description: |
          Base64-encoded JSON array of { name, digest } objects describing
          each artifact to attest. Computed by the caller.
          Example: echo '[{"name":"foo.whl","digest":"abc..."}]' | base64 -w0
        type: string
        required: true
      upload-assets:
        description: "Upload the .intoto.jsonl as a GitHub Release asset (requires release event)"
        type: boolean
        default: true
      provenance-name:
        description: "Filename for the generated provenance (default: <artifact>.intoto.jsonl)"
        type: string
        default: ""

# Required for the slsa-github-generator to operate correctly.
# These permissions MUST be specified at this level; the generator checks them.
permissions:
  id-token: write    # to sign the provenance via OIDC
  contents: write    # to upload release assets
  actions: read      # to read workflow metadata

jobs:
  provenance:
    name: Generate SLSA L3 provenance
    # Delegate to the upstream generator.
    # Pin to a specific tag for reproducibility (NOT a floating major version).
    # As of publication, v2.1.0 is the recommended production tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a  # v2.1.0
    with:
      base64-subjects: ${{ inputs.artifacts-hash-base64 }}
      upload-assets: ${{ inputs.upload-assets }}
      provenance-name: ${{ inputs.provenance-name }}
      # Whether to use the Rekor public transparency log (always yes for
      # medical-software compliance — audit trail must be publicly verifiable).
      private-repository: false
