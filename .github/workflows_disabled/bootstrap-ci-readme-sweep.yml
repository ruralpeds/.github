name: Bootstrap CI Gap Status + README — All Rust & Julia Repos

# ─────────────────────────────────────────────────────────────────────────────
# One-shot (and idempotent) sweep that ensures every ruralpeds Rust and Julia
# repo has:
#   - .github/workflows/ci-gap-status.yml  (language-appropriate caller)
#   - README.md gap-status section with <!-- gap-status-start/end --> markers
#
# Opens a single PR per repo for human review. Already-configured repos are
# skipped. Safe to re-run — already-open PRs are not duplicated.
#
# Triggers:
#   - Manual (workflow_dispatch) with optional dry-run and single-repo filter
#   - Scheduled: first day of each month at 08:30 UTC — catches new repos
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — show what would change without opening PRs"
        type: boolean
        default: false
        required: false
      repo:
        description: "Target a single repo (name only, e.g. fhir-gateway). Blank = all."
        type: string
        default: ""
        required: false
  schedule:
    - cron: "30 8 1 * *"   # 1st of month 08:30 UTC — after other governance sweeps

concurrency:
  group: ci-readme-bootstrap-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Bootstrap CI gap status + README markers
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 45

    steps:
      - name: Checkout .github repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276b0f2ebde5d8cd729c4d5  # v1.11.0
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds

      - name: Install dependencies
        run: |
          pip3 install requests --quiet --break-system-packages 2>/dev/null \
            || pip3 install requests --quiet

      - name: Run bootstrap sweep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          ARGS=(--token "$GH_TOKEN" --org ruralpeds)
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$INPUT_REPO" ]; then
            ARGS+=(--repo "$INPUT_REPO")
          fi
          python3 scripts/bootstrap_ci_readme_sweep.py "${ARGS[@]}"

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ci-readme-sweep-report-${{ github.run_number }}
          path: /tmp/ci_readme_sweep_report.json
          retention-days: 30

      - name: Write job summary
        if: always()
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          REPORT=/tmp/ci_readme_sweep_report.json
          {
            echo "## CI Gap README Bootstrap Sweep"
            echo ""
            echo "**Runner:** $(hostname)"
            echo "**Dry run:** ${INPUT_DRY_RUN:-false}"
            echo "**Target repo:** ${INPUT_REPO:-ALL Rust + Julia}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            CONFIGURED=$(python3 -c \
              "import json; d=json.load(open('$REPORT')); print(sum(1 for r in d if r['status']=='configured'))")
            ALREADY=$(python3 -c \
              "import json; d=json.load(open('$REPORT')); print(sum(1 for r in d if r['status']=='already_configured'))")
            WOULD=$(python3 -c \
              "import json; d=json.load(open('$REPORT')); print(sum(1 for r in d if r['status']=='would_configure'))")
            ERRORS=$(python3 -c \
              "import json; d=json.load(open('$REPORT')); print(sum(1 for r in d if r['status']=='error'))")
            PRS=$(python3 -c \
              "import json; d=json.load(open('$REPORT')); prs=[r.get('pr_url','') for r in d if r.get('pr_url')]; print('\n'.join(prs))")
            {
              echo "| Result | Count |"
              echo "|--------|-------|"
              echo "| ✅ PR opened | ${CONFIGURED} |"
              echo "| ✓ Already configured | ${ALREADY} |"
              echo "| 📋 Would configure (dry run) | ${WOULD} |"
              echo "| ❌ Errors | ${ERRORS} |"
              if [ -n "$PRS" ]; then
                echo ""
                echo "### Pull Requests Opened"
                echo ""
                while IFS= read -r url; do
                  [ -n "$url" ] && echo "- $url"
                done <<< "$PRS"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
