name: "FDA Submission Readiness"

# Validates that the Q1 2027 FDA submission planning artifacts are present
# and contain the core submission-readiness checkpoints.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fda-submission-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate submission readiness
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Q1 FDA readiness artifacts
        run: |
          set -euo pipefail

          SUBMISSION_PLAN="compliance-metrics/Q1-2027-FDA-submission.md"
          EXECUTION_LOG="compliance-metrics/Q1-2027-execution-jan31.md"
          SUBMISSION_PACKAGE="testing/compliance/FDA_510K_SUBMISSION_PACKAGE.md"
          STANDARDS_MAP="docs/compliance/STANDARDS_MAP.md"
          FDA_BUNDLE_WORKFLOW=".github/workflows/fda-bundle.yml"
          READINESS_REPORT="/tmp/fda-submission-readiness.txt"

          test -f "$SUBMISSION_PLAN"
          test -f "$EXECUTION_LOG"
          test -f "$SUBMISSION_PACKAGE"
          test -f "$STANDARDS_MAP"
          test -f "$FDA_BUNDLE_WORKFLOW"

          grep -q "FDA portal registration" "$SUBMISSION_PLAN"
          grep -q "User fee verification" "$SUBMISSION_PLAN"
          grep -q "Submission Quality Assurance Checklist" "$SUBMISSION_PLAN"
          grep -q "SUBMISSION EXECUTION" "$EXECUTION_LOG"
          grep -q "Submission receipt number" "$EXECUTION_LOG"
          grep -q "510(k) Submission Package" "$SUBMISSION_PACKAGE"
          grep -q "21 CFR Part 11" "$STANDARDS_MAP"

          {
            echo "submission_plan=$SUBMISSION_PLAN"
            echo "execution_log=$EXECUTION_LOG"
            echo "submission_package=$SUBMISSION_PACKAGE"
            echo "standards_map=$STANDARDS_MAP"
            echo "bundle_workflow=$FDA_BUNDLE_WORKFLOW"
            echo "portal_registration=verified"
            echo "user_fee_check=verified"
            echo "submission_qa_checklist=verified"
          } | tee "$READINESS_REPORT"

      - name: Upload readiness artifact
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: fda-submission-readiness-${{ github.run_id }}
          path: |
            /tmp/fda-submission-readiness.txt
            compliance-metrics/Q1-2027-FDA-submission.md
            compliance-metrics/Q1-2027-execution-jan31.md
            testing/compliance/FDA_510K_SUBMISSION_PACKAGE.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          {
            echo "## FDA Submission Readiness"
            echo ""
            echo "| Artifact | Path |"
            echo "|---|---|"
            echo "| Submission plan | compliance-metrics/Q1-2027-FDA-submission.md |"
            echo "| Execution log | compliance-metrics/Q1-2027-execution-jan31.md |"
            echo "| Submission package guide | testing/compliance/FDA_510K_SUBMISSION_PACKAGE.md |"
            echo "| Standards map | docs/compliance/STANDARDS_MAP.md |"
            echo "| FDA bundle workflow | .github/workflows/fda-bundle.yml |"
          } >> "$GITHUB_STEP_SUMMARY"
