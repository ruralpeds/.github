name: Gap Analysis — Notifications

# Sends notifications about gap-analysis events:
# - Scheduled: Daily gap aging check (8 AM UTC)
# - Event-driven: When GAP_ANALYSIS.md changes
#
# Notifications go to:
# - Slack: #gap-analysis-alerts channel (webhook)
# - Email: Configured email list (optional, for weekly summaries)
#
# Requires:
#   - SLACK_WEBHOOK_URL secret (for gap analysis alerts channel)

on:
  schedule:
    # Weekly on Monday at 8:30 AM UTC (cost optimization: batch notifications)
    # Changed from daily (30 runs/month) to weekly (4 runs/month)
    # Staggered 30 min to avoid UTC 08:00 collision with playwright-audit & sync-copilot-assets
    # Savings: 26 runs/month (~$1/month) | Risk: LOW (batched weekly digest sufficient)
    - cron: "30 8 * * 1"

  push:
    branches:
      - main
    paths:
      - ".gap-analysis/GAP_ANALYSIS.md"

  pull_request:
    branches:
      - main
    paths:
      - ".gap-analysis/GAP_ANALYSIS.md"
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify_aging_gaps:
    name: Check for Aging Gaps
    runs-on: [self-hosted, mac-studio, arm64]
    if: github.event_name == 'schedule'
    timeout-minutes: 5

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout org .github
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ruralpeds/.github
          ref: main
          path: .org-github

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Check gap aging
        id: aging_check
        shell: bash
        run: |
          if [ ! -d .gap-analysis ]; then
            echo "No gap analysis directory; skipping."
            exit 0
          fi

          python3 .org-github/scripts/gap_aging_check.py \
            --repo . \
            --json-output /tmp/aging-report.json

          # Check if there are any aging gaps
          AGING_COUNT=$(python3 -c "
          import json
          with open('/tmp/aging-report.json') as f:
              data = json.load(f)
              print(len(data.get('aging_gaps', [])))
          ")

          echo "aging_count=$AGING_COUNT" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: steps.aging_check.outputs.aging_count > 0
        shell: bash
        run: |
          python3 .org-github/scripts/gap_notifications.py \
            --repo "${{ github.repository }}" \
            --event aging_gaps \
            --aging-file /tmp/aging-report.json \
            --slack-webhook "${{ secrets.SLACK_WEBHOOK_URL }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify_gap_changes:
    name: Notify on Gap Changes
    runs-on: [self-hosted, mac-studio, arm64]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout org .github
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ruralpeds/.github
          ref: main
          path: .org-github

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Detect gap changes
        id: gap_changes
        shell: bash
        run: |
          if [ ! -f .gap-analysis/GAP_ANALYSIS.md ]; then
            echo "No gap analysis file; skipping."
            exit 0
          fi

          # Get diff of GAP_ANALYSIS.md
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # Extract newly created P0/P1 gaps
          DIFF=$(git diff $BASE_SHA..$HEAD_SHA -- .gap-analysis/GAP_ANALYSIS.md || true)

          # Look for new gap headers with P0 or P1
          NEW_GAPS=$(echo "$DIFF" | grep -E '^\+### (GAP-[0-9]+):' | wc -l)

          echo "new_gaps_count=$NEW_GAPS" >> $GITHUB_OUTPUT
          echo "diff_output=$DIFF" >> $GITHUB_ENV

      - name: Send notification for new gaps
        if: steps.gap_changes.outputs.new_gaps_count > 0
        shell: bash
        run: |
          echo "::notice::New gaps detected in GAP_ANALYSIS.md"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
