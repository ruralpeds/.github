name: "EHR Sandbox Validation"

# Validates core FHIR integration paths against sandbox endpoints.
# Default mode is dry-run for safe planning and checklist execution.

'on':
  workflow_dispatch:
    inputs:
      sandbox_provider:
        description: "Target sandbox provider"
        type: choice
        options:
          - epic
          - cerner
        default: epic
      dry_run:
        description: "Run validation in dry-run mode"
        type: boolean
        default: true
      base_url:
        description: "FHIR base URL (required when dry_run=false)"
        type: string
        default: ""
  workflow_call:
    inputs:
      sandbox_provider:
        description: "Target sandbox provider"
        type: string
        default: "epic"
      dry_run:
        description: "Run validation in dry-run mode"
        type: boolean
        default: true
      base_url:
        description: "FHIR base URL (required when dry_run=false)"
        type: string
        default: ""
    secrets:
      SMART_FHIR_TOKEN:
        description: "OAuth bearer token for sandbox"
        required: false

permissions:
  contents: read

concurrency:
  group: ehr-sandbox-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate ${{ inputs.sandbox_provider || 'epic' }} sandbox"
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate provider input
        run: |
          PROVIDER="${{ inputs.sandbox_provider || 'epic' }}"
          if [ "$PROVIDER" != "epic" ] && [ "$PROVIDER" != "cerner" ]; then
            echo "::error::sandbox_provider must be epic or cerner"
            exit 1
          fi

      - name: Dry-run checklist
        if: inputs.dry_run == true
        run: |
          echo "Running in dry-run mode. No external API calls will be made."

      - name: Validate mapping and sandbox plan
        run: |
          set -euo pipefail

          MAPPING_DOC="docs/ehr-integration/FHIR_MAPPING.md"
          SANDBOX_PLAN="docs/ehr-integration/SANDBOX_VALIDATION_PLAN.md"
          READINESS_REPORT="/tmp/ehr-readiness-report.txt"

          test -f "$MAPPING_DOC"
          test -f "$SANDBOX_PLAN"

          for resource in Patient Observation DocumentReference DiagnosticReport Encounter; do
            grep -q "### .*${resource}" "$MAPPING_DOC"
          done

          grep -q "## SMART on FHIR Security Requirements" "$MAPPING_DOC"
          grep -q "## Audit Event Contract" "$MAPPING_DOC"

          for test_id in EHR-01 EHR-02 EHR-03 EHR-04 EHR-05 EHR-06 EHR-07 EHR-08 EHR-09 EHR-10; do
            grep -q "$test_id" "$SANDBOX_PLAN"
          done

          {
            echo "mapping_doc=$MAPPING_DOC"
            echo "sandbox_plan=$SANDBOX_PLAN"
            echo "resource_count=5"
            echo "test_matrix_count=10"
            echo "smart_on_fhir=verified"
            echo "audit_contract=verified"
          } | tee "$READINESS_REPORT"

      - name: Validate required runtime inputs
        if: inputs.dry_run == false
        env:
          BASE_URL: ${{ inputs.base_url }}
          SMART_FHIR_TOKEN: ${{ secrets.SMART_FHIR_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::base_url is required when dry_run=false"
            exit 1
          fi

          case "$BASE_URL" in
            https://*)
              ;;
            *)
              echo "::error::base_url must use https"
              exit 1
              ;;
          esac

          if [ -z "$SMART_FHIR_TOKEN" ]; then
            echo "::error::SMART_FHIR_TOKEN secret is required when dry_run=false"
            exit 1
          fi

      - name: Live sandbox smoke test
        if: inputs.dry_run == false
        env:
          BASE_URL: ${{ inputs.base_url }}
          SMART_FHIR_TOKEN: ${{ secrets.SMART_FHIR_TOKEN }}
        run: |
          set -e

          HEALTH_CODE=$(curl --proto '=https' --tlsv1.3 -sS -o /tmp/capability.json -w "%{http_code}" \
            -H "Authorization: Bearer $SMART_FHIR_TOKEN" \
            -H "Accept: application/fhir+json" \
            "$BASE_URL/metadata")

          if [ "$HEALTH_CODE" -lt 200 ] || [ "$HEALTH_CODE" -ge 300 ]; then
            echo "::error::CapabilityStatement check failed with HTTP $HEALTH_CODE"
            exit 1
          fi

          PATIENT_CODE=$(curl --proto '=https' --tlsv1.3 -sS -o /tmp/patient-search.json -w "%{http_code}" \
            -H "Authorization: Bearer $SMART_FHIR_TOKEN" \
            -H "Accept: application/fhir+json" \
            "$BASE_URL/Patient?_count=1")

          if [ "$PATIENT_CODE" -lt 200 ] || [ "$PATIENT_CODE" -ge 300 ]; then
            echo "::error::Patient search failed with HTTP $PATIENT_CODE"
            exit 1
          fi

          OBS_CODE=$(curl --proto '=https' --tlsv1.3 -sS -o /tmp/observation-search.json -w "%{http_code}" \
            -H "Authorization: Bearer $SMART_FHIR_TOKEN" \
            -H "Accept: application/fhir+json" \
            "$BASE_URL/Observation?_count=1")

          if [ "$OBS_CODE" -lt 200 ] || [ "$OBS_CODE" -ge 300 ]; then
            echo "::error::Observation search failed with HTTP $OBS_CODE"
            exit 1
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: ehr-sandbox-validation-${{ github.run_id }}
          path: |
            /tmp/ehr-readiness-report.txt
            /tmp/capability.json
            /tmp/patient-search.json
            /tmp/observation-search.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          {
            echo "## EHR Sandbox Validation"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Provider | ${{ inputs.sandbox_provider || 'epic' }} |"
            echo "| Dry run | ${{ inputs.dry_run || true }} |"
            echo "| Mapping doc | docs/ehr-integration/FHIR_MAPPING.md |"
            echo "| Sandbox plan | docs/ehr-integration/SANDBOX_VALIDATION_PLAN.md |"
            echo "| Resource mappings checked | 5 |"
            echo "| Test matrix checked | EHR-01..EHR-10 |"
            if [ "${{ inputs.dry_run || true }}" = "false" ]; then
              echo "| Metadata endpoint | checked |"
              echo "| Patient search | checked |"
              echo "| Observation search | checked |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
