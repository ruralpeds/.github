name: Reusable — CI Build Status → Gap Lifecycle

# ─────────────────────────────────────────────────────────────────────────────
# Translates a CI lifecycle signal from a Rust repo into a gap status change.
# Called by:
#   - build-status-sweep.yml  (scheduled sweep)
#   - rust-ci-gap-status.template.yml  (event-driven per-repo caller)
#
# CI status → Gap status:
#   started  →  Building
#   passed   →  Committed
#   failed   →  In the Air
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      target_repo:
        description: "Owner/repo of the Rust repo (e.g. ruralpeds/fhir-gateway)"
        type: string
        required: true
      gap_id:
        description: "GAP-NNN identifier extracted from branch/PR title"
        type: string
        required: true
      ci_status:
        description: "CI signal: started | passed | failed"
        type: string
        required: true
      branch:
        description: "Source branch name"
        type: string
        required: false
        default: ""
      pr_number:
        description: "PR number (if available)"
        type: string
        required: false
        default: ""
      sha:
        description: "Commit SHA that triggered the CI run"
        type: string
        required: false
        default: ""
      actor:
        description: "GitHub actor who triggered the event"
        type: string
        required: false
        default: ""
      run_id:
        description: "GitHub Actions run ID of the CI run"
        type: string
        required: false
        default: ""
    secrets:
      TH_BOT_APP_ID:
        required: true
      TH_BOT_PRIVATE_KEY:
        required: true

jobs:
  update-gap-status:
    name: "Update ${{ inputs.gap_id }} → ${{ inputs.ci_status }}"
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ruralpeds
          repositories: ${{ inputs.target_repo }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo

      - name: Checkout ruralpeds/.github scripts
        uses: actions/checkout@v4
        with:
          repository: ruralpeds/.github
          token: ${{ steps.app-token.outputs.token }}
          path: dot-github
          sparse-checkout: scripts

      - name: Validate gap_id format
        run: |
          if ! echo "${{ inputs.gap_id }}" | grep -qE '^GAP-[0-9]{3,4}$'; then
            echo "::error::Invalid gap_id format: '${{ inputs.gap_id }}' — expected GAP-NNN"
            exit 1
          fi

      - name: Apply CI build status to gap
        run: |
          python3 dot-github/scripts/gap_lifecycle.py build-status \
            --repo target-repo \
            --gap "${{ inputs.gap_id }}" \
            --ci-status "${{ inputs.ci_status }}" \
            --branch "${{ inputs.branch }}" \
            --pr "${{ inputs.pr_number }}" \
            --sha "${{ inputs.sha }}" \
            --actor "${{ inputs.actor }}" \
            --run-id "${{ inputs.run_id }}"

      - name: Sync index
        run: |
          python3 dot-github/scripts/gap_lifecycle.py sync-index \
            --repo target-repo

      - name: Commit and push gap status update
        run: |
          cd target-repo
          git config user.name  "ruralpeds-bot[bot]"
          git config user.email "ruralpeds-bot[bot]@users.noreply.github.com"
          git add .gap-analysis/
          if git diff --cached --quiet; then
            echo "No changes to commit (status was already up to date)"
            exit 0
          fi
          STATUS_LABEL="${{ inputs.ci_status }}"
          case "$STATUS_LABEL" in
            started) GAP_STATUS="Building"     ;;
            passed)  GAP_STATUS="Committed"    ;;
            failed)  GAP_STATUS="In the Air"   ;;
          esac
          git commit -m "chore(gap): ${{ inputs.gap_id }} → ${GAP_STATUS} [ci=${{ inputs.ci_status }}]

          CI run ${{ inputs.run_id }} on branch ${{ inputs.branch }}
          Triggered by @${{ inputs.actor }}"
          git push
