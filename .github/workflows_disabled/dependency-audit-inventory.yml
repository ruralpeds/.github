name: "Dependency Audit Inventory"

# Generates Q3 dependency inventory CSV used by compliance-metrics reporting.
# This workflow is read-only and publishes artifact output for review.

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

concurrency:
  group: dependency-audit-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate dependency inventory
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build inventory CSV
        run: |
          bash scripts/dependency-audit/build-inventory.sh

      - name: Validate dependency policy artifacts
        run: |
          set -euo pipefail

          INVENTORY="compliance-metrics/dependency-inventory-q3-2026.csv"
          RISK_ASSESSMENT="compliance-metrics/dependency-risk-assessment.md"
          REMEDIATION_PLAN="compliance-metrics/dependency-remediation-plan.md"
          POLICY_DOC="policies/dependencies.md"
          GUIDE_DOC="docs/compliance/DEPENDENCY_POLICY.md"
          READINESS_REPORT="/tmp/dependency-audit-readiness.txt"

          test -f "$INVENTORY"
          test -f "$RISK_ASSESSMENT"
          test -f "$REMEDIATION_PLAN"
          test -f "$POLICY_DOC"
          test -f "$GUIDE_DOC"

          grep -q "repo,ecosystem,dependency_name" "$INVENTORY"
          grep -q "## Risk Tiers" "$RISK_ASSESSMENT"
          grep -q "## Remediation Policy" "$REMEDIATION_PLAN"
          grep -q "## Classification Tiers" "$POLICY_DOC"
          grep -q "## Classification Workflow" "$GUIDE_DOC"

          {
            echo "inventory=$INVENTORY"
            echo "risk_assessment=$RISK_ASSESSMENT"
            echo "remediation_plan=$REMEDIATION_PLAN"
            echo "policy_doc=$POLICY_DOC"
            echo "guide_doc=$GUIDE_DOC"
          } | tee "$READINESS_REPORT"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: dependency-inventory-${{ github.run_id }}
          path: |
            /tmp/dependency-audit-readiness.txt
            compliance-metrics/dependency-inventory-q3-2026.csv
            compliance-metrics/dependency-risk-assessment.md
            compliance-metrics/dependency-remediation-plan.md
            policies/dependencies.md
            docs/compliance/DEPENDENCY_POLICY.md
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          {
            echo "## Dependency Inventory"
            echo ""
            echo "| Artifact | Path |"
            echo "|---|---|"
            echo "| Inventory | compliance-metrics/dependency-inventory-q3-2026.csv |"
            echo "| Risk assessment | compliance-metrics/dependency-risk-assessment.md |"
            echo "| Remediation plan | compliance-metrics/dependency-remediation-plan.md |"
            echo "| Policy | policies/dependencies.md |"
            echo "| Implementation guide | docs/compliance/DEPENDENCY_POLICY.md |"
          } >> "$GITHUB_STEP_SUMMARY"
