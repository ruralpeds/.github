name: "Reusable FHIR Contract Testing"
# Validates FHIR resources against HL7 profiles (default: US Core) and
# OpenAPI specs against consumer/provider contracts.
#
# Regulatory drivers:
#   - 42 CFR Part 170 (ONC Cures Act Final Rule) — USCDI v3, US Core
#   - FDA Software Precertification Principles — API quality
#   - IEC 62304 §5.6 — Software integration testing
#   - HL7 FHIR R4 Implementation Guides
#
# Callers: uses: timothyhartzog/.github/.github/workflows/reusable-contract.yml@main
#
# What it validates:
#   - All .json files in `fhir/` or `test/fixtures/fhir/` against:
#     - Base FHIR R4 schema
#     - US Core profile set (configurable — can swap for mCODE, CARIN BB, etc.)
#   - OpenAPI 3.x specs in `api/` validated against the spec
#   - Optional: Pact contract verification if `pacts/` directory present

on:
  workflow_call:
    inputs:
      fhir-version:
        description: "FHIR version (R4 | R5)"
        type: string
        default: "R4"
      implementation-guide:
        description: "IG package name (e.g., 'hl7.fhir.us.core#7.0.0')"
        type: string
        default: "hl7.fhir.us.core#7.0.0"
      fhir-resource-paths:
        description: "Paths to validate (newline-separated; supports globs)"
        type: string
        default: |
          fhir/**/*.json
          test/fixtures/fhir/**/*.json
      openapi-paths:
        description: "OpenAPI specs to validate (newline-separated)"
        type: string
        default: |
          api/openapi.yaml
          api/openapi.json
      fail-on-validation-error:
        description: "Fail the build on any FHIR validation error"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fhir:
    name: Validate FHIR resources
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find FHIR resources
        id: find
        run: |
          set -euo pipefail
          : > fhir-files.txt
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # Expand globs via find for path patterns with **
            for f in $(find . -path "./.git" -prune -o -type f -name "*.json" -print 2>/dev/null | grep -E "$(echo "$pattern" | sed 's#\*\*#.*#g;s#\*#[^/]*#g')" || true); do
              # Sanity check: is this a FHIR resource?
              if head -c 200 "$f" 2>/dev/null | grep -q '"resourceType"'; then
                echo "$f" >> fhir-files.txt
              fi
            done
          done <<< "${{ inputs.fhir-resource-paths }}"

          COUNT=$(wc -l < fhir-files.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT FHIR resource file(s)"

      - name: Setup Java (for HL7 validator)
        if: steps.find.outputs.count != '0'
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download HL7 FHIR validator
        if: steps.find.outputs.count != '0'
        run: |
          set -euo pipefail
          VERSION="6.3.11"
          curl -fsSL -o validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VERSION}/validator_cli.jar"
          java -jar validator_cli.jar -version || true

      - name: Validate FHIR resources
        if: steps.find.outputs.count != '0'
        id: validate
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p fhir-validation-results
          IG="${{ inputs.implementation-guide }}"
          VER="${{ inputs.fhir-version }}"

          # Run the validator with the given IG; output JSON operation outcomes
          xargs -a fhir-files.txt java -jar validator_cli.jar \
            -version "$VER" \
            -ig "$IG" \
            -output-style compact \
            -output fhir-validation-results/outcome.json \
            -format json \
            > fhir-validation-results/stdout.log 2>&1 || true

          cat fhir-validation-results/stdout.log | tail -50

          # Parse results
          python3 <<'PY'
          import json, os, pathlib
          p = pathlib.Path("fhir-validation-results/outcome.json")
          if not p.exists():
              print("::warning::Validator did not produce an outcome file.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("errors=0\nwarnings=0\nvalidated=0\n")
              exit
          try:
              data = json.loads(p.read_text())
          except Exception as e:
              print(f"::warning::Could not parse validator output: {e}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("errors=0\nwarnings=0\nvalidated=0\n")
              exit

          # The validator produces an array of OperationOutcome-like entries
          errors = warnings = 0
          if isinstance(data, list):
              entries = data
          elif isinstance(data, dict) and "issue" in data:
              entries = [data]
          else:
              entries = []

          for entry in entries:
              for issue in entry.get("issue", []):
                  sev = issue.get("severity", "")
                  if sev == "error" or sev == "fatal": errors += 1
                  elif sev == "warning": warnings += 1

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"errors={errors}\nwarnings={warnings}\nvalidated={len(entries)}\n")
          print(f"Validated: {len(entries)}, Errors: {errors}, Warnings: {warnings}")
          PY

      - name: Validate OpenAPI specs
        id: openapi
        run: |
          set -euo pipefail
          mkdir -p openapi-validation-results
          OK=true
          FAIL_COUNT=0
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            [ -f "$spec" ] || continue
            echo "═══ Validating $spec ═══"
            # Use npx to run swagger-cli (OpenAPI 3.x validator)
            if npx --yes @redocly/cli lint "$spec" > "openapi-validation-results/$(basename "$spec").log" 2>&1; then
              echo "  ✓ $spec"
            else
              echo "::warning::OpenAPI validation issues in $spec"
              cat "openapi-validation-results/$(basename "$spec").log" | tail -20
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done <<< "${{ inputs.openapi-paths }}"
          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          FHIR_COUNT="${{ steps.find.outputs.count }}"
          FHIR_ERRORS="${{ steps.validate.outputs.errors || 0 }}"
          FHIR_WARNINGS="${{ steps.validate.outputs.warnings || 0 }}"
          OAPI_FAILS="${{ steps.openapi.outputs.fail_count || 0 }}"

          {
            echo "# FHIR + OpenAPI Contract Validation"
            echo ""
            echo "## FHIR (${{ inputs.fhir-version }} / ${{ inputs.implementation-guide }})"
            echo ""
            echo "- Resources found: $FHIR_COUNT"
            echo "- Errors: $FHIR_ERRORS"
            echo "- Warnings: $FHIR_WARNINGS"
            echo ""
            echo "## OpenAPI"
            echo ""
            echo "- Specs with issues: $OAPI_FAILS"
            echo ""
            echo "## Regulatory relevance"
            echo ""
            echo "- 42 CFR Part 170 (ONC Cures Act) — USCDI v3 / US Core"
            echo "- HL7 FHIR R4 Implementation Guide conformance"
            echo "- IEC 62304 §5.6 — Software integration testing"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce gate
        if: ${{ inputs.fail-on-validation-error }}
        run: |
          set -euo pipefail
          FHIR_ERRORS="${{ steps.validate.outputs.errors || 0 }}"
          OAPI_FAILS="${{ steps.openapi.outputs.fail_count || 0 }}"
          if [ "$FHIR_ERRORS" != "0" ]; then
            echo "::error::$FHIR_ERRORS FHIR validation error(s)."
            exit 1
          fi
          if [ "$OAPI_FAILS" != "0" ]; then
            echo "::error::$OAPI_FAILS OpenAPI spec(s) failed validation."
            exit 1
          fi
          echo "All contracts validated."

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: contract-validation-${{ github.run_id }}
          path: |
            fhir-validation-results/
            openapi-validation-results/
          retention-days: 90
          if-no-files-found: ignore
