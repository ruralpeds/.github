name: Agent Branch PR Guardrails

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: agent-branch-guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate agent branch PR
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 5
    env:
      BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate branch, title, ownership, and origin alignment
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import sys

          allowed_agents = {
              "human",
              "copilot",
              "claude",
              "dependabot",
              "automation",
              "external",
          }

          body = os.environ.get("BODY") or ""
          head_ref = os.environ["HEAD_REF"]
          labels = json.loads(os.environ["LABELS_JSON"])
          title = os.environ["TITLE"]

          errors = []

          branch_match = re.fullmatch(r"gap/(\d{3})-[a-z0-9]+(?:-[a-z0-9]+)*", head_ref)
          if not branch_match:
              errors.append("Branch name must match `gap/NNN-short-slug`.")
              branch_gap = None
          else:
              branch_gap = branch_match.group(1)

          title_match = re.fullmatch(r"GAP-(\d{3}):\s+.+", title)
          if not title_match:
              errors.append("PR title must match `GAP-NNN: short summary`.")
              title_gap = None
          else:
              title_gap = title_match.group(1)

          ownership_match = re.search(
              r"<!-- agent-ownership -->(.*?)<!-- /agent-ownership -->",
              body,
              re.DOTALL,
          )
          primary_agent = None
          ownership_gap = None
          if not ownership_match:
              errors.append("PR body must include an `agent-ownership` block.")
          else:
              block = ownership_match.group(1)
              primary_match = re.search(r"^\s*primary_agent:\s*([a-z-]+)\s*$", block, re.MULTILINE)
              gap_match = re.search(r"^\s*gap:\s*GAP-(\d{3})\s*$", block, re.MULTILINE)

              if not primary_match:
                  errors.append("`agent-ownership` block must declare `primary_agent:`.")
              else:
                  primary_agent = primary_match.group(1)
                  if primary_agent not in allowed_agents:
                      allowed = ", ".join(sorted(allowed_agents))
                      errors.append(f"`primary_agent` must be one of: {allowed}.")

              if not gap_match:
                  errors.append("`agent-ownership` block must declare `gap: GAP-NNN`.")
              else:
                  ownership_gap = gap_match.group(1)

          origin_labels = [label["name"] for label in labels if label["name"].startswith("origin:")]
          if len(origin_labels) != 1:
              errors.append("PR must have exactly one `origin:*` label.")
          elif primary_agent is not None:
              expected = f"origin:{primary_agent}"
              if origin_labels[0] != expected:
                  errors.append(f"`origin:*` label must match `primary_agent` (`{expected}`).")

          if branch_gap and title_gap and branch_gap != title_gap:
              errors.append("Branch gap number and PR title gap number must match.")
          if branch_gap and ownership_gap and branch_gap != ownership_gap:
              errors.append("Branch gap number and `agent-ownership` gap must match.")
          if title_gap and ownership_gap and title_gap != ownership_gap:
              errors.append("PR title gap number and `agent-ownership` gap must match.")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          print("::notice::Branch, PR title, ownership metadata, and origin label are aligned.")
          PY
