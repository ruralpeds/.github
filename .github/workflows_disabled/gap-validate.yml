name: Gap Analysis Format Validation

# ─────────────────────────────────────────────────────────────────────────────
# Validates gap analysis format and schema compliance.
#
# Triggers:
#   - On any push/PR that modifies .gap-analysis/ files
#
# Validates:
#   - Status enum: [Not Started, Backlog, In Progress, Blocked, In Review, ...]
#   - Gap ID format (GAP-NNN) and uniqueness
#   - Required fields: Status, Priority, Owner, Target Completion
#   - Proper markdown structure
#   - Priority values: [P0, P1, P2, P3, P4]
#   - P0/P1 gaps have owners and target dates
#   - schema.md exists and is valid
#   - .gitignore ignores status.json
#   - build-ledger.jsonl is valid JSONL
#
# Fails PR if:
#   - Critical validation errors are found
#   - Required files missing
#   - Schema enforcement fails
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - '.gap-analysis/GAP_ANALYSIS.md'
      - '.gap-analysis/schema.md'
      - '.gap-analysis/.gitignore'
      - '.gap-analysis/build-ledger.jsonl'

  push:
    branches: [main]
    paths:
      - '.gap-analysis/GAP_ANALYSIS.md'
      - '.gap-analysis/schema.md'
      - '.gap-analysis/.gitignore'
      - '.gap-analysis/build-ledger.jsonl'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gap-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-format:
    name: Validate Gap Analysis Format
    runs-on: [self-hosted, mac-studio, arm64]
    timeout-minutes: 10
    env:
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.toolcache
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.toolcache

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.11'

      - name: Run format validation
        id: validate
        shell: bash
        run: |
          python3 .github/scripts/validate_gap_format.py --repo . --json-report /tmp/gap_validation.json
          RESULT=$?

          # Output result for later steps
          echo "validation_result=$RESULT" >> "$GITHUB_OUTPUT"
          exit "$RESULT"

      - name: Check supporting files
        if: always()
        shell: bash
        run: |
          set -e

          echo "🔍 Checking supporting files..."

          # Check schema.md exists
          if [ ! -f ".gap-analysis/schema.md" ]; then
            echo "❌ Missing .gap-analysis/schema.md"
            exit 1
          fi
          echo "✅ schema.md present"

          # Check .gitignore exists
          if [ ! -f ".gap-analysis/.gitignore" ]; then
            echo "❌ Missing .gap-analysis/.gitignore"
            exit 1
          fi
          echo "✅ .gitignore present"

          # Verify status.json is ignored
          if ! grep -q "status.json" ".gap-analysis/.gitignore"; then
            echo "⚠️  status.json is not in .gitignore (should be ignored)"
            exit 1
          fi
          echo "✅ status.json properly ignored"

      - name: Validate JSONL format
        if: always()
        shell: bash
        run: |
          set -e

          LEDGER=".gap-analysis/build-ledger.jsonl"

          if [ ! -f "$LEDGER" ]; then
            echo "⚠️  No build-ledger.jsonl found (OK for new repos)"
            exit 0
          fi

          echo "🔍 Validating build-ledger.jsonl..."

          python3 << 'EOF'
          import json

          with open(".gap-analysis/build-ledger.jsonl", "r") as f:
              line_num = 0
              for line in f:
                  line_num += 1
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      json.loads(line)
                  except json.JSONDecodeError as e:
                      print(f"❌ Invalid JSON on line {line_num}: {e}")
                      exit(1)

          print(f"✅ Valid JSONL ({line_num} lines)")
          EOF

      - name: Validate markdown structure
        if: always()
        shell: bash
        run: |
          set -e

          GAP_FILE=".gap-analysis/GAP_ANALYSIS.md"

          echo "🔍 Checking markdown structure..."

          if [ ! -f "$GAP_FILE" ]; then
            echo "❌ GAP_ANALYSIS.md not found"
            exit 1
          fi

          # Check for required headers
          if ! grep -q "^# Gap Analysis" "$GAP_FILE"; then
            echo "❌ Missing main header '# Gap Analysis ...'"
            exit 1
          fi
          echo "✅ Main header present"

          # Check for active gaps section
          if ! grep -q "^## Active Gaps\|^## Gaps" "$GAP_FILE"; then
            echo "⚠️  Recommended: add '## Active Gaps' section"
          fi

      - name: Check status enum values
        if: always()
        shell: bash
        run: |
          set -e

          GAP_FILE=".gap-analysis/GAP_ANALYSIS.md"
          VALID_STATUSES="Not Started|Backlog|In Progress|Blocked|In Review|Completed|Archived|In the Air|Building|Committed"

          echo "🔍 Validating status values..."

          # Find invalid status values
          INVALID=$(grep -E "^\*\*Status\*\*:" "$GAP_FILE" | \
            grep -v -E "($VALID_STATUSES)" || true)

          if [ -n "$INVALID" ]; then
            echo "❌ Invalid status values found:"
            echo "$INVALID"
            exit 1
          fi

          echo "✅ All status values valid"

      - name: Check priority enum values
        if: always()
        shell: bash
        run: |
          set -e

          GAP_FILE=".gap-analysis/GAP_ANALYSIS.md"
          VALID_PRIORITIES="P0|P1|P2|P3|P4"

          echo "🔍 Validating priority values..."

          # Find invalid priority values
          INVALID=$(grep -E "^\*\*Priority\*\*:" "$GAP_FILE" | \
            grep -v -E "($VALID_PRIORITIES)" || true)

          if [ -n "$INVALID" ]; then
            echo "❌ Invalid priority values found:"
            echo "$INVALID"
            exit 1
          fi

          echo "✅ All priority values valid"

      - name: Check gap ID uniqueness
        if: always()
        shell: bash
        run: |
          set -e

          GAP_FILE=".gap-analysis/GAP_ANALYSIS.md"

          echo "🔍 Checking gap ID uniqueness..."

          # Extract all gap IDs
          GAP_IDS=$(grep "^### GAP-" "$GAP_FILE" | sed 's/.*\(GAP-[0-9]*\).*/\1/' | sort)

          if [ -z "$GAP_IDS" ]; then
            echo "ℹ️  No gaps found (OK for new repos)"
            exit 0
          fi

          # Check for duplicates
          DUPLICATES=$(echo "$GAP_IDS" | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "❌ Duplicate gap IDs found:"
            echo "$DUPLICATES"
            exit 1
          fi

          COUNT=$(echo "$GAP_IDS" | wc -l)
          echo "✅ All gap IDs unique ($COUNT gaps)"

      - name: Print validation summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/gap_validation.json ]; then
            echo ""
            echo "=== Detailed Validation Report ==="
            python3 -m json.tool < /tmp/gap_validation.json || cat /tmp/gap_validation.json
          fi

          echo ""
          echo "=== Validation Complete ==="
          echo "✅ Gap analysis format and schema validated"

  schema-enforcement:
    name: Enforce Gap Schema
    runs-on: [self-hosted, mac-studio, arm64]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Verify required fields in P0/P1 gaps
        shell: bash
        run: |
          set -e

          GAP_FILE=".gap-analysis/GAP_ANALYSIS.md"

          if [ ! -f "$GAP_FILE" ]; then
            exit 0
          fi

          echo "🔍 Checking P0/P1 gap requirements..."

          python3 << 'EOF'
          import re

          with open(".gap-analysis/GAP_ANALYSIS.md", "r") as f:
              content = f.read()

          # Find all P0/P1 gaps
          p0p1_pattern = re.compile(
              r"^### (GAP-\d{3,4}):\s*(.+?)\n.*?"
              r"^\*\*Priority\*\*:\s*(P0|P1)",
              re.MULTILINE | re.DOTALL
          )

          gaps = p0p1_pattern.findall(content)

          issues = []
          for gap_id, gap_title, priority in gaps:
              # Check for owner
              owner_pattern = re.compile(
                  rf"^### {re.escape(gap_id)}:.*?"
                  r"^\*\*Owner\*\*:\s*(.+?)$",
                  re.MULTILINE | re.DOTALL
              )
              owner_match = owner_pattern.search(content)

              # Check for target completion
              target_pattern = re.compile(
                  rf"^### {re.escape(gap_id)}:.*?"
                  r"^\*\*Target Completion\*\*:\s*(.+?)$",
                  re.MULTILINE | re.DOTALL
              )
              target_match = target_pattern.search(content)

              owner = owner_match.group(1).strip() if owner_match else ""
              target = target_match.group(1).strip() if target_match else ""

              # Warn if unassigned or no target
              if not owner or "[Unassigned]" in owner:
                  issues.append(f"⚠️  {gap_id} ({priority}): Missing owner")
              if not target or "TBD" in target:
                  issues.append(f"⚠️  {gap_id} ({priority}): Missing target date")

          if issues:
              print("\nWarnings for P0/P1 gaps:")
              for issue in issues:
                  print(f"  {issue}")
          else:
              print("✅ All P0/P1 gaps have owners and target dates")
          EOF

  report:
    name: Validation Report
    runs-on: [self-hosted, mac-studio, arm64]
    needs: [validate-format, schema-enforcement]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Generate summary
        shell: bash
        run: |
          {
            echo "## Gap Analysis Validation Summary"
            echo ""
            echo "✅ Format validation complete"
            echo "✅ Schema enforcement complete"
            echo ""
            echo "**Status:** Validation passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if validation failed
        shell: bash
        run: |
          if [ "${{ needs.validate-format.result }}" != "success" ]; then
            echo "❌ Validation failed"
            exit 1
          fi
