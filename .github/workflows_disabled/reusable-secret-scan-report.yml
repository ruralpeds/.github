name: "Secret Scan Weekly Report"
# Compiles a weekly report of open secret-scanning alerts across the
# ruralpeds organization and opens/updates a tracking issue.
#
# Can be called as a reusable workflow OR run on a schedule.
#
# Callers: uses: ruralpeds/.github/.github/workflows/reusable-secret-scan-report.yml@main
#
# What this does:
#   1. Fetches all open org-level secret-scanning alerts (paginated).
#   2. Formats a markdown summary: total count, breakdown by secret type,
#      top-10 newest alerts, top-10 oldest (longest-open) alerts.
#   3. Uploads the report as a workflow artifact (retained 90 days).
#   4. Opens or updates a single tracking issue titled
#      "Weekly secret-scan report" in ruralpeds/.github.
#
# Authentication:
#   Requires a GitHub App token (vars.TH_BOT_APP_ID + secrets.TH_BOT_PRIVATE_KEY)
#   with security_events:read and issues:write at the org level.
#   Falls back to secrets.REPO_SETUP_TOKEN (PAT) during the transition period.
#
# Regulatory basis:
#   - NIST SSDF PO.5.1 — implement supporting toolchains
#   - HIPAA §164.312(a)(2)(i) — unique user identification (preventing shared secrets)
#   - OpenSSF Scorecard: Token-Permissions

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub organization to scan (default: ruralpeds)"
        type: string
        default: "ruralpeds"
      dry-run:
        description: "Generate report but do not update tracking issue"
        type: boolean
        default: false
  workflow_call:
    inputs:
      org:
        description: "GitHub organization to scan (default: ruralpeds)"
        type: string
        default: "ruralpeds"
      dry-run:
        description: "Generate report but do not update tracking issue"
        type: boolean
        default: false
    secrets:
      TH_BOT_PRIVATE_KEY:
        description: "Private key for the GitHub App (TH_BOT_APP_ID variable required)"
        required: false
      REPO_SETUP_TOKEN:
        description: "Fallback PAT with security_events:read + issues:write"
        required: false
    outputs:
      report-path:
        description: "Path to the generated markdown report"
        value: ${{ jobs.report.outputs.report-path }}
      open-alert-count:
        description: "Total number of open secret-scanning alerts"
        value: ${{ jobs.report.outputs.open-alert-count }}

permissions:
  contents: read

concurrency:
  group: secret-scan-report
  cancel-in-progress: false   # never cancel a report run; let it finish

jobs:
  report:
    name: Compile secret-scan report
    runs-on: [self-hosted, mac-studio, arm64]
    outputs:
      report-path: ${{ steps.build-report.outputs.report-path }}
      open-alert-count: ${{ steps.build-report.outputs.open-alert-count }}

    steps:
      # ── 1. Checkout (needed to push back nothing; kept for workspace) ─────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # ── 2. Generate short-lived App token (preferred path) ───────────────────
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.TH_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@3ff1caaa28b64c9cc276b0f2ebde5d8cd729c4d5 # v1.11.0
        with:
          app-id: ${{ vars.TH_BOT_APP_ID }}
          private-key: ${{ secrets.TH_BOT_PRIVATE_KEY }}
          owner: ${{ inputs.org || 'ruralpeds' }}

      # ── 3. Resolve token ─────────────────────────────────────────────────────
      - name: Resolve auth token
        id: resolve-token
        run: |
          if [ -n "${APP_TOKEN}" ]; then
            echo "token-source=app" >> "$GITHUB_OUTPUT"
            echo "::notice::Using GitHub App installation token."
          elif [ -n "${PAT_TOKEN}" ]; then
            echo "token-source=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using REPO_SETUP_TOKEN (PAT). Migrate to GitHub App per P0.1."
          else
            echo "::error::No token available. Configure TH_BOT_APP_ID+TH_BOT_PRIVATE_KEY or REPO_SETUP_TOKEN."
            exit 1
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}

      # ── 4. Fetch open secret-scanning alerts (paginated) ─────────────────────
      - name: Fetch open alerts
        id: fetch-alerts
        run: |
          set -euo pipefail

          ORG="${{ inputs.org || 'ruralpeds' }}"
          OUTFILE="alerts.json"

          # Prefer App token; fall back to PAT
          if [ -n "${APP_TOKEN}" ]; then
            EFFECTIVE_TOKEN="${APP_TOKEN}"
          else
            EFFECTIVE_TOKEN="${PAT_TOKEN}"
          fi

          # Paginate through all open alerts (max 100 per page)
          PAGE=1
          echo "[]" > "$OUTFILE"
          while true; do
            RESPONSE=$(curl -fsS \
              -H "Authorization: Bearer ${EFFECTIVE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG}/secret-scanning/alerts?state=open&per_page=100&page=${PAGE}")

            COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            # Merge into cumulative JSON array
            python3 -c "
          import sys, json
          with open('${OUTFILE}') as ef:
              existing = json.load(ef)
          new_page = json.loads(sys.stdin.read())
          with open('${OUTFILE}', 'w') as wf:
              json.dump(existing + new_page, wf)
          " <<< "$RESPONSE"

            PAGE=$((PAGE + 1))
          done

          TOTAL=$(python3 -c "import json; print(len(json.load(open('alerts.json'))))")
          echo "total-alerts=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Fetched $TOTAL open alert(s) from org '$ORG'."
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}

      # ── 5. Build markdown report ─────────────────────────────────────────────
      - name: Build report
        id: build-report
        run: |
          set -euo pipefail

          TOTAL="${{ steps.fetch-alerts.outputs.total-alerts }}"

          python3 - <<'PYEOF'
          import json, os
          from collections import Counter
          from datetime import datetime, timezone

          alerts   = json.load(open("alerts.json"))
          total    = len(alerts)
          org      = os.environ["ORG"]
          run_id   = os.environ["RUN_ID"]
          run_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # ── Counts by secret_type ──────────────────────────────────────────
          by_type = Counter(a.get("secret_type", "unknown") for a in alerts)

          # ── Sort by created_at ─────────────────────────────────────────────
          def parse_dt(s):
              if not s:
                  return datetime.min.replace(tzinfo=timezone.utc)
              try:
                  return datetime.fromisoformat(s.replace("Z", "+00:00"))
              except (ValueError, AttributeError):
                  return datetime.min.replace(tzinfo=timezone.utc)

          sorted_newest = sorted(alerts, key=lambda a: parse_dt(a.get("created_at")), reverse=True)
          sorted_oldest = sorted(alerts, key=lambda a: parse_dt(a.get("created_at")))

          now = datetime.now(timezone.utc)

          def age(a):
              dt = parse_dt(a.get("created_at"))
              return (now - dt).days if dt != datetime.min.replace(tzinfo=timezone.utc) else "?"

          def fmt_alert(a):
              repo  = a.get("repository", {}).get("full_name", "unknown")
              stype = a.get("secret_type_display_name") or a.get("secret_type", "unknown")
              url   = a.get("html_url", "#")
              num   = a.get("number", "?")
              days  = age(a)
              return f"| [{repo} #{num}]({url}) | {stype} | {days}d |"

          lines = []
          lines.append(f"# Weekly Secret-Scan Report — {run_date}")
          lines.append("")
          lines.append(f"**Organization:** `{org}`  ")
          lines.append(f"**Open alerts:** {total}  ")
          lines.append(f"**Generated:** {run_date}")
          lines.append("")

          if total == 0:
              lines.append("✅ No open secret-scanning alerts. Well done!")
          else:
              lines.append("## Breakdown by secret type")
              lines.append("")
              lines.append("| Secret type | Count |")
              lines.append("|---|---|")
              for stype, count in sorted(by_type.items(), key=lambda x: -x[1]):
                  lines.append(f"| {stype} | {count} |")
              lines.append("")

              top_n = 10
              lines.append(f"## Top {top_n} newest alerts")
              lines.append("")
              lines.append("| Alert | Secret type | Age |")
              lines.append("|---|---|---|")
              for a in sorted_newest[:top_n]:
                  lines.append(fmt_alert(a))
              lines.append("")

              lines.append(f"## Top {top_n} oldest (longest open) alerts")
              lines.append("")
              lines.append("| Alert | Secret type | Age |")
              lines.append("|---|---|---|")
              for a in sorted_oldest[:top_n]:
                  lines.append(fmt_alert(a))
              lines.append("")

          lines.append("---")
          lines.append("")
          lines.append(
              "_Generated by `.github/workflows/reusable-secret-scan-report.yml`"
              f" \u00b7 run `{run_id}`"
              " \u00b7 [Triage guide](https://github.com/ruralpeds/.github/blob/main/docs/security/secret-scanning.md#alert-triage-process)_"
          )

          with open("secret-scan-report.md", "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Report written ({total} alerts).")
          PYEOF

          echo "report-path=secret-scan-report.md" >> "$GITHUB_OUTPUT"
          echo "open-alert-count=$TOTAL" >> "$GITHUB_OUTPUT"

          # Print to step summary
          cat secret-scan-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          ORG: ${{ inputs.org || 'ruralpeds' }}
          RUN_ID: ${{ github.run_id }}

      # ── 6. Upload report as artifact ─────────────────────────────────────────
      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan-report-${{ github.run_id }}
          path: secret-scan-report.md
          retention-days: 90

      # ── 7. Open or update tracking issue ─────────────────────────────────────
      - name: Open or update tracking issue
        if: ${{ !(inputs.dry-run) }}
        run: |
          set -euo pipefail

          ISSUE_TITLE="Weekly secret-scan report"
          REPORT_BODY=$(cat secret-scan-report.md)

          # Prefer App token; fall back to PAT; final fall back to GITHUB_TOKEN
          if [ -n "${APP_TOKEN}" ]; then
            EFFECTIVE_TOKEN="${APP_TOKEN}"
          elif [ -n "${PAT_TOKEN}" ]; then
            EFFECTIVE_TOKEN="${PAT_TOKEN}"
          else
            EFFECTIVE_TOKEN="${GITHUB_TOKEN}"
          fi

          export GH_TOKEN="${EFFECTIVE_TOKEN}"

          # Look for an existing open tracking issue in ruralpeds/.github
          EXISTING_ISSUE=$(gh issue list \
            --repo "ruralpeds/.github" \
            --state open \
            --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" \
            | head -1)

          if [ -n "$EXISTING_ISSUE" ]; then
            # Add a comment with the new report
            gh issue comment "$EXISTING_ISSUE" \
              --repo "ruralpeds/.github" \
              --body "$REPORT_BODY"
            echo "Updated tracking issue #${EXISTING_ISSUE} with new report."
            echo "issue-number=$EXISTING_ISSUE" >> "$GITHUB_OUTPUT"
          else
            # Create a new tracking issue
            NEW_ISSUE=$(gh issue create \
              --repo "ruralpeds/.github" \
              --title "$ISSUE_TITLE" \
              --label "security" \
              --body "$REPORT_BODY")
            echo "Created new tracking issue: $NEW_ISSUE"
            ISSUE_NUM=$(echo "$NEW_ISSUE" | grep -oE '[0-9]+$')
            echo "issue-number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
