name: "Scan & Bootstrap All Repos"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no PRs)"
        type: boolean
        default: false
      target-repo:
        description: "Single repo (blank = all)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  GH_OWNER: ruralpeds

jobs:
  scan:
    runs-on: [self-hosted, mac-studio]
    outputs:
      repos: ${{ steps.discover.outputs.repos }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      
      - name: Discover repos
        id: discover
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        run: |
          echo "=== DEBUG: Discover Repos ==="
          echo "Org: $GH_OWNER"
          echo "Token present: $([ -n "$GH_TOKEN" ] && echo YES || echo NO)"
          echo "Target repo input: '${{ inputs.target-repo }}'"
          echo ""
          
          if [ -n "${{ inputs.target-repo }}" ]; then
            echo "Using single repo input: ${{ inputs.target-repo }}"
            echo 'repos=["${{ inputs.target-repo }}"]' >> $GITHUB_OUTPUT
          else
            echo "Fetching all repos from $GH_OWNER..."
            REPOS=$(gh repo list "$GH_OWNER" --json name --limit 300 --jq '[.[].name]')
            REPO_COUNT=$(echo "$REPOS" | jq 'length')
            echo "Found $REPO_COUNT repos"
            echo ""
            echo "Sample repos:"
            echo "$REPOS" | jq '.[:5]'
            echo ""
            echo "repos=$REPOS" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "Output set: repos"

  bootstrap:
    needs: scan
    runs-on: [self-hosted, mac-studio]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repo: ${{ fromJson(needs.scan.outputs.repos) }}
    steps:
      - name: Checkout .github (templates)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          path: templates

      - name: Checkout target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          repository: ${{ env.GH_OWNER }}/${{ matrix.repo }}
          token: ${{ secrets.REPO_SETUP_TOKEN }}
          path: target

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: "3.12"

      - name: Bootstrap
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        run: |
          python templates/scripts/bootstrap_repo.py target templates "${{ inputs.dry-run }}"

      - name: Create PR (if changes)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REPO_SETUP_TOKEN }}
        run: |
          cd target
          
          if git diff --quiet; then
            echo "No changes in ${{ matrix.repo }}"
            exit 0
          fi
          
          BRANCH="ci/bootstrap-workflows-$(date +%s)"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "ci: bootstrap reusable workflows from ruralpeds/.github"
          git push origin "$BRANCH"
          
          gh pr create \
            --repo "${{ env.GH_OWNER }}/${{ matrix.repo }}" \
            --title "ci: add reusable workflows" \
            --body "Automated bootstrap from ruralpeds/.github" \
            --head "$BRANCH" \
            --base main \
            || echo "PR may already exist"

